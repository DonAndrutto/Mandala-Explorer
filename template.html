 they \"Bodhisattvas.\"\nThey are not those who, without means to harness it, repudiate desire,\nNor yet are they defeated by defilement."}, {"tib": "སྣང་བ་མཐའ་དག་ལྷ་དང་དཀྱིལ་འཁོར་དང་། །སྤྱད་བྱའི་དམ་རྫས་བདུད་རྩིའི་རང་བཞི་དུ། །\nའདུ་ཤེས་གནས་འགྱུར་གང་ལ་གནང་བ་ཡིན། །སོ་སོ་ཐར་དང་བྱང་ཆུབ་སེམས་དཔའ་ཡི། །", "en": "To those for whom all things appear as deities and mandalas\nAnd as amrita—substance of samaya to be taken and enjoyed—\nTo those with changed perceptions thus, such things have been allowed."}, {"tib": "དགེ་སློང་དང་ནི་དགེ་འདུན་ལ་བྱིན་ལས། །ཡི་དམ་ལ་ཕུལ་ཚོགས་ཀྱང་ཡར་ལྡན་འགྱུར། །\nབསླབ་པའི་ཆ་ཤས་གཞན་ལའང་དེ་ཡིས་འགྲེ། །འོན་ཀྱང་རང་ལྡོག་མ་འདྲེས་དགག་དགོས་ཚང་། །", "en": "Compared with gifts made to the Sangha\n(Monks who hold the pratimoksha or the bodhisattva vows),\nOfferings proffered to the yidam are of greater merit.\nTo other aspects of the precepts the same should be applied.\nBut the respective aspects of the vows are not alloyed or mixed.\nAs antidote and in their purpose, they are all the same."}, {"tib": "ངོ་བོ་གནས་འགྱུར་ཡོན་ཏན་ཡར་ལྡན་པས། །གནད་ཀྱིས་མི་འགལ་དུས་སྐབས་གཙོར་སྤྱད་དོ། །\nགྲུབ་པའི་མཐའ་ལ་དཔྱད་པ་ཞུགས་པ་རྣམས། །གནས་འགྱུར་ངོ་བོ་གཅིག་ཏུ་འདོད་པ་དང་། །", "en": "The vows are gradually transmuted and their qualities enhanced.\nThey thus remain without essential contradiction;\nTheir observance should be fitted to the situation.\nOf those who now consider\nHow the three vows are combined within a single mind,\nSome say that they are one, for they transform;"}, {"tib": "གཅིག་ལ་གཞི་མི་མཐུན་དུ་འདོད་པ་དང་། །གསུམ་ཀ་རྫས་འགལ་གོང་འཕེལ་འདོད་པ་དང༌། །\nགཏོང་ཐོབ་མཚམས་ནས་རྣམ་པར་དབྱེ་བ་དང་། །དོང་རྩེ་བརྩེགས་བཞིན་མ་འདྲེས་འདོད་པ་དང་། །", "en": "Some say that in one vow,\nThe aspects of the lower vows remain distinct;\nSome say they are three substances in conflict\nBut increasing in their quality.\nOthers differentiate the vows according to the time and circumstance\nWherein they are relinquished and received.\nSome say the vows remain distinct,\nLike copper coins stacked one upon the other,"}, {"tib": "ཉི་ཟླ་སྐར་གསུམ་རིམ་ཅན་ཚོམས་པ་ལྟར། །རང་འོད་མ་ཉམས་ནུས་པའི་ཁྱད་ཞུགས་འདོད། །\nདེ་སོགས་རྣམ་པའི་ཁས་བླང་མཐའ་དག་ཀྱང་། །ཆོ་གའི་དུས་ལྟར་རང་ལྡོག་མ་འདྲེས་དང༌། །", "en": "Some that they are of a different strength—\nThey're like the sun and moon and stars\nWhose light is not diminished when they are eclipsed.\nThough these and further statements may be made about the vows,\nTheir aspects are distinct as at the moment of their taking."}, {"tib": "བསྲུང་མཚམས་དུས་ན་དགག་དགོས་ཚང་བ་དང༌། །གནས་འགྱུར་ངོ་བོ་ཡེ་ཤེས་མཐུས་བྱེད་པའི། །\nསྤྱིར་བཏང་དམིགས་བསལ་ཕྱེད་པ་ཁྱད་པར་ཡིན། །གླེང་གཞི་གནས་འགྱུར་འདོད་ལ་ཕྱིར་བཅོས་མེད།།", "en": "When observed, they're all the same\nAs antidote and in their purpose.\nAnd they are all transformed through power of primal wisdom.\nThese are general considerations, different from specific points.\nFor those who claim the aspects are transformed,\nNo redress is possible."}, {"tib": "སོ་ཐར་ངོས་ནས་བྱུང་བའི་ལྟུང་བ་གཅིག །རང་ངོས་འཆོས་ན་གནས་འགྱུར་ཟིན་པས་འགལ། །\nགོང་མའི་ངོས་ནས་འཆོས་ན་དེ་ཉིད་ལ། །ལྟ་བ་མ་བྱུང་ཕྱིར་བཅོས་མི་དགོས་བསྙོན།།", "en": "For when a downfall has occurred in terms of Pratimoksha,\nRepairing it accordingly can have no sense\nBecause they say the vow has been transformed.\nAnd there's no need, and it is out of place,\nTo mend the fault according to a higher vow,\nIn terms of which no downfall has occurred."}, {"tib": "ལུས་ངག་ལས་སྐྱེས་སྡོམ་པ་གཟུགས་ཅན་ནམ། །སྤོང་སེམས་རྒྱུན་ཆགས་ས་བོན་བདེན་ཞེན་ལྡན། །\nབསྒྱུར་དང་ལམ་འཁྱེར་ཐབས་ཀྱིས་མ་ཟིན་པར། །ཐེག་ཆེན་ལམ་ཞུགས་དབང་བསྐུར་ནོད་ནའང་། །", "en": "Those who understand the vows as forms\nThat come to birth from body and from speech,\nOr else as the continuum of the refraining mind\n(Together with the seeds thereof),\nRegard the vows as truly real.\nAnd those who are without the skillful means\nWhereby defilements are transformed and brought upon the path—\nThough they embrace the Mahayana\nAnd even have received empowerment—"}, {"tib": "གནས་འགྱུར་ཐོབ་པའི་རྡོ་རྗེ་འཛིན་པ་མིན། །སྡོམ་པ་དག་པར་བྱེད་པ་འདུ་ཤེས་ཏེ། །\nའདུ་ཤེས་དག་བྱེད་ལྷ་ཡི་རྣལ་འབྱོར་ཡིན། །དེ་ཉིད་དག་བྱེད་ཡེ་ཤེས་ལ་གོམས་ན། །", "en": "Are not Vajradharas, beings for whom the vows have been transformed.\nVows are rendered pure by attitude of mind\nAnd attitude is purified by yoga of the deity.\nWhen this in turn is cleansed through mastery of primal wisdom,"}, {"tib": "བཅས་པའི་ལྟུང་བ་ཆོས་ཅན་སྐྱེ་འཇིག་ཅན། །རང་མཚན་མི་འཛིན་ཐོབ་དང་ཤོར་བ་མེད། །\nཐོག་མཐའ་བར་དུ་འགལ་བར་མི་གནས་པའི། །ངོ་བོ་ཀུན་རྫོབ་ཡིན་པས་གནས་འགྱུར་གྲུབ། །", "en": "Precept-marring downfalls\n(Entities endowed with their own features,\nSubject to both birth and to cessation),\nAre no longer apprehended.\nThen there is no gain and there's no loss.\nAt their outset, in their middle, and their ending,\nThe vows are not in conflict with each other.\nThey're relative phenomena whereby one's attitude is changed."}, {"tib": "གཞི་དང་བསམ་པ་གཉིས་ཀ་མངོན་གྱུར་ལྡན། །མོས་པས་སྤྱོད་པའི་སྡོམ་པ་གསུམ་ལྡན་ལ། །\nགནས་ན་བྱེ་བྲག་བསྲུང་ན་འཆོལ་བར་བསྲུང་། །ལྡན་ན་ཡང་ལྡན་འཆོས་ན་རང་ས་ནས། །", "en": "If those who apprehend their bodies and their minds as real,\nAnd hold the three vows, practicing with aspiration,\nRemain therein and keep their different aspects,\nThey must observe the vows combined.\nIf thus they keep the vows, the lower precepts are enhanced.\nIf downfalls are repaired, this must be done\nAccording to the level of the vow infringed."}, {"tib": "ཉམས་པ་ཁོལ་བུར་ཕྱུང་བའི་ཕྱིར་བཅོས་འགྲུབ། །ཅི་ཕྱིར་ཉེས་པ་བསྐྱེད་ན་གང་ཡང་འགོག །\nདགེ་དང་ཡོན་ཏན་བསྐྱེད་ན་གནང་བའི་ཕྱིར། །གནང་བཀག་ཚིག་གི་ལམ་ན་གནས་པ་མིན། །", "en": "Since actions that give rise to faults have been proscribed\nAnd what produces qualities and merit is allowed,\nAllowance or proscription hinges not upon the letter of the law\nBut must be gauged according to the agent's attitude."}, {"tib": "གང་ཟག་རྒྱུད་དང་འབྲེལ་ནས་གྲུབ་པའོ། །ཕ་རོལ་ཕྱིན་པ་དྲུག་དང་ཚོགས་གཉིས་ཀྱི། །\nཡོན་ཏན་མ་སྐྱེས་བསྐྱེད་པར་བྱེད་པ་དང༌། །སྐྱེས་པ་སྤེལ་ལ་དགེ་བ་ཆོས་སྡུད་ཀྱི། །", "en": "To generate the qualities not yet possessed\nOf all the six perfections and the two accumulations,\nAnd bringing increase to the ones already gained,\nAll this is called the discipline of gathering virtue."}, {"tib": "ཚུལ་ཁྲིམས་ཞེས་བྱ་སེམས་ཀྱི་བསླབ་པས་བསྡུས། །བྱམས་དང་སྙིང་རྗེས་ཟིན་པའི་དགེ་བ་ནི། །\nགང་དུ་སེམས་ཅན་དོན་བྱེད་སྦྱིན་པ་ཡིན། །དེ་ལ་རང་འདོད་མེད་པ་ཚུལ་ཁྲིམས་ལ། །", "en": "It is included in the training of the mind.\nVirtue that is filled with loving-kindness and compassion\nIs generosity when practiced for the sake of beings.\nIt is discipline when free from self-concern"}, {"tib": "གཞན་དོན་སྐྱོ་ངལ་མེད་པ་བཟོད་པའོ། །ལྷག་པར་སྤྲོ་བཞིན་འཇུག་པ་བརྩོན་འགྲུས་ཏེ། །\nསེམས་ཅན་དོན་ལ་རྩེ་གཅིག་བསམ་གཏན་དང་། །དངོས་མཚན་ཞེན་པ་སྤངས་པ་ཤེས་རབ་སྟེ། །", "en": "And patience when untiring for the sake of others.\nIt is diligence when done with vibrant joy\nAnd concentration when enacted with one-pointed mindfulness.\nIt is wisdom when there is no clinging to reality of things."}, {"tib": "ཕ་རོལ་ཕྱིན་དྲུག་ནམ་ཡང་འདུ་འབྲལ་མེད། །སྤྱོད་ལམ་རྣམ་བཞི་ཀུན་ལ་དྲན་ཤེས་ལྡན། །\nསྤྱོད་ཡུལ་ཡོངས་སུ་དག་པའི་དགེ་ཚོགས་ཀྱི། །གོམ་པའི་འདེགས་འཇོག་དག་ཀྱང་ཕྱིན་དྲུག་ལམ། །", "en": "From virtue such as this the six perfections never separate.\nMindful, self-aware in all the four activities,\nBodhisattvas gather perfect virtue in their every deed.\nEven as they walk and raise and place their feet,\nThey effortlessly tread the path of six perfections,"}, {"tib": "རྩོལ་མེད་འཇུག་པས་ཚོགས་རྫོགས་ཤིན་ཏུ་མྱུར། །ཐབས་ལ་མཁས་པས་དངོས་སམ་རྒྱུད་མ་ནས།།\nསེམས་ཅན་ཀུན་ལ་ཕན་པ་ལྷུར་བྱེད་ཅིང་། །སྦྱིན་དང་སྙན་སྨྲ་དོན་སྤྱོད་དོན་མཐུན་དང་། །", "en": "Completing with great speed the two accumulations.\nSkilled in means direct and indirect,\nThey labor for the benefit of every being.\nThey open wide the doors of generous giving,\nOf pleasing speech and inspiration to the practice,\nOf conduct that accords with teachings given,"}, {"tib": "དགེ་བ་ཆོས་སྡུད་ཚུལ་ཁྲིམས་སྒོ་འཕར་ཡངས། །གང་ལ་བརྟག་པ་དྲུག་ཏུ་གསུངས་པའང་།།\nརང་གི་ཆོས་ལ་འབྱོར་རྒུད་བརྟག་པར་འདུ། །རང་ཉིད་ཆོས་ལམ་མ་ཉམས་གཞན་དོན་བྱ། །", "en": "And discipline that gathers virtue.\nRegarding altruistic action,\nThough the teachings speak of six considerations,\nIn short this means the judgment of the strength of one's own practice.\nLet those who never wander from the Dharma's path\nSecure the good of others."}, {"tib": "རང་དོན་ཉམས་པའི་སོ་སྐྱེས་འཁྲུལ་པ་བརྟག །གཞན་ལ་ཕན་པ་རླབས་ཆེན་འགྲུབ་སྲིད་ན། །\nབཅས་པ་ཆུང་ངུ་བག་ཡངས་གནང་བའི་སྐབས། །ཡོད་དེ་གྲོང་ཁྱེར་ཕྱིར་ན་གྲོང་རྡལ་དང་། །", "en": "Common people, who have not yet gained their own good,\nShould investigate their own deluded thoughts.\nWhen one can achieve the great good of another,\nIt's then that lower precepts may be left aside.\nA village may be sacrificed to save a town;"}, {"tib": "བདག་ཕྱིར་ས་གཏོང་ཆོས་ཕྱིར་བདག་ཀྱང་གཏོང་། །འདི་ན་མི་མཇེད་བཟོད་པའི་ས་གཞི་ལ། །\nཆོས་ཀྱི་དྲི་བཟང་རྒྱས་པ་རབ་བསྲུང་བའི། །དཀའ་བ་དང་ལེན་བཟོད་པ་ཇི་མི་སྙམ། །", "en": "One's home may be relinquished to preserve one's life;\nAnd for the sake of Dharma, one may sacrifice oneself.\nUpon the ground of unafraid endurance\nThe perfumed scent of Dharma is diffused,\nProtected by three kinds of patience:\nPutting up with hardship, making light of any injury,"}, {"tib": "ཟབ་མོའི་དོན་ལ་མི་སྐྲག་རྣམ་པ་གསུམ། །ཡིད་ནི་ཤིན་ཏུ་རེངས་བྱས་ཞེ་སྡང་གི།།\nསྡིག་པའི་མངོན་རྟོགས་མུན་པའི་འཁྲི་ཤིང་ཅན། །ཐར་མེད་དམྱལ་བར་འཛུལ་ལ་སྐྲག་པ་རྣམས། །", "en": "And braving the profundity of doctrine.\nThe evil state of anger with its dark and creeping tendrils\nMakes the mind and heart extremely hard.\nThose afraid of hell whence there is no escape"}, {"tib": "ནམ་ཡང་ཁྲོ་བའི་གོ་སྐབས་དབྱེ་མི་བགྱིད། །གནོད་པའི་ཡུལ་ནི་ནགས་ཀྱི་ཚེར་མ་བཞིན། །\nགདུལ་གྱི་མི་ལང་ཀུན་ནས་འཕེལ་བ་ཅན། །འཁོན་དང་ཁྲོ་བའི་བྱེད་པོ་གཅིག་བཏུལ་ན། །", "en": "Will give no chance for anger to develop.\nHarmful circumstances are like forest thorns:\nThere is no overcoming them; they constantly increase.\nBut if we tame the single source of anger and resentment,"}, {"tib": "བཟོད་པའི་དཀའ་ཐུབ་ bདག་ལ་མཛའ་བར་འགྱུར། །རེག་པ་ཤིན་ཏུ་རྩུབ་པའི་ཚིག་གི་མདས། །\nསྐྱེས་བུའི་སྙིང་ལ་ཟུག་པ་ཅང་མཆིའམ། །དེ་ཉིད་དང་དུ་བླང་བའི་ཉེར་ལེན་གྱིས། །", "en": "The hard austerity of patience will become our friend.\nThrough contact with the dart of harsh and hostile words,\nOur hearts are stricken through—and yet does anything occur?\nBecause we take such words as harmful in themselves,"}, {"tib": "ཕན་ཚུན་རྟེན་དང་བརྟེན་པར་འཁྲུགས་བཞིན་མནར། །འདི་ན་གནོད་པའི་རྒྱུ་འབྲས་མཐའ་ཡས་སུ། །\nབདག་ཉིད་ལས་བྱུང་སྒྲ་དང་བྲག་ཅ་བཞིན། །བདག་ཉིད་མ་བྱུང་གནོད་པའི་ཡུལ་མེད་པས། །", "en": "We're pained and agitated in the interplay of harm and harmed.\nFor in this world our hurts in cause and fruit,\nLike shouts and answering echoes, all arise from us.\nIf \"I\" does not arise, there's no one they can injure."}, {"tib": "རང་གི་སྔོན་བྱས་རྐྱེན་གྱིས་བོས་ལ་ལྟོས།།བརྟགས་ན་གནོད་ཆེན་མ་ཡིན་ཕན་ཆེན་ཏེ། །\nགང་ལ་བརྟེན་ནས་བཟོད་པའི་གྲུ་གཟིངས་དང་། །བྱང་ཆུབ་སེམས་ཀྱི་ནོར་བུ་འཐོབ་འགྱུར་བས། །", "en": "See how they derive from factors earlier contrived.\nWhen examined, they are not great harms but great advantages.\nFor thanks to them we board the ship of patience\nThus to gain the jewel of bodhichitta."}, {"tib": "དེ་འདྲའི་གནོད་པ་དམ་པའི་ཆོས་ལྟར་མཆོད་། །ཤིན་ཏུ་བརྟགས་ན་གནོད་པའི་ངོ་བོ་ལ། །\nམཚན་ཉིད་མེད་དེ་ཆུ་ཡི་རི་མོ་བཞིན། །རྣམ་རྟོག་ཁྲོ་གཉེར་རྩུབ་མོ་ཞིག་པའི་མོད། །", "en": "Let us honor all such hurts as holy teaching!\nWhen the nature of these injuries is closely scrutinized,\nThey lack enduring features, they're like figures traced on water.\nIn the instant that the strident thought of wrath subsides,"}, {"tib": "མཁའ་བཞིན་རྣམ་པར་སྟོང་ལ་ཐོབ་ཤོར་མེད། །གང་ཕྱིར་བཟོད་པའི་དཀའ་ཐུབ་གསུམ་ཉམས་ན། །\nསྦྱིན་སོགས་ཕ་རོལ་ཕྱིན་པ་གཞན་ལྔ་ཡང་། །ཕྱི་མཐའ་དགྲ་ཡིས་བསྐོར་བའི་བཤུལ་ལམ་བཞིན། །", "en": "A state of spacelike emptiness occurs\nDevoid of taking or rejecting.\nWhen the three austerities of patience fail,\nTo undertake the other five perfections, giving and the rest,\nIs, in the end, like walking on a road beset with enemies."}, {"tib": "འདོད་པའི་གནས་སུ་ཕྱིན་དཀའ་བློ་སྟོབས་བསྐྱེད། །དུས་ལས་ཡོལ་བ་མེད་པའི་བརྩོན་འགྲུས་ཀྱིས། །\nརང་དབང་ཉིད་དུ་དགེ་བའི་ཆོས་མཐའ་དག །སྐྱེད་མོས་ཚལ་དུ་ངང་པ་འགྲོ་བ་བཞིན། །", "en": "It's hard to reach the wished-for goal, so let us be stouthearted.\nWith punctual and timely diligence,\nLike swans that hasten to their groves,\nWe should devote ourselves to all the practices of virtue,"}, {"tib": "ལེ་ལོའི་གཡང་ལ་བསྐྱུད་པ་མེད་པར་འཇུག །བྱ་བ་ངན་ཞེན་འདུ་འཛིའི་ཐག་པས་དཀྲིས། །\nསྒྱིད་ལུག་མཐུས་ནོན་སྦྱོར་བས་ནུས་པའང་བཏང་། །བདག་ཉིད་བརྙན་ནས་སེམས་ཞུམ་བརྟུལ་ཞུགས་བླངས། །", "en": "Not leaving them forgotten in the pit of laziness.\nPeople are engrossed in wrongful actions;\nThey are tangled in the strings of their distracting pastimes.\nDiscouragement oppresses them\nAnd even what they can do they neglect.\nPutting themselves down, they wallow in faintheartedness."}, {"tib": "དེ་འདྲའི་གང་ཟག་ཉེས་བའི་གཟིངས་ལ་ཞོན། །བདུད་བཞི་འཇོམས་པ་གོ་ཆའི་བརྩོན་འགྲུས་དང་། །\nས་བཅུའི་ལམ་འགྲོ་སྦྱོར་བའི་བརྩོན་འགྲུས་དང༌། །མི་འགོང་མི་ལྡོག་ཆོག་ཤེས་མེད་པ་ཡི། །", "en": "They are like people who set sail in leaking ships.\nDiligence that's armorlike beats the four demons down;\nDiligence in action brings us progress on the ten grounds and the paths;\nDiligence undaunted, irreversible, insatiable—"}, {"tib": "བརྩོན་འགྲུས་ཅན་གྱི་སྨོས་པའི་དོན་ཀུན་འགྲུབ། །བདག་གི་ཚེ་ནི་ཉིན་མོའི་མཐར་གྱུར་ཏེ། །\nམྱུར་བ་མྱུར་བར་འཆི་བའི་མུན་ནག་གིས། །གཏུགས་ན་འཁོར་བའི་སྤྱོད་པ་རྒྱུ་སྐར་ལས། །", "en": "Those who have all these will gain the goals that they desire.\nOur life is like the closing of the day:\nQuickly, quickly does the dark of death draw near.\nAnd when it comes, our worldly works give no relief,\nThough they be many, more than all the stars."}, {"tib": "རྣམ་གྲངས་མང་བ་དེ་ཡིས་དབུགས་མི་ཕྱིན། །ལེ་ལོའི་རྙོག་པ་དྭངས་པའི་རྩོན་འགྲུས་ཀྱི། །\nདལ་འབབ་ཕྱོགས་ལྷུང་སྟོན་པ་མ་ཡིན་པར། །རྣམ་པ་ཀུན་མཁྱེན་རྒྱ་མཚོར་ཕྱིན་དེ་སྲིད། །", "en": "The mighty stream of diligence, which clears away\nThe turbid ooze of laziness and never deviates,\nFlows on with swift and tireless strength\nUntil it pours into the ocean of omniscience."}, {"tib": "གཡོ་ཞིང་མྱུར་བའི་བརྟུལ་ཞུགས་ཉམས་མི་བགྱིད། །ནགས་ཚལ་མེ་ཏོག་འཁྲིགས་པའི་སྨན་ལྗོངས་ནི། །\nངང་པ་ཤིན་ཏུ་ཞི་བས་བརྟེན་བྱས་ཤིང༌།། ལྟ་ན་སྡུག་པ་བྲག་རིའི་ཕ་གུ་དང་། །", "en": "A wholesome land, a forest, flower-strewn,\nThe haunt and habitat of peaceful waterbirds,\nBeautiful to see, with walls and terraces of rock,"}, {"tib": "རྟ་བབས་རི་དྭགས་གཞོན་ནུས་མཛེས་པ་ཡོད། །དགའ་བའི་ནགས་ཚལ་ལྷ་མོའི་སྐེད་ཆིངས་ནི། །\nཤིང་བལ་གཞོན་ནུའི་དྲྭ་ཕྱེད་གཡོ་བ་ན།། དོགས་པས་སྐྲག་པ་མིན་པའི་ཁུ་བྱུག་རྣམས། །", "en": "And lovely with the young of hart and hind,\nThe joy-bestowing woodland\nIs a goddess with her waist entwined\nWith fresh and swaying traceries of moss.\nIt's here that cuckoos, unafraid of harm,"}, {"tib": "འཁོར་བར་སྐྱོ་བའི་གཏམ་གྱི་སྤྲིང་ཡིག་འགྲེམ། །དེ་རུ་གཤེགས་ཤིག་བསམ་གཏན་འདོད་པ་རྣམས། །\nལོངས་སྤྱོད་སྤྲིན་གྱི་བླ་རེའི་ནང་ཤེད་ན། །ཚེ་སྲོག་རོལ་པའི་གློག་ནི་གཡོ་ཞིང་འདར། །", "en": "Announce their tidings: sadness with the world.\nGo to such a place all you who wish to concentrate your minds.\nWealth and pleasures are like fleeting canopies of cloud;\nAnd life, a flash of lightning, shakes and trembles"}, {"tib": "འགྱུ་དང་སྡུག་བསྔལ་འདུ་བྱེད་ཆོམ་རྐུན་དཀྱུ། །ཕུང་ཀྲོལ་བསྐྱེད་པའི་ཆུ་ཀླུང་ཅ་ཅོ་ཅན། །\nགསོག་དང་བསྲུང་དང་སྤེལ་བའི་འདོད་པས་འཁྲུགས། །ཁེངས་དང་འཇུངས་དང་སེར་སྣས་ཚེ་གཏུགས་ནས། །", "en": "Midst a gang of thieves: the sufferings of pain,\nOf change and sorrow in the making.\nCraving to acquire, to keep, and to increase—\nBeings are tumbled in this ruin-bearing torrent.\nGripped by pride, by avarice and stinginess,"}, {"tib": "ངན་འགྲོའི་ཆུ་གཏེར་མུ་མཐའ་མེད་པར་འཁྱམས། །གཡོ་སྒྱུའི་ཆར་སྤྲིན་བརྣགས་པའི་རིན་ཐང་ཅན། །\nནོར་ནི་ཇི་ཙམ་འབྱོར་བཞིན་སྡུག་བསྔལ་རྒྱུ། །ཡོ་བྱད་བསྙུངས་རྣམས་དགྲ་རྐུན་འཚེ་བས་སྤོང་། །", "en": "They wander after death in shoreless seas of lower realms.\nPrecious things acquired deceitfully\nAre like the clouds abundant with their rain.\nThey are the cause of suffering.\nBut those with little property are safe from enemies and thieves."}, {"tib": "ཆོག་ཤེས་ཐོབ་པ་འབྱོར་པའི་རྩེ་མོར་འགྲོ། །སོ་སོ་སྐྱེ་བོའི་རང་བཞིན་བྱིས་པ་སྟེ། །\nབྱིས་པ་རྣམས་ནི་ཉེས་པའི་སྤྲིན་གྱིས་འཁྲིགས། །བདག་ཉིད་བསྟོད་ཅིང་གཞན་ལ་མི་སྙན་སྒྲོག །", "en": "And those content with what they have\nHave reached the highest peak of wealth.\nOrdinary people are by nature childish,\nTheir childish minds are clogged with clouds of faults.\nThey praise themselves, disparage others;"}, {"tib": "ཉོན་མོངས་སྦྲུལ་ལྕེ་རྩུབ་མོའི་ཉམས་བག་བསྟེན། །དཔལ་འབྱོར་གཡོ་བ་གང་ལའང་རྟག་པར་སེམས། །\nབྱས་པ་མི་གཟོ་མགུ་བའི་གཟུགས་བརྙན་འཁྱོག །མཁོན་གྱི་མེ་ལྕེ་ཕྲ་མའི་རླུང་གིས་བསྐྱོད། །", "en": "They have rough defiled emotions like a serpent's tongue.\nThey think the wavering glories of this life will last forever.\nFor what is done for them they show no thanks\nBut only its reverse, and look with sullen frowns.\nThey blow the fires of hatred with the winds of calumny."}, {"tib": "སྤྲེའུ་བཞིན་དུ་གནོད་པ་སྣ་ཚོགས་སྟེར།། ཆུ་སྲིན་བཞིན་དུ་སྡིག་པའི་ལྟོ་བ་ཡངས། །\nསྦྲུལ་གདུག་བཞིན་དུ་སུ་དང་ཕྲད་པ་འཇོམས། །མེ་བཞིན་དགེ་བའི་ལྗོན་ཤིང་བསྲེག་འགྱུར་བའི། །", "en": "Like apes they are the source of every kind of mischief.\nThe belly of their sins is vast like some leviathan.\nLike vicious snakes they harm all those they meet."}, {"tib": "བྱིས་པའི་གྲོགས་ལས་རིང་དུ་བསྲིང་བར་བྱ། །ཡུལ་ནི་དུག་ལས་ཐུ་སྟེ་རྣམ་སྨིན་རྩུབ། །\nསྤྱད་པའི་མོད་ལ་འདའ་བའི་རོ་བྲོ་ཡང་། །ཚེ་རབས་གཅིག་མིན་སྐྱེ་བ་ཐམས་ཅད་དུ། །", "en": "Keep far away from childish folk who, like a fire,\nWill scorch and burn the healing trees of virtue.\nWorse than poison are the objects of the senses,\nFor their fruit, when fully ripened, brings great harm,\nNot only in this life but all the lives to come—\nThough in the moment of their tasting, they are sweet indeed—"}, {"tib": "གསང་སྔགས་མཆོག་དང་སྨན་གྱི་གསོར་མི་རུང་། །གང་ཞིག་སེམས་ཀྱི་གླང་པོ་མ་དུལ་བར། །\nབསླུ་བའི་རྫུ་འཕྲུལ་ཡུལ་ལས་ཆེ་བ་མེད། །ཕུང་པོའི་འདུ་བྱེད་ཕྱོགས་ལ་བཞག་དེ་སྲིད། །", "en": "And this no supreme mantra and no physic can relieve.\nFor those who have not tamed the elephant of mind,\nNothing is more false or more deceptive\nThan the objects of the senses.\nTill this compounded aggregate is borne away upon the bier,"}, {"tib": "ཞི་བའི་ནགས་མཐོངས་དག་ལ་བསྙེན་པར་མཛོད། །བས་མཐའ་འབྲོག་ནི་ཡིད་འོང་སྐྱོ་ཤས་འཕེལ། །\nཚོང་དང་སོ་ནམ་སྡིག་པའི་གྲོགས་ཀྱིས་སྤངས། །དཔྱ་དང་ཁྲལ་དང་ཞོ་ཤས་འཚོས་མི་གདུང་། །", "en": "Let peaceful forest glades be home for you!\n\"Wildernesses\" and \"secluded places\": both are good,\nInspiring us with sorrow at samsara.\nNo trade is there, no farming, no bad company,\nNo tiresome threats of impositions, duties, need for livelihood;"}, {"tib": "བྱ་དང་རི་དྭགས་མི་སྙན་སྒྲོག་པ་མེད། །ཆུ་གཙང་འབྲས་བུའི་ཉེར་སྤྱོད་རྒྱ་ཆེ་ལ། །\nབྲག་རིའི་ཕུང་དང་ལོ་མའི་ཁང་བཟང་ཡངས། །ལྗོན་པའི་གྲིབ་བསིལ་འགྲོགས་ན་བདེ་བ་དང་། །", "en": "The birds and beasts say nothing untoward.\nAll things needful, fruits and limpid water, there abound,\nAnd spacious caves and shelters made of leaves.\nTo live within the cool shade of the trees is bliss indeed;"}, {"tib": "ནམ་ཞིག་བདག་ནི་ལྷན་ཅིག་གནས་འགྱུར་བས། །དེ་ན་དུས་བཞིའི་མགྲོན་པོ་གསར་པ་ཡིས། །\nའཕོ་འགྱུར་མངོན་རྟོགས་ངོམ་པའི་ནགས་ཚལ་རྣམས། །རང་ཉིད་ཉོན་མོངས་མ་ཡིན་གཏན་ཚིགས་སུ། །", "en": "Would that we might take it for our dwelling place!\nThe fashion of the forest is transformed\nTo greet its guests as the four seasons pass.\nNothing there provokes defilement."}, {"tib": "གོམ་བདུན་ཕྱོགས་པའི་བསོད་ནམས་སྒྲོག་ལ་ལྟོས། །གང་དུ་བསམ་གཏན་ཤིན་ཏུ་བརྟེན་པ་ནི། །\nལྷག་པ་སེམས་ཀྱི་བསླབ་པའི་མཚན་ཉིད་དེ། །རྟེན་ཅིང་འབྲེལ་འབྱུང་ལུས་ཀྱི་ཆོ་ག་ནི། །", "en": "See! The teachings we may trust have said\nThat boundless merit comes from even seven steps to such a place.\nResting there in perfect concentration\nDefines the higher training of the mind.\nBecause they're interlinked, the body placed in"}, {"tib": "རྣམ་སྣང་ཆོས་བདུན་སེམས་ཀྱི་སྲོག་ཤིང་ཅན། །གཅིག་ལས་གཉིས་པ་མ་ཡིན་མཉམ་གཞག་བརྩོན། །\nདམིགས་པ་གང་ཡང་རུང་བའི་འཛིན་དཔྱད་ཀྱིས། །ཡིད་ནི་དགེ་བའི་དོན་ལ་རྣམ་པར་བཅིང་། །", "en": "Vairochana's Sevenfold posture acts as vital axis of the mind.\nStrive in stable meditation.\nPlace the mind upon one thing, not straying to another.\nChecking that the target's held, whatever it may be.\nThe mind is thereby fastened to its virtuous object;"}, {"tib": "སྤྲོས་པའི་སྣང་བ་ཆོས་ཉིན་གཅིག་ཏུ་ནུབ། །སྣང་ཡུལ་མ་འགགས་དེར་འཛིན་མེད་པ་ཡིན། །\nཤེས་པ་ཡུལ་ལ་མི་རྟོག་མཉམ་བཞག་ལ། །ངོ་བོ་གཅིག་བའི་རྗེས་ཐོབ་ལྷག་མཐོང་སྟེ། །", "en": "All appearances contrived by thought will sink into the dharmata.\nThings appear uninterruptedly.\nBut not considering such things as truly real,\nThe mind remains without discursiveness upon its object.\nThis is meditative equipoise or shamatha.\nVipashyana, which shares its nature, is post-meditation."}, {"tib": "དབྱེ་ན་བྱིས་པ་ཉེར་སྤྱོད་དོན་རབ་འབྱེད། །དེ་བཞིན་གཤེགས་དགེའི་བསམ་གཏན་རྣམ་གསུམ་དང་། །\nརྟོག་དཔྱོད་ཡོད་མེད་མུ་བཞིའི་བསམ་གཏན་བཞི། །དེ་བཞིན་གཟུགས་མེད་བཞི་སྟེ་རྣམ་པའི་གྲངས། །", "en": "Three kinds of concentration are distinguished:\nConcentration that's enjoyed by childish beings,\nConcentration that discerns with clarity,\nAnd the perfect concentration of the Tathagatas.\nThere are four samadhis following four criteria:\nThe absence or the presence of discursiveness,\nBoth gross and subtle, and the rest.\nLikewise there exist four formless concentrations."}, {"tib": "ལམ་མ་ཞུགས་པའི་རྒྱུད་ཀྱི་ཏིང་འཛིན་ནི། །བསམ་གཏན་གཟུགས་མེད་བྱིས་པ་ཉེར་སྤྱོད་ཡིན། །\nལམ་ཞུགས་ཚོགས་དང་སྦྱོར་བའི་ཏིང་འཛིན་གྱིས། །ཐར་ལམ་མངོན་བྱེད་དོན་རབ་འབྱེད་པར་གྲགས། །", "en": "The samadhis and the formless concentrations constitute\nThe concentration that's enjoyed by childish beings:\nThose who have not entered any of the paths.\nThe concentration of the ones who have embraced\nAccumulation and the path of joining\nMakes the path of freedom manifest.\nTheir concentration thus is clearly discerning."}, {"tib": "དང་པོའི་ས་ཡན་འཕགས་པའི་ཏིང་འཛིན་ཏེ། །ཟག་པ་མེད་པས་དེ་བཞིན་གཤེགས་དགེ་ཡིན། །\nཀུན་ཀྱང་ངོ་བོ་ནང་དུ་སེམས་འཛིན་ལ། །རྒྱུ་ནི་དྲན་པ་རྒྱུན་ཆགས་བརྩོན་འགྲུས་ཅན། །", "en": "From the first ground onward\nIs the concentration of the Noble Ones:\nThe immaculate and perfect concentration of the Tathagatas.\nThe essence of all concentration is the holding of the mind within,\nThe cause of which is steady mindfulness and diligence."}, {"tib": "རྣམ་པར་གཡེང་ན་སླར་ཡང་དེ་ལ་བསླན། །བྱེད་ལས་བདེ་བ་བསྐྱེད་ཅིང་རྫུ་འཕྲུལ་འགྲུབ། །\nའབྲས་བུ་མངོན་ཤེས་ལ་སོགས་ཐོབ་པ་ཡིན། །བསམ་གཏན་དང་པོའི་ཉེར་བསྡོགས་རྟོག་ཅིང་དཔྱོད། །", "en": "When attention wanders, it is once again repaired.\nBy acting thus is bliss engendered, wondrous siddhi gained.\nSuch practice has as its result\nClairvoyance and the other powers.\nDiscursiveness is present, gross and subtle,\nIn the stage of preparation for the first samadhi."}, {"tib": "དངོས་གཞི་རྟོག་པ་མེད་ལ་སྤྱོད་པ་ཙམ།། ལྷག་མ་གསུམ་པོར་རྟོག་དཔྱོད་གཉིས་ཀ་མེད། །\nསྔ་མ་སྔ་མས་ཕྱི་མའི་ཉེར་བསྡོམས་བྱེད། །འཕགས་པའི་ལམ་གྱི་རྟེན་གཞི་ཞེས་སུ་གྲགས། །", "en": "But as the first samadhi supervenes,\nThe gross departs and just the subtle stays.\nThe other three samadhis are devoid\nOf all discursiveness both gross and subtle;\nAnd each of them makes ready for the one that follows.\nAll are said to be the basis for the noble path."}, {"tib": "ཡོན་ཏན་ཐམས་ཅད་བྱེད་པའི་བསམ་གཏན་ནི། །སྙིང་རྗེ་དང་ནི་ཡེ་ཤེས་དམ་པས་ཟིན། །\nཏིང་འཛིན་མང་ལྡན་རྣམ་པ་ཐམས་ཅད་བསྒྲུབ། །བློ་རྫས་གཅིག་པའི་མཉམ་རྗེས་གཟུང་འཛིན་སྤོང་། །", "en": "The concentration that engenders every perfect quality\nIs pervaded by compassion and by primal wisdom.\nThrough having many concentrations,\nOne achieves the qualities of all the grounds and paths.\nMeditation and post-meditation, which share a single mental substance,\nEliminate duality of perceiver and perceived."}, {"tib": "མཉམ་གཞག་ལས་ལའང་རྗེས་ཐོབ་རྒྱ་ཡན་པ། །ས་བདུན་ཚུན་ཆད་ཀུན་ན་ཡོད་པ་ཡིན། །\nལྷག་པ་ཤེས་རབ་བསླབ་པའི་ངེས་འབྱེད་ནི། །ཏིང་ངེ་འཛིན་གྱི་སྦྱོར་བ་ལས་སྐྱེས་ཞིང་། །", "en": "Until the seventh ground is reached,\nPractitioners arising from such meditative equipoise\nAre dissipated in the period of post-meditation.\nWisdom's higher training is now clearly ascertained.\nIt arises from the preparation for samadhi."}, {"tib": "དངོས་དང་རྗེས་ལ་བྱུང་བའི་ཤེས་རབ་བམ། །ཐོས་དང་བསམ་པ་སྒོམ་པ་ལས་བྱུང་བའི། །\nཤེས་རབ་གསུམ་གྱི་ལྷག་མཐོང་ཡང་དག་འགྲུབ། །ཉོན་མོངས་ཚོགས་འཇོམས་ཆོས་དང་ཆོས་ཅན་ཤེས།།", "en": "Through this and through the wisdom that is born\nFrom both the actual samadhi and post-meditative state\n(Or through the wisdoms that derive\nFrom hearing, from reflection, and from meditation),\nVipashyana is perfectly accomplished.\nThrough this, the host of the afflictions is destroyed.\nPhenomena and their nature, all is understood."}, {"tib": "སྲིད་པའི་གྲོང་ལས་མྱ་ངན་མེད་པར་འདའ། །སྦྱིན་སོགས་རྣམ་པ་དྲུག་པོའང་གོང་ནས་གོང༌། །\nཁྱད་ཞུགས་ཤེས་རབ་ཕ་རོལ་ཕྱིན་ལ་བསྟེན། །དེའང་འདི་ན་སོ་སོའི་སྐྱེ་བོའི་སར།།", "en": "The city of existence is traversed,\nThe state of no more sorrow is attained.\nThe ascending structure of the six perfections\nIs founded on transcendent wisdom.\nIf therefore those who are still ordinary beings"}, {"tib": "ཐོས་པ་ལས་བྱུང་ཤེས་རབ་མ་བསྟེན་ན། །བསམ་དང་སྒོམ་པའི་ཡོན་ཏན་གནས་མིན་འཁྱམས། །\nཐོས་པའི་ཤེས་རབ་ཀུན་གྱི་རྒྱུ་རུ་གསུངས། །གཞལ་བྱའི་ཆོས་ལ་འཇལ་བྱེད་ཤེས་རབ་ཀྱིས། །", "en": "Fail to take support of wisdom that derives from listening to teachings,\nTheir reflection and their meditation both will wander into error.\nThe teachings thus declare that wisdom that derives from hearing\nIs the cause of all the others.\nThis wisdom will survey the Dharma to be understood,"}, {"tib": "དྲང་ངེས་གཉིས་དང་ལྡེམ་དགོངས་རྣམ་བཞིར་གཞལ། །ཆོས་རྣམས་ཀུན་གྱི་ངོ་བོ་དེ་བཞིན་ཉིད། །\nརྣམ་ཐར་གསུམ་དུ་གནས་པ་ངེས་དོན་ཡིན།། ཆོས་ཅན་སྣང་ཚོད་ལམ་ལ་འཇུག་པའི་ཕྱིར། །", "en": "Distinguishing expedient and definitive,\nAnd different kinds of teaching: four implied, four indirect.\nSuchness is the nature of all things\nAbiding in three doors of perfect liberation.\nThe meaning of this teaching is definitive.\nThat beings might be led upon the path,"}, {"tib": "རིག་པས་གཞལ་ནས་སྒྲོ་བཏགས་དྲང་བའི་ལམ། །གཉེས་པོས་དྲང་ངེས་གང་ལ་རྟོན་མི་རྟོན། །\nཤེས་དེ་གསུང་རབ་བལྟ་བའི་ལྡེ་མིག་ཡིན། །དེ་དག་རང་བཞིན་གསལ་བར་བྱ་བ་དང་། །", "en": "All objects that appear are analyzed with reasoning\nAnd overstated as to their existence.\nThis is the expedient path.\nTo know on which of these two teachings\n(Expedient or definitive) one should rely\nIs indeed a key that opens up the scriptures.\nWhen the nature of these two is clarified,"}, {"tib": "དོན་གྱི་དགོངས་པ་རྟོགས་པར་བྱ་བའི་ཕྱིར། །དགོངས་ལྡེམ་གཉིས་བཤད་དང་པོ་དགོངས་པ་ནི། །\nཅུང་ཟད་སྒྲོ་བཏགས་བཤད་དུ་ཡང་ཡོད་ལ། །གདུལ་བྱའི་ཡུལ་རྣམས་རེ་ཤིག་ཁ་དྲང་བ། །", "en": "Implied and indirect instructions are explained\nAs means to grasp the expedient's real intention.\nThe first of these are only slightly overstated\nAnd open to interpretation.\nTheir aim\nIs not to lead beings in one situation only."}, {"tib": "གཅིག་པུའི་སླད་དུ་མ་ཡིན་དགོས་ཆེད་དང༌། །བཅས་ནས་དགོངས་པ་རྣམ་བཞིར་སྟོན་པ་སྟེ། །\nམཉམ་པ་ཉིད་དགོངས་འགལ་བའང་གཅིག་ཏུ་བསྟན། །དོན་གཞན་ལ་དགོངས་དཔྱད་ན་མ་གྲུབ་བསྟན། །", "en": "Four kinds of implied teachings have been taught\nAnd all of them achieve the aim intended.\nTeachings that imply the equality of all phenomena\nReveal that even opposites are one.\nSome teachings, which imply another sense,\nReveal that if things are examined they are found to be unreal."}, {"tib": "དུས་གཞན་ལ་དགོངས་འབད་མེད་འཚང་རྒྱ་བསྟན། །གང་ཟག་ལ་དགོངས་དེ་དེའི་མཆོག་འཛིན་སྨད། །\nལྡེམ་པོར་དགོངས་པ་གདུལ་བྱ་གང་ཞིག་གི། བློ་ལ་མི་ཆུད་ཡིད་གཉིས་གནས་ཐོབ་རྣམས། །", "en": "Teachings that imply fulfillment at another time\nDeclare the effortless achievement of enlightenment.\nTeachings given for certain individuals\nAre intended to humiliate their arrogance.\nTeachings that are indirect\nAre those that express artfully, in pleasing and engaging words,\nWhat does not fit the minds of some and leads them into doubt."}, {"tib": "དེ་ཉིད་དགའ་བའི་མིང་དང་ཆ་ལྡན་གྱི། །རྣམ་པར་ཀྱོགས་ནས་ཡང་དག་ལམ་གཟུད་ཕྱིར། །\nཚིག་མཐུན་དོན་མི་མཐུན་པར་བཤད་པ་སྟེ། །དབྱེ་ན་ཞུགས་པ་མཚན་ཉིད་གཉེན་པོ་བསྒྱུར། །", "en": "That the perfect path might be embraced,\nThe words are on the level of their hearers,\nThough their meaning is not so.\nThese teachings are distinguished in four types:\nThose for introducing to the path, those upon the nature of phenomena,\nThose that are remedial, and those expressed in metaphors."}, {"tib": "ཞུགས་པ་ལྡེམ་དགོངས་གང་ཞིག་ཉན་ཐོས་དག །སྟོང་པས་སྐྲག་ནས་ཐེག་ཆེན་སྤོང་བ་ལ། །\nགཟུགས་ཡོད་སྨོས་པས་གྲུབ་པར་གོ་ནས་འཇུག །སྣང་ཚོད་རྨི་ལམ་ལྟ་བུར་དགོངས་པའོ། །", "en": "Teachings given indirectly for the sake of introduction\nAre aimed at Shravakas who, alarmed by emptiness,\nReject the Mahayana.\nHearing \"there is form,\"\nThey take it for existent and embark upon the path,\nYet Buddha's meaning was that everything appears to us like dreams."}, {"tib": "མཚན་ཉིད་ལྡེམ་དགོངས་ངོ་བོ་ཉིད་མེད་དོན། །ཤེས་པའི་དོན་དུ་རིམ་བཞིན་ཀུན་བཏགས་དང་། །\nགཞན་དབང་ཡོངས་གྲུབ་རྣམ་པ་གསུམ་དག་ལས། །དང་པོར་མཚན་ཉིད་ངོ་བོ་ཉིད་མེད་དང་། །", "en": "The indirect instructions on the threefold nature of phenomena—\nThe imputed, the dependent, and the actual—\nWere given that beings might grasp the absence of intrinsic being.\nThe first reveals that things have no intrinsic nature,"}, {"tib": "གཉིས་པར་སྐྱེ་བ་ངོ་བོ་ཉིད་མེད་དང་། །གསུམ་པར་དོན་དམ་ངོ་བོ་ཉིད་མེད་པས། །\nཆོས་རྣམས་བརྗོད་པ་ཟབ་པ་དག་ཏུ་སྟོན། །གཉེན་པོ་ལྡེམ་དགོངས་གཞན་གྱི་ལོག་རྟོག་ལྡོག །", "en": "The second that production too has no intrinsic nature.\nThe third shows likewise that the ultimate has no intrinsic nature.\nPhenomena are thus described with deep and perfect words.\nThe teachings given indirectly as remedial methods\nCorrect the false ideas that people have."}, {"tib": "སྐུ་ཚེ་རིགས་དང་སྐུ་བོངས་ཚད་ཀྱིས་མིན།། སངས་རྒྱས་ཐམས་ཅད་གཟུགས་སྐུ་ཆོས་སྐུར་མཉམ། །\nཚོགས་ཀྱི་ཡུལ་ལའང་མཉམ་པ་ལྟ་བུར་དགོངས། །བསྒྱུར་བ་ལྡེམ་དགོངས་བསད་བྱ་མ་ཡིན་པའི། །", "en": "Declaring that his life, his lineage and stature were both measureless,\nThe Buddha's meaning was that all the Buddhas' forms\nAre equal in the Dharmakaya,\nAnd equal likewise in accumulation and activities.\nThe teaching given indirectly in the form of metaphors—\nWhere it is said that one should slay one's parents\n(Who should not be slain),"}, {"tib": "ཕ་མ་གསོད་དང་དེ་བཞིན་བཅོམ་བྱ་མིན། །རྒྱལ་པོ་དང་ནི་གཙང་སྦྲ་ཅན་གཉིས་བཅོམ། །\nསྲེད་ལེན་ཀུན་གཞི་སོགས་ལ་བཏགས་པའི་དོན། །རྣལ་མར་བཟུང་ན་ནོར་པ་ཆེན་པོའོ།།", "en": "Destroy the ones who should not be destroyed\n(The Sovereign and the two of pure life)—\nThese indicate such things as\nCraving, Grasping, and the alaya.\nTo understand them in their literal sense would be a great mistake."}, {"tib": "མདོར་ན་དགོངས་དང་ལྡེམ་པོའི་ཁྱད་པར་ནི། །དགོངས་པ་ཡིད་ལ་རྣམ་པར་བཞག་པ་ཙམ། །\nཡིན་གྱི་ཕ་རོལ་བཟུང་ལ་ལྟོས་པ་མིན། །ལྡེམ་པོར་དགོངས་པ་ཕ་རོལ་བཟུང་བ་ལ།།", "en": "Here, in brief, is what distinguishes\nThe teachings that are indirect from those that are implied.\nThat which is implied relates to what the Buddha had in mind:\nSuch words do not depend upon the wits of the recipient.\nBut teachings given indirectly\nDo depend upon the hearers' understanding."}, {"tib": "ལྟོས་པའི་རྣམ་འབྱེད་གསུང་རབ་ལྟ་བའི་མིག །གཞལ་བྱའི་ངོས་ནས་རྒྱལ་བས་ཆོས་ཀྱི་སྒོ། །\nབརྒྱད་ཁྲི་བཞི་སྟོང་གསུངས་པ་མཐའ་དག་དོན། །འཇིག་རྟེན་ཀུན་རྫོབ་པ་དང་དོན་དམ་སྟེ། །", "en": "This distinction likewise is a key that opens up the scriptures.\nRegarding what is to be understood,\nThe essence of the four and eighty thousand sections\nOf the Dharma of the Conqueror consists in the two truths:\nThe all-concealing relative of worldly beings and the absolute."}, {"tib": "བདེན་པ་གཉིས་ལས་གསུམ་པ་མ་མཆིས་སོ། །ཀུན་རྫོབ་པ་ལ་སྣང་ལུགས་རྣམ་པ་གཉིས། །\nའཁྲུལ་ཤེས་ངོ་ལ་སྣང་བ་ཇི་སྙེད་ཀྱི། །སྣང་ཚོད་ཉིད་དང་མཐུན་པར་དོན་བྱེད་རྣམས། །", "en": "Aside from these there is no third.\nTwo ways there are in which the all-concealing relative appears:\nThose things occurring to deluded mind\nThat function in accordance with the way that they appear\nAre known as \"unmistaken relative.\""}, {"tib": "ཡང་དག་ཀུན་རྫོབ་ཉིད་དེ་སྣང་ནའང་། །དོན་མི་བྱེད་ལ་ལོག་པའི་ཀུན་རྫོབ་གྲགས། །\nདོན་དམ་བདེན་པ་གཤིས་ཀྱི་བཞུགས་ཚུལ་ཏེ། །འཁོར་བ་དང་ནི་མྱ་ངན་འདས་པའི་ཆོས། །", "en": "And those that do not function though they do appear\nAre known as the \"mistaken relative.\"\nThe absolute truth is the fundamental way of being.\nThe phenomena of samsara and nirvana\nAre not by nature of two different kinds,"}, {"tib": "ངོ་བོ་གཉིས་མེད་གདོད་ནས་བསམ་བརྗོད་འདས། །རྟོགས་དང་མ་རྟོགས་བློ་ཡི་མ་བཞག་གོ། །\nབདེན་གཉིས་འདྲེས་པའི་སྣང་སྟོང་ཟུང་འཇུག་ནི། །རྫིང་བུར་ཞུགས་པའི་ཟླ་བའི་སྐྱེ་མཆེད་བཞིན། །", "en": "But are beyond both thought and word primordially.\nThis truth is not set forth in terms of realized and unrealized minds.\nThe two truths blend: appearance and emptiness unite.\nPhenomena are like the moon reflected in a pool."}, {"tib": "སྣང་བའི་ཆ་ནས་ཀུན་རྫོབ་བདེན་པ་དང་། །རང་བཞིན་མ་གྲུབ་དོན་དམ་བདེན་པའོ། །\nཡུལ་ལྔའི་ཤེས་པ་ཚོན་རིས་མ་འདྲེས་ལྟས། །གཟུགས་སོགས་འདོད་པའི་ལོངས་སྤྱོད་ཆ་བཟུང་བ། །", "en": "Their aspect of appearance is the all-concealing truth;\nTheir lack of real existence is the absolute.\nTo the five sense consciousnesses\nForms and other things appear distinct like colors in a painting.\nDesirable, they're grasped as things to be enjoyed."}, {"tib": "དེ་ལ་དེར་འཛིན་དགག་བསྒྲུབ་བློ་རྟོག་གི། །འཁྲུལ་སྣང་སྒྱུ་མའི་དཔེ་བརྒྱད་ཉིད་དུ་བརྟག །\nམཐར་ཐུག་བློ་ཡིས་རྣམ་པར་དཔྱད་བཟོད་ན།། དོན་དམ་མ་ཡིན་བློ་ནི་ཀུན་རྫོབ་ཕྱིར། །", "en": "They are considered real and are rejected or accepted.\nThese delusory perceptions of discursive mind\nShould be examined in the light of eight examples of illusion.\nThe ultimate that can withstand analysis\nIs not the absolute, for intellect itself is relative."}, {"tib": "གཅིག་དང་དུ་མར་འགལ་བའི་མཚན་ཉིད་རྣམས། །བློ་ཡི་ཡུལ་ལ་ནམ་ཡང་གནས་མ་མྱོང་། །\nརེ་ཞིག་གྲུབ་པའི་མཐའ་ཡི་རྣམ་བཞག་ནི།། ཤེས་པའི་དོན་དམ་བློ་ཡིས་དཔྱད་པ་དང་། །", "en": "What is neither one nor many\nCan never be the object of the intellect.\nHere now is the outline of the tenet systems.\nThe ultimate constituent of consciousness through mental scrutiny;"}, {"tib": "དངོས་པོའི་དོན་དམ་ཐོ་བས་བཅོམ་པ་ཡི། །རྡུལ་ཕྲན་ཆ་མེད་ཉན་ཐོས་སྡེ་བའི་ལུགས། །\nདོན་བྱེད་ནུས་པ་གང་ཡིན་དེ་འདིར་ནི། །དོན་དམ་ཡོད་མིན་གཞན་ནི་ཀུན་རྫོབ་ཡོད། །", "en": "The ultimate constituent of matter through destruction with a hammer—\nArriving thereby at the partless particle:\nSuch is the system of the Shravakas.\nWhat performs a function is here declared the absolute;\nThe rest is all-concealing relative."}, {"tib": "དེ་ལ་རང་སྤྱིའི་མཚན་ཉིད་ཀྱིས་བཤད་པ། །མདོ་སྡེ་པའི་ལུགས་ངོ་བོ་རྟོག་གེར་མཐུན། །\nགཟུང་འཛིན་གཉིས་སུ་སྣང་བའི་ཡུལ་ཡུལ་ཅན།། ཀུན་རྫོབ་བདེན་པ་ཉིད་དེ་གང་ལས་གཞན། །", "en": "These two have been described respectively\nAs the specifically and generally characterized.\nThis is the view of the Sautrantika in harmony with reasoning.\nThe subject and the object appearing as two separate things—\nPerceiver and perceived—is the all-concealing truth."}, {"tib": "གཉིས་མེད་ཤེས་པ་དོན་དམ་བདེན་པ་རུ། །འདོད་པ་སེམས་ཙམ་པ་ཡི་གྲུབ་པའི་མཐའ། །\nཇི་ལྟར་སྣང་བ་ཐམས་ཅད་ཀུན་རྫོབ་ཏུ།། གྲུབ་པ་སྒྱུ་མ་ལྟ་བུའི་མཚན་ཉིད་དེ། །", "en": "By contrast, nondual mind is absolute:\nThis is the tenet of the Chittamatra school.\nAll appearing things exist upon the level of the relative\nAnd are illusion-like by nature—"}, {"tib": "དོན་དམ་གྲུབ་པ་མེད་པ་ནམ་མཁའ་ལྟར། །འདོད་པ་དབུ་མ་རང་རྒྱུད་པ་ཡི་ལུགས། །\nའདི་ལྟར་སྣང་བ་ཉིད་ནི་ཀུན་རྫོབ་དང་། །སྟོང་པ་དོན་དམ་ཤེས་བྱ་ཐ་སྙད་ཀྱིས། །", "en": "Though ultimately none is real but is like space—\nTo make this affirmation is the way of the Svatantrika Madhyamikas.\nTo say \"the relative is just appearance\"\nAnd that \"emptiness is absolute,\" is simply to verbalize."}, {"tib": "བཏགས་པ་གང་ཡང་སྤྲོས་པའི་མཐ་དང་བྲལ། །སྣང་དུས་ཉིད་ནས་སྐྱེ་འགག་འགྲོ་འོང་མེད། །\nགཞན་དབང་དངོས་པོར་འདོད་པའི་ཀུན་རྫོབ་ཀྱང་། །དེ་ཡི་གྲུབ་པའི་མཐའ་རུ་ཁས་མ་བླངས། །", "en": "Phenomena transcend all ontological extremes.\nFrom the very moment they appear,\nThey have no birth and no cessation, no going and no coming.\nTo hold back from asserting the position\nThat on the level of the relative, dependent things exist—"}, {"tib": "དེ་ནི་ཐལ་འགྱུར་ཤིང་རྟའི་སྲོལ་འབྱེད་ཆེ། །ཀླུ་དབང་ཟླ་བ་གྲགས་པའི་ཁྱད་ཆོས་ཡིན། །\nའདིར་ནི་འོག་མའི་རྣམ་པ་ཐམས་ཅད་ལ། །བརྩད་ཅིང་བརྟགས་པས་གོང་མ་ནོར་མི་འགྱུར། །", "en": "Such is the special teaching of Nagarjuna and of Chandrakirti,\nThe founders of the great way of Prasangika.\nAble to examine and contest the views of all the lower schools,\nThis is the supreme way and free from all mistake."}, {"tib": "རང་རང་འདོད་ཞེན་གྱིས་སྦྱར་ལྟོས་གྲུབ་ཀྱི། །གྲུབ་པའི་མཐའ་ཡི་མཚན་ཉིད་ཉམས་འོག་ཆུད། །\nདེ་ལས་དངོས་དང་དངོས་འདྲ་དངོས་མིན་གྱི། །མཚན་ཉིད་ལེགས་པར་ཕྱེད་པའི་ཤེས་རབ་ཀྱང་། །", "en": "Knowing thus the character of different tenets,\nDeriving as these do from varying beliefs,\nThe wisdom that can well discern the true position\n(And that which is in harmony, and that which disagrees)\nDepends upon one's hearing of the teaching."}, {"tib": "ཐོས་ལ་བརྟེན་འབྱུང་དེ་ཡིས་ཉོན་མོངས་བཅིལ། །ཉོན་མོངས་མེད་ལ་བདུད་ཀྱིས་གླགས་མི་རྙེད།།\nའདིར་གང་བཟུང་ན་གཤིས་ཀྱི་བཞུགས་ཚུལ་ལ། །སྨྲ་བསམ་བརྗོད་མེད་དོན་དམ་བདེན་པ་ཡིན། །", "en": "It expels defilement\nAnd on the undefiled the demons have no hold.\nWhat here is comprehended is the fundamental nature of phenomena:\nUnspeakable, unthinkable,\nThe final truth that cannot be expressed."}, {"tib": "བློ་ཡི་ཆ་ནས་སྨྲ་བསམ་བརྗོད་པ་རུ། །བཏགས་ཤིང་སྣང་བ་ཀུན་རྫོབ་བདེན་པའི་ཆར། །\nབཞག་ནས་བདེན་གཉིས་རྟོགས་བྱ་རྟོགས་བྱེད་ལས། །འདས་པ་སུས་ཀྱང་མངོན་དུ་བྱར་མེད་ལ། །", "en": "All things that appear and are imagined by the mind\nAs what can be expressed and spoken of and thought\nAre posited as relative, the all-concealing truth.\nThe union of the two truths\nIs beyond both realizer and realized;\nNo one can experience it in such a way."}, {"tib": "བལྟར་མེད་ཐོབ་དང་མ་ཐོབ་གཉིས་ཀ་མེད། །སྟོང་པ་ཉིད་དང་ངེས་པར་རྗེས་མཐུན་པའི། །\nབློ་སྐྱེས་པ་ལ་རྟོགས་པའི་བླ་དྭགས་བཏགས། །", "en": "Indeed it cannot be observed.\nThere's no attaining and no nonattaining it!\nBut when a state of mind occurs attuned to emptiness,\nTo this the label \"realization\" is affixed."}, {"tib": "གང་ཞིག་རྟེན་ཅིང་འབྲེལ་འབྱུང་ནི། །ཆོས་རྣམས་མ་ལུས་ཀུན་གྱི་མཛོད། །\nགང་ལ་བསམ་པའི་ཤེས་རབ་ཀྱིས།། ཡང་དག་འཇུག་པ་ལྡེ་མིག་ཡིན། །", "en": "All arises in dependence:\nThis, of all the Dharma, is the treasure.\nTo understand and penetrate this well,\nThrough wisdom based upon reflection,\nIs the key to all the teachings—all without exception."}, {"tib": "སྣང་སྲིད་འཁོར་འདས་ཆོས་རྣམས་ཀུན། །གང་ནས་ཀྱང་ནི་མ་འོངས་ལ། །\nགང་དུའང་མ་སོང་མི་གནས་པ། །གཤིས་ལ་གནས་པའི་རྟེན་ཅིང་འབྲེལ། །", "en": "Everything that might appear,\nAll things of both samsara and the state beyond all sorrow,\nCome from nowhere; nowhere do they go or stay,\nArising in dependence based upon their fundamental nature."}, {"tib": "ཆོས་ཅན་ཉིད་ཀྱང་སྐྱེ་འགག་ལྟར། །སྣང་དུས་ཉིད་ནས་སྟོང་པར་ཤར། །\nསྤྲོས་པའི་མཐའལ་མི་གནས་པ། །དབུ་མའི་རང་བཞིན་ཉིད་དུ་བསྟན། །", "en": "Things seem to arise and then to cease,\nAnd yet they're empty in the very instant of appearing.\nTo rest in no conceptual extreme\nIs set forth as the Middle Way itself."}, {"tib": "དག་དང་མ་དག་གློ་བུར་བ། །དོན་ལ་མེད་ཀྱང་མེད་བཞིན་སྣང་། །\nཀུན་ཏུ་བཏགས་པས་ཉེ་བར་ལེན། །རྟོག་ཅིང་དཔྱད་པས་མཐའ་བཞི་བྱུང་། །", "en": "\"Clean\" and \"unclean\"—both are adventitious.\nThey don't exist in fact and yet appear, though they are nonexistent.\nThey're seized upon through mental imputation.\nAnalysis reveals these four extremes:\nExistence, nonexistence, permanence, annihilation."}, {"tib": "ཡོད་དང་མེད་དང་རྟག་དང་ཆད། །དབུས་ལ་གནས་པའང་མཁས་པ་མིན། །\nཇི་ལྟར་དར་གྱི་སྲིད་བུ་བཞིན། །འདོད་པའི་གྲུབ་མཐས་རང་ཉིད་བཅིངས། །", "en": "Even those \"abiding in the middle\" are not wise!\nFor just like silkworms cased within their silk,\nThey're tangled in their tenets and assertions!"}, {"tib": "འདི་ན་བློ་ཡིས་བཏགས་པའི་ཆོས། །སྐྱེ་འགག་གནས་དང་འགྲོ་འོང་མིན། །\nདོན་གཅིག་མ་ཡིན་ཐ་དད་མིན། །རྟག་པ་མ་ཡིན་ཆད་པའང་མིན། །", "en": "Phenomena—the things imputed by our minds—\nDo not arise, nor do they cease or stay;\nThey do not come, they do not go;\nThey are not different, they are not the same;\nThey are not permanent and they are not annihilated."}, {"tib": "སྤྲོས་པ་མཐའ་དག་ཉེར་ཞི་བའི། །རང་བཞིན་ཉིད་དུ་ཤེས་པ་ནི། །\nབསམ་བྱུང་ཤེས་རབ་ངོ་བོ་ཡིན།།", "en": "All conceptual theories regarding them subside.\nTo know this as their very nature\nIs the essence of the wisdom that arises from reflection."}, {"tib": "སྣང་ཡུལ་ས་ཆུ་མེ་རླུང་མཁའ། །རི་དང་ནགས་ཚལ་ཁང་བུ་བརྩེགས། །\nའདུ་བྱེད་རྒྱུ་ལས་ཐམས་ཅད་སྐྱེས། །འཁོར་བ་རྟེན་ཅིང་འབྲེལ་འབྱུང་ཡིན། །", "en": "All appearing objects: earth and water, fire and wind and space;\nMountains, forest groves and towns;\nAll such compounded things arise from their respective causes.\nSamsara thus arises in dependence."}, {"tib": "མ་རིག་པ་ལས་འདུ་བྱེད་དེ།། དེབཞིན་གཅིག་ལ་གཅིག་རྟེན་གྱིས། །\nརྒ་ཤིའི་བར་དུ་འབྲེལ་བ་ནི། །ནང་གི་རྟེན་ཅིང་འབྲེལ་བར་འབྱུང༌། །", "en": "Because there's ignorance, conditioning factors manifest,\nAnd likewise every link is based on the preceding one.\nThey all unfold till \"age and death\" is reached.\nSuch is dependent arising in the inner sense."}, {"tib": "མྱང་འདས་རྟེན་ཅིང་འབྲེལ་འབྱུང་ནི། །ལམ་དང་འབྲས་བུ་གཉིས་སུ་གནས། །\nལམ་ནི་འཁོར་བའི་རྟེན་ཅིང་འབྲེལ། །ལུགས་སུ་འཇུག་པ་བཅུ་གཉིས་ཀྱི། །", "en": "Nirvana, which arises in dependence,\nRests in both the paths and their result.\nTo speak then of these paths:\nWhen ignorance,\nThe root of the twelve links arranged in forward order\nLeading to samsara,"}, {"tib": "རྩ་བ་མ་རིག་ཆེན་པོ་ནི། །རིག་པའི་ཡེ་ཤེས་ཀྱིས་ལྡོག་པས། །\nའདུ་བྱེད་ལ་སོགས་གཞན་རྣམས་ཀྱང་། །ལུགས་ལྡོག་སྲིད་པའི་རྩ་བ་ཆད། །", "en": "Is vanquished through wisdom of awareness,\nConditioning factors and the other links\nAre, in their order, also overturned,\nThus severing the root of all existence."}, {"tib": "དེ་ལྟར་རྟེན་ཅིང་འབྲེལ་འབྱུང་གི། མཚན་ཉིད་མཐོང་བའི་སྐྱེས་བུ་ཡིས། །\nསྡུག་བསྔལ་ཤེས་ཤིང་ཀུན་འབྱུང་སྤོང་། །འགོག་པ་མངོན་གྱུར་ལམ་མཆོག་མཐོང་། །", "en": "Those who understand the nature\nOf \"arising in dependence,\"\nKnowing Suffering, reject its Origin;\nThey effect Cessation and behold the supreme Path."}, {"tib": "དེ་ལྟར་སྣང་བ་སྐྱེ་མེད་དུ། །བསམ་པས་གཏན་ལ་ཕབ་པ་དེའི། །\nརང་བཞིན་ཤེས་པའི་ཆོས་ཉིད་ལ། །སྒོམ་པའི་ཤེས་རབ་ཅེས་སུ་གྲགས། །", "en": "And so, upon the basis of reflection,\nOne comes to the conviction that phenomena are unoriginate.\nTo recognize their nature and to rest in it\nIs known as wisdom that results from meditation."}, {"tib": "ནམ་མཁའ་རྣམ་པར་དག་པའི་དབྱིངས། །སྒོམ་པའི་དོན་དང་རོ་གཅིག་པ། །\nདེ་ལ་གཟུགས་སོགས་ཕུང་པོ་ལྔ། །ཚོགས་བརྒྱད་ཀུན་ཀྱང་ཡོད་མ་ཡིན། །", "en": "The ultimate expanse—immaculate, pure space—\nIs of a single taste with meditation's object.\nHere there is no place for form or other aggregates,\nAnd also of eight consciousnesses there's indeed no trace."}, {"tib": "མེད་ཅེས་བློ་ཡིས་བཀག་པ་ན།། ཤེས་རབ་ཉིད་དང་ལྷག་པར་འགལ། །\nཅང་མེད་ཆད་པ་ཉིད་མ་ཡིན། །སྐུ་དང་ཡེ་ཤེས་ཀུན་གྱི་མཛོད། །", "en": "To say \"There's nothing there,\" thus mentally refuting them,\nIs utterly at variance with wisdom in itself.\nThe ultimate expanse is not mere nothingness;\nIt is a treasure of all wisdoms and enlightened bodies."}, {"tib": "རང་བཞིན་ཉིད་དུ་རྣམ་དག་པའི། །ཡང་དག་ཉིད་ལ་ཡང་དག་བལྟ། །\nབལྟ་ཞེས་བྱ་བའང་ཀུན་རྫོབ་སྟེ། །ངང་ལས་མ་གཡོས་སྒོམ་པའི་མཆོག །", "en": "Perfectly one watches perfect purity,\nWhich is the spotless nature in itself.\nBut \"to watch\" is just a metaphor.\nNot to wander from this is the best of meditations."}, {"tib": "དེ་ཡི་མདུན་ན་བློ་དང་ནི། །ཡིད་བྱེད་ཐམས་ཅད་གནས་པ་མིན། །\nཤེས་རབ་དེ་འདྲར་ཡོངས་ཤེས་ན། །ཐབས་ཀྱིས་རྣམ་པར་གྲོལ་བར་འགྱུར། །", "en": "For in the presence of such primal wisdom\nThere's no place for intellect and mental fabrication.\nWhen wisdom such as this is well and truly known,\nIt is by skillful means that liberation comes."}, {"tib": "ཤེས་རབ་མེད་པའི་ཐབས་ཀྱིས་ནི། །བཅིངས་པ་ཉིད་ལས་གྲོལ་བ་མེད། །\nགང་དུ་སྟོང་ཉིད་སྙིང་རྗེ་གཉིས། །རྒྱུད་ལ་བསྟེན་པ་ཚོགས་ལམ་ཆེ།།", "en": "But if there is no wisdom, skillful means\nWill bring to us no freedom from our fetters.\nThose who cultivate within their minds\nEmptiness and great compassion\nPursue the great path of accumulation."}, {"tib": "སྦྱོར་ལམ་ཆོས་མཆོག་མན་ཆད་དུ། །མཉམ་རྗེས་སྟོང་དང་སྙིང་རྗེར་འཆར། །\nམཐོང་ལམ་ཐོབ་ནས་གཉིས་པོ་ནི། །ཟུང་དུ་འཇུག་ཅིང་འདུ་འབྲལ་མེད། །", "en": "Until the supreme mundane level on the path of joining,\nEmptiness occurs in meditation, and compassion afterward.\nBut when the path of seeing is attained,\nEmptiness, compassion—both unite inseparably."}, {"tib": "རབ་ཏུ་དགའ་བ་དང་པོའི་སར། །ཆོས་ཉིད་བདེན་པ་མངོན་སུམ་མཐོང་། །\nདེ་ནས་འཕགས་པའི་སྒོམ་ལམ་དུ། །ས་བཅུ་རྒྱུན་གྱི་མཐའ་མ་ལ། །", "en": "And on the first ground, that of Perfect Joy,\nThe truth of suchness is perceived directly.\nLater, on the noble path of meditation\nAt the tenth ground's final point,"}, {"tib": "རྡོ་རྗེ་ལྟ་བུའི་ཏིང་འཛིན་གྱིས། །ཤེས་སྒྲིབ་བཅོམ་ནས་མངོན་བྱང་ཆུབ། །\nམཉམ་པར་མ་གཞག་མེད་པ་སོགས། །རྒྱལ་བའི་མ་འདྲེས་ཆོས་བཅོ་བརྒྱད། །", "en": "Concentration diamondlike destroys the veils of thought:\nEnlightenment stands manifest.\nAnd then there is no moment when\nThe mind is not at rest in even meditation.\nEighteen distinctive qualities of the Victorious Ones,"}, {"tib": "སྟོབས་བཅུ་དང་ནི་མི་འཇིགས་བཞི། །མཐའ་དག་མངོན་གྱུར་སངས་རྒྱས་ཡིན། །\nའདི་ལྟར་ཕ་རོལ་ཕྱིན་པ་དྲུག །རྒྱལ་བ་ཀུན་གྱི་གཞུང་ལམ་སྟེ། །", "en": "The ten strengths and four fearless states—\nAll of them are actualized, and one is Buddha.\nIt's thus that all the six perfections\nAre the broad highway of all the Conquerors."}, {"tib": "ལྟ་བས་མ་རྨོངས་སྤྱོད་པའང་། །ཤིན་ཏུ་རྣམ་དག་འོག་མིན་འགྲོ། །\nཡོན་ཏན་རིན་པོ་ཆེའི་མཛོད་དགའ་བའི་ཆར་ཞེས་བྱ་བ་ལས། སྨོན་འཇུག་གི་བསླབ་བྱ་བསྟན་པའི་ཚོམས་ཏེ་ལེའུ་དགུ་པའོ།།", "en": "Unmistaken in their view and in their deeds most pure,\nTo Akanishta unexcelled they make their way."}],
      10: [{"tib": "།།བྱང་ཆུབ་སེམས་དཔའ་སྔགས་ཀྱི་ཐེག་པ་ལ། །འབྲས་བུའམ་ནི་རྡོ་རྗེའི་ཐེག་པ་དང་།\n།ཐབས་ཀྱི་ཐེག་པ་རིག་པ་འཛིན་པ་ཡི། །སྡེ་སྣོད་ཅེས་གྲགས་རྒྱུ་ལས་ཁྱད་པར་འཕགས། །", "en": "Regarding the Bodhisattva Mantra Vehicle:\nIt is the Resultant or the Vajra Vehicle,\nAnd the Vehicle of Methods, the Pitaka of Vidyadharas;\nIt is renowned as superior to the Causal [Vehicle]."}, {"tib": "རྒྱུན་ཆགས་ངོས་ནས་གཞི་ལམ་འབྲས་བུའི་རྒྱུད། །རིམ་གཉིས་ལ་བརྟེན་ཐབས་དང་ཤེས་རབ་འབྲེལ།\n།དཀའ་ཐུབ་མཐུ་ཡིས་མི་གདུང་འཇུག་སྒོ་ཡངས། །དབང་པོ་རྣོན་པོའི་དབང་བྱས་བརྟུལ་ཞུགས་མྱུར། །", "en": "From the perspective of continuity, it is the Tantra of Ground, Path, and Result.\nRelying on two stages, method and wisdom are conjoined.\nNot tormented by the power of austerity, the entrance is vast.\nDominating with sharp faculties, the discipline is swift."}, {"tib": "དུས་ལ་དགོངས་པ་རྫོགས་ལྡན་གསུམ་ལྡན་དང་། གཉིས་ལྡན་དང་ནི་རྩོད་པར་ལྡན་པ་བཞི།\n།རིགས་ལ་དགོངས་པ་བྲམ་ཟེ་རྗེའུ་རིགས། །རྒྱལ་པོ་དང་ནི་དམངས་སམ་གདོལ་པའོ། །", "en": "Intended for the times: the Perfection, the Three,\nThe Two, and the Age of Strife—these four.\nIntended for castes: the Brahmin, the Royal Caste,\nThe King, and the Lowly or Outcaste."}, {"tib": "དབང་པོར་དགོངས་པ་རྟུལ་འབྲིང་རྣོན་དང་མཆོག །ཆོས་ནི་བྱ་སྤྱོད་རྣལ་འབྱོར་བླ་ན་མེད།\n།དང་པོ་གསུམ་ནི་གསང་སྔགས་ཕྱི་པ་སྟེ། །ཐུབ་པས་དངོས་གསུངས་མཚན་ཉིད་ཐེག་པ་དང་། །", "en": "Intended for faculties: dull, medium, sharp, and supreme.\nThe Dharmas are Action, Conduct, Yoga, and Unsurpassed.\nThe first three are the Outer Secret Mantra;\nExplicitly taught by the Sage, they share characteristics with the [Causal] Vehicle."}, {"tib": "གཙང་སྦྲ་སྡོམ་པའི་ཀུན་སྤྱོད་ཕལ་ཆེར་མཚུངས།།རྩོད་པའི་དུས་དང་འགལ་བའི་འདོད་ཆགས་ཀྱིས།\n།ཀུན་སྤྱོད་ལམ་བྱེད་ལྷ་ཡང་ཟུང་འབྲེལ་མིན། །ཤ་ལྔ་བདུད་རྩི་ལྔ་ལ་ལོངས་མི་སྤྱོད། །", "en": "Conduct of cleanliness and vows is mostly similar.\nThough conflicting with the Age of Strife, desire\nIs taken as the path, yet deities are not in union.\nThe five meats and five nectars are not enjoyed."}, {"tib": "དབྱེ་ན་བྱ་བ་དང་ནི་སྤྱོད་པའི་རྒྱུད།།སེམས་དཔའ་སེམས་མ་རིག་སྔགས་གཟུངས་སྔགས་ལྷ།\n།བྱ་བས་རྗེ་ཁོལ་སྤྱོད་པས་སྤུན་གྲོགས་ཚུལ། །བྱ་བས་རྗེ་ཁོལ་རྣམ་པར་བསྒྲུབ་པ་ལའང་། །", "en": "Dividing them: The Tantras of Action and Conduct.\nMale and female Bodhisattvas, Vidya [mantra] and Dharani [deities].\nIn Action, the manner is lord and servant; in Conduct, friend and sibling.\nEven in accomplishing the lord and servant of Action..."}, {"tib": "བདག་བསྐྱེད་མེད་པར་རང་ཉིད་དམན་པར་བཞག །ལ་ལར་ཡོད་དེ་གཙོ་བོར་མདུན་བསྐྱེད་སྟོན།\n།ཕྱི་ཡི་བྱ་བ་ཁྲུས་དང་གཙང་སྦྲ་གཙོ། །མཆོག་དམན་ཚུལ་དུ་བསྒྲུབས་ནས་དངོས་གྲུབ་འདོད། །", "en": "Lacking self-generation, one positions oneself as inferior.\n[Though] existing in some, principally front-generation is shown.\nExternal activities, bathing and cleanliness, are paramount.\nPracticing in the manner of high and low, siddhis are desired."}, {"tib": "བྱ་བའི་ཐབས་དང་ནང་གི་རྣལ་འབྱོར་ལ། །ཆ་མཉམ་སྤྱོད་པས་སྤྱོད་པའི་རྒྱུད་དུ་གྲགས།\n།རང་ཉིད་དམ་ཚིག་སེམས་དཔའི་མདུན་བཞུགས་པའི། །ཡེ་ཤེས་ལྷ་ལ་སྤུན་ལྟར་དངོས་གྲུབ་ལེན། །", "en": "Regarding the method of Action and one's own [internal] yoga,\nBy practicing in equal parts, it is known as the Conduct Tantra.\nOneself as the Samayasattva, and dwelling in front\nIs the Wisdom Deity; as a sibling, one takes siddhis."}, {"tib": "རྣལ་འབྱོར་རྒྱུད་ཀྱི་གྲུ་ཆད་མན་ཆད་ལ། །བཀོད་པ་ཆེན་པོ་ལོངས་སྤྱོད་རྫོགས་པ་ལྟར།\n།བསྟན་ཡང་ཟུང་འབྲེལ་མ་ཡིན་བསྐྱེད་དང་རྫོགས། །ཐབས་དང་ཤེས་རབ་རིམ་ཅན་སོ་སོ་བ།།", "en": "Regarding the boundaries of Yoga Tantra and below,\nThe Great Array is like the Sambhogakaya.\nThough shown, generation and perfection are not in union.\nMethod and wisdom are graduated and distinct."}, {"tib": "རྣལ་འབྱོར་གཙོར་སྤྱོད་ལུས་ངག་གྲོགས་སུ་སྟོན། །ཡེ་ཤེས་དགུག་བསྟིམ་ཕྱག་རྒྱ་བཞི་ཡིས་བཅིང་།\n།དམ་ཡེ་གཅིག་པའི་ངང་ནས་དངོས་གྲུབ་བླང་། །བཟླས་བ་པའི་མཐའ་ལ་གཤེགས་གསོལ་བྱ་བའོ། །", "en": "Practicing yoga principally, body and speech are shown as friends.\nWisdom [beings] are invoked and dissolved, bound by the four mudras.\nWithin the state of Samaya and Wisdom being one, siddhis are taken.\nAt the conclusion of recitation, the request to depart is made."}, {"tib": "བླ་ན་མེད་པ་གསང་སྔགས་ནང་པ་ནི། །བསྐྱེད་དང་རྫོགས་དང་ཟུང་དུ་འཇུག་པ་ལས།\n།ཕ་རྒྱུད་མ་རྒྱུད་གཉིས་མེད་རྒྱུད་དུ་བཞག །ལྷ་ནི་འཁྲིལ་སྦྱོར་དམ་རྫས་ཁྱད་པར་སྤྱོད། །", "en": "The Unsurpassed Inner Secret Mantra\nIs the union of generation and perfection.\nIt is posited as Father Tantra, Mother Tantra, and Non-dual Tantra.\nDeities are in union; special samaya substances are utilized."}, {"tib": "གཙང་བརྩོག་སྤོང་ལེན་མེད་པའི་རང་བཞིན་ཅན། །རྣལ་འབྱོར་ཆེན་པོ་ཕ་རྒྱུད་ཐབས་ཀྱི་ལམ།\n།བསྐྱེད་རིམ་གཙོར་བྱས་རླུང་ལྔ་དག་པར་བྱེད༑ ༑རྗེས་སུ་རྣལ་འབྱོར་མ་རྒྱུད་ཤེས་རབ་ལམ། །", "en": "Possessing a nature without accepting or rejecting clean and dirty.\nGreat Yoga (Mahayoga), the Father Tantra, is the path of method.\nMaking generation stage primary, it purifies the five winds.\nSubsequently, Yoga [of Scripture] (Anuyoga), the Mother Tantra, is the path of wisdom."}, {"tib": "རྫོགས་རིམ་གཙོར་བྱེད་ཁམས་ལས་ཞུ་བདེ་བསྐྱེད། །ཤིན་ཏུ་རྣལ་འབྱོར་གཉིས་མེད་ཡེ་ཤེས་ལམ།\n།གཅིག་དང་དུ་བྲལ་འོད་གསལ་ཆེན་པོར་སྦྱོར། །ཀུན་གྱི་གནད་དུ་ཁམས་དྲུག་ལྡན་པའི་ལུས། །", "en": "Making perfection stage primary, from elements melting bliss is generated.\nGreat Perfection (Atiyoga), the Non-dual path of primal wisdom,\nSeparated from one and many, connects to Great Luminosity.\nThe vital point of all: the body possessing six elements."}, {"tib": "ཕུང་པོ་ཁམས་དང་སྐྱེ་མཆེད་རྩ་ཐིག་རླུང་། །ལས་སུ་རུང་ལས་བསྐྱེད་རྫོགས་ཟུང་འཇུག་གསུམ།\n།ཡོན་ཏན་ཀུན་བསྐྱེད་རྡོ་རྗེ་ཐེག་པའི་ལམ། །རང་བཞིན་ལྷུན་གྲུབ་དཀྱིལ་འཁོར་ཆེན་པོ་རུ། །", "en": "Aggregates, elements, and sense fields; channels, drops, and winds—\nThrough being workable, the three—generation, perfection, and union—\nGenerate all qualities; this is the path of the Vajra Vehicle.\nIn the naturally spontaneously present great mandala..."}, {"tib": "ལྟ་བས་ཐག་བཅད་སྒོམ་པས་ཉམས་སུ་བླངས། །སྤྱོད་པས་ལ་དོར་འབྲས་བུས་དོན་གཉིས་བསྒྲུབ།\n།གཞི་ལམ་འབྲས་བུའི་རྒྱུད་ལ་ཡང་དག་བསྟེན། །འཇུག་པའི་སྒོ་ནི་སྨིན་པར་བྱེད་པའི་དབང་། །", "en": "The view decides; meditation brings into experience.\nAction adopts and discards; the result accomplishes the two benefits.\nRelying authentically on the Tantra of Ground, Path, and Result.\nThe door of entering is the ripening empowerment."}, {"tib": "གྲོལ་བར་བྱེད་པ་བསྐྱེད་རྫོགས་རྣམ་པ་གཉིས། །མཐུན་པའི་གྲོགས་སུ་དམ་ཚིག་སྤྱོད་པ་གསུམ།\n།སྔགས་ཀྱི་ལམ་མཆོག་རྣལ་མར་ངེས་པ་ལས། །དང་པོ་དབང་བསྐུར་མ་ཐོབ་དངོས་གྲུབ་མེད། །", "en": "That which liberates is the two aspects: generation and perfection.\nAs harmonious friends are the three: samaya and conduct.\nFrom certainty in the genuine supreme path of Mantra:\nWithout first obtaining empowerment, there are no siddhis."}, {"tib": "བྱེ་མ་བཙིར་ལས་ཞུན་མར་འདོད་པ་བཞིན། །འཆད་ཉན་སྒོམ་ལ་བརྩོན་ཀྱང་དམྱལ་བར་འགྲོ།\n།དབང་ཐོབ་སྐྱེས་བུ་རྒྱལ་བའི་སྲས་སུ་འགྱུར། །དཀྱིལ་འཁོར་མཐོང་བས་སྡིག་ལས་རྣམ་པར་གྲོལ། །", "en": "Like wishing for butter by squeezing sand,\nThough diligent in teaching, learning, and meditating, one goes to hell.\nThe individual who obtains empowerment becomes a Son of the Victors.\nBy seeing the mandala, one is fully liberated from negative karma."}, {"tib": "གཙང་མའི་རིགས་སྐྱེ་སྐྱེ་བ་བདུན་དག་ན། །ངེས་པར་འགྲུབ་ཅིང་ས་བཅུ་ཐོབ་པར་བཤད།\n།དབང་བསྐུར་སློབ་དཔོན་རིམ་གཉིས་གདིང་དང་བྲལ། །བསྟི་གནས་དཀོར་སྤྱོད་མ་བསྡམས་ཁྱིམ་ལ་ཆགས། །", "en": "If possessing the pure family for seven lifetimes,\nIt is said one will definitely accomplish and obtain the tenth ground.\n[But] a master bestowing empowerment, devoid of confidence in the two stages,\nWho does not bind the retreat or enjoyment of funds, attached to home..."}, {"tib": "སྙིང་རྗེ་ཆུང་དང་རྟོག་གེས་ཟིལ་ནོན་དེས། །དབང་བསྐུར་བྱས་ཀྱང་བེ་སྤྲེལ་གཡང་སར་ལྷུང་།\n།ཕྱི་ནང་གསང་བའི་དེ་ཉིད་རྣམ་པ་བཅུ། །རིག་ཅིང་རང་ཉིད་གྲོལ་བའི་བླ་མ་ཡིས། །", "en": "Possessing little compassion and overpowered by speculation,\nThough he performs empowerment, like linked cattle, he falls to the abyss.\nThe ten aspects of Thatness—Outer, Inner, and Secret—\nThe Lama who knows these and is himself liberated..."}, {"tib": "དད་དང་ངོ་ཚ་ཤེས་པའི་སློབ་མའི་རྒྱུད༑ ༑བརྟགས་ལ་དབང་བསྐུར་རིམ་པས་སྦྱིན་པར་བྱ།\n།བསྙེན་པ་དང་ནི་ས་ཡི་ཆོ་ག་དང་། །སྟ་གོན་དང་ནི་སློབ་མ་འཇུག་ཅིང་སྨིན། །", "en": "Should examine the continuum of the disciple possessing faith\nAnd a sense of shame, then grant empowerment by stages.\nThe Approach, and the Ritual of the Earth,\nAnd the Preparation; the disciple enters and is ripened."}, {"tib": "མངོན་རྟོགས་བཞི་པོ་རེ་རེ་ཉིད་ལ་ཡང༌།།བཞི་བཞིར་རྫོགས་པའི་ཡན་ལག་མ་ཚང་ན།\n།ཆོ་ག་ཉམས་པས་སྨིན་པར་ནུས་མ་ཡིན། །རྒྱུད་སྡེ་སོ་སོའི་དབང་གི་རིགས་དབྱེ་ལ། །", "en": "Even regarding each of the four clear realizations,\nIf the four-by-four perfecting branches are incomplete,\nBecause the ritual is impaired, it is unable to ripen.\nRegarding the classification of empowerment in individual Tantra sections:"}, {"tib": "བྱ་བའི་རྒྱུད་ལ་ཆུ་དང་ཅོད་པན་གཉིས། །སྤྱོད་པའི་རྒྱུད་ལ་དེ་སྟེང་རྡོ་རྗེ་མིང་།\n།རྣལ་འབྱོར་རྒྱུད་ལ་རིག་པའི་དབང་ལྔ་དང་། །གསང་བ་བཀའ་ཡི་དབང་དུ་མཐའ་རྟེན་རྫོགས། །", "en": "In Action Tantra, there are the two: Water and Crown.\nIn Conduct Tantra, added to that is the Vajra Name.\nIn Yoga Tantra, the five empowerments of Awareness,\nAnd the Secret, the Authorization, and the Final Support are completed."}, {"tib": "བླ་མེད་བུམ་གསང་ཤེས་རབ་ཚིག་དབང་བཞི། །ཐེག་པའི་རྩེ་མོའི་རིམ་པ་བྱེ་བྲག་པ།\n།སྤྲོས་དང་སྤྲོས་མེད་ཤིན་ཏུ་རབ་སྤྲོས་མེད། །སྤྱིར་ན་དབང་གི་དབྱེ་བསྡུ་མཐའ་ཡས་ཀྱང་། །", "en": "In Unsurpassed: Vase, Secret, Wisdom, and Word—the four empowerments.\nIn the specific stages of the Pinnacle Vehicle:\nElaborate, Unelaborate, and Extremely Unelaborate.\nThough generally the opening and closing of empowerments is limitless..."}, {"tib": "ས་ཟིན་འཇོག་མཚམས་རྣམ་པ་བཞི་པོ་ཡིན། །གཞི་དང་ལམ་དང་འབྲས་བུ་དབང་བཞི་རུ།\n།གདོད་ནས་གྲུབ་པ་རྩ་རླུང་ཐིག་ལེའི་རྟེན། །རང་ཆས་ཉིད་དེ་མཚུངས་པར་ལྡན་པ་དང༌། །", "en": "They are the four aspects of seizing the ground and placing the boundary.\nAs the four empowerments of Ground, Path, and Result.\nPrimordially established, the support of channels, winds, and drops;\nBeing intrinsic to oneself and endowed in parallel."}, {"tib": "ལྷན་ཅིག་བྱེད་པའི་རྒྱུ་ནི་རྣམ་གཉིས་ལ། །སྣོད་དུ་རུང་བའི་སློབ་བུ་རྒྱུ་ཡི་རྐྱེན།\n།ལྟ་དགོངས་ལྡན་པའི་སློབ་དཔོན་བདག་པོའི་རྐྱེན། །ནུས་པའི་ཆོ་ག་མཁྱེན་པ་དམིགས་པའི་རྐྱེན། །", "en": "Regarding the two kinds of cooperative causes:\nThe suitable vessel, the minor student, is the causal condition.\nThe Master possessing view and realization is the dominant condition.\nKnowing the potent ritual is the object condition."}, {"tib": "རྟེན་ཅིང་འབྲེལ་འབྱུང་དེ་མ་ཐག་པའི་རྐྱེན། །རྒྱུ་གཉིས་རྐྱེན་བཞི་ཚོགས་ལས་དབང་བསྐུར་འགྲུབ།\n།གཉེན་པོ་གྲངས་ངེས་སྒོ་ནས་བཞག་པ་ནི། །ལུས་ཀྱི་གཙོ་བོར་གྱུར་པ་རྩ་ཡིན་ཏེ། །", "en": "Dependent arising is the immediate condition.\nFrom the assembly of two causes and four conditions, empowerment is accomplished.\nPosited through the certainty of the number of antidotes:\nThe principal of the body is the channel."}, {"tib": "རྩ་ཡི་རྣམ་པ་ཡི་གེའི་གཟུགས་སུ་གནས། །དེ་ལ་རླུང་བརྟེན་རླུང་ལ་ཁམས་རྣམས་བརྟེན།\n།ཁམས་ལ་དོན་དམ་བྱང་ཆུབ་སེམས་བརྟེན་བཞིན། །འདོད་པའི་ཁམས་ཀྱི་གང་ཟག་རང་རྒྱུད་པ། །", "en": "The aspect of the channels abides in the form of syllables.\nOn that rely the winds; on winds rely the elements.\nOn elements relies the ultimate bodhichitta—the four.\nThe individual of the Desire Realm, the person of their own continuum..."}, {"tib": "ཀུན་ལ་འདོད་ཆགས་རྣམ་བཞིར་གནས་པ་སོགས། །དག་བྱ་དག་བྱེད་ལ་བརྟེན་ངེས་པ་ཡང་།\n།དང་པོ་བལྟས་པས་ཚིམ་པའི་འདོད་ཆགས་ནི། །གཞན་འཕྲུལ་དབང་བྱེད་པ་ལ་གནས་པ་སྟེ།།", "en": "Abides in the four kinds of desire regarding all, etc.\nRelying on what is to be purified and the purifier, there is certainty.\nThe desire which is satisfied by the initial look\nIs the abiding in the mastery of others' emanations."}, {"tib": "རྡུལ་ཚོན་དཀྱིལ་འཁོར་ལ་བརྟེན་བུམ་པའི་དབང་། །བསྐུར་བས་གཙོ་བོར་ལུས་ཀྱི་སྒྲིབ་པ་འདག\n།སྣོད་བཅུད་བརྟན་གཡོ་ཕུང་ཁམས་སྐྱེ་མཆེད་ཀུན། །གདན་གསུམ་ཚང་བའི་དཀྱིལ་འཁོར་གཅིག་ཏུ་ཤར། །", "en": "Relying on the colored powder mandala, the Vase Empowerment\nIs conferred; principally it cleanses the obscurations of the body.\nThe vessel and contents, stationary and moving, aggregates, elements, and sense fields all\nDawn as the single mandala complete with the three seats."}, {"tib": "སྣང་སྟོང་ཟུང་འཇུག་ངོ་བོ་ཉིད་གསུམ་གྱི། །གྲུབ་མཐའ་འཁོར་འདས་གཉིས་མེད་ཆེན་པོ་ལ།\n།འདའ་ཀ་འོད་ཀྱི་གོང་བུ་སྒྲ་ཡིས་འཕོ། །རྩ་ཡི་འགྲོས་ཐིམ་བསྐྱེད་རིམ་སྤྲུལ་པའི་སྐུ། །", "en": "Appearance and emptiness in union; the three essences.\nRegarding the philosophical tenet, the great non-duality of samsara and nirvana.\nAt death, the ball of light transfers through sound.\nThe course of the channels dissolves; [it is] the Generation Stage, the Nirmanakaya."}, {"tib": "མཁའ་ཁྱབ་སྐུ་ཡི་རྡོ་རྗེ་འདུས་མ་བྱས། །བྷ་གའི་དཀྱིལ་འཁོར་ལ་བརྟེན་གསང་དབང་བསྐུར།\n།དགོད་པས་ཚིམ་ལ་འཕྲུལ་དགའི་འདོད་ཆགས་དང་།། ངག་གི་སྒྲིབ་སྦྱངས་བདག་བྱིན་སློབ་པའི་ལམ། །", "en": "The uncompounded Vajra of Body pervading space.\nRelying on the mandala of the Bhaga, the Secret Empowerment is conferred.\nDesire satisfied by laughter; the Joy of Emanation.\nCleansing the obscurations of speech, it is the path of self-blessing."}, {"tib": "གཏུམ་མོས་གཟུང་འཛིན་རོ་རྐྱང་དབུ་མར་འཛུད། །རང་བྱུང་ཡེ་ཤེས་གྲུབ་མཐའ་མ་འདྲེས་རྫོགས།\n།འདའ་ཀ་དཔེ་ཡི་འོད་གསལ་ཆེན་པོའི་ངང་། །ཡི་གེའི་འགྲོས་ཐིམ་ལོངས་སྤྱོད་རྫོགས་པའི་སྐུ། །", "en": "Tummo inserts the subject-object, Roma, and Kyangma into the Central Channel.\nSelf-arisen primal wisdom, the tenet of unmixed perfection.\nWithin the state of Great Luminosity, the Example at death,\nThe course of syllables dissolves; [it is] the Sambhogakaya."}, {"tib": "ཡན་ལག་དྲུག་ཅུར་རྫོགས་པའི་གསུང་རྡོ་རྗེ། །གདན་གསུམ་མངོན་རྟོགས་ངོམ་པའི་མཛེས་མ་ཡི།\n།གསང་བའི་དཀྱིལ་འཁོར་ལ་བརྟེན་ཤེར་དབང་གིས། །ལག་བཅངས་ཚིམ་པ་དགའ་ལྡན་འདོད་ཆགས་དག །", "en": "The Vajra of Speech complete with sixty branches.\nOf the beautiful one displaying the clear realization of the three seats,\nRelying on the Secret Mandala is the Wisdom Empowerment;\nSatisfied by holding hands; the desire of the Joyous Realm [Tushita]."}, {"tib": "ཡིད་ཀྱི་སྒྲིབ་སྦྱངས་སྣང་མཆེད་ཐོབ་གསུམ་དང༌། །དགའ་བཞིའི་ཡེ་ཤེས་ཁམས་ཀྱི་ཞུ་བདེས་འགྲུབ།\n།གྲུབ་མཐའ་བདེ་སྟོང་དབྱེར་མེད་ཉམས་སུ་མྱོང་། །འདའ་ཀ་དེར་སྣང་མ་གྲུབ་རྡོ་རྗེ་སེམས། །", "en": "Cleansing obscurations of mind; Appearance, Increase, and Attainment—the three—\nAnd the wisdom of four joys are accomplished by the melting bliss of elements.\nThe tenet of indivisible bliss and emptiness is experienced.\nAppearance at death is unestablished; [it is] the Vajrasattva."}, {"tib": "སྙིང་གའི་རྩ་མདུད་གྲོལ་བ་དཔེའི་ཡེ་ཤེས།།མཁའ་ཁྱབ་ཐུགས་ཀྱི་རྡོ་རྗེ་དྭངས་མའི་སྐུ།\n།བྱང་ཆུབ་སེམས་ཀྱི་དཀྱིལ་འཁོར་ལ་བརྟེན་ནས། །གསུམ་པའི་ཉམས་མྱོང་ཚིག་གིས་མཚོན་པའི་དབང་། །", "en": "The knot of channels at the heart is released; the Example Wisdom.\nThe space-pervading Vajra of Mind, the Body of Lucidity.\nRelying on the mandala of Bodhichitta,\nThe experience of the third is the Empowerment Indicated by Words."}, {"tib": "འཐབ་བྲལ་མན་ཆོད་འཁྱུད་སྦྱོར་འདོད་ཆགས་དང་། །སྒོ་གསུམ་སྒྲིབ་དག་ཐ་དད་འཛིན་པ་སྦྱོང་།\n།སྟོང་པའི་ཐིག་ལེ་རིག་པའི་སྙིང་པོ་ཅན། །གྲུབ་མཐའ་བསམ་མི་ཁྱབ་པའི་ཡེ་ཤེས་ཏེ། །", "en": "Free from strife and below; desire of embrace and union.\nCleansing the obscurations of the three doors; purifying the grasping at difference.\nThe essence-drop of emptiness possessing the essence of awareness.\nThe tenet is Inconceivable Primal Wisdom."}, {"tib": "འདའ་ཀ་གསང་ཆེན་ཕྱག་རྒྱ་ཆེན་པོ་ལ། །འབྲས་བུ་མཁའ་ཁྱབ་ངོ་བོ་ཉིད་སྐུའོ།\n།སྒྲ་དོན་སྦྱར་ན་ཨ་བྷི་ཥིཉྩའི་སྒྲས། །གློ་བུར་དྲི་མ་གཏོར་དང་ཁེ་ཀ་ཏས། །", "en": "At death, the Great Secret Mahamudra.\nThe result is the space-pervading Essence Body (Svabhavikakaya).\nIf applying the sound and meaning: by the sound Abhishimcha\nAdventitious stains are scattered; and by Shekata..."}, {"tib": "སྐལ་བ་བླུགས་པ་རྣམ་པ་གཉིས་སུ་གྲུབ།།དབང་མཆོག་རང་ལ་གནས་པ་ཁམས་དྲུག་གི།\n།རྟེན་དང་འབྱོར་པ་རྒྱུ་ཡི་དབང་ཡིན་ཏེ། །སློབ་དཔོན་ཉིད་ཀྱི་ཆོ་གས་བསྐུར་བ་དང་། །", "en": "Good fortune is poured; thus it is established in two aspects.\nThe Supreme Empowerment abiding in oneself, the six elements'\nSupport and endowment, is the Causal Empowerment.\nThat conferred by the ritual of the Master himself..."}, {"tib": "རང་གི་དམིགས་པས་འདྲིས་པ་ལམ་གྱི་དབང་།།རྒྱུ་དུས་འོད་ཟེར་ཆེན་པོའི་དབང་བཞིན་དུ།\n།རང་སེམས་སྐུ་བཞིར་སྨིན་པ་འབྲས་བུའི་དབང༌། །དབང་བཞི་རྫོགས་ཚེ་རིག་འཛིན་སྡོམ་པ་ཐོབ། །", "en": "And habituated by one's own visualization is the Path Empowerment.\nLike the Empowerment of Great Rays of Light at the time of the cause,\nOne's mind ripening into the Four Kayas is the Result Empowerment.\nWhen the four empowerments are complete, the vow of the Vidyadhara is obtained."}, {"tib": "དབང་ཐོབ་སྐྱེས་བུ་ཐ་བའི་སྐྱོན་སྦྱངས་པའི། །ཞིང་སར་ས་བོན་བཞག་པ་ཇི་བཞིན་དུ།\n།སྒྲིབ་པ་བཞི་དག་སྐུ་བཞི་མངོན་དུ་བྱེད། །གཉིས་པར་ལམ་ལ་བསྐྱེད་རྫོགས་རྣམ་གཉིས་ལས། །", "en": "Like a seed placed in the soil of a field\nWhere the defects of the hard earth have been purified by the individual obtaining empowerment,\nHaving purified the four obscurations, the Four Kayas are made manifest.\nSecondly, regarding the path, from the two aspects of generation and perfection…"}, {"tib": "དང་པོ་བསྐྱེད་རིམ་སྐྱེ་གནས་རྣམ་པ་བཞིའི། །བག་ཆགས་སྦྱོང་ཕྱིར་དེ་དང་མཐུན་པར་སྟོན།\n།བསྐྱེད་ཚུལ་འཁོར་བའི་རྣམ་པ་དང་མཐུན་པས། །སྲིད་པ་གསུམ་པོ་མ་ལུས་སྦྱོང་ཞིང་དག །", "en": "First, regarding the Generation Stage: for the sake of purifying the habitual tendencies\nOf the four kinds of birth-places, it is shown in accordance with those.\nSince the manner of generation is in accord with the aspects of samsara,\nThe three existences are purified and cleansed without remainder."}, {"tib": "མྱ་ངན་འདས་དང་བཞུགས་ཚུལ་མཐུན་པ་ཡི། །ལྷ་ཡི་རྣམ་པས་འབྲས་བུ་གཞི་ལ་རྫོགས།\n།གཉིས་ཀའང་རྫོགས་པའི་རིམ་པ་སྨིན་བྱེད་དུ། །འགྲོ་བའི་དག་རྫོགས་སྨོན་གསུམ་སྤྱི་ལ་གཅེས། །", "en": "Through the agreement of the manner of abiding [the Ground] and Nirvana,\nThe result is perfected in the ground through the aspect of the deity.\nAs the ripener of the Perfection Stage for both [self and other],\nThe three—purity, perfection, and ripening—are crucial for the general welfare of beings."}, {"tib": "ཇི་ལྟར་སྒོང་སྐྱེས་ལན་གཉིས་སྐྱེ་བ་ལྟར། །བདག་སྲས་གཞན་སྲས་རྣམ་པ་གཉིས་སུ་བསྐྱེད།\nབདག་གི་སྲས་སུ་གཞན་བྱ་བ་ལ་ལྔ། །ས་བོན་ལས་ནི་གཙོ་བོ་བསྐྱེད་པ་དང་། །", "en": "Just as egg-born beings are born twice,\nOne generates in the two aspects: Self-generation and Other-generation.\nRegarding the five [steps] of creating the Other as the Son:\nGenerating the Principal [Deity] from the seed; and..."}, {"tib": "ཕྱོགས་བཅུའི་སངས་རྒྱས་བཀུག་ནས་མཁར་བསྟིམ་དང་། །སེམས་ཅན་བཀུག་ནས་སྒྲིབ་པ་སྦྱང་བ་དང་།\n།གཉིས་སུ་མེད་ལ་ཆེ་བ་བསྐྱེད་པ་དང་། །མཁའ་ནས་བཏོན་ནས་གདན་ལ་དགོད་པའོ། །", "en": "Invoking the Buddhas of the ten directions and dissolving them into the space [of the deity];\nInvoking sentient beings and purifying their obscurations;\nGenerating greatness regarding non-duality; and\nDrawing [the deity] from space and placing them upon the seat."}, {"tib": "གཞན་གྱི་སྲས་སུ་བདག་བྱ་བ་ལ་བརྒྱད། །སྒོ་ང་སྨིན་པ་དེ་དང་དེར་གྱུར་བཞིན།\n།གཙོ་བོ་འོད་ཞུ་ས་བོན་གྱུར་པ་དང་། །དེ་ལས་ཡབ་ཡུམ་སྐྱེ་མཆེད་རྫོགས་པ་དང་། །", "en": "Regarding the eight [steps] of creating Oneself as the Son:\nLike the ripening of the egg and its transformation into this and that [shape]:\nThe Principal melts into light and becomes the seed; and\nFrom that, the Father and Mother and sense bases are perfected; and..."}, {"tib": "ཡབ་ཀྱི་རྟོག་པ་ཡི་གེར་གྱུར་པ་དང་། །ཡུམ་ལས་འོད་འཕྲོས་ལྷ་ལ་གསོལ་གདབ་དང༌།\n།ཀུན་ཀྱང་རང་བསྟིམ་ང་རྒྱལ་བཟུང་བ་དང་། །སྙོམས་པར་ཞུགས་ནས་མཁའ་རུ་དཀྱིལ་འཁོར་བསྐྱེད། །", "en": "The thought of the Father becomes the syllable; and\nLight radiates from the Mother and makes supplication to the deity; and\nAll are dissolved into oneself; holding the pride; and\nHaving entered into union, the mandala is generated in space."}, {"tib": "རྟོག་པ་ཞེ་གཉིས་ལྷར་གསལ་ཕྱིར་གདོན་དང་། །ཕྱག་རྒྱ་ཞི་ཡིས་བཅིངས་དང་རྒྱས་གདབ་བོ།\n།བསྡུ་ན་ཐོག་མར་རང་ཉིད་ལྷར་གསལ་བས།།མདུན་མཁར་དཀྱིལ་འཁོར་གསལ་བཏབ་རྒྱུན་བཤགས་བྱ། །", "en": "The forty-two thoughts dawn as deities; expelling [interferences];\nBinding with the four mudras; and sealing.\nIf condensing: By visualizing oneself as the deity primarily,\nThe mandala is clearly struck in the front sky; performing the stream of confession."}, {"tib": "གཉིས་ཀ་མི་དམིགས་ངང་ནས་ལྷ་སོ་སོའི། །དཀྱིལ་འཁོར་མངོན་རྟོགས་ཇི་བཞིན་སྒོམ་པའོ།\n།མངལ་སྐྱེས་སྦྱོང་ཕྱིར་མངོན་བྱང་བཞིའམ་ལྔ། །དང་པོ་ཁྲག་འཐུང་གལ་པོའི་དགོངས་པ་སྟེ། །", "en": "In the state where both are non-objectified, the individual deity's\nMandala is meditated upon according to the clear realization.\nFor the sake of purifying womb-birth, the Four or Five Manifest Enlightenments:\nFirst, the intent of the Heruka Galpo:"}, {"tib": "འཆི་སྲིད་བར་དོར་བཅས་པ་སྟོང་ཉིད་སེམས། །དྲི་ཟ་ཉེ་བར་ལེན་པའི་རྣམ་ཤེས་ནི།\n།ལྷ་ཡི་ས་བོན་གྱིས་སྦྱོང་དེ་ཉིད་ཀྱང་། །ཁུ་རྡུལ་རླུང་དང་འདྲེས་པའི་མེར་མེར་ནུར། །", "en": "The death and bardo together are the mind of emptiness.\nThe consciousness of the Gandharva, the appropriator,\nIs purified by the seed of the deity; that also,\nLike semen, blood, and wind mixing, is the quivering 'nur-nur' [embryonic stage]."}, {"tib": "ས་བོན་ཉིད་ལས་ཕྱུག་མཚན་གྱུར་པས་སྦྱོང་། །ལྟར་དང་མཁྲང་གྱུར་ཕྱག་མཚན་འོད་གོང་གྱུར།\n།ཁྱབ་འཇུག་ཉ་དང་རུས་སྦལ་དབང་པོ་རྫོགས། །ལྷ་ཡི་རྣམ་པར་གྱུར་ནས་སྦྱོང་བའོ། །", "en": "It is purified by the seed itself transforming into the hand implement.\nHardening and becoming oblong, the hand implement becomes a ball of light.\nLike the completion of Vishnu's fish and turtle and limbs,\nHaving transformed into the aspect of the deity, it is purified."}, {"tib": "ཕྱག་རྒྱ་སྐུ་ལ་ཡིག་འབྲུ་གསུམ་རྡོ་རྗེ། །ཐུགས་ནི་ཕྱག་མཚན་ཉིད་དུ་སྦྱོར་བ་ལ།\n།རྡོ་རྗེའི་ཆོ་ག་གསུམ་ཞེས་ཕ་རྒྱུད་ལུགས༑ ༑བར་མ་དོ་ནས་ལུས་འཚོལ་ཚོགས་ཀྱི་ལམ། །", "en": "The mudra is the Body; the seed syllable is the Vajra of Speech;\nThe Mind is applied as the hand implement itself.\nThis is the system of Father Tantra called \"The Three Vajra Rituals.\"\nFrom the Bardo [Intermediate State] seeking a body is the Path of Accumulation."}, {"tib": "མངལ་དུ་རྣམ་ཤེས་འཇུག་པ་སྦྱོར་ལམ་སྟེ། །ལྷུམ་ཞུགས་བྱང་ཆུབ་ལྔ་པོ་མཐོང་སྒོམ་དང་།\n།ཟླ་བ་བཅུ་ནི་ས་དང་རབ་སྦྱར་ནས།།བཙལ་བ་མི་སློབ་ལམ་གྱུར་སྤྲུལ་པའི་སྐུ། །", "en": "Consciousness entering the womb is the Path of Joining.\nHaving entered the womb, the five awakenings are Seeing and Meditation.\nThe ten months are applied to the Grounds; and\nBirth is the Path of No More Learning, the Nirmanakaya."}, {"tib": "མངོན་བྱང་དང་པོ་ཟླ་བའི་དཀྱིལ་འཁོར་ནི། །མངལ་སྐྱེས་ཁུ་བ་དྲོད་གཤེར་སྐྱེས་ཀྱི་གཤེར།\n།སྒོང་སྐྱེས་ཕ་དང་རྫུས་སྐྱེས་སྟོང་པའི་ཆ།།དེ་བཞིན་གཉིས་པ་ཉི་མའི་དཀྱིལ་འཁོར་ཡང་། །", "en": "The First Manifest Enlightenment, the Moon Mandala:\nSemen of womb-birth; moisture of warmth-moisture birth;\nThe father of egg-birth; the emptiness portion of miraculous birth.\nSimilarly, the Second, the Sun Mandala also:"}, {"tib": "མངལ་སྐྱེས་རྡུལ་དང་དྲོད་གཤེར་སྐྱེས་ཀྱི་དྲོད། །སྒོང་སྐྱེས་མ་དང་རྫུས་སྐྱེས་གསལ་བའི་ཆ།\n།མངོན་བྱང་གསུམ་པ་ས་བོན་ཕྱག་མཚན་བཅས། །ཁུ་རྡུལ་གཉིས་པར་རྣམ་ཤེས་ཞུགས་པ་དང་། །", "en": "The ovum [blood] of womb-birth; the warmth of warmth-moisture birth;\nThe mother of egg-birth; the clarity portion of miraculous birth.\nThe Third Manifest Enlightenment: together with seed and hand implement.\nThe entrance of consciousness between the two, semen and blood; and..."}, {"tib": "སྐྱེ་གནས་བཞི་པོའི་བར་དོའི་རྣམ་ཤེས་སྦྱོང་། །མངོན་བྱང་བཞི་པ་རྣམ་གསུམ་གཅིག་ཏུ་འདྲེས།\n།ཁུ་རྡུལ་སེམས་གསུམ་རོ་གཅིག་འདྲེས་པ་དང་། །དྲོད་གཤེར་སྐྱེས་ཀྱི་དྲོད་དང་རྣམ་ཤེས་དང་། །", "en": "It purifies the bardo consciousness of the four birth-places.\nThe Fourth Manifest Enlightenment: the three types mix into one.\nThe mixing of semen, blood, and mind into one taste; and\nThe warmth of warmth-moisture birth and consciousness; and..."}, {"tib": "རྫུས་སྐྱེས་གསལ་ལ་སྟོང་བའི་ཆ་ཙམ་དང་། །བར་སྲིད་འདྲེས་པའི་ཆ་རྣམས་སྦྱོང་བ་ཡིན།\n།མངོན་བྱང་ལྔ་པ་སྐུ་རུ་གྲུབ་པ་ནི། །སྐྱེ་གནས་བཞི་པོའི་སྐྱེ་མཆེད་ཡོངས་རྫོགས་ནས། །", "en": "The clear yet empty portion of miraculous birth; and\nThe mixed portions of the intermediate existence are purified.\nThe Fifth Manifest Enlightenment: established as the Body.\nWhen the sense bases of the four birth-places are fully perfected..."}, {"tib": "རེག་པའི་ཡུལ་ལ་དབང་པོ་སད་པ་ཡི། །འཁོར་བའི་རྣམ་པ་ཆ་དང་བཅས་པ་སྦྱོང་༑\n༑ཁམས་དང་ཕུང་པོ་རྣམ་པར་ཤེས་པའི་ཚོགས། །གནས་སུ་དག་པ་གདན་གསུམ་ཚང་བའི་ལྷ། །", "en": "The waking of the senses towards the object of awareness—\nThe aspect of samsara together with its parts is purified.\nThe collection of elements, aggregates, and consciousness\nIs pure in its locus; the Deity complete with the three seats."}, {"tib": "མྱ་ངན་འདས་དང་བཞུགས་ཚུལ་མཐུན་པ་ནི། །རྒྱུ་ལས་འབྲས་བུའི་ཧེ་རུ་ཀ་ཉིད་དོ།\n།ཁུ་རྡུལ་རླུང་གསུམ་སེམས་དང་བཅས་པའི་ཆ། །རྣམ་པར་དག་པས་རྫོགས་རིམ་སྨིན་བྱེད་འགྱུར། །", "en": "Agreement with the manner of abiding and Nirvana\nIs the Resultant Heruka [arising] from the Cause.\nThe parts of semen, blood, wind—the three—together with the mind,\nThrough being utterly purified, become the ripener of the Perfection Stage."}, {"tib": "དྲོད་གཤེར་སྐྱེས་ནི་གཉིས་པོ་འདུས་པ་ལ། །རྣམ་ཤེས་ཞུགས་པས་མོད་ལ་གཟུགས་གྲུབ་བཞིན།\n།ལྷ་ཡི་མཚན་དང་མངོན་རྟོགས་དྲན་ཙམ་ལ། །ཕྱག་རྒྱ་རྫོགས་པའི་བསྐྱེད་རིམ་ཚང་བར་སྒོམ། །", "en": "Regarding birth from warmth and moisture: upon the gathering of the two [fluids],\nThrough the entrance of consciousness, just as form is accomplished instantly,\nUpon the mere recollection of the name and clear realization of the deity,\nThe Generation Stage complete with mudras is meditated upon."}, {"tib": "རྫུས་ཏེ་སྐྱེ་བ་སྐད་ཅིག་དྲན་རྫོགས་ཏེ། །མིང་དང་གཟུགས་ལ་མ་བརྟེན་ཝལ་གྱི་གསལ།\n།སྒོམ་ཚུལ་བཞི་པོའང་དང་པོའི་ལས་ཅན་ལ། །སྒོང་སྐྱེས་སྦྱོང་བའི་བསྐྱེད་རིམ་གཙོ་བོར་སྒོམ། །", "en": "Miraculous birth is instantaneous recollection and perfection.\nWithout relying on name and form, it is brilliantly clear.\nRegarding the four modes of meditation also: for the beginner,\nThe Generation Stage purifying egg-birth is meditated upon principally."}, {"tib": "རིམ་བཞིན་གོམ་པ་བརྟན་དང་བརྟན་པ་ཆེ། །ཤིན་ཏུ་བརྟན་པའི་མཐུ་དང་མཐུན་པར་སློབ།\n།ཀུན་ཀྱང་དེ་བཞིན་ཉིད་ཀྱི་ཏིང་ངེ་འཛིན། །སྤྲོས་པ་ཀུན་དང་བྲལ་བའི་ཤེས་རབ་གདངས། །", "en": "Training in accord with the power of gradual habituation: Firm, Greatly Firm,\nAnd Extremely Firm.\nAll are the Samadhi of Suchness,\nThe tone of wisdom free from all elaboration."}, {"tib": "ཀུན་སྣང་སྙིང་རྗེའི་འཕེན་པས་བསྐྱེད་རིམ་དུ།།ཤར་བ་ཐབས་ཀྱི་ལམ་མཆོག་མ་ནོར་ཞིང་།\n།སྣང་དུས་ཉིད་ནས་རང་བཞིན་མ་གྲུབ་པ། །ཟབ་མོ་སྣང་སྟོང་ཐབས་ཤེས་འབྲེལ་བའི་ལམ། །", "en": "Through the projecting impetus of All-Illuminating Compassion,\nWhat dawns as the Generation Stage is the unmistaken supreme path of method.\nFrom the very time of appearance, it is unestablished in nature.\nProfound appearance-emptiness, the path connecting method and wisdom."}, {"tib": "དེ་ལས་འགལ་བའི་དམིགས་བཅས་བསྐྱེད་རིམ་ནི། །མུ་སྟེགས་བྱེད་དང་གདོན་གྱི་རིགས་ལའང་ཡོད།\n།སྔགས་སུ་བྱང་ཆུབ་སེམས་དཔའི་མཐོང་ལམ་ལ། །ཕྱག་རྒྱ་ཆེན་པོ་མཆོག་གི་དངོས་གྲུབ་ཅེས། །", "en": "A Generation Stage with object-fixation contrary to that\nExists even among Mutineers [Tirthikas] and types of demons.\nRegarding the Bodhisattva Path of Seeing in Mantra:\nIt is called the Supreme Siddhi of Mahamudra."}, {"tib": "ཤིན་ཏུ་གྲགས་པ་མངོན་དུ་བྱེད་པའི་ཐབས། །སྣང་ཆ་ལྷ་སྐུར་གསལ་བ་བསོད་ནམས་ཚོགས།\n།དེ་ལ་རང་བཞིན་མ་གྲུབ་ཡེ་ཤེས་ཏེ། །ཚོགས་གཉིས་ཉེ་རྒྱུར་བསྟེན་པའི་དབང་རྣོན་དང་། །", "en": "The method for making the very renowned [Mahamudra] manifest:\nThe aspect of appearance clear as the deity's body is the Accumulation of Merit.\nRegarding that, the nature unestablished is Wisdom.\nRelying on the two accumulations as the near cause, the sharp faculties..."}, {"tib": "ལམ་ལྔར་འབྲེལ་བ་རིག་འཛིན་རྣམ་པ་བཞིའི། །ཐེམ་སྐས་ཉིད་ལས་ངེས་པ་ལྔ་ལྡན་སོགས།\n།སྐུ་ལྔའི་ཞིང་དུ་མིག་འཕྲུལ་ལྟ་བུར་འགྲོ། །གཉིས་པ་རྫོགས་པའི་རིམ་པ་ཉིད་ལའང་། །", "en": "And the four types of Vidyadharas connected to the five paths,\nFrom the staircase itself, possessing the five certainties, etc.\nProceed to the field of the Five Kayas like a magical illusion."}, {"tib": "ཕ་རྒྱུད་རྣམས་ལས་འབྱུང་བ་ལྔ་ཡི་རླུང་། །རྣམ་པར་དག་པས་གསལ་སྟོང་ཡེ་ཤེས་བསྐྱེད།\n།མ་རྒྱུད་རྣམས་ལས་ཁམས་ལ་ཞུ་བདེ་ཡི། །ཡེ་ཤེས་བསྐྱེད་ཕྱིར་རང་ལུས་ཐབས་ལྡན་དང་།།", "en": "Secondly, regarding the Perfection Stage itself:\nAccording to the Father Tantras: the winds of the five elements\nBeing utterly purified generates the wisdom of clarity-emptiness.\nAccording to the Mother Tantras: for the sake of generating the wisdom\nOf melting bliss within the elements, possessing the method of one's own body; and..."}, {"tib": "གཞན་ལུས་ལ་བརྟེན་དགའ་བཞིའི་ཡེ་ཤེས་བསྐྱེད། །གཉིས་མེད་རྒྱུད་ལས་གཅིག་དང་དུ་བྲལ་གྱི།\n།ཐིག་ལེ་ཆེན་པོའི་འོད་གསལ་གཙོར་བྱེད་ལས། །སྔ་མ་གཉིས་ནི་སྣང་བཅས་དམིགས་པའི་ལམ། །", "en": "Relying on another's body generates the wisdom of the four joys.\nAccording to the Non-dual Tantra: the separated-from-one-and-many\nGreat Essence Drop (Bindu), the Luminosity, is taken as principal.\nThe former two are paths of appearance with object-fixation."}, {"tib": "ཕྱི་མ་གཅིག་ནི་སྣང་མེད་འོད་གསལ་ཏེ། །དང་པོའི་ཕྱོགས་ལ་གནས་པ་རྩ་དང་ནི།\n།གཡོ་བ་རླུང་ལ་བཀོད་པ་བྱང་ཆུབ་སེམས། །གསུམ་དུ་གནས་པ་རྡོ་རྗེ་ཕུང་པོའི་གྲོང་། །", "en": "The latter one is Luminosity without appearance.\nAbiding in the faction of the first [Conceptual Perfection Stage]: the channels; and\nThe arrangement of the moving winds; and the Bodhichitta.\nAbiding in [these] three is the City of the Vajra Aggregate."}, {"tib": "མི་ཡི་མངལ་གནས་འཛིན་པའི་ཐོག་མ་རུ། །མིག་གཉིས་དང་ནི་ལྟེ་བའི་རྩ་མདུད་ཆགས།\n།དེ་ལས་ལུས་བསྐྱེད་དྭངས་མར་གྱུར་པ་ཡི། །རྩ་གསུམ་ཀ་བ་ལྟ་བུར་གནས་པའི་ནང་། །", "en": "In the beginning of taking the place of the human womb,\nThe two eyes and the channel knot of the navel are formed.\nDepending on that, the body is generated; the refined\nThree channels abiding like pillars inside."}, {"tib": "ཕྱི་རུ་ལུས་ངག་ནང་དུ་ཉོན་མོངས་གསུམ། །གསང་བར་སྐུ་གསུང་ཐུགས་ཀྱི་རྟེན་བྱེད་པའི།\n།ཡི་གེ་གསུམ་གནས་དབུ་མའི་ཡས་མར་སྣ། །ཚངས་པའི་སྒོ་དང་གསང་གནས་གཉིས་ལ་ཟུག །", "en": "Outwardly, body and speech; inwardly, the three afflictions;\nSecretly, acting as the support for Body, Speech, and Mind.\nThe three syllables abide; the upper and lower tips of the Central Channel\nAre planted in the Brahma Aperture and the Secret Place, the two."}, {"tib": "གཡས་གཡོན་རོ་རྐྱང་དཀར་དང་དམར་བ་ཉིད། །བུད་མེད་ཉིད་ལ་ལྡོག་པས་རྐྱང་མ་གཡས།\n།དབུ་མ་སྔོ་སྐྱར་གཉིས་པོས་ལུག་རྒྱུད་དུ།།མདུད་པ་ཉི་ཤུ་རྩ་གཅིག་བྱས་པ་ལ། །", "en": "Right and left, Roma and Kyangma, white and red.\nIn women, it is reversed, so Kyangma is right.\nThe Central Channel is pale blue; by the two [side channels] in the manner of a sheep's pen [loops]\nTwenty-one knots are made."}, {"tib": "རིམ་བཞིན་སྐུ་གསུང་ཐུགས་སམ་སྐུ་བཞི་ལྔ། །ཕྱིན་དྲུག་གྲངས་ཀྱི་འཁོར་ལོའི་རྩ་འདབ་རྣམས།\n།ཕྲི་བསྣན་གྱུར་པ་སྦྱང་གཞི་སྦྱོང་བྱེད་ཚུལ།།ལྟེ་བར་དྲུག་ཅུ་རྩ་བཞི་མགྲིན་པ་ལ། །", "en": "Respectively, Body, Speech, Mind—or the Four/Five Kayas\nAnd the Six Paramitas—the channel petals of the wheels of number.\n[Through] subtracting and adding, the mode of the base of purification and the purifier.\nAt the navel, sixty-four; at the throat..."}, {"tib": "བརྒྱད་ཚན་གཉིས་དང་སྙིང་གར་རྩ་འདབ་བརྒྱད། །སྤྱི་བོར་སུམ་ཅུ་རྩ་གཉིས་བདེ་སྐྱོང་ན།\n།བདུན་ཅུ་རྩ་གཉིས་དེ་བཞིན་གཙུག་ཏོར་ལ། །ནམ་མཁའི་ཁམས་ཀྱི་འཁོར་ལོ་ཞེས་སུ་གྲགས། །", "en": "Two sets of eight [16]; and at the heart, eight channel petals.\nAt the crown, thirty-two; at the Bliss-Preserver [Secret Place],\nSeventy-two. Similarly, at the Ushnisha,\nIt is known as the Wheel of the Space Element."}, {"tib": "འཁོར་ལོ་རེ་དང་སོ་སོའི་བར་མཚམས་སུ། །འཕོ་བ་བཅུ་གཉིས་རླུང་གི་དུས་སྦྱོར་དང་།\n།དེ་བཞིན་རྟེན་ཞིང་འབྲེལ་འབྱུང་བཅུ་གཉིས་གནས༑ །ཁམས་ལ་འཕོ་བ་སྤུངས་པའི་ལུགས་ལྡོག་འགྲོས། །", "en": "At each wheel and at their individual intervals,\nTwelve transfers, the time-conjunctions of the winds, and\nSimilarly, the twelve dependent arisings abide.\nRegarding the elements, the transfers are the reverse order of abandonment."}, {"tib": "གསང་གནས་ཡེ་ཤེས་འཁོར་ལོར་ཕྱིན་པ་དང་། །རླུང་གི་འཕོ་བ་གཅིག་དང་རྟེན་འབྲེལ་གཅིག\n།འགགས་ནས་དང་པོའི་ས་ཡི་རྟོགས་པ་འཆར། །རིམ་བཞིན་ནམ་མཁའི་ཁམས་ཀྱི་འཁོར་ལོའི་བར། །", "en": "When reaching the Wisdom Wheel of the secret place,\nOne transfer of wind and one dependent arising\nHaving ceased, the realization of the First Ground dawns.\nGradually, up to the Wheel of the Space Element..."}, {"tib": "རླུང་དང་རྟེན་འབྲེལ་རེ་རེའི་ཆ་ལྡོག་པས། །ས་ནི་བཅུ་གཉིས་རབ་ཏུ་རྫོགས་པའི་མཐར།\n།ཐིག་ལེ་ནམ་མཁའི་ཁམས་དང་འདྲེས་པའི་ཚེ། །མངོན་པར་འཚང་རྒྱ་དང་པོའི་སངས་རྒྱས་ལུགས། །", "en": "Through the reversing of the portion of each wind and dependent arising,\nAt the end of the twelve grounds being fully perfected,\nWhen the Bindu mixes with the element of Space,\nOne manifestly awakens; the system of the Primordial Buddha."}, {"tib": "དེ་དང་རྣམ་གྲངས་མཐུན་པའི་རྩ་འདབ་ལ། །སྦྱང་གཞིར་གནས་པའི་རིགས་དྲུག་ས་བོན་རྣམས།\n།སྦྱོང་བྱེད་རིག་པའི་སྐྱེས་བུ་རྣམ་དྲུག་དང་། །ཕ་རོལ་ཕྱིན་པ་དྲུག་གིས་སྦྱངས་པ་ལས། །", "en": "On the channel petals whose numbers agree with those,\nThe seeds of the six families abiding as bases of purification\nAre purified by the six Sages of Awareness, the purifiers,\nAnd the Six Paramitas."}, {"tib": "ཐ་དད་པ་ཡི་ཡེ་ཤེས་རྣམ་པ་ལྔ། །བསམ་གྱིས་མི་ཁྱབ་གཅིག་དང་དྲུག་འཐོབ་བོ།\n།དེ་བཞིན་སྙིང་ག་ཞི་བའི་འཁོར་ལོ་དང་། །སྤྱི་གཙུག་ཁྲོ་བོའི་འཁོར་ལོ་རྣམ་གཉིས་ལ། །", "en": "The five aspects of distinct wisdom\nAnd the inconceivable one—six—are obtained.\nSimilarly, the Wheel of Peace at the heart and\nThe Wheel of Wrath at the crown—the two..."}, {"tib": "ལྷ་དང་རྣམ་གྲངས་མཉམ་པའི་རྩ་འདབ་དང་། །ཐབས་གྲོལ་སྟེང་འོག་ལམ་གྱི་སྒོ་གཉིས་སུ།\n།འདོད་པ་རྒྱུད་ཀྱི་རྒྱལ་པོ་སྒྱུ་འཕྲུལ་ལུགས། །གཡོ་བ་རླུང་ལ་འགྱུར་བ་ཆེ་ཆུང་གཉིས། །", "en": "Channel petals equal in number to the deities; and\nThrough the two doors of karma, upper and lower, the liberation of method.\nThe system of the Mayajala, the King of Tantra.\nUpon the moving winds, the two: major and minor [elements]."}, {"tib": "ཆེ་བ་ཉིན་ཞག་ཕྲུགས་གཅིག་དག་ལ་ནི། །ཉི་ཁྲི་ཆིག་སྟོང་དྲུག་བརྒྱའི་གྲངས་སུ་འགྱུ།\n།ཆུང་བ་ཀུན་རྟོག་བརྒྱད་ཁྲི་བཞི་སྟོང་གི། །གྲངས་དང་མཉམ་པའི་བཞོན་པ་ལྟ་བུར་གནས། །", "en": "The major: in one full day and night,\nIt courses in the number of twenty-one thousand six hundred.\nThe minor: of the eighty-four thousand conceptual thoughts,\nThey abide like mounts equal in number."}, {"tib": "རྩ་བའི་རླུང་ནི་སྲོག་འཛིན་མེ་མཉམ་དང་། །ཁྱབ་བྱེད་གྱེན་རྒྱུ་ཐུར་སེལ་ལྔར་གནས་པའི།\n།བྱེད་ལས་རིམ་བཞིན་སྲོག་བརྟེན་མེ་དྲོད་བསྐྱེད། །ལུས་ཉམས་བརྟས་དང་དབུགས་ཀྱི་འགྲོ་འོང་དང་། །", "en": "The root winds are the Life-Supporting, the Fire-Accompanying,\nThe All-Pervading, the Upward-Moving, and the Downward-
