ss-Emptiness; the \"Playful Joy\" [Goddesses] waving.\nChowries, ribbons, parasols, victory banners, jeweled top-ornaments.\nCanopies and tassels; the celestial chamber is piled with beauty."}, {"tib": "།ཆུ་ཞེང་སྲིད་དུ་མི་མངོན་གང་བལྟས་གང་། །གྲངས་ཀྱིས་མི་གཏུགས་མཁའ་དབྱིངས་སྣོད་གྱུར་བཞིན། །\nརྟེན་གཞི་གཞལ་མེད་ཁང་པ་རེ་རེའི་ནང་། །བརྟེན་པའི་གཙོ་བོ་ལྔ་ཡི་གདན་ཁྲི་ནི།", "en": "Regarding height and width, it is not apparent [measureless]; wherever one looks,\nIt is not reached by numbers; like the Space Element becoming a vessel.\nInside each individual support-base Celestial Palace,\nThe thrones of the five supported Principals..."}, {"tib": "།འཕྲོག་བྱེད་གཉིས་འཐུང་ཅང་ཤེས་ཟློས་གར་ཅན། །ཤང་ཤང་ཏེའུ་ཆུ་སྐྱེས་ཉི་ཟླའི་སྟེང་། །\nདུས་གསུམ་གཞིར་རྫོགས་ཀུན་ཏུ་བཟང་པོའི་དུས། །འཕོ་འགྱུར་བྲལ་བའི་མཚན་རྫོགས་སྟོན་པ་ལྔ།", "en": "Lion, Elephant, Horse, Peacock,\nShang-Shang bird; upon the Water-Born [Lotus], Sun, and Moon.\nThe three times perfected in the ground, the Time of Samantabhadra.\nFree from transfer and change, the Five Teachers perfected in marks."}, {"tib": "།རྣམ་སྣང་མི་བསྐྱོད་རྡོ་རྗེ་རིན་ཆེན་འབྱུང་། །འོད་མཚན་སྟོང་འབར་དོན་ཡོད་གྲུབ་པ་ནི། །\nརང་རང་རིགས་ཀྱི་ཡུམ་དང་བཅས་པ་རྣམས། །ཁ་སྦྱོར་བདུན་གྱི་བདག་ཉིད་ཆེན་པོར་བཞུགས།", "en": "Vairochana, Akshobhya, Vajra[sattva], Ratnasambhava,\nAmitabha [Light-Blazing], and Amoghasiddhi.\nTogether with the Consorts of their respective families,\nThey dwell in the great identity of the Seven Kisses [Union]."}, {"tib": "།རང་ལས་མི་གཞན་སེམས་དཔའ་སེམས་མའི་འཁོར། །སྒོ་བ་བཞི་དང་དེ་བཞིན་སོ་སོའི་ཡུམ། །\nརང་བཞིན་རྫོགས་པ་ཆེན་པོའི་ཆོས་འཁོར་ནི། །སྒྲ་ཚིག་མཚན་མའི་ཡུལ་ལས་འདས་པར་བསྐོར།", "en": "Not other than themselves, the retinue of male and female Bodhisattvas,\nThe four Gatekeepers and similarly their individual Consorts.\nThe Dharma Wheel of the Natural Great Completeness\nIs turned beyond the object of sound, word, and characteristic."}, {"tib": "།སྟེང་ཁང་ཞི་བ་བྱང་ཆུབ་སྙིང་པོའི་གནས། །དབང་མཛད་ཞི་བ་བཞི་བཅུ་རྩ་གཉིས་ལས། །\nདམ་པའི་སྟངས་དཔྱལ་གཉིས་ནི་སྤྲུལ་གཞི་སྟེ། །ཀུན་ལ་ཁྱབ་པར་བརྡལ་བས་ཆོས་ཀྱི་སྐུ།", "en": "The Upper House: Peace, the Place of the Heart of Enlightenment.\nOf the forty-two Peaceful Ones acting as Lords,\nThe Holy Couple [Samantabhadra/Consort] are the basis of emanation.\nBecause they pervade all, they are the Dharmakaya."}, {"tib": "།འགྲོ་དྲུག་སོ་སོའི་གནས་སུ་དོན་མཛད་པའི། །རིག་པའི་སྐྱེས་བུ་དྲུག་ནི་སྤྲུལ་པར་ཤར། །\nརང་སྣང་ལོངས་སྐུའི་ཞིང་ན་སུམ་ཅུ་བཞི། །གཙོ་བོ་བཅུ་ལ་ཉེར་བཞི་འཁོར་གྱི་ཚུལ།", "en": "Acting for the welfare in the individual places of the six classes of beings,\nThe Six Sages of Awareness dawn as emanations.\nIn the Field of Self-Appearance Sambhogakaya, there are thirty-four.\nRegarding the ten Principals, there are twenty-four in the manner of the retinue."}, {"tib": "།ཕུང་ཁམས་སྐྱེ་མཆེད་གནས་སུ་དག་པའི་ལྷ། །གདན་གསུམ་ཚང་བའི་དཀྱིལ་འཁོར་ཆེན་པོ་ཡིན། །\nའདི་དག་སྒྱུ་འཕྲུལ་དྲྭ་བ་མཉམ་སྦྱོར་སོགས། །བླ་མེད་རྒྱུད་ལས་ལུས་གྲུབ་དཀྱིལ་འཁོར་ནི།", "en": "The aggregates, elements, and sense-fields are pure as deities in their place.\nThe Three Seats are the Great Mandala of Brahma.\nThese are the body-established mandalas from the Unsurpassed Tantras\nSuch as the Magical Net (Mayajala) and the Union (Samputa), etc."}, {"tib": "།ཇི་སྙེད་བསྟན་དང་རྣམ་དག་མཚུངས་པ་ཡི། །འོག་ཁང་ཚོགས་ཆེན་འདུས་པའི་དཀྱིལ་འཁོར་ནི། །\nའབར་བའི་གཞལ་ཡས་ཕྱི་ནང་རིམ་པ་དགུ། །སྒོ་ཁྱམས་དགུ་པའི་ཕྱི་མར་རྒྱུ་འབྲས་ཀྱིས།", "en": "Whatever is taught [there], the purity is identical.\nThe Lower House: the Palace of the Gathering of the Great Assembly.\nThe Blazing Celestial Palace has nine levels, outer and inner.\nOutside the ninth door-courtyard, regarding cause and result..."}, {"tib": "།རྟ་བབས་གཉིས་ལྡན་ཕོ་བྲང་དབུས་མའི་ནང་། །རྡོ་རྗེའི་བྲག་ཆེན་པདྨ་སྟོང་བརྡལ་ལ། །\nཐབས་ཤེས་ཉི་ཟླ་དབང་ཕྱུག་ཁྱོ་ཤུག་ནི། །ཉི་ཤུ་རྩ་བཞི་སྟེང་དུ་དཔའ་གཏུམ་སྟག", "en": "Possessing two pediments; inside the central palace,\nUpon the Great Vajra Rock and the Thousand-Petaled Lotus,\nMethod and Wisdom, Sun and Moon; the Lord Couple [Mahottara/Consort].\nTwenty-one [couples]; above are the Hero, the Fierce One, the Tiger..."}, {"tib": "།འཇིགས་བྱེད་སེང་གེ་གདུག་པ་གཟིག་དང་ནི། །གཏུམ་པ་དོམ་དང་སྟོབས་ཆེན་གླང་པོ་དང་། །\nབརྗིད་པའི་མ་ཧེ་འཛིན་པའི་ཆུ་སྲིན་དང༌། །ཞེ་སྡང་ལྟོ་འགྲོ་བྱོལ་སོང་གཙོ་བརྒྱད་རེས།", "en": "The Terrifier, the Lion; the Malicious, the Leopard; and\nThe Savage, the Bear; and the Great Strength, the Elephant; and\nThe Majestic, the Buffalo; the Holder, the Water-Monster (Makara); and\nAnger, the Snake—the eight principal animals respectively..."}, {"tib": "།དྲེགས་པ་ཕོ་མོ་བཟུང་ཞིང་བརྫིས་པའི་སྟེང་། །འཁོར་འདས་ཀུན་གྱི་སྤྱི་དཔལ་བཅོམ་ལྡན་འདས། །\nཆེ་བའི་ཆེ་མཆོག་ཨིནྡྲ་ནཱི་ལའི་མདངས། །ཉི་མ་བྱེ་བའི་འོད་ལྡན་བདུན་གསུམ་ཞལ།", "en": "Trampling upon the arrogant male and female spirits.\nThe Glorious One of all Samsara and Nirvana, the Transcendent Lord (Bhagavan).\nGreatest of the Great, [Chechog], with the brilliance of sapphire.\nPossessing the light of ten million suns; seven times three [21] faces."}, {"tib": "།ཞབས་བརྒྱད་ཕྱག་ནི་བཞི་བཅུ་རྩ་གཉིས་ན། །ཞི་བའི་ལྷ་ཚོགས་བཞི་བཅུ་རྩ་གཉིས་བསྣམས། །\nགནམ་ཞལ་ཡུལ་མཆོག་དབུ་དགུ་ཕྱག་བཅོ་བརྒྱད། །རྩ་བའི་ཕྱག་གཉིས་རྡོ་རྗེ་དུང་ཁྲག་འཛིན།", "en": "Eight legs; regarding the hands, in the forty-two\nHe holds the forty-two assembly of Peaceful Deities.\nThe Sky-Faced Supreme Consort; nine heads, eighteen hands.\nThe two root hands hold the Vajra and the Blood-Conch [Skullcup]."}, {"tib": "།ལྷག་མ་གནས་ཡུལ་མ་མོ་ཕྲ་མེན་བསྣམས། ཡབ་ཡུམ་ཁྲོ་མཁར་ཚུལ་ལམ་མཉམ་པར་སྦྱོར། །\nསྲིད་དང་ཞི་བའི་ཆོས་ཁམས་མ་ལུས་པ། །བཅོམ་ལྡན་འདས་ཀྱི་ཞབས་ཀྱི་གདན་ཁྲི་ནས།", "en": "The remainder hold the Mamos of the places and lands, and the Tramen [Hybrids].\nFather and Mother in the manner of the Wrathful Citadel or joined in union.\nThe phenomena and elements of Existence and Peace without remainder,\nFrom the throne at the feet of the Bhagavan..."}, {"tib": "།དབུ་རྒྱན་འཁོར་ལོའི་བར་ལ་རང་བཞིན་རྫོགས་། །དབང་མཆོག་དང་ནི་ཧེ་རུ་ཀ་དཔལ་དགུ། །\nགློ་འབུར་བཞི་དང་གྲུ་ཆད་རྣམ་བཞི་ལ། །རྣམ་ཤེས་ཚོགས་དག་གོ་རཱི་ལ་སོགས་བརྒྱད།", "en": "Up to the wheel of the crown ornament, are naturally perfected.\nThe Supreme Might and the nine Glorious Herukas.\nIn the four balconies and the four corners,\nThe pure collection of consciousnesses: Gauri, etc., the eight."}, {"tib": "།དཀྱིལ་འཁོར་དང་པོའི་ཁྱམས་ལ་ཕྲ་མེནཱ་བརྒྱད། །གཉིས་པའི་ཁྱམས་ལ་སྤོར་མ་རྣམས་པ་བརྒྱུད། །\nགསུམ་པའི་ཁྱམས་ལ་དབང་མོ་ཉི་ཤུ་བརྒྱུད། །ཀུན་ལ་རང་རང་སྒོ་མ་བཞི་བཞིར་ལྡན།", "en": "In the courtyard of the first mandala, the eight Tramen [Hybrids].\nIn the courtyard of the second, the eight types of Sorma.\nIn the courtyard of the third, the twenty-eight Wangmo [Isvaris].\nFor all, possessing four Gatekeepers each, individually."}, {"tib": "།འབར་བའི་རྣམ་རོལ་གར་དགུའི་ཉམས་ཀྱིས་བརྗིད། །འདི་དག་རང་སྣང་ལོངས་སྐུའི་དཀྱིལ་འཁོར་ཏེ། །\nགཞི་སྣང་ལྷུན་གྲུབ་དོན་གྱི་འོག་མིན་ཡིན། །བཞི་པའི་ཁྱམས་ལ་མཁའ་འགྲོ་སུམ་ཅུ་གཉིས།", "en": "Majestic with the mood of the nine dances of the blazing display.\nThese are the Mandala of the Self-Appearance Sambhogakaya.\nThe Ground-Appearance Spontaneously Present is the Actual Akanishtha.\nIn the fourth courtyard, the thirty-two Dakinis."}, {"tib": "།ལྔ་པའི་ཁྱམས་ལ་མ་བདུན་སྲིང་མོ་བཞི། །དྲུག་པའི་ཁྱམས་ལ་གིང་ཆེན་དྲུག་ཚན་གསུམ། །\nབདུན་པར་ཁྲོ་བོ་ཡབ་ཡུམ་བཅུ་ཕྲག་དྲུག །བརྒྱད་པར་ཕོ་ཉ་ཉིས་བརྒྱ་བཞི་བཅུ་སྟེ།", "en": "In the fifth courtyard, the seven Mothers and four Sisters.\nIn the sixth courtyard, the three sets of six Great Gings.\nIn the seventh, the sixty Wrathful Fathers and Mothers.\nIn the eighth, the two hundred and forty Emissaries."}, {"tib": "།དགུ་པའི་ཁྱམས་ལ་མ་མོ་དྲུག་ཅུ་རྣམས། །ལོག་འདྲེན་འདུལ་ཕྱིར་སྤྲུལ་པས་བསྡུས་པའི་ཕྱིར། །\nབགེགས་སོགས་གདུལ་བྱ་སོ་སོའི་རང་ངོར་སྣང་། །དེ་ཕྱིར་རང་སྣང་འོག་མིན་དཀྱིལ་འཁོར་མིན།", "en": "In the ninth courtyard, the sixty Mamos.\nBecause they are gathered by emanation to tame the misleading guides,\nAnd appear to the face of the individual tames—obstructors, etc.—\nTherefore, they are not the Mandala of the Self-Appearance Akanishtha."}, {"tib": "།ཆོས་སྐུའི་ཡེ་ཤེས་ཕྱི་རུ་གསལ་བའི་མདངས། །ཕུན་ཚོགས་ལྔ་ལྡན་ལོངས་སྤྱོད་རྫོགས་པའི་གནས། །\nགང་དུ་སྒྲིབ་པ་མཐའ་དག་སྤངས་གྱུར་པའི། །སངས་རྒྱས་ཁོ་ནའི་རྒྱུད་ཀྱིས་བསྡུས་པ་ཡི།", "en": "The tone of Dharmakaya Wisdom clarifying outwardly;\nThe place perfected as the Sambhogakaya possessing five perfections.\nWherein obscurations have been abandoned entirely;\nIncluded in the continuum of the Buddha alone."}, {"tib": "།རོལ་པ་ཉིད་ཕྱིར་གཙོ་འཁོར་མཆོག་དམན་མཉམ་། །ཀུན་གྱི་ཐུགས་ཀྱང་རྣམ་པར་མི་རྟོག་ཅིང་། །\nགསུང་ནི་བརྗོད་བྲལ་སྐུ་ནི་མཚན་དཔེར་རྫོགས། །རང་སྣང་ཡེ་ཤེས་མཐོང་བ་དག་པའི་སྤྱན།", "en": "Because it is the display itself, the Principal and Retinue are equal in high and low.\nThe minds of all are non-conceptual; and\nSpeech is beyond expression;\nBody is perfected in marks and signs.\nSeeing Self-Appearance Wisdom is the Pure Eye."}, {"tib": "།གཅིག་གིས་གཅིག་གཟིགས་ནམ་ཡང་སྒྲིབ་པ་མེད། །དུས་གསུམ་རྒྱལ་བ་རྣམས་ཀྱི་སྤྱོད་ཡུལ་ནི། །\nབླ་ན་མེད་ཕྱིར་སྲིད་ཞིས་མ་བསྡུས་ཕྱིར། །དག་པའི་སེམས་ཅན་ཆེན་པོ་རྣམས་ཀྱིས་ཀྱང་།", "en": "One sees the other; there is never obscuration.\nRegarding the domain of the Victors of the three times:\nBecause it is Unsurpassed, and because Existence and Peace are not included [in it],\nEven by the Great Pure Sentient Beings [Bodhisattvas]..."}, {"tib": "།མཐོང་བར་མི་ནུས་རྒྱལ་བའི་ཡེ་ཤེས་དང་། །འགལ་བའི་སྒྲིབ་ཆས་ད་དུང་མ་སྤངས་ཕྱིར། །\nའདས་དང་མ་འོངས་ད་ལྟ་དུས་གསུམ་གྱི། །ངེས་པ་ལས་འདས་འོག་མིན་ཆེན་པོ་ན།", "en": "It is unable to be seen; because the obscuration portion contrary\nTo the Wisdom of the Victors is not yet abandoned.\nIn the Great Akanishtha beyond the certainty\nOf the three times—past, future, and present..."}, {"tib": "།བཞུགས་པའི་སངས་རྒྱས་དུས་བཞིའི་བདག་ཉིད་ཅན། །གཙོ་འཁོར་ངོ་བོ་མཐུན་པའི་རང་སྣང་ངོ༌ །\nདེ་ཉིད་ངང་ལས་སེམས་ཅན་གདུལ་བའི་ཕྱིར། །འདུལ་བྱེད་སྟོན་པ་གསུམ་དུ་བཀོད་པ་ནི།", "en": "The abiding Buddhas possess the identity of the Fourth Time.\nPrincipal and Retinue are Self-Appearance compatible in essence.\nFrom the state of that, for the sake of taming sentient beings,\nThe arrangement of the three Teachers who tame is:"}, {"tib": "།རང་བཞིན་སྤྲུལ་པ་འགྲོ་འདུལ་སྤྲུལ་པ་དང་། །སྣ་ཚོགས་སྤྲུལ་པ་གསུམ་ལས་རང་བཞིན་ནི། །\nརྒྱལ་བའི་ཡེ་ཤེས་སྣང་བ་འོག་མིན་གྱིས། །དབྱིངས་སྣང་ལོངས་སྐུའི་དཔེ་བྱད་དྭངས་ཤེལ་ནང་།", "en": "Natural Emanation (Nirmanakaya), Taming Emanation, and\nDiverse Emanation—the three.\nRegarding the Natural:\nThe appearance of the Victor's Wisdom, the Appearance of the Expanse of Akanishtha,\nInside the clear crystal of the marks of the Sambhogakaya..."}, {"tib": "།འཕོས་ལྟའི་གཟུགས་བརྙན་ཕྱེད་སྤྲུལ་ལོངས་སྐུའི་གནས། །དབུས་ན་འོག་མིན་ཤར་ན་མངོན་པར་དགའ། །\nལྷོ་ན་དཔལ་ལྡན་ནུབ་ན་པདྨ་བརྩེགས། །བྱང་ན་ལས་རབ་གྲུབ་པ་རྣམ་པ་ལྔ།", "en": "The reflection of the form, the \"Half-Emanation,\" the Abode of Sambhogakaya.\nIn the Center, Akanishtha; in the East, Manifest Joy (Abhirati).\nIn the South, Glorious (Shrimat); in the West, Piled Lotuses (Padmakuta).\nIn the North, Perfect Action (Karmaprasiddhi)—in the five aspects."}, {"tib": "།གཟུགས་ཀྱི་རྒྱལ་པོ་ལ་སོགས་སྟོན་མཆོག་ལྔ། །མཚན་དཔེ་ཡོན་ཏན་རྒྱ་མཚོའི་བདག་ཉིད་ཅན། །\nཞི་དང་ཁྲོ་བའི་རྣམ་འགྱུར་དཔག་མེད་ཅིང་། །ཡེ་ཤེས་རྣམ་པ་ལྔ་པོ་རེ་རེ་ལའང་།", "en": "The King of Form, etc., the five Supreme Teachers.\nPossessing the identity of the ocean of marks, signs, and qualities.\nThe transformations of Peaceful and Wrathful are measureless.\nRegarding each of the five aspects of Wisdom also..."}, {"tib": "།བཞི་བཞིའི་འཁོར་དང་བཅས་པས་ཉི་ཤུ་ལྔ། །ཆོས་དབྱིངས་ཡེ་ཤེས་གཡོ་བ་མེད་པ་ནི། །\nནམ་མཁའི་གཟུགས་བཞིན་ཤེས་བྱའི་མཐའ་ལས་འདས། །མེ་ལོང་ཡེ་ཤེས་གཟུང་འཛིན་རྡུལ་བྲལ་ནི།", "en": "With the retinues of four each, there are twenty-five.\nDharmadhatu Wisdom is immovable;\nLike the form of the sky, it is beyond the limit of objects of knowledge.\nMirror Wisdom is free from the dust of subject and object;"}, {"tib": "།མངོན་པར་འདུ་བྱེད་མེད་བཞིན་མཆེད་པའི་གཞི། །མཉམ་ཉིད་ཡེ་ཤེས་ཆོས་ཀུན་མཚན་ཉིད་མེད། །\nསྲིད་ཞི་དབྱེར་མེད་ཞི་བའི་དབྱིངས་སུ་ཞུགས། །སོར་རྟོག་ཡེ་ཤེས་ཆོས་ཉིད་ཇི་ལྟ་དང་།", "en": "While without manifest formation, it is the ground of spreading.\nEquality Wisdom is the lack of characteristics of all phenomena;\nExistence and Peace indivisible, it enters the Expanse of Peace.\nDiscriminating Wisdom: regarding the Dharmata \"As It Is\" and..."}, {"tib": "།ཆོས་ཅན་ཤེས་བྱ་ཇི་སྙེད་རྟག་ཐོགས་མེད། །བྱ་གྲུབ་ཡེ་ཤེས་ཕྲིན་ལས་གཞན་ཕན་ཅན། །\nཆགས་ཐོགས་སྤངས་པའི་མཛད་པ་ལྷུན་གྱིས་གྲུབ། །འཁོར་ནི་ས་བཅུའི་བྱང་སེམས་འབའ་ཞིག་ལ།", "en": "Regarding the phenomena \"As Many As There Are\"—knowledge is permanently unobstructed.\nAll-Accomplishing Wisdom: possessing activity beneficial to others;\nActions free from attachment and obstruction are spontaneously accomplished.\nRegarding the retinue, which is solely Bodhisattvas of the Tenth Ground..."}, {"tib": "།སྐུ་ཡིས་ཆོས་རྣམས་འཇལ་བའི་འོད་བཀྱེ་བས། །བྱད་ཀྱི་དྲི་མ་མེ་ལོང་ནང་གསལ་ལྟར། །\nད་དུང་བདག་དང་སྟོན་པའི་ཁྱད་མཐོང་ནས། །བྱང་ཆུབ་སྒྲིབ་པ་གཏིང་དཔག་དཀའ་བ་དག", "en": "By the Body radiating lights which meet with phenomena,\nLike the dirt of the face clear in a mirror,\nSeeing the difference between oneself and the Teacher, still,\nThe obscurations to Enlightenment, difficult to fathom..."}, {"tib": "།སྦྱངས་ནས་བཅུ་གཅིག་ཀུན་ཏུ་འོད་ལ་འགྲོ། །དུས་ནི་ས་བཅུའི་དབང་ཕྱུག་ཆེན་པོ་རྣམས། །\nའཇིག་རྟེན་མགོན་པོ་ངོ་བོ་མེད་པའི་དབྱིངས། །མི་ཟད་རྒྱན་འཁོར་སྐུ་གསུང་ཐུགས་ཀྱི་ངང་།", "en": "Having purified, they go to the Eleventh, Universal Light.\nThe time: the Great Lords (Ishvaras) of the Ten Grounds,\nThe Protectors of the World, the Expanse without essence.\nIn the state of Body, Speech, and Mind of the Wheel of Inexhaustible Ornaments."}, {"tib": "།སྟོན་འཁོར་དགོངས་པ་གཅིག་ཏུ་མ་གྱུར་བར། །འཆི་བའི་བདུད་བཅོམ་འཇིག་རྟེན་འབྱོར་སླད་རྟག །\nགདུལ་བྱའི་གཏི་མུག་ལ་སོགས་ཉོན་མོངས་ལྔ། །གང་གི་གཉེན་པོར་ཆེ་བའི་ཞིང་ཁམས་དང་།", "en": "Until the intention of Teacher and Retinue becomes one,\nHaving conquered the demon of death, for the sake of the world's fortune, permanently,\nRegarding the ignorance, etc.—the five poisons—of the tames,\nActing as the antidote to whatever: the great Field and..."}, {"tib": "།སྟོན་པར་བསྟན་པའི་སྐུ་ལྔ་ཆོས་རབ་ལྔ། །གནས་འགྱུར་ཡེ་ཤེས་རྣམ་པ་ལྔ་པོ་ཡང་། །\nམཐོང་ལམ་ནས་བཟུང་ས་བཅུ་རྒྱུན་མཐའི་བར། །རིམ་རྫོགས་རྫོགས་པའི་བྱང་ཆུབ་སྙིང་པོར་འགྲོ།", "en": "The Five Kayas shown as the Teacher; the five excellent Dharmas;\nThe five aspects of Transformed Wisdom also.\nHeld from the Path of Seeing up to the end of the stream of the Tenth Ground,\nGradually perfecting, one goes to the essence of Perfect Enlightenment."}, {"tib": "།ཞིང་འདི་ས་བཅུའི་བྱང་ཆུབ་སེམས་དཔའ་ལས། །གཞན་གྱི་སྤྱོད་པའི་ཡུལ་དུ་སྣང་མིན་ཞིང་། །\nདེ་བཞིན་སྟོན་པ་ལོངས་སྤྱོད་རྫོགས་ན་ཡང་། །འཁོར་སོགས་རང་སྣང་མ་ཡིན་རྒྱུད་གཞན་པས།", "en": "In this field, other than Bodhisattvas of the Ten Grounds,\nIt does not appear as an object of activity for others.\nSimilarly, although the Teacher is the Perfect Enjoyment (Sambhogakaya),\nBecause the retinue, etc., are not Self-Appearance but other-streams..."}, {"tib": "།བསྡུས་ཕྱིར་ཕྱེད་སྣང་རང་བཞིན་སྤྲུལ་པ་ཞེས། །ཉི་ཟླ་ཁ་སྦྱོར་ཆེན་པོའི་རྒྱུད་ཀྱིས་བསྟན། །\nཁྱད་པར་རང་བཞིན་རྫོགས་པ་ཆེན་པོ་ཡི། །རང་སྣང་ཡེ་ཤེས་དཀྱིལ་འཁོར་དམ་པ་རུ།", "en": "Because they are gathered, it is called \"Half-Appearance Natural Emanation.\"\nIt is taught by the Tantra of the Great Union of Sun and Moon.\nIn particular, in the Holy Mandala of Self-Appearance Wisdom\nOf the Natural Great Completeness..."}, {"tib": "།མཆོག་གཟིགས་བླ་མས་དབང་བསྐུར་མ་ཉམས་ལ། །ཉིན་དུས་རང་སྣང་མངོན་སུམ་འོད་གསལ་དང་། །\nམཚན་མོ་སྙིང་ཁའི་འོད་གདངས་གོམས་པ་རྣམས། །རྟོགས་པའི་རང་བཞིན་ཚད་དུ་མ་ཕྱིན་ཡང་།", "en": "Unimpaired in the empowerment conferred by the Lama who sees the Supreme;\nDuring the day, the direct Luminosity of Self-Appearance, and\nAt night, habituating to the light-tone of the heart.\nEven if the nature of realization has not reached the measure..."}, {"tib": "།ཆོས་ཉིད་བདེན་པ་བླ་མའི་བྱིན་རླབས་ཀྱི། །ས་ཐོབ་རྣམས་དང་སྐལ་པ་མཚུངས་གྱུར་ནས། །\nགཞི་སྣང་ལྷུན་གྲུབ་ཕྱོགས་བཅུ་སྤྲུལ་པར་འགྲོ། །ཁྱད་པར་རྣམ་གྲོལ་དབུགས་ཆེན་འབྱིན་པ་ལྔ།", "en": "By the truth of Dharmata and the blessing of the Lama,\nHaving become equal in fortune with those who have obtained the Grounds,\nOne goes to the emanations of the ten directions, the Ground-Appearance Spontaneously Present.\nIn particular, the five great breath-releasers of liberation."}, {"tib": "།ཤར་ནས་རིམ་བཞིན་ཤེས་དང་སུ་ཝརྞ། །པད་རཱག་ཨིནྡྲ་ནཱི་ལའི་གཞལ་མེད་ཁང་། །\nསྒོ་ཁྱམས་རྟ་བབས་སྣང་བྱེད་བ་གླང་མིག །ཟུར་བཞིར་མུ་ཏིག་མཆོད་རྟེན་དྲིལ་བུ་དང་།", "en": "From the East, gradually: Crystal, Gold,\nRuby, Sapphire [Emerald]; the Celestial Palaces.\nDoor-courtyards, pediments, illuminators [windows], ox-eyes.\nIn the four corners, pearl stupas; bells and..."}, {"tib": "།གཡེར་ཁས་སྦྲེལ་བའི་དཔྱང་ཐག་རླུང་བསྐྱོད་སྒྲ། །རྣམ་ཐར་གསུམ་ལྡན་ཆོས་དབྱངས་དར་དིར་སྒྲོག་\n།ཕྱོགས་བཞིར་སྤོས་སྤྲིན་གཡོ་བའི་བ་དན་བཞི། །ཕྱི་རིམ་ཡན་ལག་བརྒྱད་ལྡན་རྫིང་བུའི་འགྲམ།", "en": "Chimes connected; the sound of the wind moving the suspension ropes\nProclaims the humming Dharma-melody possessing the three liberations.\nIn the four directions, four banners waving in clouds of incense.\nOn the banks of the ponds possessing the eight qualities of the outer rim..."}, {"tib": "།ཏཱ་ལའི་ལྗོན་པ་དྲྭ་ཕྱེད་འཕྱང་འཕྲུལ་ཅན། །ཤང་ཤང་ཏེའུ་རྨ་བྱ་ཀ་ཏ་རི། །\nནེ་ཙོ་མི་སྐད་འབྱིན་དང་ངང་པ་གཞོན། །རི་སྐེགས་ཟེར་མོ་སྦབ་དང་ཀངྐ་རི།", "en": "Palm trees possessing the hanging ornaments of half-nets.\nShang-Shang bird, Peacock, Kalanda,\nParrot uttering human speech, and young Swan;\nGrouse, Warbler, \"Spaba\" bird, and Kangkari."}, {"tib": "།ལྷའི་བྱ་དྲིལ་བུའི་སྒྲ་ཅན་ཁུ་བྱུག་དང༌། །གསེར་གྱི་རྡོ་རྗེའི་གཟུགས་ཅན་ཀྲྀ་ཏི་པ། །\nགཡུ་དང་བྱི་རུ་ཨིནྡྲ་ནཱི་ལདང་། །དུང་ལྟར་ཁ་དོག་ཕྱེད་པའི་བྱ་ཚོགས་ཀྱིས།", "en": "The Divine Bird possessing the sound of a bell, the Cuckoo, and\nThe \"Kritiba\" having the form of a golden vajra.\nTurquoise, Coral, Sapphire, and\nConch—by the assembly of birds of mixed colors..."}, {"tib": "།སྙན་སྒྲོག་མགྲིན་པའི་རྒྱུད་མང་ཀུན་ཏུ་འཁྲོལ། །དེ་ན་བཞུགས་པའི་བྱང་ཆུབ་སེམས་དཔའ་རྣམས། །\nཉོན་མོངས་གནོད་པ་ཞི་བའི་ཆུ་ཀླུང་ལ། །སྤྱད་པ་ཙམ་གྱིས་འདུ་བའི་ནད་མི་འབྱུང་།", "en": "The lute of the throat proclaiming pleasant sounds is played everywhere.\nThe Bodhisattvas dwelling there:\nIn the river where the harm of affliction is pacified,\nBy merely using it [bathing/drinking], the illness of gathering [elements] does not arise."}, {"tib": "།ཡིད་ལ་ཅི་བསམ་དྲན་པའི་མོད་ལ་འབྱུང་། །སུམ་ཅུ་རྩ་གསུམ་ལྷ་དང་ལོངས་སྤྱོད་མཉམ། །\nཕྱི་རིམ་རིན་ཆེན་སྣ་བདུན་ཕ་གུ་ཅན། །ཞིང་མཆོག་དེ་ན་རིགས་བཞིའི་སྟོན་པ་ཡིས།", "en": "Whatever is thought in the mind arises the moment it is remembered.\nEnjoyments are equal to the Gods of the Thirty-Three.\nThe outer rim possesses the coping of the seven jewels.\nIn that supreme field, the Teachers of the Four Families..."}, {"tib": "།དུས་བཞིར་ཆོས་ཀྱི་སྒྲ་སྒྲོག་རྒྱུན་མི་ཆད། །ཀུན་གྱི་བར་སྣང་ཧེ་རུ་ཀ་དཔལ་ཞིང་། །\nདུར་ཁྲོད་ཆེན་པོ་མེ་རི་འབར་བ་ན། །སྟོན་པ་གཞོན་ནུ་དཔའ་བོ་བཅོམ་ལྡན་འདས།", "en": "Proclaim the sound of Dharma in the four times uninterruptedly.\nIn the illumination [sky] of all is the Field of the Glorious Heruka.\nIn the blazing mountain of the Great Charnel Ground,\nThe Teacher, the Youthful Hero, the Bhagavan..."}, {"tib": "།ལག་ན་རྡོ་རྗེ་ལ་སོགས་དཔའ་བོ་དང་། །མཁའ་འགྲོའི་སྤྲིན་ཕུང་འཕྲོ་བའི་དབུས་ཉིད་ན། །\nའབྲས་བུ་བླ་ན་མེད་པའི་ཆོས་འཁོར་བསྐོར། །པདྨ་ལས་སྐྱེས་རྒྱལ་སྲས་དཔག་ཏུ་མེད།", "en": "In the very center of the radiating cloud-mass of Heroes such as\nVajrapani and the Dakinis,\nTurns the Dharma Wheel of the Unsurpassed Result.\nThe Lotus-Born, the Measureless Sons of the Victor..."}, {"tib": "།ཀུན་ཀྱང་ལྷ་དང་ལྷ་མོ་ཁྱེའུ་དང་། །བུ་མོའི་རྣམ་པ་དྲང་སྲོང་གྲུབ་པ་ཅན། །\nརྣམ་པར་རྟོག་པ་མེད་ཅིང་སེམས་གསུམ་མེད། །ཡིད་དྲུག་དང་ནི་ཉོན་མོངས་དྲུག་ཀྱང་མེད།", "en": "All are in the aspect of Gods, Goddesses, Boys, and\nGirls; possessing the accomplishment of Rishis.\nThere is no conceptuality and no three minds [past/present/future].\nThere are no six consciousnesses and no six afflictions either."}, {"tib": "།མ་རིག་པ་མེད་རྐྱེན་བཞི་ཡོད་མ་ཡིན། །དེ་དང་མཚུངས་པར་ལྡན་པ་རྣམས་ཀྱང་མེད། །\nསྟོན་པ་རྡོ་རྗེ་འཆང་གི་བྱིན་རླབས་ལས། །རང་བཞིན་ཉིད་དུ་བཀོད་ཕྱིར་རང་བཞིན་ནི།", "en": "There is no ignorance; there is no basis for conditions.\nThere are none who possess the equivalence of that [ignorance].\nFrom the blessing of the Teacher Vajradhara,\nBecause it is arranged naturally, \"Natural\"..."}, {"tib": "།སྤྲུལ་པའི་ཞིང་ཞེས་རྒྱལ་སྲས་རྣམས་ལ་གྲགས། །རང་བཞིན་རྫོགས་པ་ཆེན་པོའི་གསང་ལམ་དུ། །\nརིག་པ་རང་ཤར་ཆེན་པོའི་རྒྱུད་ལས་བསྟན། །གཞན་དུ་བདེ་ཆེན་མཁའ་ལ་སྤྱོད་པ་དང༌།", "en": "\"Emanated Field\"—so it is known to the Sons of the Victors.\nOn the Secret Path of the Natural Great Completeness,\nIt is taught in the Tantra of Self-Arising Awareness.\nOtherwise, enjoying the Great Bliss Sky (Khechara), and..."}, {"tib": "།ས་སྤྱོད་ཅེས་གྲགས་དོན་གྱི་འོད་གསལ་ལ། །དབང་ཐོབ་ལྷན་གཅིག་སྐྱེས་མའི་ཌཱ་ཀི་དང་། །\nཡུལ་ཆེན་ཉེར་བཞིར་སྤྱོད་པའི་ཞིང་སྐྱེས་མ། །ལ་སོགས་དཔའ་བོ་རྣལ་འབྱོར་མ་ཚོགས་དང༌།", "en": "Known as \"Enjoying the Earth\" (Bhuchara), in the actual Luminosity,\nThe Co-emergent Dakinis who have obtained empowerment, and\nThe Field-Born women acting in the twenty-four great lands,\nEtc.—the assembly of Heroes and Yoginis, and..."}, {"tib": "།སྐལ་བ་མཉམ་པའི་རིག་འཛིན་གྲལ་གོང་དུ། །ལམ་གྱི་འཕྲོ་སྦྱོང་རིག་པ་འཛིན་པ་ཡི། །\nརྡོ་རྗེའི་བླ་མ་རྣམས་ནི་རབ་བཞུགས་ནས། །སྔགས་ཀྱི་ལྟ་སྤྱོད་རླབས་པོ་ཆེ་ལ་སྤྱོད།", "en": "Wherever the row of Vidyadharas of equal fortune [is found],\nThe Vajra Lamas holding the awareness of training in the remainder of the path\nReside perfectly; and\nPractice the great wave of the View and Conduct of Mantra."}, {"tib": "།འདི་དག་རང་སྣང་དགེ་བའི་ས་བོན་དང༌། །བསྐྱེད་རྫོགས་ཟབ་མོའི་བརྟུལ་ཞུགས་མཐར་སོན་པའི། །\nགསང་སྔགས་གྲུབ་པ་རྣམས་ལ་སྣང་བ་ལས། །རྟོག་འདོད་ཅན་གྱི་ཕྱིན་དུ་ཡོད་པ་ཡི།", "en": "These appear as Self-Appearance to those accomplished in Secret Mantra\nWho have reached the end of the profound discipline of Generation and Perfection\nAnd the seed of virtue;\nOther than that, for those possessing desire for conceptuality..."}, {"tib": "།རིས་ཆད་ཅན་དུ་བསམ་པར་མི་བྱའོ། །དེ་ཉིད་ངང་ལས་ལོངས་སྤྱོད་རྫོགས་པ་ཡི། །\nཡི་གེའི་སྤྲིན་གྱི་འོད་ཟེར་རབ་འཕྲོས་པས། །འཇིག་རྟེན་འདུལ་བྱེད་སྤྲུལ་པའི་སྐུ་མཆོག་ནི།", "en": "It is not to be thought of as partiality [limited/ordinary].\nFrom the state of Thatness, the Perfect Enjoyment (Sambhogakaya)\nRadiates the light rays of the clouds of syllables;\nThe Supreme Nirmanakaya which tames the world..."}, {"tib": "།གནས་རིགས་དྲུག་གི་གདུལ་བྱའི་སྣང་བ་ལ། །རང་རང་མིང་གི་མངོན་བརྗོད་རྗེས་འགྲོ་བའི། །\nའདུལ་བྱེད་རིགས་པའི་སྐྱེས་བུ་ཐུབ་པ་དྲུག། །ཕྱོགས་བཅུ་མཐའ་ཡས་མུ་མེད་སྟོང་གསུམ་གྱི།", "en": "To the appearance of the tames of the six classes of abodes,\nFollowing the clear expression of their individual names,\nThe Six Munis, the Beings of Awareness who tame.\nThe Limitless Ten Directions, the boundless Three Thousand..."}, {"tib": "།སྟོང་ཆེན་སྙེད་དང་མཉམ་པར་རབ་སྲུལ་ནས། །གདུལ་བ་བཞི་ཡི་འགྲོ་དོན་བསམ་མི་ཁྱབ། །\nདེ་ཡང་བསོད་ནམས་ཆེན་པོས་འདུལ་བ་ནི། །སྐུ་ཡི་མཛད་པ་ཆེན་པོ་བཅུ་གཉིས་ཡིན།", "en": "Having fully emanated equal to the number of the Great Thousand [worlds],\nThe welfare of beings of the Four Modes of Taming is inconceivable.\nFurthermore, regarding the taming by great merit:\nThe twelve great deeds of the Body."}, {"tib": "།གསུམ་གི་མཛད་པ་ཐེག་པ་གསུམ་ནམ་གཅིག། །གང་ཡང་འདུ་ཤེས་རྗེས་འགྲོ་སེམས་ཅན་གྱི། །\nཉོན་མོངས་གཉེན་པོར་དགོངས་ཏེ་གསུངས་པ་ལ། །ཆོས་ཀྱི་སྒོ་འཕར་བརྒྱད་ཁྲི་བཞི་སྟོང་གྲངས།", "en": "Regarding the deeds of Speech: Three Vehicles or One—\nWhatever perception is followed, intending as the antidote\nFor the afflictions of sentient beings, regarding what is spoken:\nThe number of the doors of Dharma is eighty-four thousand."}, {"tib": "།གསུམ་ལྟར་སྣང་ཡང་སྒྲ་ཚིག་རང་མཚན་པ། །མ་ཡིན་སེམས་ཅན་ཁམས་ལ་བྱིན་བརླབས་མཐུས། །\nརྣམ་པར་རིག་པ་ཉིད་དང་མཐུན་པར་ཤར། །ཐུགས་ཀྱིས་འདུལ་བ་དུས་གསུམ་མཁྱེན་ཅིང་གཟིགས།", "en": "Through appearing as speech, it is not sound, word, or specific characteristic.\nBy the power of blessing in the element of sentient beings,\nIt dawns in harmony with individual perception itself.\nTaming by Mind: Knowing and seeing the three times."}, {"tib": "།དུས་ཀྱང་སོ་སོར་མི་རྟོག་དུས་མེད་དུས། །རང་བཞིན་གདོད་མའི་གནས་སྐབས་ཀུན་ཏུ་བཟང་། །\nགཞན་གྱི་སེམས་རྒྱུད་མཁྱེན་དང་དེ་བཞིན་དུ། །རྫུ་འཕྲུལ་ཆེན་པའི་སྤྱན་དང་སྙན་ལ་སོགས།", "en": "Regarding time also: individual non-conceptuality; timeless time.\nThe nature is the occasion of the Primordial Samantabhadra.\nKnowing the mind-streams of others; and similarly,\nThe Eye and Ear of Great Miracles, etc."}, {"tib": "།མངོན་ཤེས་དྲུག་པོ་དུས་ལས་ཡོལ་བ་མེད། །ཕྲིན་ལས་འདུལ་བ་ཀུན་ཏུ་སྐུ་དང་ཞིང་། །\nཀུན་ཏུ་ཐུགས་དང་དེ་བཞིན་ཀུན་ཏུ་ཞལ། །ཀུན་ཏུ་གསུང་གི་གསང་བ་བསམ་མི་ཁྱབ།", "en": "The six Superknowledges do not deviate from the time.\nRegarding Activity: in all taming, the Body and Field,\nIn all, the Mind; and similarly, in all, the Face.\nIn all, the Secret of Speech is inconceivable."}, {"tib": "།སྐུ་གསུང་ཐུགས་ཀྱིས་དངོས་སུ་དོན་མཛད་ལ། །ཕྲིན་ལས་ཀྱིས་ནི་དངོས་རྒྱུད་ཀུན་ཏུ་མཛད། །\nདེ་ལྟར་དབྱིངས་ལས་སྤྲུལ་པའི་སྐུར་མཆོག་རྣམས། །ཆོས་ཉིད་ལ་ལྟོས་ཇི་ལྟའི་ཡེ་ཤེས་དང༌།", "en": "Acting for the welfare in the actual Body, Speech, and Mind;\nPerforming the actual stream of activity in all.\nThus, the Supreme Nirmanakayas emanated from the Expanse:\nRegarding Dharmata, [possessing] the \"Wisdom of How It Is,\" and..."}, {"tib": "།ཆོས་ཅན་ལ་ལྟོས་ཇི་སྙེད་མཁྱེན་པ་ཡི། །ཡེ་ཤེས་གཉིས་ཀྱིས་གདུལ་བྱའི་རྒྱུད་འགྲོལ་ཞིང་། །\nཉེ་བར་ཞི་དང་མ་འདྲེས་ཆོས་ཚུལ་སྟོན། །དེ་ལས་ཡང་སྤྲུལ་རྣམ་པ་བརྗོད་མི་ལང་།", "en": "Regarding Phenomena, possessing the \"Wisdom of How Many There Are\";\nBy the two Wisdoms, liberating the stream of the tames.\nDemonstrating the mode of Dharma which is thoroughly peaceful and unmixed.\nFrom that, the further emanations are unspeakable in kind."}, {"tib": "།འགྲོ་བ་དྲུག་གི་གནས་རིགས་དེ་སྙེད་དུ། །ལྷ་རྣམས་འདུལ་བྱེད་ཚངས་དབང་བདེ་འབྱུང་སོགས། །\nམི་ལ་ཉན་རང་བྱང་སེམས་འཁོར་ལོས་སྒྱུར། །དེ་བཞིན་ལྷ་མ་ཡིན་ལ་ཐགས་བཟང་རིས།", "en": "In as many abode-types of the six classes of beings as there are:\nThose who tame Gods: Brahma, Indra, Source of Bliss (Shiva), etc.\nFor Humans: Shravakas, Pratyekabuddhas, Bodhisattvas, Chakravartins.\nSimilarly, for Demi-Gods: Vemachitra (Thags-bzang-ris)."}, {"tib": "།བྱ་ལ་ཤིང་རྟ་མོ་དབང་རི་དྭགས་ཕྱིར། །སེང་གེའི་རྒྱལ་པོ་ཡི་དམ་བརྟན་པ་སོགས། །\nམདོར་ན་དམྱལ་བ་ཡི་དྭགས་གང་དང་གང་། །འདུལ་བྱེད་དེ་དང་དེ་འདྲའི་གཟུགས་སྤྲུལ་ནས།", "en": "For Birds: The Charioteer; and for Pretas:\nThe Lion King, the Firm Yidam, etc.\nIn brief, whatever Hells and Pretas...\nHaving emanated the form similar to that which tames that..."}, {"tib": "།སེམས་ཅན་དོན་ལ་ནམ་ཡང་གཡེལ་བ་མེད། །འདི་ནི་འཇིག་རྟེན་དྲུག་གི་ཞིང་རྣམས་སུ། །\nལས་དང་བག་ཆགས་དགེ་སྡིག་རྒྱུ་འབྲས་ཀྱི། །གནས་རིགས་བདེ་སྡུག་མཐོ་དམན་ལྟར་སྣང་བའི།", "en": "There is never negligence regarding the welfare of sentient beings.\nThis acts for the benefit in the fields of the six worlds\nBy the Teacher compatible with the Self-Appearance\nOf what appears as happiness/suffering, high/low abodes and classes..."}, {"tib": "།རང་སྣང་མཐུན་པའི་སྟོན་པས་དོན་མཛད་ཅིང་། །ཆོས་ཀྱང་མ་ངེས་གདུལ་བྱའི་བློ་རྟོག་ལྟར། །\nདུས་ཀྱང་རང་རང་སྐལ་པའི་རྗེས་འགྲོ་བ། །མ་དག་ཞིང་གི་འགྲོ་ལ་དེ་ལྟར་སྣང་།", "en": "Of the cause and result of virtue and sin, karma and habitual tendencies.\nThe Dharma also is uncertain; in accordance with the mental thought of the tame.\nTime also follows individual aeons.\nIt appears like that to the beings of impure fields."}, {"tib": "།གང་ཞིག་རྨི་ལམ་ནང་དུ་སངས་རྒྱས་མཐོང༌། །རྨི་ལམ་ལྟ་བུར་སྤྲུལ་པའི་ཆོས་བསྟན་ཡང་། །\nངོ་བོ་ཉིད་མེད་རང་བཞིན་མ་གྲུབ་ལ། །བདག་མེད་སྟོང་པ་གསོག་ཏུ་རིག་བྱ་ཞེས།", "en": "Whoever sees the Buddha in a dream:\nAlthough the emanated Dharma is shown like a dream,\nIt is without essence and unestablished in nature;\n\"It is to be known as selfless, empty, and accumulating [merit]\"—so..."}, {"tib": "།ཟབ་མོའི་མདོ་སྡེ་དག་ལས་གསུངས་པས་ན། །འཁོར་འདས་རྨི་ལམ་ལྟ་བུའི་རོལ་པ་ལ། །\nསྣང་བའི་སངས་རྒྱས་ངོ་བོ་དག་ནའང་། །སྤྲུལ་པ་གདུལ་བྱ་ཉིད་ལྟར་སྣང་བའི་ཕྱིར།", "en": "Because it is taught in the profound Sutras,\nRegarding the display like a dream of Samsara and Nirvana,\nAlthough the essence of the appearing Buddha is pure,\nBecause the Emanation appears like the tame itself..."}, {"tib": "།མ་དག་ཐུགས་རྗེ་རོལ་པའི་སྤྲུལ་པ་ཡང་། །ཇི་སྲིད་འཁོར་བའི་རྗེས་འགྲོ་རྒྱུན་མི་འཆད། །\nདེ་ཉིད་ངང་ལས་སྣ་ཚོགས་སྤྲུལ་པ་ནི། །རང་བཞིན་བྱོན་དང་འདུ་བྱེད་ལས་བྱུང་བ།", "en": "The Emanation displayed by Impure Compassion also,\nAs long as Samsara exists, follows uninterruptedly.\nFrom the state of Thatness, the Diverse Emanation\nIs that which comes naturally and that which arises from created action."}, {"tib": "།འབུར་དུ་བྱས་དང་རིས་སུ་བྲིས་པ་དང་། །གནྡྷོ་ལ་དང་ཁང་བཟང་སྐྱེད་མོས་ཚལ། །\nམྱ་ངམ་ཐང་ལ་སྤྲུལ་པའི་གྲོང་ཁྱེར་དང་། །པདྨ་དཔག་བསམ་ཤིང་དང་ཡིད་བཞིན་ནོར།", "en": "Sculpted [statues] and drawn in figures; and\nStupas and Excellent Houses [Temples], Pleasure Groves.\nEmanated cities in the wilderness; and\nLotuses, Wish-Granting Trees, and Wish-Fulfilling Gems."}, {"tib": "།གྲུ་གཟིངས་ཟམ་པ་ཤིང་རྟ་ཟབ་གོས་སོགས། །སེམས་མེད་བེམ་པོའི་ཚུལ་དུ་སྣང་བ་དང་། །\nསྐྱེ་བ་མུ་གེའི་ཚེ་ན་ཉ་བོ་ཆེ། །ནད་ཀྱི་གདུངས་ལ་སྲོག་ཆགས་དེས་པ་དང༌།", "en": "Boats, Bridges, Chariots, Food, Clothing, etc.\nAppearing in the manner of inanimate matter; and\nA Great Fish at the time of famine for beings.\nFor those tormented by illness, the Gentle Creature; and..."}, {"tib": "།སྲིད་མོའི་གླིང་དུ་ཅང་ཤེས་བ་ལ་ཧ། །མི་གཙང་འདམ་དུ་གསེར་གྱི་བུང་བ་སོགས། །\nསྤྲུལ་པ་སྣ་ཚོགས་རྣམ་ཀུན་བདེ་བའི་གཞིར། །རྟོག་པ་མེད་ཅིང་གཡོ་བ་མེད་པ་ལྟས།", "en": "In the land of Rakshasis, the Horse Balaha.\nIn the filthy swamp, the Golden Bee, etc.\nDiverse emanations as the ground of happiness in all aspects.\nBecause it is without thought and without motion..."}, {"tib": "།དོན་ཆེན་གྱིས་ནི་དཔལ་དུ་ཉེ་བར་གནས། །གལ་ཏེ་གདུལ་བར་བྱ་བའི་དུས་ཡོལ་ན། །\nའདུལ་བྱེད་དབྱིངས་སུ་ནུབ་པའི་མཚོན་དཔེ་ནི། །ཇི་ལྟར་ཆུ་སྣོད་མེད་ཚེ་ཆུ་ཟླའི་གཟུགས།", "en": "It abides near to the glory of great benefit.\nIf the time for taming passes,\nThe marks and signs capable of taming [dissolve] into the Expanse.\nJust as when there is no water vessel, the form of the water-moon..."}, {"tib": "།སྤྲུལ་གཞིའི་ཟླ་བ་ཉིད་ལ་ཐིམ་པ་ལྟར། །གདུལ་བྱའི་སྣང་བས་བསྡུས་པའི་སྤྲུལ་པ་རྣམས། །\nརང་སྣང་ལོངས་སྤྱོད་རྫོགས་པའི་དབྱིངས་སུ་ཐིམ། །དེའང་གནམ་སྟོང་ཟླ་བ་གཅིག་ཤོས་ནས།", "en": "Dissolves into the moon of the basis of emanation itself;\nThe emanations gathered by the appearance of the tames\nDissolve into the Expanse of the Self-Appearance Perfect Enjoyment (Sambhogakaya).\nThat also, from the [Full] Moon to the New Moon [Space]..."}, {"tib": "།གཅིག་ཏུ་ཐིམ་པ་མེད་ཀྱང་ཕྱིར་གསལ་གདངས། །ནང་དབྱིངས་སྤྲོས་པ་མེད་པའི་ངང་ཐིམ་ལྟར། །\nལོངས་སྤྱོད་རྫོགས་པའི་རང་སྣང་ཆོས་ཀྱི་སྐུའི། །ཡེ་ཤེས་ཆེན་པོར་འཁྱིལ་བ་དེ་ཉིད་ལ།", "en": "Although there is no dissolving into one, the outward clear tone\nDissolves into the state of the inner expanse free from elaboration.\nThe Self-Appearance of Perfect Enjoyment [dissolves] into the Dharmakaya;\nInto that very swirling Great Primal Wisdom..."}, {"tib": "།དབུམ་པ་རྣམས་འཇུག་པ་ཆོས་དབྱིངས་སུ། །ཞི་བའི་འགོག་པ་དམ་པ་ཞེས་འདོད་ལ། །\nའདིར་ནི་སོ་སོ་རང་རིག་ཡེ་ཤེས་ཉིད། །ཕྲ་བའི་ཡེ་ཤེས་ནང་གསལ་ཆོས་ཀྱི་དབྱིངས་།", "en": "The Madhyamikas assert the entrance into Dharmadhatu\nAs the \"Supreme Cessation of Peace.\"\nHere, the Wisdom of Individual Self-Awareness itself—\nThe Subtle Wisdom, Inner Clarity Dharmadhatu..."}, {"tib": "།ཐིམ་ལ་མ་རྨུགས་གཞོན་ནུ་བུམ་པའི་སྐུ། །གང་དུ་གདུལ་བྱ་སྣང་བའི་མོད་ཉིད་ལ། །\nའགག་མེད་ཐུགས་རྗེའི་ཡེ་ཤེས་མཚེད་པའི་གཞི། །ཤིན་ཏུ་མཉམ་པར་བཞག་པའི་ཆོས་ཉིད་ནི། །\nའབྲས་བུ་ལྷུན་གྲུབ་ཆེན་པོའི་གོ་འཕང་ཡིན།\n\n།ཡོན་ཏན་རིན་པོ་ཆེའི་མཛོད་དགའ་བའི་ཆར་ཞེས་བྱ་བ་ལས། །མཐར་ཕྱིན་འབྲས་བུ་སྐུ་དང་ཡེ་ཤེས་བསྟན་པའི་ཚོམས་ཏེ་ལེའུ་བཅུ་གསུམ་པས་རྫོགས་སོ།།", "en": "Absorbed but not dull; the Youthful Vase Body.\nIn the very moment that the tames appear,\nThe ground of the spreading of unceasing Compassionate Wisdom.\nThe Dharmata which is utterly equipoised\nIs the Go-phang (State/Level) of the Great Spontaneous Result."}],
      colophon: [{"tib": "།།བདག་བརྒྱུད་སྣོད་ཀྱི་དཔྱད་པ་རྫོགས་གྱུར་ནས། །འཇིག་རྟེན་མགོན་པོ་དྲི་མེད་འོད་ཟེར་གི། །\nཞལ་མཐོང་ཐུགས་རྗེའི་དབུགས་འབྱིན་མ་ཐོབ་ན། །ལམ་མིན་གཡང་སར་དལ་རྟེན་སྟོང་ལོག་བྱས།", "en": "Having perfected the analysis of the vessel of my own continuum,\nIf I had not obtained the relieving breath of compassion\nOf seeing the face of the Protector of the World, Drime Ozer [Longchenpa],\nI would have rendered the support of leisure empty upon the precipice of a wrong path."}, {"tib": "།དེ་ཕྱིར་འདི་ལ་ལེགས་པར་བཤད་པའི་ཆ། །བླ་མའི་བྱིན་རླབས་སྒོམ་བྱུང་ཤེས་རབ་ལས། །\nཐོས་བསམ་རྟོག་གེའི་རིག་པས་མ་བསྐྱེད་པས། །རང་རང་འདོད་གཞུང་ཕྱོགས་དང་འགལ་ན་འཆགས།", "en": "Therefore, the portion which is well explained here\nArises from the wisdom born of meditation through the Lama's blessing;\nSince it was not generated by the logic of speculation, study, and reflection,\nIf it contradicts the individual textual systems of [others], I confess."}, {"tib": "།ཆོས་ཚུལ་རྒྱ་མཚོ་གཏིང་དཔག་དཀའ་བའི་དོན། །མཉམ་པར་བཞག་པ་ཁོ་ནའི་ཁྱད་ཆོས་ལས། །\nཇི་ལྟ་ཇི་སྙེད་མཁྱེན་པའི་ཡེ་ཤེས་གནས། །ཡང་དག་མཐོང་ལ་ནམ་ཡང་བསླུ་བ་མེད།", "en": "The meaning of the mode of Dharma is an ocean difficult to fathom;\nOther than being the special feature of Equipose alone,\nThe Primal Wisdom knowing \"How It Is\" and \"How Many There Are\" exists.\nRegarding seeing authentically, it is never deceptive."}, {"tib": "།དགེ་བ་འདི་ཡིས་བདག་དང་སེམས་ཅན་རྣམས། །རྒྱལ་བའི་རིང་ལུགས་ནོར་བ་མེད་པའི་ལམ། །\nསྒྲིབ་གཉིས་རྙོག་པ་དྭངས་པའི་གཟིངས་ཞུགས་ནས། །བྱང་ཆུབ་ཞི་བ་རིན་ཆེན་གླིང་ཕྱིན་ཤོག་", "en": "By this virtue, may I and sentient beings,\nHaving entered the ship which clears the sediment of the two obscurations\nOf the unmistaken path of the Victor's tradition,\nReach the Precious Island of the Peace of Enlightenment."}, {"tib": "།ནགས་མཐོངས་རི་དྭགས་དཀྱུ་བའི་སྨན་ལྗོངས་ན། །དུས་བཞིའི་མངོན་རྟོགས་ངོམ་པའི་ལྗོན་པ་ནི། །\nདྲང་སྲོང་རྣམས་ལ་མི་སྙན་སྒྲོག་མི་བྱེད། །སྙིང་ལ་འབབ་པར་སྨྲ་བའི་བྱ་ཚོགས་ཀྱང།", "en": "In the medicinal valley of the forest depths where deer run free,\nThe trees displaying the clear realization of the four seasons\nDo not proclaim unpleasant sounds to the Sages.\nThe assembly of birds speaking words that fall [pleasantly] on the heart…"}, {"tib": "།སྦྲུལ་གདུག་འཁྲི་ཤིང་ལྟ་བུའི་འཁོར་བ་འདིར། །སྐྱོ་བའི་ངེས་འབྱུང་ཤིང་རྟས་ཡིད་འདྲེན་པའི། །\nཅ་ཅོ་ཤིན་ཏུ་ཞི་བ་སྒྲོག་ཐོས་ནས། །དབང་པོ་ཉེ་བར་ཞི་བའི་དཔལ་ཐོབ་ཤོག་", "en": "In this Samsara which is like a vine of poisonous snakes,\nThrough the mind being led by the chariot of sadness and renunciation,\nHaving heard the proclamation of the utter peace of noise and clamor,\nMay we obtain the glory of the senses being thoroughly pacified."}, {"tib": "།ལྟ་བ་ཡིད་བྱེད་རླུང་གིས་མ་དཀྲུགས་ལ། །སྤྱོད་པ་རྒྱལ་སྲས་དམ་པའི་རྗེས་འགྲོ་བས། །\nནམ་ཡང་གཞན་གྱི་ཁུར་དུ་མི་འགྲོ་ཞིང་། །རླབས་ཆེན་ཕྲིན་ལས་འགྲོ་བའི་དཔལ་དུ་ཤོག་\n\n།ཡོན་ཏན་རིན་པོ་ཆེའི་མཛོད་དགའ་བའི་ཆར་ཞེས་བྱ། །ལ་སྟོད་པ་ཆོས་རྗེ་བྲག་ཕུག་པས་བསྐུལ་བའི་ངོར། །\n\n།སངས་རྒྱས་གཉིས་པ་པདྨ་སམྦྷ་ཝའི་ཞབས་རྡུལ་ལ་སྤྱི་བོས་རེག་པའི་རྫོགས་ཆེན་པ་རང་བྱུང་རྡོ་རྗེ་མཁྱེན་བརྩེ་འོད་ཟེར་གྱིས་དཔལ་ལྡན་པདྨ་འོད་གླིང་དུ་སྦྱར་བའོ། །དགེའོ།། །།", "en": "The View not disturbed by the wind of mental activity;\nThe Conduct following after the Holy Sons of the Victors;\nNever becoming a burden to others,\nMay the great wave of activity become the glory of beings.\n\nThe Treasury of Precious Qualities called \"The Rain of Joy\" was composed at the request of the Dharma Lord (Choje) Drakpuk-pa of Latö, by the Dzogchenpa Rangjung Dorje Khyentse Ozer—who touches with his crown the dust of the feet of the Second Buddha Padmasambhava—in Glorious Pema Oling."}]

    function getVerseKey(node, byId) {
      if (!node || !byId) return null;
      let cur = node;
      while (cur) {
        if (cur.id === '1') return 'prologue';
        if (cur.id === '3') return 'colophon';
        if (!cur.parent) break;
        cur = byId[cur.parent] || null;
      }
      cur = node;
      while (cur) {
        if (cur.chapter != null) return cur.chapter;
        if (!cur.parent) break;
        cur = byId[cur.parent] || null;
      }
      return null;
    }

            <div className="lang-toggle" role="radiogroup" aria-label="Language">
              <button role="radio" aria-checked={lang === 'tib'}
                      className={`lang-opt ${lang === 'tib' ? 'is-active' : ''}`}
                      style={{ fontFamily: 'Jomolhari, Noto Sans Tibetan, serif', fontSize: 14, lineHeight: 1.4 }}
                      onClick={() => onSetLang('tib')}>བོད་ཡིག</button>
              <button role="radio" aria-checked={lang === 'en'}
                      className={`lang-opt ${lang === 'en' ? 'is-active' : ''}`}
                      onClick={() => onSetLang('en')}>English</button>
            </div>
          </div>
        </div>
      );
    }

    function TweaksPanel({ tweaks, setTweaks }) {
      const set = (patch) => {
        const next = { ...tweaks, ...patch };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
      };
      return (
        <div className="tweaks-panel">
          <h4>Tweaks</h4>
          <div className="tweaks-row">
            <label>Rotation speed</label>
            <input type="range" min="0" max="2" step="0.05"
              value={tweaks.rotationSpeed}
              onChange={(e) => set({ rotationSpeed: parseFloat(e.target.value) })}/>
            <span className="val">{tweaks.rotationSpeed.toFixed(2)}°/s</span>
          </div>
          <div className="tweaks-row">
            <label>Parallax</label>
            <input type="range" min="0" max="24" step="1"
              value={tweaks.parallax}
              onChange={(e) => set({ parallax: parseInt(e.target.value, 10) })}/>
            <span className="val">{tweaks.parallax}px</span>
          </div>
          <div className="tweaks-row">
            <label>Sa bche tree</label>
            <button className={`chip ${tweaks.showTreePanel ? 'is-on' : ''}`}
                    onClick={() => set({ showTreePanel: !tweaks.showTreePanel })}>
              {tweaks.showTreePanel ? 'Visible' : 'Hidden'}
            </button>
          </div>
          <div className="tweaks-row">
            <label>Ring sizing</label>
            <button className={`chip ${tweaks.ringWeighted ? 'is-on' : ''}`}
                    onClick={() => set({ ringWeighted: true })}>By depth</button>
            <button className={`chip ${!tweaks.ringWeighted ? 'is-on' : ''}`}
                    onClick={() => set({ ringWeighted: false })}>Equal</button>
          </div>
        </div>
      );
    }

    function ReadingPanel({ node, lang, data, onClose, onVerseClick }) {
      const scrollRef = useRef(null);
      const [showTop, setShowTop] = useState(false);
      
      // Auto-scroll to highlighted verse when node changes
      useEffect(() => {
        if (node && node.verseRange && scrollRef.current) {
          // slight delay to ensure render
          setTimeout(() => {
            if (scrollRef.current) {
              const el = scrollRef.current.querySelector('.rp-verse.is-highlighted');
              if (el) {
                // Scroll into view but keep a bit of margin
                const containerTop = scrollRef.current.getBoundingClientRect().top;
                const elTop = el.getBoundingClientRect().top;
                scrollRef.current.scrollBy({ top: elTop - containerTop - 60, behavior: 'smooth' });
              }
            }
          }, 100);
        }
      }, [node]);

      if (!node) return null;
      const handleScroll = () => setShowTop((scrollRef.current?.scrollTop ?? 0) > 120);
      const scrollToTop = () => scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });

      // Build full ancestry path for breadcrumb
      const path = [];
      let cur = node;
      while (cur) {
        path.unshift(cur);
        cur = (cur.parent && data && data.byId[cur.parent]) || null;
      }

      const ROOT_LABELS = {
        '1': { tib: 'ཀླད་ཀྱི་དོན།', en: 'Preamble' },
        '2': { tib: 'གཞུང་གི་དོན།', en: 'Main text' },
        '3': { tib: 'མཇུག་གི་དོན།', en: 'Conclusion' },
      };

      const label = (n) => {
        const rl = ROOT_LABELS[n.id];
        if (lang === 'tib') return rl ? rl.tib : (n.tibClean || n.tib || '');
        return rl ? rl.en : (n.enClean || n.en || '');
      };

      return (
        <div className="rp-overlay" onClick={onClose}>
          <div className="rp-panel" onClick={(e) => e.stopPropagation()}>
            <button className="rp-x" onClick={onClose}>×</button>
            <div className="rp-scroll" ref={scrollRef} onScroll={handleScroll}>

            {/* Ancestry breadcrumb */}
            {path.length > 1 && (
              <div className="rp-path">
                {path.map((n, i) => (
                  <React.Fragment key={n.id}>
                    {i > 0 && <span className="rp-path-sep">›</span>}
                    <span className={`rp-path-item${i === path.length - 1 ? ' rp-path-current' : ''}`}>
                      {label(n)}
                    </span>
                  </React.Fragment>
                ))}
              </div>
            )}

            <div className="rp-eyebrow">§ {node.id}{node.chapter ? ` · Chapter ${node.chapter}` : ''}</div>
            <div className="rp-tib t-tib">{node.tibClean || node.tib}</div>
            <div className="rp-en">{node.enClean || node.en}</div>

            {node.chaptersInSubtree && node.chaptersInSubtree.length > 0 && (
              <div className="rp-meta">
                Contains chapters: {node.chaptersInSubtree.join(', ')}
              </div>
            )}

            {/* Root text attribution */}
            <div className="rp-source">
              <div className="rp-source-label">Root text</div>
              <div className="rp-source-tib t-tib">ཡོན་ཏན་རིན་པོ་ཆེའི་མཛོད།</div>
              <div className="rp-source-en">
                Treasury of Precious Qualities (Yönten Rinpoché Dzö)
                — Jigme Lingpa · Sa-bché outline by Patrul Rinpoche
              </div>
            </div>

            {/* Root text verses */}
            {(() => {
              const key = getVerseKey(node, data && data.byId);
              const verses = key != null ? VERSE_DATA[key] : null;
              if (!verses) return null;
              const chapterLabel = key === 'prologue'
                ? 'Prologue'
                : key === 'colophon'
                ? 'Colophon'
                : `Chapter ${key}: ${CHAPTER_TITLES[key - 1] || ''}`;
                
              let range = node.verseRange;
              return (
                <div className="rp-verses">
                  <div className="rp-verses-head">{chapterLabel}</div>
                  {verses.map((v, i) => {
                    const verseNum = i + 1;
                    const isHighlighted = range && (verseNum >= range.from && verseNum <= range.to);
                    return (
                    <div key={i} 
                         className={`rp-verse ${isHighlighted ? 'is-highlighted' : ''}`}
                         onClick={() => onVerseClick && onVerseClick(key, verseNum)}
                         style={{ cursor: onVerseClick ? 'pointer' : 'default' }}>
                      <div className="rp-verse-n">{verseNum}</div>
                      <div className="rp-verse-tib t-tib">{v.tib}</div>
                      <div className="rp-verse-en">{v.en}</div>
                    </div>
                  )})}
                </div>
              );
            })()}
            </div>
            <button className={`rp-scroll-top${showTop ? ' is-visible' : ''}`} onClick={scrollToTop} title="Back to top" aria-label="Scroll to top">↑</button>
          </div>
        </div>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [lang, setLang] = useState(() => localStorage.getItem('me-lang') || 'tib');
      const [mode, setMode] = useState(() => localStorage.getItem('me-mode') || 'mandala');
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksOn, setTweaksOn] = useState(false);
      const [zoomNode, setZoomNode] = useState(null);
      // mandala focus path is owned by MandalaExplorer; we mirror it here for the side tree
      const [focusPath, setFocusPath] = useState([]);

      useEffect(() => { localStorage.setItem('me-lang', lang); }, [lang]);
      useEffect(() => {
        localStorage.setItem('me-mode', mode);
        document.body.dataset.mode = mode;
      }, [mode]);
      const toggleMode = () => setMode(m => m === 'mandala' ? 'scriptorium' : 'mandala');

      // Edit-mode protocol
      useEffect(() => {
        const handler = (ev) => {
          const d = ev.data || {};
          if (d.type === '__activate_edit_mode') setTweaksOn(true);
          if (d.type === '__deactivate_edit_mode') setTweaksOn(false);
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      // Load sa bche data — bundled blob URL first, fall back to fetching ./sabche.json in dev
      useEffect(() => {
        const url = (window.__resources && window.__resources.sabche) || 'sabche.json';
        fetch(url).then(r => r.json()).then(setData).catch(err => {
          console.error('Failed to load sabche.json', err);
        });
      }, []);

      if (!data) {
        return <div className="me-loading">Loading sa bche…</div>;
      }

      // node clicked from tree → set focus path on the mandala
      const onTreeSelect = (id) => {
        const chain = [];
        let cur = data.byId[id];
        while (cur) { chain.unshift(cur.id); cur = cur.parent ? data.byId[cur.parent] : null; }
        setFocusPath(chain);
      };

      const handleVerseClick = (chapterKey, verseNum) => {
        if (!data || !data.byId) return;
        let bestNode = null;
        let maxDepth = -1;
        
        const getDepth = (id) => id.split('.').length;
        
        for (const id in data.byId) {
          const n = data.byId[id];
          if (n.verseRange && n.verseRange.chapter == chapterKey && 
              verseNum >= n.verseRange.from && verseNum <= n.verseRange.to) {
             const depth = getDepth(id);
             if (depth > maxDepth) {
                maxDepth = depth;
                bestNode = n;
             }
          }
        }
        
        if (bestNode) {
          onTreeSelect(bestNode.id);
          // Only zoom if it's different from the current zoomNode so the panel updates correctly
          setZoomNode(bestNode);
        }
      };

      return (
        <div className="me-app" data-show-tree={tweaks.showTreePanel ? 'true' : 'false'}>
          <ChromeBar lang={lang} onSetLang={setLang}
                     onResetView={() => setFocusPath([])}
                     mode={mode} onToggleMode={toggleMode} />

          <div className="me-layout">
            {tweaks.showTreePanel && (
              <SabcheTreePanel data={data}
                               focusPath={focusPath}
                               onSelect={onTreeSelect}
                               lang={lang} />
            )}
            <MandalaExplorer data={data} lang={lang} mode={mode} tweaks={tweaks}
                             focusPath={focusPath}
                             onPathChange={setFocusPath}
                             onZoom={(node) => setZoomNode(node)} />
          </div>

          {zoomNode && <ReadingPanel node={zoomNode} lang={lang} data={data}
                                     onClose={() => setZoomNode(null)}
                                     onVerseClick={handleVerseClick} />}

          {tweaksOn && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>


</body></html>
