n easy terms with them,\nThe great strength of their sin will taint your own samaya."}, {"tib": "།འགྲོགས་པར་བདེ་བ་སྐ་རགས་ལྟ་བུ་དང་། །འཇུག་པ་བདེ་བ་ལན་ཚྭ་ལྟ་བུ་དང་། །\nབཟོད་སྲན་ཆེ་བ་ཀ་བ་ལྟ་བུ་ཡིས། །བླ་མའི་འཁོར་དང་རྡོ་རྗེའི་སྤུན་ལ་གཉེན༑", "en": "Adjust yourself to your companions like a belt.\nLike salt, be easy to absorb.\nLike posts, be strong in your endurance.\nBefriend the teacher's retinue and all the vajra kin."}, {"tib": "།རྫིང་བུ་མཆོག་ལ་བསྟེན་པའི་ངང་པ་དང་། །བུང་བས་མེ་ཏོག་བཅུད་ལ་རོ་མྱང་བཞིན། །\nརྟག་ཏུ་འགྲོགས་པའི་སྤྱོད་པ་ངོ་མཚར་ཅན། །སྐྱོ་ངལ་མེད་པས་བླ་མའི་ཐུགས་བཟུང་ནས། །\nདད་པའི་ཉེ་བར་ལེན་པས་ཡོན་ཏན་མྱང་།", "en": "Like swans that swim in perfect pools,\nLike bees that taste the nectar in the flowers,\nBe tireless in your constant and impeccable attendance.\nAnd having pleased the teacher,\nTaste, through faith, his perfect qualities."}, {"tib": "།འཇུག་པའི་སྤྱོད་ལ་ངེས་པར་ཞུགས་པ་ཡི། །དམ་པ་མཆོག་གི་བསོད་ནམས་ཡེ་ཤེས་ཚོགས། །\nགང་གི་ཁྲོད་དུའང་དོན་མཐུན་སྤྱོད་པ་དང་། །མངག་གཞུག་བང་ཕྱིན་ཕྱག་དར་ཚུན་ཆོད་ཀྱང་། །\nངལ་བ་འབྲས་བཅས་ཚོགས་ཀྱི་ལམ་མཆོག་ཡིན།", "en": "Engaging truly in the actions of enlightenment,\nHoly beings make supreme accumulation\nOf both merit and of wisdom.\nTo serve and help them in their work,\nTo carry messages and sweep the floor—\nEven tasks like these bear fruit\nAnd of accumulation are the supreme path."}, {"tib": "།ཅི་ཕྱིར་སྐྱབས་སུ་འགྲོ་དང་ཚོགས་ཀྱི་ཞིང་། །བླ་མ་བསྒྲུབ་པའི་རྣལ་འབྱོར་ཕྱི་ནང་གཉིས། །\nབསྐྱེད་རྫོགས་བསྒྲུབ་བྱའི་ངོ་བོ་འདིར་འདུས་པས། །མདོ་རྒྱུད་ཀུན་ནས་སངས་རྒྱས་ཉིད་དུ་བསྟན༑", "en": "Why so? Because the practice based upon the teacher\nHolds within it refuge in a field of merit,\nThe outer and the inner yogas that accomplish the guru\nAnd the practices of generation and perfection.\nFor the teacher is the Buddha, as the sutras and the tantras all declare."}, {"tib": "།རྨོངས་པ་ཕལ་ཆེར་གཟུགས་བརྙན་འདྲི་ཞིང་བསྒོམ། །དངོས་སུ་བཞུགས་ལ་རིམ་གྲོ་བགྱི་བ་མེད། །\nགནས་ལུགས་བསྒོམ་ཟེར་བླ་མའི་ཐུགས་མི་ཤེས། །བསྒྲུབ་དང་བསྒྲུབ་བྱ་འགལ་བ་ཉོན་རེ་མོངས། །\nམོས་གུས་མེད་བཞིན་བར་དོར་འཇལ་བ་མཚར།", "en": "Most foolish people meditate on images they have contrived;\nThey do not serve the teacher while he's present.\nThey claim to meditate upon the natural state\nBut do not know the teacher's mind.\nAlas, their actions and their aims are contraries!\nAnd strange to say, although without devotion,\nThey hope to meet him in the bardo!"}, {"tib": "།དང་པོ་བླ་མ་བརྟག་ལ་མཁས་པ་དང་། །བར་དུ་བླ་མ་བསྟེན་ལ་མཁས་པ་དང་། །\nཐ་མར་དགོངས་སྤྱོད་བསླབ་ལ་མཁས་པ་ཡི། །སྐྱེས་བུ་དེ་ནི་ཡང་དག་ལམ་ལ་འགྲོ།", "en": "At first, be skillful in examining a teacher.\nThen be skilled in knowing how to follow him.\nAt last, be skilled in training in his view and action.\nActing thus you'll tread a perfect path."}, {"tib": "།གང་ཚེ་ཞི་ལ་སྡང་བའི་འབྱུང་པོ་ཡི། །བསམ་པ་སྐྱེས་བུའི་གཟུགས་སུ་འོངས་པ་དང་། །\nགཡོ་དང་སྒྱུར་སྤྱོད་ནག་པོའི་ཆོས་ལ་བསྟེན། །དམ་པར་དམོད་སོགས་དཀར་པོའི་ཆོས་ལ་སྡང་། །\nཇི་ཙམ་འགྲོགས་བཞིན་སྡིག་སྤྱོད་འཐོར་རླུང་འཚུབ།", "en": "It's then that, in their hate of peace, the evil spirits come,\nAssuming human guise, deceitful in their dark and wicked ways.\nIn hatred of bright virtue, they despise the holy beings.\nAs much as you consort with them, the storm of sin will rage.\nHow stupid then to keep such evil friends,\nWho trample down the harvest of your virtue.\nFor by these demon hordes you are brought low!"}, {"tib": "།དགེ་བའི་ལོ་ཏོག་འཇོམས་པའི་སྡིག་གྲོགས་ལ། །བསྟེན་པའི་བློ་གྲོས་བླུན་པོ་བདུད་སྡེས་བཅོམ། །\nདེ་ཕྱིར་དགེ་བའི་བཤེས་དང་གྲོགས་བསྟན་པས། །བདེ་ལེགས་ཡོན་ཏན་མཐོང་བའི་ཆོས་ལ་ཟིན༑", "en": "Frequenting, therefore, virtuous teachers and good friends,\nYou will gain perfect fortune in this very life.\nThe Buddhas and the Bodhisattvas will at all times think of you;\nYou will be rich in all the excellence of high birth and enlightenment."}, {"tib": "།རྒྱལ་དང་རྒྱལ་སྲས་རྣམས་ཀྱིས་རྟག་ཏུ་དགོངས། །མངོན་མཐོ་ངེས་ལེགས་ཡོན་ཏན་ཀུན་གྱིས་འབྱོར། །\nཚོགས་རྫོགས་སྒྲིབ་དག་དངོས་གྲུབ་རྣམ་གཉིས་འཐོབ། །ས་ལམ་ཡོན་ཏན་བླ་ནས་བླར་འགྲོ་བས། །\nརྣལ་འབྱོར་བསྒོམ་ཞིང་བསྒྲུབ་པ་བསོད་ནམས་ཚོགས། །ཐུགས་རྒྱུད་གཅིག་ཏུ་བསྲེ་བ་ཡེ་ཤེས་ཏེ།", "en": "Accumulations all complete and obscurations purified,\nYou will attain the two accomplishments,\nProgressing from the high to higher qualities of grounds and paths.\nThe practice of the guru yoga brings about the gathering of merit,\nAnd mingling your mindstream with the guru's mind\nGives rise to primal wisdom."}, {"tib": "།ཚོགས་གཉིས་འབྲས་བུའི་ཐུས་ཀ་ཡིན་པའི་ཕྱིར། །བསྐལ་བར་རྒྱལ་དང་རྒྱལ་སྲས་བསྙེན་བཀུར་ཞིང་། །\nབསྐྱེད་རིམ་བརྒྱ་ཕྲག་བསྒོམ་ལས་བླ་མ་ནི། །སྐད་ཅིག་དྲན་པ་མཆོག་ཅེས་རྒྱལ་བས་གསུངས།", "en": "Because the two accumulations are quintessence of the fruit,\nThe Conqueror has said that—more than all the agelong worship\nOf the Buddhas and their Bodhisattva heirs,\nMore than a hundred meditations on the generation stage—\nThe recollection of the teacher for a single instant is supreme."}, {"tib": "།དམ་ཆོས་བདུད་རྩིའི་ཆུ་ཀླུང་དཔག་མེད་མཛོད། །རྒྱུད་ལ་འདྲོངས་པའི་དམིགས་པ་བཟང་པོ་རྣམས། །\nསྟོན་པའི་བླ་མ་བཟང་པོར་བརྟེན་ཅིང་འབྲེལ། །ཐབས་བཟད་པ་ལས་མན་ངག་འཁྱམ་མི་འགྱུར། །\nངེས་འབྱུང་བཟང་པོའི་རིག་སྔགས་ནུས་པ་ཅན། །འཁོར་བར་སྐྱོ་བ་མེད་པའི་གདོན་ལ་ཐེབས། །བཟང་པོ་བཞི་དང་ལྡན་པའི་ལེགས་སྨོན་ཡིན།", "en": "The perfect aim to bring into your mind\nThe treasury of boundless streams of nectar of the sacred teaching\nHangs upon the exposition of a perfect teacher\nBy whose perfect skillful means the pith instructions will not err.\nThe perfect resolution to gain freedom\nIs a strong enchantment cast upon the demon of contentment with samsara.\nWith these four perfections is your aspiration excellent."}, {"tib": "།ཆོས་སྒོར་ཞུགས་ཀྱང་མོད་ལ་སུན་པ་དང་། །ཀུན་སློང་དུག་ཅན་འདྲེས་པའི་ཐོས་བསམ་བསྒོམ། །\nཆོས་ལས་བློ་ཉམས་བསྲུང་སྡོམ་ཁུར་དུ་སོང་། །ཆོས་བརྒྱད་དམོད་པས་ཐེག་ཆེན་བརྟུལ་ཞུགས་འཁྱམ། །\nལེགས་སྨོན་དཀའ་ཐུབ་བཤིག་པའི་རྙོག་པ་ཡིན།", "en": "To enter Dharma's door but then grow weary;\nTo study, contemplate, and meditate with poisoned motivation;\nTo have no true commitment to the Dharma,\nHolding vows as though they were a burden;\nTo wander from the practice of the Mahayana,\nCursed by eight mundane concerns:\nAll these are grievous faults whereby\nPersistence in the excellent aspiration is destroyed."}, {"tib": "།ཐད་ཀ་ཐད་ཀའི་ཉོན་མོངས་དུག་ཆེན་ལྔའི། །གཉེན་པོར་ཆེ་བ་སྐྱེས་བུ་རྣམ་གསུམ་གྱི། །\nཤིང་ལྟར་འཛེགས་ལ་དུས་བཞིར་སྐྱོ་བ་མེད། །སྣང་བ་མཐའ་དག་ཆོས་とབླ་མར་ཤར། །\nརྣམ་མཁྱེན་རྒྱུར་སོང་ལེགས་སྨོན་གྲུབ་པ་ཡིན།", "en": "Directly then for all the five great poisons of defilement\nThe powerful treatment is to ride upon the chariots of three kinds of beings.\nThroughout the four times freed from weariness,\nYou will see all things as Dharma and your very teacher.\nThese will be the causes of omniscience\nWhereby the excellent aspiration is fulfilled."}, {"tib": "།མཐོ་རིས་ཡོན་ཏན་བདུན་པའི་དགའ་བ་དང་། །དལ་བས་ཡང་དག་མཐོ་ལ་ནད་མེད་ཅིང་། །\nཏིང་ངེ་འཛིན་とརྣམ་འབྱེད་ཤེས་རབ་ལྔ། །སྔོན་ཆད་བསོད་ནམས་ལ་གུས་མངོན་རྟགས་ཡིན།", "en": "The joy of seven qualities enjoyed in higher realms,\nHigh status graced with freedom, and an absence of disease,\nConcentration and a wise discernment:\nThese five are certain signs of merit gathered in the past."}, {"tib": "།མ་བསྒོམས་པས་ནི་རིག་པ་འཇོམས་ཤིང་འོང་། །རྒྱགས་པ་རྒྱས་པས་དཔལ་འབྱོར་འཇོམས་ཤིང་འོང་། །\nརྣམ་པར་སྡང་བས་ལེགས་ཚོགས་འཇོམས་ཤིང་འོང་། །ཆགས་པས་ཡང་དག་མཐོ་བ་འཇོམས་ཤིང་འོང་།", "en": "But without training, knowledge will be brought to ruin;\nThrough swelling pride, the glory of the trainings will be brought to ruin;\nThrough hatred, every virtue will be brought to ruin;\nAnd by desire, your perfect high position will be brought to ruin."}, {"tib": "།གང་ཕྱིར་ལས་དང་ཉོན་མོངས་སྡིག་པ་ཡིན། །རྣམ་པར་དཀྲུགས་པ་མ་ཡིན་བློ་གྲོས་ནི། །\nཤེས་རབ་མཐུ་དང་སྐལ་བས་བཀོལ་ཐུབ་པ། །བསོད་ནམས་བསགས་པའི་རྟགས་སུ་རྒྱན་ལས་བཤད།", "en": "Thus to have a mind that's undisturbed\nBy karma and defilement and misdeeds;\nTo be, through strength of wisdom and good fortune, well-disposed:\nAll these are signs that merit has been gathered, as the Ornament explains."}, {"tib": "།ཆོས་ལ་སེམས་པའི་གོ་ཆ་རྣམ་པར་སྲ། །ཟབ་རྒྱས་ཆོས་ཁམས་རྒྱ་མཚོ་དབང་པོའི་མཚོན། །\nབདུད་བར་བློ་ཡི་སྤངས་སམ་མི་སྤངས་ཀུན། །སྙིང་སྟོབས་གཉེན་པོའི་དབང་དུ་གཏོང་བ་རྣམས། །\nལམ་མི་འཆག་པར་ཕྱིན་དྲུག་སྟེང་དུ་འགྲོ།", "en": "With firm defense of their commitment to the Dharma,\nThose who put forth strong determination\n(Cure for any doubt that they might bend strong Indra's bow—\nThe practice of the ocean of the Dharma deep and vast)\nWill walk unerring on the paramita path."}, {"tib": "།དེ་ཡི་མཐུན་ཕྱོགས་ཡན་ལག་བདུན་པ་དང་། །ཆུ་གཏོར་ལ་སོགས་བསག་སྦྱངས་མཐའ་དག་ཡིན། །\nམི་མཐུན་ཕྱོགས་ཀྱི་དེ་ལ་མི་བརྫི་ཞིང་། །ལམ་དུ་འགྲོ་བ་བསོད་ནམས་དག་ལ་བསྟེན། །\nའདི་ནི་སྐྱེས་བུ་ཆེན་པོའི་ལམ་སྟེགས་ཡིན༑", "en": "All acts of cleansing and all gatherings of merit\nLike offering of the Seven Branches, water tormas, and the rest,\nAre in harmony with such a path.\nAdversity will not bring low the ones who practice in this way;\nThey tread the path relying on their merit.\nThis then is the mainstay of the path of beings of the greatest scope."}],
      6: [{"tib": "།།འཇིགས་པ་གསུམ་གྱི་ཆུ་གཏེར་འཁྲུགས་པ་ལ༑ །སྐྱབས་སུ་འོས་པར་ཡིད་ཆེས་སྲོག་བརྟན་པའི། །\nདཀོན་ཅོག་གསུམ་གྱི་གྲགས་པའི་གདུགས་དཀར་ནི། །བསྟན་ལ་འཇུག་པའི་ཐོག་མ་ཉིད་དུ་འཛིན།", "en": "In the troubled ocean of three fears,\nThe worthy and unfailing refuge for the faithful\nIs the Triple Gem renowned as a white parasol.\nOn entering the Teaching, we must first have trust in it."}, {"tib": "།ཐར་པར་འགྲོ་བའི་ལམ་དང་ཡོན་ཏན་གྱི། །རྟེན་དང་སྣོད་དུ་དམ་བཅའ་མི་བསླུ་བ། །\nསྐྱབས་སུ་འགྲོ་བ་ཉིད་དེ་དེའི་སྔོན་དུ། །སྟོན་དང་བསྟན་པའི་ཡོན་ཏན་ཤེས་པར་གཅེས།", "en": "Undeceiving refuge is itself the pledge to be\nThe basis of the path that leads to freedom and the vessel for its qualities.\nBefore embarking on it, therefore, we must understand\nThe qualities of both the Teacher and his Teaching."}, {"tib": "།ཆོས་རྣམས་ཀུན་གྱི་རྩ་བ་དད་པ་ནི། །སྐྱེས་བུའི་སེམས་ལ་ལུང་དུ་མ་བསྟན་པ། །\nསྟོན་པ་མཐོང་དང་སྡེ་སྣོད་བཀླག་པ་ཡི། །མོད་ལ་བ་སྤུའི་འཁྲི་ཤིང་སློང་བཞིན་ལྡང་༑", "en": "The root of every good is faith itself,\nAnd this is unpredictable in beings' minds.\nOn meeting with a Teacher or on reading in the texts,\nIt floods the mind, the hairs upon one's flesh stand up."}, {"tib": "།དེ་ལ་དང་བའི་དད་པ་དང་པོ་སྟེ། །དེ་བཞིན་འདོད་དང་ཡིད་ཆེས་ཕྱིར་མི་ལྡོག །\nརྣམ་པ་བཞི་ལས་སྐྱབས་འགྲོའི་གནས་སྐབས་འདིར། །སྲོག་ལ་བབས་ཀྱང་ཕྱིར་མི་ལྡོག་པ་དགོས།", "en": "This first is \"vivid faith.\" It's followed then by faith that's\n\"Yearning,\" \"confident,\" and \"irreversible.\"\nOf these four kinds, when taking refuge,\nFaith is needed that, at cost of life and limb, is irreversible."}, {"tib": "།དད་པ་སྐྱེ་བའི་རྒྱུ་ནི་བཞི་ཡིན་ཏེ། །དམ་པ་བསྟེན་དང་དམ་པའི་གྲོགས་དང་འགྲོགས་། །\nདཀོན་མཆོག་རྗེས་སུ་དྲན་དང་འཁོར་བ་ལ་། །སྙིང་པོ་མེད་པའི་ཉེས་དམིགས་བསམ་ལས་སྐྱེ་།", "en": "Four causes are there for the birth of faith:\nFrequenting holy beings, keeping company with wholesome friends,\nRemembering the Triple Gem,\nAnd thinking of the miseries of meaningless samsara:\nThence it is that faith comes into being."}, {"tib": "།ཐུབ་པ་རྣམས་ཀྱི་ཡོན་ཏན་མཐའ་ཡས་ཏེ་། །སྤངས་པ་གཉིས་ཀྱིས་ཉོན་ཤེས་སྒྲིབ་པ་བཅོམ་། །\nསྤྱན་དང་མངོན་ཤེས་དབང་བཅུ་གཟུངས་ཀྱི་སྒོ་། །སྟོབས་བཅུ་མི་འཇིགས་བཞི་དང་སོ་སོ་རིག། །\nམ་འདྲེས་བཅོ་བརྒྱད་རྫོགས་པ་སངས་རྒྱས་ཏེ་། །རྣམ་པ་ཀུན་གྱི་མཆོག་ལྡན་ཆོས་ཀྱི་སྐུ་། །\nས་བཅུའི་འཁོར་ལ་ལོངས་སྤྱོད་རྫོགས་པར་སྟོན་།", "en": "Boundless are the qualities of buddhahood\nWhen two eliminations are victorious\nOver veils emotional and cognitive.\nThe eyes of vision, knowledge preternatural,\nTen powers, four dharanis, and ten strengths,\nFour fearlessnesses, perfect knowledge,\nEighteen distinctive qualities:\nBuddhahood is all of these complete.\nBuddha is the Dharmakaya\nEndowed with supreme qualities,\nRevealed as the Sambhogakaya\nTo a retinue of tenth-ground Bodhisattvas."}, {"tib": "།ཆོས་ནི་བསོད་ནམས་ལམ་དང་མྱ་ངན་འདའ། །བརྗོད་བྱའི་དོན་དེ་དེ་ལའང་འབྲས་བུ་དང་། །\nབྱ་བའི་རང་བཞིན་གཉིས་སུ་གནས་པ་ལ་། །བདེན་གཉིས་ཞེས་བྱ་འགོག་ལམ་རྣམ་གཉིས་ཡིན་། །\nབརྗོད་བྱ་རྗོད་བྱེད་ལ་ལྟོས་ལུང་རྟོགས་ཆོས་།", "en": "The Dharma is nirvana, path, and virtue: these are what it teaches.\nIt is both fruit and all the acts whereby the fruit is gained.\nIt therefore has two natures, called two truths:\nCessation and the Path.\nIn terms of exposition and of that which is expounded,\nThere is Dharma of transmission and of realization."}, {"tib": "།ལུང་ནི་གསུང་རབ་ཡན་ལག་བཅུ་གཉིས་དང་། །གཉེན་པོའི་སྒོ་ནས་སྡེ་སྣོད་གསུམ་དུ་ཤར་། །\nཐབས་ཀྱི་ཆེ་བ་རིག་འཛིན་སྡེ་སྣོད་ཡིན་། །གླེགས་བམ་ཡི་གེར་གནས་པ་དམ་ཚིག་རྟེན་།", "en": "The sacred writings in twelve branches are the Dharma of transmission,\nWhich, arranged as antidotes, become the Three Collections,\nAnd also the Collection of Vidyadharas, endowed with greater means.\nAnd since the scriptures all consist of syllables,\nThe latter are the basis of our pledges."}, {"tib": "།རྟོགས་པའི་ཆོས་ནི་དྲན་པ་ཉེར་བཞག་ནས་། །རིམ་བཞིན་ལམ་ལྔའི་ཡོན་ཏན་མཐའ་དག་དང་༑ །\nའཕགས་པའི་སྤངས་རྟོགས་ཡེ་ཤེས་སྙིང་པོ་ཅན་། །བསྐྱེད་དང་རྫོགས་པ་གཟུངས་དང་ཟད་པར་དང་། །\nསློབ་ལམ་བཞི་དང་མི་སློབ་ལམ་གྱི་དངོས་། །རྒྱུ་ཡི་ས་བཅུ་འབྲས་བུའི་བཅུ་གསུམ་སོགས་། །\nརྡོ་རྗེ་ཐེག་པའི་རིགས་དབྱེ་དཔག་ཏུ་མེད་། །གང་གི་ཡེ་ཤེས་བརྒྱུད་ལ་བརྟེན་པའོ།", "en": "The Dharma, then, of realization\nHolds within it, step by step, the qualities contained in the five paths\nBeginning with the four close mindfulnesses.\nIt is the primal wisdom of elimination and realization\nPossessed by Noble Beings; it is the buddha nature.\nIt is the generation and perfection stages,\nThe dharanis and unbounded ayatanas:\nAll the contents of four paths of learning\nAnd the path of no more learning.\nThis Dharma therefore is the primal wisdom\nPresent in the minds of those abiding\nOn the ten grounds of the causal vehicle,\nAnd all the boundless grades of realization of the Vajrayana:\nThe thirteen levels of fruition and the rest."}, {"tib": "།དགེ་འདུན་ངོ་བོ་རིག་གྲོལ་གཉིས་ལྡན་ཏེ་། །ཉན་རང་ཞུགས་གནས་སྐྱེས་བུ་ཟུང་བཞིའམ། །\nཡ་བརྒྱད་རྒྱལ་སྲས་སར་གནས་མཐའ་དག་པའི་། །རང་སའི་ཡོན་ཏན་བརྗོད་ཀྱིས་མི་ལང་ཡང་།", "en": "The Sangha is, in essence, those\nWho are both wise and free.\nThey are the Shravakas and Pratyekabuddhas\nAccording as they enter and abide—\nFour pairs, eight kinds in all.\nWith these are all the Bodhisattvas, Buddha's heirs,\nWho dwell with qualities ineffable\nUpon the grounds of realization."}, {"tib": "།ལམ་དང་སྐྱོབ་པའི་ངོ་བོ་དམ་པའི་ཆོས་༑ །ཆོས་ནི་སྟོན་པ་ལས་བྱུང་དེ་བསྒྲུབ་པའི་། །\nགྲོགས་སམ་བསླབ་པའི་རྟེན་གནས་དགེ་འདུན་ཕྱིར་། །དཀོན་མཆོག་གསུམ་ཞེས་སྐྱབས་ཀྱི་ཡུལ་དུ་གྲུབ་།", "en": "Our path and our protection is the sacred Dharma—\nThe Dharma that from Buddha has arisen.\nThe Sangha is composed of those who dwell within the trainings\nOr assist us in achieving them,\nWherefore this Triple Gem is object of our refuge."}, {"tib": "།དེ་ལ་རྒྱུ་དང་འབྲས་བུའི་སྐྱབས་འགྲོ་ཡི་། །དམ་བཅའ་གཉིས་ལས་དུས་གཞན་འགྲུབ་འདོད་རྒྱུ་། །\nདེ་ལྟར་གྲུབ་པ་རང་སེམས་འབྲས་བུའི་སྐྱབས་། །རྡོ་རྗེའི་ཐེག་པ་དག་གིས་ཁྱད་ཆོས་ཡིན་། །\nརྒྱུ་ཡི་ཡུལ་ནི་དཀོན་མཆོག་རྣམ་པ་གསུམ་། །སྔགས་སུ་དེ་ཡི་ངོ་བོ་བླ་མར་འདུས་།", "en": "Of the vows of refuge, causal and resultant,\nThe first is aspiration for attainment at some later time.\nResultant refuge is the mind itself already now accomplished.\nThis refuge is the special feature of the Vajrayana.\nThe object of the causal refuge is the Triple Gem,\nWhich, in the Mantrayana, is embodied in the lama."}, {"tib": "།ཉི་ཚེ་མཆོག་དང་བླ་ན་མེད་པ་ཡི་། །ཀུན་སློང་གསུམ་ལས་སྐྱེས་བུ་ཆུང་ངུ་ནི་༑ །\nངན་འགྲོ་ལ་འཇིགས་མངོན་མཐོའི་བར་དུ་འགྲོ་།", "en": "Three motivations: narrow, great, and unsurpassed\nDefine three kinds of beings.\nThose of little scope are frightened of the lower realms;\nThey can progress as far as higher realms."}, {"tib": "།འབྲིང་གཉིས་སྲིད་པས་འཇིགས་ནས་ཐར་པ་གཉེར་། །གནས་སྐབས་ཇི་སྲིད་འཚོ་དང་མཐར་ཐུག་ནི་། །\nཉན་རང་འབྲས་བུ་ཐོབ་པའི་བར་དུ་འགྲོ་།", "en": "Those of middle scope seek freedom, fearful of samsara.\nThey take refuge for their life's duration\nAnd ultimately till they gain the goal pursued\nBy both the Shravakas and the Pratyekabuddhas."}, {"tib": "།ཆེན་པོ་གཞན་དོན་སྤངས་པའི་ཞི་བདེས་འཇིགས་། །འཁོར་བ་དབུགས་འབྱིན་ཆེན་པོ་ལ་བསྒྲལ་ཕྱིར་། །\nབྱང་ཆུབ་པར་འགྲོ་དེ་ཡང་རང་གི་སེམས་། །བྲལ་ཐོབ་བསླུ་བ་སྤངས་པ་འབྲས་བུའི་སྐྱབས་།", "en": "Great beings fear the blissful peace that overlooks the good of others.\nThat they might free them from samsara in the state of great relief,\nUntil enlightenment is gained, they take resultant refuge in the mind itself,\nWherein there are no false phenomena either to be spurned or gained."}, {"tib": "།ལམ་དུས་སངས་རྒྱས་རྣམས་ནི་སེམས་ཅན་གྱི་། །ཁམས་ལ་ཐུགས་རྗེ་དུས་ལས་ཡོལ་བ་མེད་། །\nབ་སྤུའི་ཁུང་བུ་གཅིག་གི་ཡོན་ཏན་ཀྱང་། །མཐའ་དག་བརྗོད་པས་མ་ཐུག་ནམ་མཁའ་ལྡིང་། །\nབྱ་ལམ་གྲུབ་མཐའ་མ་གཏུགས་སླར་འབབ་འདྲ།", "en": "The compassion of the Buddhas is at all times opportune\nFor those who wander on the paths.\nAll discourse on the qualities of just a single of a Buddha's pores\nCan never have an end.\nOne would be like a bird\nThat fails to reach the limits of the sky and comes to earth again."}, {"tib": "།འདི་ན་འཁོར་བའི་འཁོར་ལོར་ཡང་ནས་ཡང་། །བརྒྱུད་དེ་ལས་ངན་བསགས་པའི་མཚང་ཅན་རྣམས་༑ །\nའཁོར་ལོས་སྒྱུར་དང་དབང་ཕྱུག་ལ་སོགས་པ་། །སྐྱབས་གཞན་གང་གིས་བསླུ་བར་མཐོང་ནས་ནི་། །\nའཇིགས་དང་དད་དང་སྙིང་རྗེ་རྣམ་གསུམ་གྱི་། །གཞན་དོན་སེམས་པ་སྐྱེས་བུ་ཆེན་པོའི་བློས་། །\nདཀོན་ཅོག་རྗེས་སུ་དྲན་པས་སྐྱབས་སུ་འགྲོ་།", "en": "Ishvara, the Chakravartins, and the rest,\nWith hidden stores of faults (the evil actions that they have amassed),\nTurn constantly upon samsara's wheel.\nPerceiving them to be deceptive refuges,\nWe should, with fear and faith and with compassion,\nAnd with the attitude of greatest scope—concern for others' good—\nBe mindful of the Triple Gem and thus take refuge."}, {"tib": "།ཇི་ལྟར་ནམ་མཁའ་ཚད་བཟུང་མེད་པ་ལྟར་། །དཀོན་ཅོག་ལ་བརྟེན་དཀར་ནག་ལས་འབྲས་ཀྱི་། །\nཕ་མཐའ་མི་དཔོགས་སྐྱབས་སོང་གཟུགས་གྱུར་ན་། །ནམ་མཁའི་སྣོད་ཀྱིས་བརྟེན་པར་ནུས་མ་ཡིན་།", "en": "Just as the extent of space cannot be sounded,\nLikewise fruits of actions white or black,\nRelated to the Triple Gem, are measureless.\nIf taking refuge could assume a form,\nThe whole of space could not encompass it."}, {"tib": "།ནང་པའི་ཁྱུར་འགྲོ་སྡོམ་པ་མཐའ་དག་བརྟེན་། །སྡིག་སྒྲིབ་འཛད་ཅིང་གནོད་པའི་ཕྱོགས་ཀྱིས་སྤོང་༑ །\nངན་འགྲོའི་གཡང་བསྲུང་དཀོན་མཆོག་གསུམ་མི་འབྲལ། །ཕུན་སུམ་ཚོགས་པ་མཐོང་པའི་ཆོས་ལ་འོངས་། །\nབསོད་ནམས་ཚོགས་རྫོགས་གཟུགས་ཀྱི་སྐུ་གཉིས་འགྲུབ་།", "en": "Refuge is the entrance to the Buddhist fold and is the basis of all vows.\nIt will put an end to sins and obscurations, driving perils far away.\nIt will guard us from the chasms of the lower realms\nAnd keep us in the presence of the Triple Gem;\nIn life we'll taste of every excellence.\nOur stores of merit will be filled,\nWhereby the twofold Rupakaya is attained."}, {"tib": "།འབྲས་བུའི་སྐྱབས་འགྲོ་བསླུ་བ་མེད་པ་ནི་། །རྣམ་ཐར་སྒོ་གསུམ་སྨོན་པ་མེད་པའི་དབྱིངས་། །\nགནས་ལུགས་རྡོ་རྗེ་འདུས་མ་བྱས་པ་ཡིན་། །ཡེ་ཤེས་ཚོགས་རྫོགས་དག་པ་གཉིས་ལྡན་འཐོབ་༑", "en": "Resultant refuge, undeceiving, is the threefold door to liberation.\nIt is the ultimate expanse transcending all expectancy:\nThe nature of the mind, the uncompounded vajra.\nIt is the perfect gathering of wisdom\nAnd attainment of the twofold purity."}, {"tib": "།བསླབ་བྱ་རྒྱུ་འབྲས་གཉིས་ལས་དང་པོ་ནི་། །མངའ་རིས་བྱ་དགའི་སླད་དུ་སྨོས་ཅི་དགོས་། །\nསྲོག་གི་ཕྱིར་ཡང་དཀོན་མཆོག་གཏོང་བ་མིན་། །དེ་ཡི་ངོ་བོ་བླ་མར་སྐྱབས་སོང་ནས་༑ །\nདམ་པ་བསླུ་དང་མི་སྙན་སྒྲོག་པ་སྤང་།", "en": "There are precepts for both causal and resultant refuge.\nAccording to the first, the Triple Gem is not to be abandoned\nEven at the cost of life or limb—\nNo need to speak of doing so for sake of power or gain.\nThe lama is himself the essence of the Triple Gem\nAnd having taken refuge in him,\nWe should spurn pretense and all improper talk."}, {"tib": "།དེ་བཞིན་སངས་རྒྱས་ཆོས་དང་དགེ་འདུན་ལ་། །སྐྱབས་སུ་སོང་ནས་རིམ་བཞིན་བདག་ཉིད་ནི་། །\nའཁོར་བར་འཁོར་བའི་ལྷ་ལ་ཕྱག་མི་འཚལ། །གཞན་ལ་མི་འཚེ་མུ་སྟེགས་ཅན་མི་འགྲོགས་། །\nདཀོན་མཆོག་རྟེན་ལ་དད་པས་བསྙེན་བཀུར་ཞིང་། །ཉིན་མཚན་བརྗེད་པ་སྤངས་ནས་སྐྱབས་སུ་འགྲོ་།", "en": "When refuge has been taken in the Buddha, Dharma, Sangha,\nRespectively, no honor should be paid to gods\nWho, like us, circle in samsara;\nWe should do no hurt to others, nor befriend those hostile to the Dharma;\nWith faith we should show reverence to the symbols of the Triple Gem,\nAnd night and day, without forgetting, we should go to them for refuge."}, {"tib": "།འབྲས་བུའི་བསླབ་བྱ་ཐུབ་པ་ཆོས་ཀྱི་སྐུ་། །བྲལ་ཐོབ་སྤངས་པའི་དབྱིངས་ལ་བྱང་ཆུབ་པས། །\nསྐྱོབ་དང་བསྐྱབ་བྱར་མི་འཛིན་ཐ་སྙད་ལས་། །འདས་ཕྱིར་གཏོང་རྒྱུའང་བཏགས་པ་བླ་དྭགས་ཡིན་།", "en": "Regarding precepts of resultant refuge,\nSince Buddha is the Dharmakaya,\nAnd buddhahood occurs in the expanse\nWhere there is no rejecting or adopting,\nThere is no protector, no protected.\nResultant refuge thus surpasses\nRefuge understood conventionally.\nTo say that it can be abandoned is just empty words."}, {"tib": "།རྒྱུ་ཡི་གཏོང་མཚམས་སྐྱབས་འགྲོ་མཚན་ཉིད་པ་། །འགྲོ་བའི་ཡུལ་ལ་ལོག་ལྟ་སྐྱེས་པས་གཏོང་། །\nབསླབ་བྱ་ཉམས་ན་དམན་པར་ལྟུང་བའི་ཕྱིར་། །རྨ་ཡི་བག་བཞིན་བསྒྲིམས་ཏེ་བསྲུང་བར་བྱ།", "en": "Causal refuge is abandoned when,\nThrough holding to wrong views,\nThe true, authentic refuge is forsaken.\nThe spoiling of the training leads to lower states.\nWe should keep the precepts therefore as we guard our wounds."}, {"tib": "།ལས་ཀྱི་ཅེ་སྤྱང་གདུག་པས་སྐབས་བཙལ་རྣམས་། །ཚིག་དོན་འཛོལ་བའི་ཡིད་གཉིས་སྣོད་ངན་དུ་། །\nབསླུ་བ་མེད་པའི་ངེས་ཤེས་བྲི་བའི་རྟགས། །ཡི་དྭགས་ལ་བསྟེན་ཚེ་འདི་ཉིད་ལ་ཉམས།", "en": "Some people are like foxes, filled with evil instincts.\nUnworthy vessels, of two minds, their acts belie their words.\nThey show a weak conviction in the refuge that is undeceiving;\nThey have recourse to spirits; in this life they come to ruin."}, {"tib": "།འདི་ན་ས་དང་ནམ་མཁའ་རི་རབ་རྣམས་། །ཡིན་མིན་གནས་འགྱུར་ཉི་ཟླ་ཐང་ལྷུང་སྲིད་། །\nདཀོན་ཅོག་གསུམ་གྱི་བསླུ་བ་མི་སྲིད་པའི་། །ངེས་ཤེས་བརྟན་པ་ཀུན་ཏུ་དོན་ཡོད་ཡིན་།", "en": "The earth and sky and Sumeru,\nAbove, below, might change their place;\nThe sun and moon might fall down to the ground.\nBut never could the Triple Gem deceive and fail.\nTo be convinced of this is of the highest moment."}, {"tib": "།རྨི་ལམ་ནའང་དཀོན་ཅོག་མཐོང་པ་དང་། །བག་ཡོད་དྲན་ཞིང་ཡོན་ཏན་ཀུན་གྱིས་འབྱོར་། །\nཚེ་རབས་དྲན་ཞིང་བར་དོ་བགྲོད་པར་སླ། །ལུས་ཅན་ཀུན་གྱི་དཔུང་དང་གཉེན་དུ་འགྱུར་།", "en": "For then we will behold the Three Jewels even in our dreams;\nAnd rich in perfect qualities through mindfulness and vigilance,\nWe will recall our former lives and cross the bardo easily.\nWe will be guardians and friends of all embodied beings."}],
      7: [{"tib": "།།ཐེག་དམན་རྫིང་བུར་བྱང་ཆུབ་སེམས་ཀྱི་ཁམས། །རིགས་ལས་ཉམས་པའི་ཉན་རང་སྐྱེས་བུའི་སེམས། །\nསྟོང་ཉིད་སྙིང་རྗེའི་དེད་དཔོན་མཐུས་སད་ནས། །ཐེག་ཆེན་རྒྱ་མཚོ་ཀུན་མཁྱེན་གླིང་དུ་འགྲོ།", "en": "In the pool of Hinayana (The minds of Shravakas and of Pratyekabuddhas),\nThe element of bodhichitta lies unstirred.\nIt is aroused by those who teach them voidness and compassion.\nAnd setting sail upon the ocean of the Mahayana,\nThey voyage to the island of omniscience."}, {"tib": "།སྦྱིན་སོགས་ཕ་རོལ་ཕྱིན་པ་རྣམ་པ་ལྔའི་། །ངོ་བོ་ལུང་དུ་མ་བསྟན་ལྕགས་ཁམས་སུ་། །\nརྣམ་པར་ཉམས་པ་ཐབས་ཤེས་གསེར་འགྱུར་རྩིས་། །ཐེབས་པའི་མོད་ལ་རིན་ཐང་ཆེན་པོར་བྱེད་།", "en": "Giving, discipline and patience, diligence and concentration\nIn themselves are not regarded as the first five paramitas.\nBut if a lowly thing is touched by alchemy of means and wisdom,\nIt is, like iron, transmuted into something of great worth."}, {"tib": "།གང་ཕྱིར་སྙིང་རྗེའི་ཐབས་དང་སྟོང་ཉིད་ཀྱི་། །ཤེས་རབ་ཟུང་དུ་འཇུག་པའི་བྱང་ཆུབ་སེམས་། །\nསྦྱོར་བ་ཚད་མེད་བཞི་པའི་ས་མཁན་གྱི། །སྨོན་འཇུག་གཉིས་དང་བསླབ་བྱ་སློབས་ལས་སྐྱེ༑", "en": "Wherefore true bodhichitta is the fusion\nOf compassionate means and wisdom that cognizes emptiness.\nThe four unbounded attitudes prepare and lead to it;\nIt comes from cultivating bodhichitta both in aspiration and in action,\nAnd from training in the precepts."}, {"tib": "།བྱམས་པའི་ངོ་བོ་གཞན་བདེ་འདོད་པ་ཡིན་། །སྡུག་པའི་མ་ཡིས་བུ་ལ་ཇི་བཞིན་དུ་། །\nལུས་དང་ལོངས་སྤྱོད་དགེ་བ་ཀུན་སྤུངས་ནས་། །གཞན་ལ་ཕན་འདོགས་གནོད་པ་བཟོད་ལ་བསླབ་༑", "en": "Love means wishing for the happiness of others.\nLike a loving mother cherishing her child,\nOne's body, wealth and virtue all amassed one gives for others' benefit,\nWhile training to endure the harms that they inflict."}, {"tib": "།སྙིང་རྗེའི་ངོ་བོ་གཞན་གྱི་སྡུག་བསྔལ་ལ་། །བཟོད་མི་ཕོད་པའི་སེམས་སྟོབས་དྲག་པོ་དང་། །\nའགྲོ་དྲུག་མཐའ་དག་སྡུག་བསྔལ་རྒྱུ་འབྲས་ཀྱི། །མཐའ་ལ་གཅུར་མཐོང་མཆི་མ་སློང་བ་ཡིན་།", "en": "Compassion is a powerful state of mind—\nAn inability to tolerate the fact that others suffer.\nBeings in the six realms are entrapped by sorrow and its cause,\nAnd seeing this brings tears to one's eyes."}, {"tib": "།དགའ་བའི་ངོ་བོ་གཞན་དག་ཕུན་ཚོགས་ལ་། །སྤྲོ་བའི་སེམས་འཇུག་ཀུན་ལ་ལེགས་སྨོན་བསྒོམ་། །\nརང་རང་མཐུ་ཡིས་ཐོབ་ལ་དགའ་བྱེད་ཅིང་༑ །ཕྱིན་ཆད་དེ་དང་མི་འབྲལ་སྨོན་པ་ཡིན་།", "en": "Joy is to delight in other's pleasure and success;\nIt is to cultivate the wish that all have happiness.\nIt is a joy one feels when they achieve it for themselves\nAnd is the wish that they should never be deprived of it."}, {"tib": "།བཏང་སྙོམས་ངོ་བོ་བྱམས་སྡང་འདྲལ་བ་སྟེ་། །ཕྱོགས་དང་རིས་ཆད་མཉམ་པ་ཉིད་བརྡལ་ནས་། །\nདགྲ་དང་གཉེན་དང་བར་མའི་འདུ་ཤེས་གསུམ་། །ཕན་འདོགས་ཡུལ་ལ་མཉམ་པར་རབ་ཏུ་སྤྱད་། །\nརྣམ་པའི་དམིགས་བཅས་དམིགས་མེད་རྩི་ཡིས་སྦྱར་།", "en": "Impartiality is freedom from attachment and hostility,\nWhen sides and factions are all seen as equal,\nWhen enemy and friend and neither—\nAll are treated with an evenhanded kindness.\nWe should practice these four attitudes remembering\nThat all is without true existence."}, {"tib": "།འདོད་པའི་བྱམས་པ་སེར་སྣའི་སྙིང་རྗེ་དང་། །ང་རྒྱལ་དགའ་བ་གཏི་མུག་བཏང་སྙོམས་དང་། །\nཐར་པའི་ལམ་མིན་ཚངས་པའི་གནས་པ་བཞིའི་། །ཕྱོགས་དང་ཉེ་བ་དམིགས་བཅས་རྣམ་པར་སྤངས།", "en": "But love that is desire, compassion that is greed,\nProud inflated joy and ignorant indifference—\nThese are not the path to freedom but resemble Brahma's four abidings.\nStained with partiality and clinging, they should be abandoned."}, {"tib": "།འདི་ན་ཞི་བའི་ལམ་དང་འབྲེལ་པ་ཡི་། །དམིགས་པའི་ཡུལ་ནི་སེམས་ཅན་ཐམས་ཅད་ཀྱང་། །\nསྣང་ལ་རང་བཞིན་མེད་པའི་ཆོས་ཉིད་ཀྱི་། །རྣམ་པའི་བསྒོམ་ཚུལ་སྟོབས་སུ་གྱུར་པ་ལས་། །\nབྱང་ཆུབ་སེམས་གཉིས་སྐྱེ་བའི་རྒྱུར་འགྲོ་བས། །ཁྱད་ཆོས་ལྡན་པའི་ཚད་མེད་བཞི་རུ་འདོེད་།", "en": "But when they are connected with the path that leads to Peace,\nThese practices encompass everything that lives,\nWho, though without intrinsic being, nonetheless appear.\nThese trainings, when they gain in strength,\nBecome the cause of the two bodhichittas.\nTherefore they are called\nThe four extraordinary and boundless attitudes."}, {"tib": "།སྒོམ་ཚུལ་གོ་རིམ་ཅན་དང་ངེས་པ་མེད་། །དམིགས་པའི་ཡུལ་གང་སྐྱེ་བར་སླ་ལ་གཏད་། །\nའོན་ཀྱང་བྱམས་བསྒོམས་ཆགས་པའི་རྟེན་གྱུར་ན་། །ཉེ་རིང་བྲལ་བའི་བཏང་སྙོམས་བསྒོམ་པར་སྤོ་།", "en": "They may be meditated on in sequence or in any order,\nFocused on the things with which they're generated easily.\nYet if meditation upon love inflames desire,\nAttention should be given to impartiality,\nWhere beings are not seen as close or distant."}, {"tib": "།དེ་ཉིད་རྨོངས་ནས་ལུང་མ་བསྟན་གྱུར་ན་། །སྙིང་རྗེར་སྤོས་པས་སྡུག་བསྔལ་རྒྱུ་འབྲས་འགོག་། །\nསྙིང་རྗེ་སྟོབས་ཞན་རིས་སུ་ཆད་པ་ན་། །དགའ་བར་སྤོས་པས་དམན་སེམས་སྐྱེ་བ་འགོག་། །\nདགའ་བས་སེམས་རྒོད་སྤྲོས་པའི་ཡུལ་འགྱུར་ན་། །བྱམས་སོགས་མཐའ་དབུས་བརྗེས་ནས་སྤེལ་མར་བསྒོམ༑", "en": "And if the mind becomes indifferent and dull,\nThis is stopped by switching to compassion and the cause and fruit of pain.\nIf then compassion sinks toward discouragement,\nBy focusing on joy, depression is dispelled.\nBut if through joy the mind is wild and scattered,\nWe should meditate on love and so forth, mixing thus the order."}, {"tib": "།དེ་ལྟར་བསྒོམས་པས་རྣམ་སྨིན་མངོན་པར་མཐོ་། །འདོད་པར་ལྷ་མིའི་ལུས་དང་ངེས་ལེགས་གཉིས། །\nརྒྱུ་མཐུན་བྱེད་པ་དེ་འདྲ་མྱོང་བས་ནི་། །མི་མཐུན་ཕྱོགས་དང་བྲལ་ཞིང་བདེ་བ་འཐོབ་།", "en": "By meditating in this way we will, as ripened fruit,\nGain high rebirth among desire realm gods or humankind—\nAnd then enlightenment itself.\nAccording to effects resembling their causes,\nWe will actively continue in the practice\nAnd experience happiness untroubled by adversity."}, {"tib": "།དབང་གིས་ཡིད་འོང་བདེ་དགའི་ཡུལ་ལ་སྤྱོེད་། །བྱེད་པ་བཞི་པོ་སྟོབས་སུ་གྱུར་པ་ཡི་། །\nདོན་གཉིས་འབྱོར་པའི་ཡོན་ཏན་འཐོབ་འགྱུར་ཏེ་།", "en": "Through the conditioning effect,\nWe will be happy in a pleasant dwelling place,\nAnd through the increasing fruit,\nThe strength of these four attitudes will prosper;\nAnd, related to the twofold goal,\nWill every virtuous quality be gained."}, {"tib": "།བྱམས་པ་འབྱོངས་པས་འགྲོ་ལ་བུ་ལྟར་བརྩེ་། །ཞེ་སྡང་མེད་ཅིང་གཞན་གྱི་ཡིད་དུ་འོང་། །\nབྱམས་པའི་ངོ་བོ་སྟོང་ལ་རང་བཞིན་མེད་། །མེ་ལོང་ཡེ་ཤེས་ལོངས་སྤྱོད་རྫོགས་པ་འཐོབ་།", "en": "When love is mastered, we will care for beings\nAs though they were our children.\nBeing free of angry hate, we will be prized by others.\nLove, by nature empty, free of an intrinsic being,\nWill lead to the accomplishment of mirrorlike wisdom and Sambhogakaya."}, {"tib": "།སྙིང་རྗེ་འབྱོངས་པས་གཞན་གྱི་སྡུག་བསྔལ་ཀྱང་། །བདག་གི་ཁུར་འགྲོ་འཚེ་བ་བྲལ་པའི་སེམས་། །\nའདོད་ཆགས་དང་བྲལ་སྟོང་ཉིད་སྙིང་རྗེར་འབྲེལ་། །སོར་རྟོག་ཡེ་ཤེས་ཆོས་ཀྱི་སྐུ་རུ་འགྲུབ་༑", "en": "When of compassion we have then the mastery,\nOthers' sorrow we will shoulder as our burden,\nOur minds released from enmity and craving.\nCompassion joined with emptiness will lead\nTo realization of the all-discerning wisdom and the Dharmakaya."}, {"tib": "།དགའ་བ་འབྱོངས་པས་ཕྲག་དོག་རྩ་བ་ཆོད་། །འབྱོར་པ་བརྟན་ཅིང་ཞི་བདེ་རྒྱུན་མི་འཆད་། །\nབསམ་གཏན་དགའ་བ་དམིགས་པ་མེད་པ་དང་། །བྱ་གྲུབ་ཡེ་ཤེས་སྤྲུལ་པའི་སྐུ་མཆོག་ཐོབ་།", "en": "When joy is mastered, envy's root is severed.\nFirm will be our wealth of wholesome qualities.\nOur calm serenity of mind will be unbroken.\nOur joyful concentration will be free from every concept;\nWe will gain the wisdom all-accomplishing and the supreme Nirmanakaya."}, {"tib": "།བཏང་སྙོམས་འབྱོངས་པས་བདག་གཞན་དགྲ་གཉེན་མཉམ་། །ང་རྒྱལ་མེད་ཅིང་ཟབ་ཞིའི་རྟོགས་པ་སྐྱེ་། །\nརྨོངས་པ་མེད་ཅིང་ཆོས་དབྱིངས་ཡེ་ཤེས་དང་། །ངོ་བོ་ཉིད་སྐུ་མངོན་དུ་འཐོབ་པར་འགྱུར་།", "en": "When impartiality is mastered,\nSelf and other, friend and foe are equal.\nPride will have no place and realization deep and peaceful will arise.\nAnd, freed from all confusion, we will truly gain\nThe primal wisdom of the dharmadhatu and the Svabhavikakaya."}, {"tib": "།དེ་ལྟའི་ཚད་མེད་བཞི་ཡི་ཡོན་ཏན་ནི་། །རྒྱུ་འབྲས་ཤིན་ཏུ་མཐའ་ཡས་བསླུ་བ་མེད་། །\nལམ་ངན་གཞན་གྱི་གྲུབ་མཐའ་སྲིད་པའི་རྒྱུ་། །སྟོང་ཉིད་སྙིང་རྗེར་འགལ་ལ་མི་བསྟེན་པར། །\nཐར་པ་དྲི་མེད་རྒྱལ་སྲས་དམ་པའི་ལམ་། །རྙོག་པ་ཞི་བའི་དགེ་ལ་གོམས་འཚོལ་ལོ།", "en": "And so the qualities of the four boundless attitudes,\nIn cause and fruit, are infinite, infallible.\nThe teachings of false paths are causes of samsara;\nThey contradict the teachings of compassion joined with emptiness.\nLet us not attend to them, I beg, but let us now pursue\nThe sacred path of Bodhisattvas leading to unsullied liberation.\nLet us train ourselves in virtue that destroys impurity."}],
      8: [{"tib": "།།རྙེད་པ་གང་གི་དོན་ལ་ཡོན་གྱི་མཆོག །ཚད་མེད་རྣམ་བཞིའི་ཐོབ་པའི་བྱང་ཆུབ་སེམས།\n།སྨོན་འཇུག་ཤིང་རྟའི་སྒྱུ་ཐབས་ལ་དྲངས་པས༑ །ཞི་བདེའི་ལྟ་བ་ངན་པ་ཉམས་པར་བྱེད།", "en": "For buddhahood, the goal to be achieved,\nThe supreme instrument is bodhichitta,\nGained through four unbounded attitudes.\nAnd as this wondrous chariot makes its way\nIn aspiration and in action,\nIt causes the inferior view, the wish for one's own peace, to wane."}, {"tib": "།སྡིག་སྡུག་འཁོར་བའི་བཙོན་རར་བཅིངས་རྣམས་ཀྱང་། །བྱང་ཆུབ་སེམས་བསྐྱེད་མོད་ལ་རྒྱལ་སྲས་ཀྱི།\n།མིང་གི་ཅོད་པན་འཐོབ་ལ་རབ་དགའ་ནས། །འཇིག་རྟེན་ལྷ་མིར་བཅས་ཀྱང་སྟི་སྟང་བྱེད།", "en": "When beings engender bodhichitta in their minds,\nThough still imprisoned in samsara, bound by sin and pain,\nThey gain a crown, the name of Children of the Conqueror,\nAnd are revered by all the world, both gods and humankind."}, {"tib": "།ལས་ཉོན་མུན་ནག་འཁྲིགས་པའི་སྤྲིན་བར་ནས། །གཏུམ་པའི་གློག་འོད་འཁྱུག་ལྟའི་དགེ་བ་ལ།\n།སྐབས་འགར་གོམས་པའི་བསོད་ནམས་ཙམ་པོ་བ། །ཆུ་ཤིང་བཞིན་དུ་འབྲས་བུས་རྩ་བ་སྨད།", "en": "Amid the thick, dark clouds of karma and defilement,\nVirtue flares like lightning sharp and swift.\nSuch virtue practiced fitfully gives rise to mere merit;\nLike the plantain tree, it fructifies and then its root is spent."}, {"tib": "།ས་གཞི་བཟང་པོས་བསྟེན་པའི་ཞིང་ས་ལ། །དགེ་བའི་ལོ་ཏོག་ཕུན་སུམ་ཚོགས་པ་ལྟར།\n།བྱང་ཆུབ་སེམས་ཀྱི་ལྗོན་ཤིང་སྲིད་པ་ན། །འབྲས་བུ་མང་ཞིང་ཞི་བའི་བར་དུ་འཕེལ།", "en": "But just as in a field of rich and fertile soil,\nA perfect harvest springs abundantly,\nSo too does bodhichitta, like a wondrous tree, yield in this world\nRich fruits that grow and increase till enlightenment is gained."}, {"tib": "།ལས་ཉོན་འདུ་བྱེད་སྡུག་བསྔལ་ཀུན་གྱི་སྣོད། །འཁོར་བའི་རྒྱ་མཚོ་རྣམ་རྟོག་རྦ་རླབས་ཅན།\n།སེམས་ཅན་རྣམས་ཀྱི་ཁྱིམ་ལྟར་རབ་བཟུང་ལས། །གདོན་པའི་སྙིང་སྟོབས་ཆེན་པོ་སེམས་བསྐྱེད་ཡིན།", "en": "Receptacle of karma and defilement, all-pervasive pain,\nSamsara is an ocean buffeted by waves of thought.\nBut beings still cling to it as though it were their home.\nBodhichitta is the great and brave resolve to rescue them."}, {"tib": "།གང་ལ་རང་དོན་སེམས་པ་ཡོད་མ་ཡིན། །བཀྲེས་པ་ཟས་དང་སྐོམ་པ་ཆུར་གདུང་བཞིན།\n།སེམས་ཅན་འབའ་ཞིག་དོན་དུ་རྣམ་མཁྱེན་གྱི། །གོ་འཕང་གཉེར་ལ་བྱང་ཆུབ་སེམས་ཞེས་གྲགས།", "en": "To have no thought for one's own benefit,\nTo strive to gain omniscience for others' sake alone,\nLike hungering and thirsting for one's food and drink—\nAll this is known as bodhichitta."}, {"tib": "།དེའང་འབྲས་བུར་དམ་འཆའ་སྨོན་པའི་སེམས། །བསླབ་བྱ་བདག་གཞན་མཉམ་དང་བརྗེ་བ་དང་།\n།བདག་བས་གཞན་གཅེས་གསུམ་དུ་བཞག་པའང་། །བསླབ་པའི་མདོ་བསྡུས་ཡིན་གྱི་དེའི་ངོ་བོ།\n།བྱམས་སོགས་ཚད་མེད་བཞི་ལ་ཡང་དག་གནས༑", "en": "The pledge to reach this object is aspiring bodhichitta,\nWhich consists in threefold training:\nFirst equaling, then interchanging, self and other,\nThen loving others more than one's own self.\nThese, briefly, are the trainings. Their essence lies in love\nAnd all the other of the four unbounded attitudes."}, {"tib": "།རྒྱུ་ལ་དམ་འཆའ་འཇུག་པའི་སེམས་ཡིན་ཏེ། །དེ་ཡི་བསླབ་བྱ་ཕ་རོལ་ཕྱིན་པ་དྲུག\n།སྤྱོད་ཡུལ་ཡོངས་སུ་དག་པ་རྣམས་ལ་བསྟེན།", "en": "To pledge oneself to that which causes such a goal\nIs active bodhichitta.\nIts trainings are the six transcendent virtues\nAnd reliance on behavior that is pure and perfect."}, {"tib": "།དབྱེ་བའི་སྒོ་ནས་སྐྱེ་འཕགས་སེམས་བསྐྱེད་གཉིས། །བསླབ་པ་གསུམ་ལ་ལྟོས་པའི་སེམས་བསྐྱེད་གསུམ།", "en": "With regard to noble and to common beings,\nBodhichitta is divided twofold.\nWhen related to the threefold training,\nIt's divided into three."}, {"tib": "།ཁྱད་པར་ཚོགས་སྦྱོར་ལམ་ན་མོས་པས་སྤྱོད། །དང་པོའི་ས་ནས་བདུན་པར་ལྷག་བསམ་དག\n།དག་ས་གསུམ་ན་རྣམ་པར་སྨིན་པ་དང་། །སངས་རྒྱས་ས་ན་སྒྲིབ་པ་སྤངས་ཏེ་བཞི།", "en": "It is distinguished fourfold in the following way:\nFirst, upon the pathways of accumulation and of joining,\nIt's embraced through aspiration;\nSecond, from the first ground till the seventh,\nThere arises bodhichitta of sublime and pure attitude;\nThird, upon the three pure grounds it comes to perfect ripeness;\nAnd fourth, upon the ground of buddhahood,\nIt's free from every obscuration."}, {"tib": "།དེ་བཞིན་ལམ་ལྔའི་རྗེས་འགྲོ་སེམས་བསྐྱེད་ལྔ། །ཕ་རོལ་ཕྱིན་པ་དྲུག་ལྟོས་དེ་སྙེད་གྲངས།\n།ས་མཚམས་དབྱེ་བ་ཉི་ཤུ་རྩ་གཉིས་སོགས། །བསམ་པས་སྨོན་དང་འཇུག་པས་ཁྱབ་ལ་འདུ།", "en": "Connected with five paths, five bodhichittas are enumerated.\nAssociated with the six transcendent virtues,\nThere are bodhichittas in an equal quantity.\nWhen the grounds of realization are distinguished,\nThere are two and twenty bodhichittas.\nIn the aspirational and active bodhichittas all these are included."}, {"tib": "།གང་ཞིག་རང་ཉིད་ལེགས་པ་དོན་གཉེར་ནས། །ཏག་ཏུ་གཅོད་པ་མེད་པའི་སྒོ་འཕར་ནང་།\n།སློང་བའི་ཡིད་ལ་འཁྲུགས་པ་མི་སྟེར་བ། །དེ་ལ་གཏན་པ་མེད་པའི་མཆོད་སྦྱིན་ཞེས།", "en": "Those who seek their own good\nAlways keep an open door;\nThey do nothing to distress the minds of those who come a-begging.\nAs openhanded patrons are they known\nAnd are indeed deserving of all praise."}, {"tib": "།བསྔགས་པར་འོས་ན་མཐའ་དག་སེམས་ཅན་དོན། །ཕན་པའི་སྨོན་སེམས་ཐང་ཅིག་སྐྱེས་པས་ཀྱང་།\n།ངན་སོང་སྒོ་གཅོད་ལྷ་མིའི་གནས་རིགས་སུ། །བདེ་བ་བསྟེན་པའི་ཡོན་ཏན་ཟད་མི་ཤེས།", "en": "But when the wish to benefit unnumbered beings\nTakes rise for just a single instant,\nThe gateway to the lower realms is closed\nAnd in the realms of gods and humankind\nUnending qualities of bliss are then enjoyed."}, {"tib": "།ཁྱད་པར་འཇུག་པའི་ཡོན་ཏན་མཐའ་ཡས་ཏེ། །དངོས་སུ་སྦྱོར་བས་ཁྱབ་པའི་ཆོ་ག་ལ།\n།གང་ནས་བཟུང་སྟེ་ལྡོག་པ་མེད་པའི་སེམས། །འགྲོ་སྒྲོལ་དམ་བཅའ་ཤིན་ཏུ་ཡིད་བརྟན་པ།\n།དེ་ནས་བཟུང་སྟེ་བག་མེད་གཉིད་ལོག་ཀྱང་། །བསོད་ནམས་རྒྱུན་ཆགས་ཉིད་དུ་འབྲེལ་འགྱུར་བ།\n།སྤྱོད་པའི་ས་ལས་འཐད་པ་དང་བཅས་བཤད།", "en": "Even greater are the boundless qualities of active bodhichitta.\nFor when with ritual support, the mind, with irreversible intent,\nIs pledged to actual deeds, and henceforth\nWith great firmness promises to free all beings,\nFrom that moment onward, even during sleep and inattention,\nMerit will be always present in the mind—\nAs it has been declared with reasons in the Bodhisattva's Way."}, {"tib": "།བསྐལ་པ་མང་པོའི་ཚོགས་ཀྱང་འདུམས་པར་འགྱུར། །ཕྱུགས་དང་གླང་པོ་ཤིང་རྟ་ཉི་ཟླ་སོགས།\n།བགྲོད་པའི་བརྟུལ་ཞུགས་མྱུར་བུལ་མཐའ་ཡས་ལྟར། །བློ་སྟོབས་ཆེན་པོའི་ཐབས་བརྩོན་ཤེས་རབ་ཀྱིས།\n།གྲངས་མེད་གསུམ་གྱི་དམ་བཞག་འཇིག་པ་ཡིན།", "en": "Over many ages are great stores of merit gathered.\nBy chariots drawn by ox or elephant, by courses of the sun and moon—\nBy such examples are the many speeds of progress on the path described.\nAnd yet, through great determination, endeavor, wisdom, skill,\nThe requisite of three unmeasured aeons is suspended."}, {"tib": "།ཇི་ལྟར་ས་བོན་ས་ལ་ལྷུང་བ་བཞིན། །སེམས་མཆོག་བསྐྱེད་པ་མི་གཙོ་སྐྱེས་པ་གཙོ།\n།སྟོབས་གསུམ་ལས་ནི་བྱང་ཆུབ་སེམས་སྐྱེ་བས། །སྙིང་རྗེ་ཆེ་དང་ཚོགས་བསག་སྐྱབས་སུ་འགྲོ།\n།བསམ་དང་སྦྱོར་བ་རྒྱུ་ཡི་སྟོབས་སུ་བཤད།", "en": "As with the planting of a seed, the generation of the supreme mind\nIs less important than its actual birth.\nFrom three strengths is bodhichitta born:\nGreat compassion, stores of merit, taking refuge,\nRespectively explained as strengths of attitude, of training, and of cause."}, {"tib": "།རྟེན་གྱི་གང་ཟག་རྣམ་པ་གཉིས་བསྟན་ཏེ། །སོ་ཐར་རིགས་བདུན་གང་རུང་སྡོམ་ལྡན་ནམ།\n།དཀོན་མཆོག་ཏཱ་ལར་བསམ་པའི་རྟེན་གཙོ་བའི། །རྗེས་ཕྱོགས་དབུ་མའི་ལམ་སྲོལ་འཇུག་པ་ཡངས།\n།ཚོགས་བསག་པ་ནི་ལྷག་པར་སྐྱེ་བའི་ཐབས།", "en": "Two kinds of being, it is taught, are able to engender bodhichitta:\nThose with one of seven pratimoksha ordinations,\nOr anyone with aspiration, as The Precious Palm declares.\nThe Middle Way, which follows this, is thus more vast in its approach.\nThe method for the full engendering of bodhichitta\nIs the gathering of merit."}, {"tib": "།རྒྱུ་ནི་ཀུན་ཀྱང་བདེ་གཤེགས་སྙིང་པོ་ཅན། །རྐྱེན་ནི་དགེ་བའི་བཤེས་ལ་རབ་བརྟེན་པས།\n།ཡིད་བཞིན་ནོར་བུ་ལྟ་བུའི་བླ་མ་མཆོག །བྱང་ཆུབ་སེམས་ཀྱི་ཐུགས་རྒྱུད་གང་བ་དེས།", "en": "Its cause is buddha nature found within the minds of all;\nIts condition is attendance on a virtuous friend:\nThe perfect teacher who is like a wishing-gem,\nWhose mind and heart are filled with bodhichitta."}, {"tib": "།ཐོག་མཐའ་བར་དུ་དག་པའི་ཆོས་རྣམས་དང་། །རྒྱན་དང་སྡོང་པོ་བཀོད་ལས་ལེགས་གསུངས་པའི།\n།བྱང་ཆུབ་སེམས་ཀྱི་ཡོན་ཏན་དཔག་ཡས་བརྗོད།", "en": "He or she sets forth the Dharma,\nPerfect at its outset, middle, and its end,\nAnd, as the Alankara and the Gandavyuha both describe,\nExplains the boundless, perfect qualities of bodhichitta."}, {"tib": "།སྐྱང་ནུལ་མཛེས་སྡུག་ངོམ་པའི་གནས་ཁང་ཡང་། །གུར་གུམ་སྤོས་ཆུས་བྲན་བཅས་གདོང་བཀྲུ་ཞིང་།\n།དཀོན་མཆོག་འབའ་ཞིག་ཡིད་ལ་སེམས་པ་ཡི། །མཆོད་ཚོགས་ཕྲུ་མ་འདེབས་ལ་དགའ་ཞིང་དགོད།", "en": "The place in which you take the bodhichitta vow\nShould be well cleaned and beautiful,\nAsperged with scent and saffron water.\nWash your face and, thinking only of the Triple Gem,\nWith joy arrange and lay out every kind of offering."}, {"tib": "།དམ་ཚིག་གཟུགས་བརྙན་མཐའ་དག་དེར་བོས་ནས། །ཡེ་ཤེས་སེམས་དཔའ་དགུག་གཞུག་ཆོ་ག་ནི།\n །མཛའ་གཅུགས་དམ་བཅའ་དྲན་པ་ལས་མྱུར་བས། །རྒྱལ་རྣམས་ཞིང་ཁམས་གཞན་དུ་གཟིགས་པ་ཡོལ།", "en": "Set up sacred images, supports for your samaya,\nThen invite the Wisdom Beings, praying them to rest therein.\nMore swift than lovers mindful of their trysts,\nThe Buddhas will not tarry nor be drawn to other fields."}, {"tib": "།གང་ཞིག་ལུས་པ་མེད་པའི་སེམས་ཅན་གྱི། །མགོན་དང་དཔུང་གཉེན་གྱུར་ཀྱང་བདུད་སྡེའི་དགྲ།\n།ཇི་ལྟ་ཇི་སྙེད་མཁྱེན་ཅིང་གཟིགས་པ་ཡི། །བཅོམ་ལྡན་བདག་གིས་སྡུམ་པར་མཆིས་སུ་གསོལ།", "en": "Then pray to the supreme Protectors, friends of all without exception,\nDestroyers of the hosts of evil demons,\nEnlightened ones who see things in their nature and their multiplicity.\nAsk them to be present in that place."}, {"tib": "།ལས་ཀྱི་སྤྲུལ་པ་མ་ཡིན་འབྱོན་པའི་ཤུལ། །ཁྲུས་ཀྱི་ཁང་བུ་བརྩེགས་པ་དྲི་བསུང་ཅན།\n།ཤེལ་དང་ནོར་བུའི་ས་གཞི་ཀ་བར་ལྡན། །གཡུ་དམར་མུ་ཏིག་བླ་བྲེ་དཔྱངས་པ་དེར།", "en": "They come into a chamber not contrived by human work,\nA sweetly scented bathing room\nWith floor and pillars made of jewels and crystal,\nCorals, pearls, and turquoises arranged in hanging canopies."}, {"tib": "།བདེ་གཤེགས་རིགས་ཀྱི་བུ་མཆོག་བཅས་པ་ལ། །སྤོས་ཆུས་གང་བའི་ནོར་བུའི་བུམ་པ་ནས།\n།ཁྲུས་ཀྱི་རིམ་གྲོ་བགྱིད་པའི་སྨིན་ལེགས་མ། །གླུ་གར་རོལ་མོའི་འགྱུར་བ་འགྲན་ལ་བརྩོན།", "en": "The Tathagatas with their sublime bodhisattva children,\nWith perfumed water poured from jeweled flasks,\nAre bathed by fair-browed goddesses\nWho vie with one another in their music, dance, and song."}, {"tib": "།ཉེ་རེག་ཆོ་ག་མཁས་པའི་རི་དྭགས་མིག །དྲིལ་ཕྱིས་བསྐུ་མཉེའི་སྲི་ཞུས་གཡེང་བའང་།\n།ཁ་དོག་གཅིག་ཏུ་མི་གནས་དབང་པོའི་མཚོན། །ཐུགས་སུ་བཏགས་པ་མེད་པའི་ལྷ་རྫས་ཉོ།", "en": "Soft-eyed maidens skilled in gentle massage\nDry their forms, anointing them with reverent touch.\nThe vesture of the gods they offer of no common weave,\nNor of one color only but of many rainbow hues:"}, {"tib": "།དཔག་བསམ་ལྗོན་པས་བཙོང་བའི་པཉྩ་ལི། །ལྕིད་ཀྱི་ནོན་སྤངས་སྲབ་འཇམ་ཡང་བའི་གོས།\n།དྲི་དང་སྤོས་ཆུས་བགོས་ཤིང་བྱུགས་པ་དང་། །རིན་ཐང་བརྗོད་ལ་ཁྲེལ་བའི་རིན་ཆེན་རྒྱན།\n།གདུ་བུ་དཔུང་རྒྱན་སྙན་ཆ་ཅོད་པན་སོགས།", "en": "Panjali provided by the wishing-tree,\nRaiment light and weightless, sheer and soft,\nImbued with fragrant scent.\nAnd bracelets, armlets, earrings, and crowns—\nThey offer jewels so rich that one would blush to tell their price."}, {"tib": "།འདོད་པའི་ཡོན་ཏན་སྤངས་པའི་ཐུབ་དབང་ཀྱང་། །བཀྲེན་ལྡན་བསོད་ནམས་སླད་དུ་བདག་གིར་བཞེས།\n།འཇིག་རྟེན་དབང་ཕྱུག་ལ་སོགས་ཉེ་བའི་སྲས། །ངན་སོང་ཀུན་འདྲེན་ལ་སོགས་བསྐལ་བཟང་གི\n།སེམས་དཔའ་བཅུ་དྲུག་དང་ནི་ཁྱིམ་པའི་ཚུལ། །ཆོས་འཕགས་རྟག་ཏུ་ངུ་དང་ལི་ཙ་བཱི།\n།དྲི་མ་མེད་པར་གྲགས་ལའང་དབུལ་བར་བགྱི།", "en": "Then pray that, though the mighty Sages\nHave forsaken objects of desire,\nThey may accept the gifts of those who thirst for merit.\nMake oblations to the mighty Buddhas and to their close sons,\nAnd to the Guide of Beings in the Lower Realms\nAnd all the others of the sixteen Bodhisattvas of this Happy Age.\nMake offerings also to the ones who take the guise of householders:\nDharmodgata, Saraprarudita, and the Licchavi Vimalakirti."}, {"tib": "།སྟོང་གསུམ་གཅིག་ཅར་ཁྱབ་པའི་དྲིའི་བཞོན་པར། །འཁྱུད་པའི་ཙན་དན་སྤོས་ཀྱི་བསུང་ཞིམ་དྲིས།\n།བསོད་ནམས་བྱེ་བའི་འབྱུང་གནས་མཚན་དཔེའི་བྱད། །གསེར་སྦྱངས་བརྟན་པ་འཕྲོག་ལ་བྱུགས་པར་བགྱི།", "en": "With sandalwood, whose fragrant scent goes wafting on the wind\nAnd instantly pervades the universe three-thousandfold,\nAnoint their forms, which overwhelm\nThe lustrous gleam of fine and burnished gold\nAnd are adorned with all the great and lesser marks of buddhahood,\nA source of merit inexhaustible."}, {"tib": "།བཏང་སྙོམས་ཡངས་པའི་ཤེལ་གྱི་ས་གཞི་ལ། །བྱམས་པའི་པདྨ་གེ་སར་སྟོང་བརྡལ་བར།\n།སྙིང་རྗེའི་ཉི་ཟླ་བཀྲག་ཏུ་ཚེར་བ་བསྟར། །དགའ་ཆེན་བཅོམ་ལྡན་འཁོར་བཅས་བཞུགས་སུ་གསོལ།", "en": "Upon the vast and spacious crystal pavement of impartiality,\nUpon the pistil of a thousand-petaled lotus flower of love,\nUpon compassion's brilliant, shining disks of sun and moon,\nImplore the Buddhas and their retinues (great sympathetic joy)\nTo come and take their seats."}, {"tib": "།བབ་ཅོལ་གོམས་པ་མིན་པའི་ལུས་བཏུད་ཀྱི། །སྙིང་གར་གུས་བཅས་མངོན་རྟོགས་ངོམ་པ་ལ།\n།མེ་ཏོག་དོག་པས་རབ་བཟུང་སྙིམ་པའི་སྣོད༑ །ག་བུ་ཆུང་གི་བརྟུལ་ཞུགས་འཛིན་པ་ཡིན།", "en": "Abandoning all loose and careless conduct then bow down,\nAnd show your state of mind by clasping to your heart\nYour hands as though they cupped a flower bud,\nHolding them together like a relic case."}, {"tib": "།རིག་དང་ཞབས་སུ་ལྡན་སོགས་བདེ་གཤེགས་ཀྱི། །ཡོན་ཏན་མཐའ་དག་གནས་ཀྱིས་བསྐལ་པ་བཞིན།\n།དད་པའི་སྐྱེད་མོས་ཚལ་དུ་འོངས་པའི་མོད། །སྐྱོ་བ་མིན་པའི་བ་སྤུ་གཅིག་ཏུ་གཟིངས།", "en": "All the qualities of Those Who Go in Bliss—\nTheir wisdom and compassion and the rest—are as if concealed.\nBut when to the grove of the devoted mind they come,\nIn faith, not grief, the hair upon one's flesh stands up!"}, {"tib": "།ཟླ་གཞོན་ཁྲུས་ལ་འཇུག་པའི་རྫིད་བུའི་ནང་། །རྨ་བྱའི་བུ་མོ་འཇོ་སྒེག་རོལ་པ་ལྟའི།\n།ལང་ཚོའི་གྲངས་སྙེད་རྡུལ་གྱི་རྣམ་གྲངས་དང་། །ཤིན་ཏུ་འཁྲུག་པ་སྐྱེད་བྱེད་ཕྱག་གིས་བྲེལ།", "en": "Like the lovely peacock's daughter dancing,\nMirrored in a pool in which the full moon bathes herself,\nWith youthful emanated forms in an amazing multitude,\nAs many as the grains of dust, prostrate."}, {"tib": "།གཏོང་བའི་ཡན་ལག་རྫོགས་པའི་དངོས་འབྱོར་དང་། །དེས་ཀྱང་མཚོན་པར་དཔེ་མེད་ཡིད་ཀྱིས་སྤྲུལ།\n།བླ་ན་མཆིས་པ་མ་ཡིན་མཆོད་པའི་སྤྲིན། །ཀུན་ཏུ་བཟང་པོའི་ཡོན་ལ་ཕྲག་དོག་བགྱིད།", "en": "In order to complete the branch of generosity,\nOffer actual wealth and unexampled gifts imagined by the mind—\nClouds of offerings excelled by none,\nThat rival even great Samantabhadra's gifts."}, {"tib": "།མུ་ཅོར་སྨྲ་བའི་ལས་དང་བག་ཆགས་སྡིག །དགེ་ལ་འཇིགས་ནས་གཞན་དུ་བྲོས་པའི་གཟུགས།\n།སྲིད་པའི་མུན་ནག་སྟུག་པོར་འཆབ་པ་ཀུན། །སྟོབས་བཞིའི་ཉིན་བྱེད་འབར་བས་སྦྱང་ཤིང་བཤགས།", "en": "The impudence of speech, all evil tendencies and deeds,\nAlarmed by virtue, flee away,\nTheir forms hid by the thick and gloomy darkness of samsara.\nIn the sunlight of the four strengths, they're confessed and cleansed."}, {"tib": "།སྦྱོར་བ་གང་གིས་བདག་ཉིད་མ་འཁྲུགས་བཞིན། །བསམ་པའི་ཁྱད་པར་གཅིག་གིས་གཞན་དག་པའི།\n།རྣམ་དཀར་ཡུད་ལ་འཕྲོག་པའི་ཆོམ་རྐུན་གྱི། །བརྟུལ་ཞུགས་རྗེས་སུ་ཡི་རང་ཁོ་ནས་བྱས།", "en": "To gather others' virtue for oneself\nBy just a single thought, untroubled by fatigue—\nThe only way is to rejoice in it.\nOne gains it for oneself as though one were a thief!"}, {"tib": "།ཐར་མེད་འཁོར་བའི་སྤྱོད་པ་མ་དུལ་ཞིང་། །རྣམ་པར་སྲ་མཁྲེགས་ཐ་བ་གང་གིས་ཀྱང་།\n།གདུལ་ཐབས་བརྟན་པ་བྲལ་ལ་ཆོས་འཁོར་གྱི། །རྩིབས་རྣོན་མུ་ཁྱུད་འཛིན་དེ་བསྐོར་བར་བསྐུལ།", "en": "Samsara knows no end where beings' actions are untamed,\nIntractable, and hard. The only way to train them is to fix them\nTo the rim of Dharma's sharp-spoked wheel;\nAnd therefore we should pray that it be turned."}, {"tib": "།རྒྱལ་དང་དེ་སྲས་རྣམས་ཀྱིས་སྤངས་གྱུར་བའི། །འགྲོ་འདིས་སྡུག་བསྔལ་གནས་སྐབས་བསྟེན་མཐོང་ནས།\n།མྱ་ངན་འདའ་བ་མིན་པའི་གདན་ཁྲི་ལ། །དངོས་པོ་ཀུན་གྱི་རིན་ཐོང་གཅིག་ཏུ་སྤུངས།", "en": "Forsaken by the Buddhas and their Bodhisattva heirs,\nBeings would be bound in their predicament of misery.\nOffer all you have, therefore, beseeching the enlightened beings\nNot to pass into nirvana but to stay upon their thrones."}, {"tib": "།བདག་ཏུ་བལྟ་བས་འདར་བའི་རྣམ་དཀར་ཡང་། ། སྲིད་པར་ལན་གཅིག་མཐོང་བའི་ཆོ་ངེ་སྟེ།\n།བྱང་ཆུབ་བསྔོ་བའི་གསེར་འགྱུར་རྩིས་ཐེབས་པ། །འདི་ནི་སྟོན་པ་གཞན་གྱི་ལུགས་ལ་མེད།", "en": "Precarious are the virtuous deeds performed within the view of self:\nHigh status in samsara is attained, but weeping follows after.\nTo dedicate such acts to buddhahood\nEffects a gold-producing alchemy—\nA method other teachers have not taught."}, {"tib": "།ཆོག་ཤེས་བདུད་རྩིའི་བཏུང་བས་མ་ངོམས་ན༑ །སྐྱེས་བུའི་ཡིད་ལ་མ་བཟུང་མཆོད་སྤྲིན་ཡང་།\n།ཚིག་གིས་ཕ་མཐར་འཁྱམས་ལ་སྐྲག་གྱུར་ནས། །བདག་ལུས་སྟན་དུ་དབུལ་ལའང་དོ་གལ་བགྱིད།", "en": "Well may those not sated by the nectar of contentment\nOffer clouds of things unclaimed—\nThey wander in the realm of empty words.\nIn fear of this, it is a crucial point to offer one's own body\nTo the Buddhas as their footstools."}, {"tib": "།དཀོན་མཆོག་གསུམ་གྱི་འབངས་སུ་དམ་བཅས་པའི། །གྲིབ་བསིལ་སོ་གའི་མེ་ཏོག་འཇོ་སྒེག་ཅན།\n།རྣམ་ཀུན་འཁྲུགས་པའི་གཤིན་རྗེའི་མདུན་སར་ཡང་། །ཁྲོ་གཉེར་འཇིགས་པའི་རིན་ཐང་ཟད་མི་ཤེས།", "en": "Those who pledge themselves to service of the Triple Gem\nResemble lovely springtime flowers sheltered in cool shade.\nBefore them even dreadful Yama smoothes his frowns:\nThe value of such service is unlimited."}, {"tib": "།དེས་ནི་གཏི་མུག་མཐུས་ནོན་སྡིག་ལྡན་བདག །བྱི་དོར་ཤིན་ཏུ་བསྟེན་པའི་དྭངས་ཤེལ་ལྟར།\n །བསོད་ནམས་རྙོག་པ་དྭངས་པའི་སེམས་ཀྱི་ནང་། །སེམས་བསྐྱེད་ཆོ་གས་ཐོབ་པའི་གཟུགས་བརྙན་དངོམ།", "en": "Through this, the sinful mind\nWeighed down by merit-clouding ignorance\nIs purified, like crystal wiped to shining brilliance;\nAnd through the bodhichitta ritual,\nThe image of the vow will shine within its limpid depths."}, {"tib": "།ཉེས་པ་བརྒྱ་ཕྲག་གཡང་སར་ལྷུང་བ་ཡི། །རིམས་ཀྱིས་ཤིན་ཏུ་བཏབ་པའི་ནད་པ་རྣམས།\n།གསོ་དཔྱད་ཕལ་པའི་མདུན་སར་དབུགས་མི་ཕྱིན། །སྨན་པ་མཆོག་ལ་སྐྱབས་སུ་ལྷག་པར་དོང།", "en": "Those grievously afflicted by the plague of suffering,\nWho fall into the chasms of unnumbered faults,\nAre not relieved by common healers.\nTo the Buddhas, the supreme physicians, let them go for refuge."}, {"tib": "།མོས་པ་གང་གི་སླད་དུ་འདིར་གཤེགས་ནས། །སེམས་ཅན་ཁམས་ལ་དགོངས་པའི་སྟོན་མཆོག་ནི།\n།ཐེག་པ་ཆེན་པོའི་སྐྱེས་བུ་འབའ་ཞིག་པའི༑ །ཚོགས་ཀྱི་དབུས་ན་ལྷམ་མེར་མཛེས་པ་ལ།", "en": "Wherever there is true devotion, there the Buddhas come,\nThe supreme teachers who embrace the world of beings in their minds.\nAnd there they stay resplendent, beautiful,\nAmid the hosts of Bodhisattvas of the Mahayana."}, {"tib": "།སྐྱབས་སུ་འགྲོ་བ་གསུམ་གྱི་གཞི་བཅས་ལ། །དགོངས་སུ་གསོལ་བ་གསུམ་གྱིས་སར་བྱས་ནས།\n།རྒྱལ་བ་སྲས་དང་བཅས་པའི་ཐུགས་བསྐྱེད་དང་། །བསླབ་པའི་བརྟུལ་ཞུགས་མཐའ་དག་བླང་པ་ཡིན།", "en": "By three times taking refuge, we create the basis.\nThen we stir the Buddhas and their heirs with threefold invocation.\nWe take the vow of bodhichitta, promising to undertake the training,\nJust as all the Buddhas and the Bodhisattvas did before."}, {"tib": "།ཉོན་སྒྲིབ་ཟུག་རྔུའི་དུམ་བུ་བཅད་གྱུར་ཀྱང་། །ཤེས་སྒྲིབ་ཡུལ་གྱི་རོ་ལ་བཅགས་པ་ཡི།\n།ཉན་རང་དགྲ་བཅོམ་མ་བསྒྲལ་བ་ལས་བསྒྲལ།", "en": "The Shravakas, Pratyekabuddhas, Arhats—\nThough the torment of defilement's veil is halted—\nStill retain a taste for objects, veil of their cognitions:\nFrom this unfreedom we will set them free."}, {"tib": "།གཉིས་ཀའི་འཆིང་བས་ཀུན་ནས་དཀྲིགས་པ་ཡི། །ཚངས་པ་ལ་སོགས་སོ་སོ་སྐྱེ་བོ་ནས།\n།སློབ་པ་འཕགས་པའི་བར་ལ་གནས་པ་ཡི། །སེམས་ཅན་མ་གྲོལ་བ་རྣམས་དགྲོལ་བ་དང་།\n།ཤིན་ཏུ་སྡུག་བསྔལ་དྲག་པོའི་ཤུགས་རིང་ལས། །དབུགས་འབྱིན་ཐོབ་པ་མེད་པའི་ངན་སོང་གསུམ།\n།དབུགས་འབྱིན་ཆེན་པོའི་གནས་ལ་སྦྱར་བ་དང་༑", "en": "And every being, Brahma and the rest,\nEnmeshed by both these veils—\nEveryone, from common beings till the ones who dwell\nOn noble grounds upon the path of learning—\nAll of them, as yet unfree, we promise to set free.\nAnd all who groan in sharp and dreadful pain,\nWho in three lower realms have no reprieve,\nWe pledge to bring them to the state of great relief."}, {"tib": "།མདོར་ན་རྟེན་ཅིང་འབྲེལ་འབྱུང་བཅུ་གཉིས་ཀྱི། །འཁོར་ལོའི་རྒྱར་ཆུད་སེམས་ཅན་ཡོད་དོ་ཅོག\n།མི་གནས་ཡེ་ཤེས་མྱ་ངན་འདས་པའི་གྲོང་།", "en": "In short, we take the pledge to bring all those who stray\nUpon samsara's wheel of twelvefold coproduction\nAnd bring them to the city of nirvana, nonabiding primal wisdom."}, {"tib": "།དགོད་བྱེད་ཆོ་གས་བཟུང་བའི་བརྗོད་པ་ནི། །སྔོན་བྱོན་དྲང་སྲོང་རྣམས་ཀྱི་ལུགས་ལ་བརྟེན།\n།རྟག་ཏུ་ཉིན་དང་མཚན་མོ་ལན་གསུམ་དུ། །བྱང་ཆུབ་སེམས་གཉིས་བསྐྱེད་ལ་ནན་ཏན་བྱ།", "en": "The way in which the vow is ritually taken\nIs based on the tradition of the masters who have gone before.\nAnd constantly, three times by day, three times by night,\nThe twofold bodhichitta should be earnestly engendered."}, {"tib": "།འདུན་པའི་རྩེ་ལ་ཆོས་རྣམས་རྐྱེན་ཆགས་པས། །བརྗོད་པ་དང་པོས་སྨོན་དང་གཉིས་པས་འཇུག\n།གསུམ་ཀས་གཉི་ཀ་བརྟན་པར་འཐོབ་པ་ནི། །རྒྱ་མཚོའི་སྤྲིན་གྱི་བཞེད་པ་བླ་ན་མེད།", "en": "All depends on concentrated yearning.\nAt the prayer's first recitation, aspiration bodhichitta is received;\nWith the second recitation, active bodhichitta is received;\nWith the third, the two are taken firmly both together—\nThus Sagaramegha's unsurpassed instruction."}, {"tib": "།སྔོན་ཆད་གཞན་གྱི་དོན་ལ་ལྟ་ཅི་སྨོས། །རང་དོན་ཉིད་དུ་རྨི་བའང་མ་མྱོང་བའི།\n།རིན་ཆེན་སེམས་ཀྱི་ཁྱད་པར་གསར་པ་འདིས། །བདག་གི་སྲིད་པ་རིན་ཐང་མེད་པ་བྱས།", "en": "Till now—no need to speak of others' good—\nNot even for our own sake did such thoughts come, even in our dreams.\nThis precious, sublime state of mind is new to us,\nFrom which our lives derive their priceless worth."}, {"tib": "།རིགས་ལས་ཉམས་པ་གང་ཞིག་ཆོ་རིགས་ཀྱི། །ལྷག་པར་བཙུན་པའི་གནས་ཐོབ་ཇི་བཞིན་དུ།\n།རྒྱལ་བ་ཀུན་གྱི་སྲས་སུ་དེང་གྱུར་པས། །བྱང་ཆུབ་སེམས་དཔའི་མིང་གི་ཅོད་པན་ཐོབ།", "en": "Just as a prince who wanders from his royal state\nAssumes the noble place accruing from his father's line,\nSo too the one who now becomes the Buddha's child\nReceives the crowning emblem of the Bodhisattva's name."}, {"tib": "།སྲིད་གསུམ་བདག་པོ་བྱས་དང་དེ་ཉིད་ཀྱིས། །རྨོངས་པའི་བླ་དྭགས་དཔྱངས་ལའང་དགའ་བྱེད་ན།\n།བྱང་ཆུབ་སེམས་དཔའི་གནས་ཐོབ་དེ་རིང་ཙམ། །དགའ་བའི་འཁྲི་ཤིང་སློང་ལ་ལྷ་ཡང་ཕྱོགས༑", "en": "Those who take the lordship of the triple world\nRejoice in lofty but mistaken names.\nBut we today assume the rank of Bodhisattvas.\nLet the gods themselves approach and share these flowers of our joy!"}, {"tib": "།འཆི་བདག་འཇོམས་པའི་བདུད་རྩི་མི་ཟད་གཏེར། །དབུལ་བ་སེལ་བའི་ནོར་དང་ནད་ཞིའི་སྨན།\n།སྲིད་ལམ་དུབ་པའི་མགྲོན་པོའི་ངལ་སྟེགས་ཕྱིར། །བདག་ནི་དེང་ནས་འགྲོ་བའི་ཉེར་འཚོར་གྱུར།\n\n།ཡོན་ཏན་རིན་པོ་ཆེའི་མཛོད་དགའ་བའི་ཆར་ཞེས་བྱ་བ་ལས། བྱང་ཆུབ་ཀྱི་སེམས་ཡོངས་སུ་བཟུང་བའི་ཚོམས་ཏེ་ལེའུ་བརྒྱད་པའོ།།", "en": "Bodhisattvas are unfailing wellsprings of immortal nectar,\nWhereby the Lord of Death is utterly destroyed.\nThey are the gems that cancel penury, the balm that soothes all ills,\nThe resting place for those who tread samsara's weary paths.\nFrom this day forward we will be the sustenance of wanderers!"}],
      9: [{"tib": "།།སྔོན་ཆད་ལེགས་པར་མ་བརྟགས་བབ་བཅོལ་གྱི། །དམ་བཅའ་གཏོང་ལའང་ཡིད་གཉིས་གནས་མཆི་ན། །\nརྒྱལ་དང་དེ་སྲས་རྣམས་ཀྱི་ཤེས་རབ་མཐུས། །གདོན་མི་ཟ་བར་བརྟགས་པའི་བླང་དོར་གནས། །", "en": "People who give up their former pledges\nRashly taken, ill-considered,\nWill only be reputed unreliable.\nBut if we now reject the precepts\nThat the Buddhas and their Bodhisattva heirs\nHave in their wisdom's power\nMost perfectly examined,"}, {"tib": "བཏང་ན་བདག་གི་སེམས་ཅན་ཀུན་བསླུས་པས། །མུ་མཐའ་མེད་པའི་ངན་འགྲོར་འཁྱམས་པར་འགྱུར། །\nདེ་ཕྱིར་སེམས་ཅན་གཅིག་གི་བདེ་བའང་། །བཤིག་ནས་བདག་ཉིད་ཉམས་པའི་ལས་མི་བགྱིད། །", "en": "We will have deceived all living beings\nAnd therefore we will wander endlessly in realms of sorrow.\nTherefore we will do no deed that mars\nA single being's joy and thus brings ruin on ourselves."}, {"tib": "ལྟུང་དང་བྱང་ཆུབ་སེམས་སྟོབས་གཉིས་ཀར་ལྡན། །འཁོར་བར་རེས་ཀྱི་འགྲེ་བྱེད་གང་ཡིན་པ། །\nས་ཐོབ་པ་ལ་ཡུན་རིང་འཐོགས་འགྱུར་ན། །བསླབ་བྱ་གཏོང་བའི་སྐྱེས་བུ་སྨོན་པ་ཡིན། །", "en": "If those who circle in samsara, mixing downfalls\nWith the strength of bodhichitta,\nAre hindered long from bodhisattva grounds,\nThose who throw away the precepts are insane indeed!"}, {"tib": "གང་ཞིག་གནོད་པའི་རྒྱུ་འབྲས་ཆུང་ངུ་ལའང་། །ཁྲོས་པའི་ང་རྒྱལ་ཤིན་ཏུ་བདོ་བ་རྣམས། །\nམདའ་མདུང་མཚོན་གྱི་ཆད་པ་བཟོད་བྱས་ནས། །དོན་མ་གྲུབ་པར་ཕྱིར་ཕྱོགས་མི་བྱེད་ན། །", "en": "Since those with proud determination fueled by anger,\nFelt at even slight discomforts and the acts that cause them,\nWill endure the wounds of weapons, dart or lance,\nAnd will not turn away until their aims are won,"}, {"tib": "རྣམ་པ་ཀུན་ཏུ་དག་ལ་དགྲར་གྱུར་པའི། །ཉོན་མོངས་སྟོབས་ཆེན་འདི་དང་གཡུལ་སྤྲད་ནས། །\nའཁོན་དུ་བཟུང་བའི་ཆོ་ག་མ་ཞིག་བར། །བསླབ་པ་བསྲུང་བའི་བརྟུལ་ཞུགས་སུ་ཞིག་གཏོང་། །", "en": "We too should wage a war against our utter enemies,\nThe mighty hosts of our defilements.\nResenting them, we should not let our discipline relax.\nFor who indeed would cast away their keeping of the precepts?"}, {"tib": "འདི་ན་ཉོན་མོངས་བཙོན་རར་བསྡམས་པ་ཡིས། །བདག་གི་ཚོད་ཀྱང་རིག་པར་མི་འགྱུར་ན། །\nམཐའ་དག་འགྲོ་བ་དེ་ལས་དབུགས་འབྱིན་ཞིང་། །སྒྲོལ་བའི་བརྟེན་པ་མི་ཉམས་ག་ལ་ཞིག །", "en": "If we are unaware of the extent to which\nWe are ourselves bound tightly in the prison of defilement,\nHow can our resolve to save unnumbered beings,\nBringing them to freedom, not diminish?"}, {"tib": "བག་ཡོད་ཤེས་བཞིན་ལྡན་པའི་ས་གཞི་ལ། །བྱང་ཆུབ་སེམས་ཀྱི་མྱུ་གུ་བསྐྱེད་སླ་བས། །\nམི་ཉམས་བཟུང་ཞིང་དྲི་མ་སྦྱོང་བ་དང་། །སྤེལ་བའི་ཐབས་ལ་ནན་ཏན་བགྱིད་འཚལ་ལོ། །", "en": "Within the fields of carefulness and introspection,\nThe shoots of bodhichitta may be cultivated easily.\nI beg that we uphold it steadily, removing faults,\nAnd strive by every means to strengthen it."}, {"tib": "དེ་ལ་ལྟུང་བའི་རབ་དབྱེ་ཉི་ཤུ་ནི།། དཀོན་མཆོག་དཀོར་འཕྲོག་ལ་སོགས་རྒྱལ་པོའི་ལྔ། །\nགྲོང་དང་གྲོང་རྡལ་འཇོམས་སོགས་བློན་པོའི་ལྔ། །བློ་མ་སྦྱངས་ལ་སྟོང་ཉིད་སྟོན་པ་སོགས། །", "en": "In this connection, twenty downfalls are to be repudiated.\nThe five of kings begin with taking of the wealth\nThat has been dedicated to the Triple Gem;\nThe five of ministers begin with laying towns and regions waste;\nThe eight of ordinary beings begin\nWith teaching emptiness to those with untrained minds."}, {"tib": "ཕལ་པའི་བརྒྱད་དང་སྨོན་འཇུག་གཏོང་རྣམས་སྤང༌། །མདོར་ན་རྨི་ལམ་སྡིག་པ་མཐོང་ན་ཡང་། །\nདེ་མ་ཐག་ཏུ་ཕུང་པོ་གསུམ་པས་བཤགས། །རྟེན་གཞི་སྨོན་སེམས་ཤོར་དང་འགལ་ཟླ་བྱུང་། །", "en": "And then to these is added the abandonment\nOf bodhichitta both in aspiration and in action.\nBriefly, even sinful deeds perceived in dreams\nShould be confessed at once\nWith recitation of the Sutra in Three Sections."}, {"tib": "སྤོང་རྐྱེན་བསླབ་པ་ཕུལ་བ་གསུམ་དག་ལས། །ཐུན་ཚོད་ལས་ཉམས་ཤོར་ན་འགྱོད་སེམས་ཀྱིས། །\nསྐྱ་རེངས་མདུན་དུ་ནམ་མཁའི་སྙིང་པོ་ལ། །བོས་ནས་ཡན་ལག་བདུན་པས་ལྟུང་བ་དང་། །", "en": "If of the three transgressions\n(Forsaking aspiration bodhichitta, basis of the path;\nDownfalls; and the giving back of vows)\nA downfall is left unconfessed beyond the stipulated time,\nWe should with strong remorse,\nBefore the break of day, invoke Akashagarbha,\nAnd with the prayer in seven branches mend the vow."}, {"tib": "བདག་བདེ་གཞན་ལ་ཡང་དག་སྤོ་བ་དང་། །གཞན་གྱི་སྡུག་བསྔལ་བདག་གི་ཁུར་བཟོད་པའི། །\nགཏོང་ལེན་སྙིང་སྟོབས་རྨད་བྱུང་འདུ་བྱེད་ཅིང་། །བྱང་ཆུབ་བར་དུ་མི་འབྲལ་ཕྱི་ཕྱིར་སྨོན།།", "en": "Perfectly to give our happiness to others,\nTaking on ourselves the burden of their pain,\nContriving thus the wondrous bravery of taking and receiving,\nThat beings, till they gain enlightenment,\nShould never be unhappy:\nThis indeed should be our constant aspiration."}, {"tib": "སྨོན་པའི་བསླབ་བྱ་ཚད་མེད་བཞི་པོའང་། །བྱས་པ་དྲིན་དུ་གཟོ་ལས་བྱམས་པ་སྐྱེ། །\nབྱམས་ལས་སྙིང་རྗེ་དེ་ལས་བྱང་ཆུབ་སེམས། །སྐྱེ་བ་ཚད་མའི་ལུང་གིས་ཡང་དག་འགྲུབ།།", "en": "Of aspiration bodhichitta\nThe precepts are the four unbounded attitudes.\nGratitude for kindnesses received gives birth to love.\nFrom love derives compassion and from this is bodhichitta born—\nAll this is well established in trustworthy texts."}, {"tib": "བཙས་མ་ཐག་པའི་སྐྱེས་བུ་བཞིན་ངན་དེ། །མ་ཡིས་པང་པས་ཁྲུས་ཁང་ལྟར་བྱས་ནས། །\nམི་གཙང་མཐའ་དག་ལག་པས་ཉེ་རེག་བྱས། །ནུ་ཞོས་བསྙེན་བཀུར་ལུས་ཀྱི་རེག་བྱས་གཡོགས། །", "en": "As soon as she gives birth, a mother takes her babe, an ugly imp,\nUpon her lap contrived now as a washing place,\nAnd with soft hands she cleans away its filth.\nWith her own milk she nurses it and wraps it in her body's warmth."}, {"tib": "བུ་ཆུང་ན་ལས་བདག་ཉིད་འཆི་བར་འདམས། །སྡིག་སྡུག་གཏམ་ངན་མཐའ་དག་སྲན་ནུས་པའི། །\nདྲིན་དང་རིམ་གྲོ་ཁྱད་དུ་གསོད་བྱེད་ན། །དེ་ལས་ཆོ་ག་འཁྲུགས་པ་སུ་ཞིག་ཡོད། །", "en": "She'd rather die than that her little one fall ill\nAnd for her child she's able to endure sin, pain, and cruel words.\nTo disregard one's mother's kindness and her loving care—\nIs anything more evil, more degenerate?"}, {"tib": "ས་འདི་རིར་བཅས་བདག་གི་ཁུར་མ་ཡིན། །བྱས་པ་མི་གཟོའི་ཁུར་ཆེན་དུག་ལྡན་གྱི། །\nབཟའ་བ་ཁོང་དུ་ཆུད་པའི་སྐྱེ་བོ་བཞིན། །དེ་ཕྱིར་ཕ་མཐའ་ཡས་པའི་སེམས་ཅན་ཀུན། །", "en": "The earth with all its mountains would be slight to bear—\nFar greater is the weight of failing to repay her kindness!\nTo do so is to be like one who swallows poisoned food."}, {"tib": "མ་རུ་གྱུར་ནས་ཕན་བཏགས་དམ་པའི་དྲིན། །དྲན་པས་བྱམས་སོགས་བཞི་པོ་གོང་འཕེལ་ཞིང་། །\nབྱས་པ་ཤེས་དང་དྲིན་དུ་གཟོ་བ་ཡི། །སྐྱེས་བུ་གང་ལ་འཕགས་པའི་ནོར་གྱིས་བསྙེན། །", "en": "We should now recall that all beings without end,\nWhen they became our mothers,\nHelped and showed us perfect kindness.\nIf we remember this,\nOur love, compassion, joy, and equanimity will grow.\nAll those who know that beings have been kind,\nWho feel great gratitude to them,\nWill be endowed with sublime riches."}, {"tib": "སྨོན་སེམས་སྟོན་ཀའི་ཟླ་བ་གསར་པ་ལ། །སྒྲ་གཅན་གདོང་བས་ཐུ་བའི་མི་མཐུན་ཕྱོགས། །\nནག་པོའི་ཆོས་བཞི་རིང་དུ་བསྐྲད་པར་བྱ། །མཆོད་འོས་བསླུ་དང་གཞན་གྱིས་བསོད་ནམས་ལ། །", "en": "Aspiration bodhichitta is resplendent like the autumn moon,\nBut perils worse than Rahu's face endanger it:\nFour evils to be driven far away.\nThese evils are to mislead people worthy of respect,"}, {"tib": "ཐེ་ཚོམ་བསྐྱེད་ནས་འགྱོད་པའི་གནས་ལ་སྦྱར། །དམ་པ་རྣམས་ལ་བསྐུར་ཞིང་མི་སྙན་སྒྲོག །\nགཡོ་དང་སྒྱུས་སྤྱོད་གཞན་དག་མགོ་བོ་བསྐོར། །ཆོས་བཞི་གང་རུང་ཉམས་མྱོང་སྨོན་སེམས་ཤོར། །", "en": "To bring regret and doubt to those who practice virtue,\nTo slander holy beings, speaking ill of them,\nTo trick and swindle others, leading them astray.\nTo harbor any of these four\nWill lead to loss of aspiration bodhichitta."}, {"tib": "འགྱོད་དང་གཉེན་པོས་མ་སླེབས་ཐུན་ཚོད་འདས། །དེ་ཡི་མོད་ལ་སེམས་བསྐྱེད་འཆོར་བ་ཡིན། །\nགཉེན་པོར་ཆེ་བ་དཀར་པོའི་ཆོས་བཞི་ནི། །སྲོག་ལ་བབས་ཀྱང་བསམ་བཞིན་རྫུན་མི་སྨྲ། །", "en": "For if we fail to feel remorse and to apply the antidotes,\nAnd if the time of reparation is allowed to pass,\nThen indeed is bodhichitta lost.\nTo this the four white forces are the best of remedies:\nNever, at the cost of life or limb to lie (intending to deceive);"}, {"tib": "རྒྱལ་སྲས་རྣམས་ལ་སྟོན་པར་གུས་ཤིང་བསྔགས། །གཡོ་སྒྱུ་མེད་པས་སེམས་ཅན་ཐམས་ཅད་གཉེར།།\nམཐའ་དག་བྱང་ཆུབ་ལམ་ལ་དཀྲི་བའོ། །བརྟན་བྱའི་སྒོ་ནས་བསྲུང་བའི་འདུ་ཤེས་བཞི། །", "en": "Always to respect and praise the Bodhisattvas\nAs though they were the very Buddha;\nTo care for every living being without guile or underhandedness;\nAnd then to lead all on the pathways of enlightenment."}, {"tib": "དགེ་བའི་བཤེས་ལ་སངས་རྒྱས་འདུ་ཤེས་དང༌། །དེས་བསྟན་ཆོས་ལ་ལམ་གྱི་འདུ་ཤེས་དང་། །\nདེ་སྒྲུབ་རྣམས་ལ་གྲོགས་ཀྱི་འདུ་ཤེས་དང་། །སེམས་ཅན་ཀུན་ལ་བུ་གཅིག་འདུ་ཤེས་ཏེ། །", "en": "Four perceptions fortify and guard the enlightened attitude:\nTo look upon one's teacher as the Buddha\nAnd take his teachings as the path;\nTo take as friends all those who practice them\nAnd look upon all beings as one's very children."}, {"tib": "འདི་དག་སྨོན་པའི་བསླབ་བྱ་ཡང་དག་གོ། །འཇུག་པའི་བསླབ་བྱ་ཕ་རོལ་ཕྱིན་དྲུག་ལས། །\nདང་པོ་ལྔ་ནི་བསོད་ནམས་དམ་པའི་ཚོགས། །ཕྱི་མ་གཅིག་ནི་ཡེ་ཤེས་ཚོགས་ཆེན་ཏེ། །", "en": "These are the perfect precepts linked with aspiration bodhichitta.\nActive bodhichitta's precepts are the six transcendent virtues.\nThe first five bring about the gathering of sublime merit.\nThe final one produces a great gathering of wisdom."}, {"tib": "གཉིས་ལ་མ་བསྟེན་སངས་རྒྱས་ཡོད་མ་ཡིན། །ཐབས་སྟོབས་སྨོན་ལམ་ཡེ་ཤེས་བསྣན་པས་བཅུ། །\nབློ་སྟོབས་མཐུ་ཡིས་སྒྲུབ་བྱེད་རྒྱལ་སྲས་གསུམ། །རང་དོན་སྔོན་བྱས་འགྲོ་བ་སྒྲོལ་འདོད་པ། །", "en": "Without relying on these two accumulations, there's no buddhahood.\nSkillful means and strength, then aspiration and primordial wisdom—\nOne speaks of ten perfections when these four are added.\nThe children of the Conqueror accomplishing this path,\nAccording to their strength of mind, are classified as three.\nThose who wish to free themselves and then to liberate all beings\nHave bodhichitta of great aspiration in the manner of a king."}, {"tib": "རྒྱལ་པོ་ལྟ་བུའི་འདོད་ཆེན་སེམས་བསྐྱེད་དང་། །རང་དང་འགྲོ་བ་སྟབས་གཅིག་སྒྲོལ་འདོད་པ། །\nགྲུ་པ་ལྟ་བུ་ཡེ་ཤེས་དམ་པའི་སེམས། །འགྲོ་བ་སྔོན་བསྒྲལ་རྗེས་ལ་ཞི་འདོད་པ། །", "en": "Those who wish to free themselves and beings all at once\nHave bodhichitta of most sacred wisdom in the manner of a ferryman.\nThose who wish for peace once beings have been saved\nHave unexampled bodhichitta in the manner of a shepherd."}, {"tib": "སྐྱོང་བྱེད་ལྟ་བུའི་དཔེ་མེད་སེམས་བསྐྱེད་དེ། །རྟུལ་པོས་གྲངས་མེད་སུམ་ཅུ་རྩ་གསུམ་དང་། །\nའབྲིང་པོས་བདུན་དང་རྣོན་པོས་གསུམ་ན་གྲོལ། །སྦྱིན་པའི་ངོ་བོ་ཆགས་པ་མེད་པ་སྟེ། །", "en": "Bodhisattvas who are dull in their capacity\nNeed thirty-three unmeasured kalpas\nFor the finding of their freedom.\nThose of moderate capacity need seven,\nWhile those of sharpest faculties need three.\n\"Giving\" is, essentially, to be without attachment."}, {"tib": "དབྱེ་ན་ཆོས་དང་ཟང་ཟིང་མི་འཇིགས་གསུམ། །ཟང་ཟིང་ལའང་རྣམ་པ་གསུམ་ཡིན་ཏེ། །\nགཏོང་དང་གཏོང་བ་ཆེ་དང་ཤིན་ཏུ་གཏོང་། །གཏོང་བ་ཞེས་བྱ་ཟས་གོས་ཤིང་རྟ་དང་། །", "en": "It is distinguished threefold: giving of the Dharma,\nGiving of possessions, and the gift of fearlessness.\nThe giving of possessions is again divided threefold:\nCommon, great, and extreme giving.\nCommon giving means providing others with supplies\nOf food and clothes, of chariot, oxen, land."}, {"tib": "གླང་པོ་ཡུལ་ཁམས་གཞན་ལ་བྱིན་པའོ། །གཏོང་བ་ཆེན་པོ་བུ་དང་བུ་མོ་དང་། །\nཁྱིམ་ཐབ་གཏོང་ཡིན་ཤིན་ཏུ་གཏོང་བ་ནི། །བྱ་དཀའི་གནས་ཏེ་མགོ་དང་ཡན་ལག་གཏང་། །", "en": "Great giving is the yielding of one's daughter, son, or spouse.\nAnd extreme giving—hardest yet—is giving of one's head and limbs."}, {"tib": "འདི་ན་ཐོག་མར་གོམས་སུ་འཇུག་པ་རྣམས། །སེར་སྣས་བསྡམས་པའི་སྐྱེས་བུའི་ལག་པ་ནི། །\nགཅིག་ནས་ཅིག་ཤོས་སྦྱིན་པར་བསམ་པའི་སེམས། །ཡང་ཡང་སྤོས་པས་ཚོད་མ་ལ་སོགས་ལ། །", "en": "Those hidebound by their avarice,\nWho start to train themselves,\nMust pass from hand to hand repeatedly\nSmall foodstuffs and the like\nAnd think that they are truly giving them.\nThus they grow in strength and overcome their craving and desire."}, {"tib": "བརྐམ་ཆགས་འཇིག་པ་སྟོབས་སུ་གྱུར་ལ་བསླབ། །མི་འཇིགས་སྦྱིན་པ་གཞན་གྱི་སྲོག་བསྲུང་དང་། །\nའཇིགས་པའི་ཡུལ་བསྒྲལ་དབུགས་འབྱིན་གནས་ལ་དགོད། །མི་ནུས་བཞིན་དུ་བབ་ཅོལ་ཆོ་ག་ཡིས། །", "en": "The gift of fearlessness means guarding others' lives,\nReleasing them from danger, bringing them to places of relief.\nInjudicious giving, when one lacks capacity,\nIs something to be scorned."}, {"tib": "རྣམ་པར་སྦྱར་བའི་སྦྱིན་པའང་སྨད་པ་སྟེ། །སྙིང་རྗེའི་བསམ་པ་ཤིན་ཏུ་མ་དག་པར། །\nལུས་དང་སྲོག་གཏོང་བསླབ་བཏུས་ཉིན་ལས་བཀག །ཁ་ན་མ་ཐོས་བསྐྲུན་པའི་སྦྱིན་པ་ཡང་། །", "en": "And so the Shikshasamucchaya has proscribed\nThe giving up of body and of life\nBy those in whom compassion is as yet impure.\nThe giving that abets nonvirtue also is not good\nBut rather something that should be despised."}, {"tib": "གནས་མིན་སྨད་པའི་གནས་ཏེ་བདོག་པ་ལ། །ཞེན་པ་བཏང་བ་སྦྱིན་པའི་ཚད་དུ་བཞེད།\nཆོས་ཀྱི་སྦྱིན་པ་རྣམ་པ་གསུམ་ལས་དངོས། །མོས་པས་སྤྱོད་ལ་ཇི་བཞིན་འདོམས་པར་དཀའ།།", "en": "To give up one's attachment to possessions\nIs held to be the measure of true giving.\nThe gift of Dharma is in three degrees,\nOf which the actual gift is teaching in accordance with one's hearers.\nSuch a thing is hard for those still on the path of aspiration;"}, {"tib": "རང་གི་ཉོན་མོངས་བསལ་བའི་ཆོ་ག་དང་། །བྱམས་དང་སྙིང་རྗེས་གསུང་རབ་བཀླགས་པ་ཡིས། །\nདཀར་པོའི་ཕྱོགས་ཀྱི་རྒྱུད་གྲོལ་སྨོན་ལམ་གདབ། །རང་རྒྱུད་གྲོལ་ནས་འགྲོ་བའི་སྐལ་བ་དང༌། །", "en": "They should instead remove their own defilements.\nWith love and with compassion\nAnd through reading of the scriptures,\nThey should liberate the minds of those who tend to virtue;\nThey should pray for them.\nAnd once their own minds have been freed,"}, {"tib": "རང་བཞིན་འཚམས་པས་གཞན་དོན་གཙོ་བོར་བྱ། །ཚུལ་ཁྲིམས་ངོ་བོ་མི་མཐུན་སྡོམ་པ་སྟེ། །\nདབྱེ་ན་ཉེས་སྤྱོད་སྡོམ་དང་དགེ་ཆོས་སྡུད། །སེམས་ཅན་དོན་བྱེད་རྣམ་པ་གསུམ་དུ་བཤད། །", "en": "Their main task is to bring about the benefit of others\nAccording to their karmic destiny and character.\nDiscipline in essence is to keep oneself from what is inappropriate\nAnd this, divided threefold, means\nTo keep from evil acts, to gather virtue,\nAnd to bring about the benefit of beings."}, {"tib": "སྒོ་གསུམ་མི་དགེ་སྡོམ་པ་ཉེས་སྤྱོད་སྡོམ། །ཕ་རོལ་ཕྱིན་པ་དྲུག་ལྡན་དགེ་ཆོས་སྡུད། །\nགཞན་ལ་ཕན་གདགས་སེམས་ཅན་དོན་བྱེད་ཡིན། །ནང་གསེས་སོ་སོ་ཐར་ལས་བྱང་ཆུབ་སེམས། །", "en": "To keep from evil means abstaining from nonvirtue,\nIn one's thoughts and words and deeds.\nTo gather virtue means the practice of the six perfections.\nBenefiting beings means to work for others' sake.\nThe discipline of Bodhisattvas is more eminent than Pratimoksha,"}, {"tib": "ཁྱད་པར་བཞི་ཡི་སྒོ་ནས་འཕགས་པ་སྟེ། །སོ་ཐར་གཞན་གནོད་གཞི་བཅས་ལྡོག་པ་ཙམ། །\nབྱང་སེམས་དེ་ཡི་སྟེང་དུ་ཕན་འདོགས་བསྣོན། །ས་ཐར་སྤངས་པ་བདུན་བསྡུས་ལུས་ངག་གཙོ། །", "en": "And this is thanks to four distinctive elements.\nThrough Pratimoksha one refrains from harming others\nAnd the wish to do so.\nThe Bodhisattvas do likewise\nBut add to this the help they give to others.\nThe things to be abandoned in the Pratimoksha\nAre summarized as seven negativities\n(The stress being laid on body and on speech),"}, {"tib": "བྱང་སེམས་སྤངས་པ་བཅུ་ཀ་གཙོ་བོར་བྱེད། །ཁྱད་པར་བསླབ་པའི་གནས་ནི་སོ་ཐར་སྐབས། །\nགཞན་གྱི་དོན་དུ་བཅས་པ་མི་འབྲལ་ལ། །བྱང་ཆུབ་སེམས་དཔའ་གཞན་གྱི་དོན་འགྱུར་ན། །", "en": "While Bodhisattvas emphasize and shun all ten.\nOther differences distinguish them.\nFor according to the Pratimoksha,\nRules should not be broken even for the sake of others.\nBut if the seven evil deeds of speech and body\nAre for others' good, the Bodhisattvas are permitted them,"}, {"tib": "ལུས་ངག་གཉིས་ཀྱི་མི་དགེ་རྣམ་པ་བདུན། །གཞན་དོན་འགྱུར་དང་འགྱུར་བར་ཤེས་པ་དང་། །\nརང་གི་དགེ་ཚོགས་མི་སྒྲིབ་འཕེལ་བ་ཡི།། གནས་སྐབས་གསུམ་བརྟགས་གནང་བའི་སྐབས་ཡོད་དེ། །", "en": "Provided that, on threefold scrutiny, they know\nTheir actions are, or will be, for the benefit of beings,\nAnd will further, and not lessen, their own store of merit."}, {"tib": "སེམས་སྟོབས་ཆེན་པོས་མི་ནག་མདུང་ཐུང་ཅན། །བྲམ་ཟེའི་ཁྱེའུ་སྐར་མ་དཔེར་མཚོན་ནས། །\n\nརྣམ་པའི་ཉེས་པའང་དོན་ལ་དགེ་བ་ཡིན། །རྒྱུ་འབྲས་མཐུ་ཅན་བསམ་པས་བྱས་པའི་ཕྱིར། །", "en": "This we find depicted in the tale of Goodheart and Black Spearman,\nAnd of Tararamana, the Brahmin's son:\nAlthough they seemed like sins, their acts were virtuous.\nBut since the strength of action and result derives from the intention,"}, {"tib": "ཡིད་ཀྱི་གསུམ་ལ་གནང་བའི་སྐབས་མེད་དོ། །དེ་ལྟ་ནའང་རྒྱལ་སྲས་སྡོམ་པ་ལ། །\nརང་དོན་ཞི་བདེ་གཉེར་དང་བྱ་དཀའ་སྤང་། །གཞན་ཕྱིར་ཕན་པ་མི་བསྒྲུབ་གང་དད་གང་། །", "en": "The three nonvirtues of the mind can never be allowed.\nIt has been taught that, though this be the case—\nFor those who, though they hold the bodhisattva vows,\nPursue their own advantage and their happiness\n(Avoiding all the actions hard to do\nAnd failing to achieve the benefit of others),"}, {"tib": "ལྟུང་བའི་རྒྱུ་རུ་གཅིག་པར་གསུངས་པ་ཡིན། །དང་པོའི་ལས་ཅན་བྱང་ཆུབ་སེམས་དཔའ་རྣམས། །\nབློ་ནི་གོང་ནས་གོང་དུ་སྤྱོད་གཙོ་བས། །ཐོག་མར་སྡོམ་པའི་ཚུལ་ཁྲིམས་མ་དག་པར། །", "en": "The dispensation just described is but the cause of downfall.\nBodhisattvas who are starting on their path\nShould mainly bring an increase to their qualities of mind.\nAt the outset, while the first of the three disciplines—\nTo keep themselves from evil—is as yet impure,"}, {"tib": "གཞན་གཉིས་གཙོ་བོར་གཉེར་ན་བར་ཆད་མང་། །རབ་ཏུ་བྱུང་བའི་བྱང་ཆུབ་སེམས་དཔའ་ནི། །\nཁྱད་པར་ཅན་དུ་མདོ་སྡེ་རྒྱན་ལས་བཤད། །བྱང་ཆུབ་སེམས་དཔའ་རང་སའི་སྡོམ་པ་ལ། །", "en": "To take the other two as principal will entail many obstacles.\nBest are Bodhisattvas who go forth to homelessness,\nAs the Sutra Ornament declares.\nAnd yet it is not clearly said that such a discipline,\nBelonging to the bodhisattva level,\nShould always be embraced through an authentic pratimoksha ritual."}, {"tib": "སོ་ཐར་མཚན་ཉིད་ཆོ་གས་གསལ་བ་མེད། །སྦྱངས་པ་སྔོན་སོང་སེམས་སྟོབས་ཆེན་པོ་ནི། །\nབསམ་པའི་རྟེན་གཙོ་ཨིནྡྲ་བྷཱུ་ཏི་བཞིན། །གང་ཞིག་ཁྱིམ་པའི་ཕྱོགས་ལ་བརྟེན་པ་རྣམས། །", "en": "For as with Indrabodhi, the intention is supreme\nFor those with previous training and great strength of mind.\nAs well as vows of upavasa and upasaka,\nThe Bodhisattvas who are householders"}, {"tib": "དགེ་བསྙེན་དང་ནི་བསྙེན་གནས་སྡོམ་པའི་སྟེང་། །སྨོན་འཇུག་བྱང་ཆུབ་སེམས་གཉིས་རྟག་ཏུ་བསྲུང་། །\nརབ་ཏུ་བྱུང་རྣམས་དགེ་སློང་དགེ་ཚུལ་དང༌། །དགེ་སློང་མ་ཡི་སྡོམ་པ་གང་ལྡན་སྟེང་། །", "en": "Maintain the twofold bodhichitta constantly\nIn aspiration and in deed.\nThose who have embraced monastic life,\nAs well as vows of bhikshu, shramanera, and shiksamana,"}, {"tib": "སྨོན་འཇུག་གཉིས་བསྲུང་རང་སའི་ཚུལ་ཁྲིམས་ཡིན། །དབྱེ་ན་དགེ་བསྙེན་རྣམ་པ་གཉིས་ཡིན་ཏེ། །\nསྣ་གཅིག་བསྲུང་བ་སྲོག་གཅོད་ལྟ་བུ་སྤང་། །དེ་སྟེང་མ་བྱིན་ལེན་སྤོང་ཕྱོགས་གཅིག་ལྡན། །", "en": "Uphold the bodhichitta both in aspiration and in deed.\nBoth maintain the discipline according to their state.\nUpasakas are differentiated in two kinds.\nThere are those who keep a single precept, such as not to kill.\nIf then they give up stealing, they maintain the vows in part."}, {"tib": "དེ་སྟེང་རྫུན་སྨྲ་སྤུང་བ་ཕལ་ཆེར་བསྲུང་། །དེ་སྟེང་འདོད་ལོག་ཆ་དང་བཅས་སྤངས་ན། །\nཡོངས་རྫོགས་བསྲུང་བའི་དགེ་བསྙེན་དག་ཏུ་འདོད། །རྩ་བཞི་ཆང་དང་ལྔ་ཀ་སྤང་བ་ལ། །", "en": "If then they promise not to lie, they hold a major part of them.\nIf then they turn from sexual misdeeds and keep from alcohol,\nThey are considered upasakas of a complete observance.\nThen, those who have renounced the four roots\nAnd abstain from alcohol,\nRenouncing thus all five,"}, {"tib": "ཚངས་པར་སྤྱོད་པའི་དགེ་བསྙེན་ཞེས་སུ་གྲགས། །རབ་ཏུ་བྱུང་བའི་བསླབ་པའི་གནས་བཅུ་ལས། །\nགསེར་དངུལ་ལེན་པ་བུ་སྨད་གསོ་ཕྱིར་གནང་། །གར་ཕྲེང་གཉིས་པོ་མཚང་ཆུང་གཅིག་ཏུ་བགྲང་། །", "en": "Are honored as upasakas of pure conduct.\nDeriving from the tenfold precepts of the shramaneras,\nBut granted the employ of gold and silver\nFor the maintenance of wives and children,\nAnd with dancing and the use of ornaments\nRegarded as a single minor flaw,"}, {"tib": "ཡན་ལག་བརྒྱད་པའི་ཁྲིམས་ཞེས་གྲགས་པ་གང་། །བསྲུང་མཚམས་མེད་པར་རྟག་ཏུ་བསྲུང་བ་དེ། །\nཙནྡྲ་གོ་མི་ལྟ་བུའི་དགེ་བསྙེན་ཡིན། །དགེ་ཚུལ་སྲོག་གཅོད་གཞན་གྱི་ནོར་འཕྲོག་དང་། །", "en": "Those who keep this \"eightfold discipline,\"\nAt all times and without a limitation,\nAre upasakas according to the way of Chandragomin.\nShramaneras keep ten major precepts:\nThey vow not to kill and not to take the property of others;"}, {"tib": "མི་ཚངས་སྤྱོད་རྫུན་བཅོས་པའི་ཆང་ལ་སོགས། །གར་སོགས་ཕྲེང་སོགས་མལ་ཆེན་མཐོ་བ་དང་། །\nཕྱི་དྲོའི་ཁ་ཟས་གསེར་དངུལ་ལེན་པ་སྤོང་། །བསླབ་པའི་གནས་བཅུ་འཛིན་པ་ཁྱད་པར་ཡིན། །", "en": "They renounce unchastity and lying and the taking of strong drink,\nDancing, ornaments and so forth,\nLofty beds and seats and eating after noon,\nTogether with the use of gold and silver."}, {"tib": "དགེ་སློབ་མ་ནི་དེ་སྟེང་སྐྱེས་པ་ལ། །རེག་པ་ལ་སོགས་སྤོང་བྱེད་བཅུ་གཉིས་ཀྱི། །\nགཉེན་པོ་དང་བཅས་བུད་མེད་ཉོན་མོངས་པས། །ལོ་གཉིས་ལ་སོགས་ཐུབ་བམ་མི་ཐུབ་བརྟག །", "en": "Women who prepare themselves to take full ordination\nMust renounce twelve extra things, like touching men.\nAnd since they're prey to their emotions,\nThey must pass two years' probation, testing thus their aptitude for vows."}, {"tib": "དགེ་སློང་རྩ་བའི་ཕམ་པ་བཞིན་དག་དང་། །ལྷག་མ་བཅུ་གསུམ་སྤང་ལྟུང་སུམ་ཅུ་དང་། །\nལྟུང་བྱེད་འབའ་ཞིག་དགུ་བཅུ་ཐམ་པ་དང་། །སོར་བཤགས་སྡེ་བཞི་ཉེས་བྱས་བརྒྱ་བཅུ་གཉིས། །", "en": "Bhikshus must forswear four radical defeats,\nThirteen residual faults, and thirty downfalls that require rejection,\nNinety \"mere downfalls\" and four faults that must be pointedly confessed,\nTogether with one hundred and twelve wrong actions—"}, {"tib": "ཉིས་བརྒྱ་ལྔ་བཅུ་རྩ་གསུམ་རྣམ་གྲངས་དང་། །དགེ་སློང་མ་ལ་སུམ་བརྒྱ་དྲུག་ཅུ་བཞི། །\nསོ་སོའི་རྩ་བ་བཞི་བརྒྱད་ཕམ་པ་དང༌། །ཉེས་བྱས་སྦོམ་པོ་ཕྱོགས་མཐུན་ཁྱད་པར་ཡོད། །", "en": "Numbering thus two hundred and fifty-three wrong deeds.\nFor bhikshunis, three hundred and sixty-four acts must be shunned:\nEight radical defeats (four specific ones are added to the four already mentioned).\nTo these are added wrongful acts\nAnd different species of related misdemeanors such as \"incomplete infractions.\""}, {"tib": "ཕམ་པས་སྡོམ་པ་རྩ་ནས་གཏོང་བ་ཡིན། །ཕྱིན་ཆད་སོར་ཆུད་རུང་དང་མི་རུང་མཚམས། །\nའཆབ་སེམས་སྐྱེས་དང་མ་སྐྱེས་དག་ལ་རག །བསྲུང་བྱ་མི་ཤེས་བསྲུང་བར་རློམ་པ་མཚར། །", "en": "Through the defeats, the ordination is completely lost.\nThe intention to conceal the fault, or not,\nDetermines the criterion whereby\nThe vows may later be repaired.\nIt is indeed amazing that some claim to keep the vows\nAnd yet are ignorant of what they should be keeping."}, {"tib": "ལྟུང་བ་ཤེས་པ་ཙམ་གྱིས་གསོ་སྦྱོང་སླ། །ལྟུང་བ་འབྱུང་བའི་སྒོ་བཞིའི་དང་པོ་ཡང་། །\nམི་ཤེས་པ་ཞེས་ཐོགས་མེད་བཞེད་པ་ཡིན། །བསྒྲུབ་པའི་བསླབ་བྱ་གཞི་གསུམ་ཆོ་ག་དང་། །", "en": "Through just a knowledge of the downfalls\nIt is easy to restore and purify the vows.\nIndeed, of the four doors that lead to downfalls,\nIgnorance is foremost, as Asanga has explained.\nThe precepts to be implemented are\nThe rituals of the three foundations"}, {"tib": "བཅུ་བདུན་བསླབ་བྱ་འཇུག་པའི་ཚུལ་ཁྲིམས་སོ། །འདི་ན་ཕམ་ལྷག་བཅུ་བདུན་མ་གཏོགས་པའི། །\nམི་རུང་ལོངས་སྤྱོད་བྱིན་གྱིས་བརླབ་པ་ནི། །དུས་མ་ཡིན་པར་ཁ་ཟས་སྤྱོད་དགོས་ན། །", "en": "And those of seventeen precepts that remain.\nThis is the discipline of things to be adopted.\nExcepting seventeen transgressions\n(Four defeats and faults that are residual)\nWhen something untoward must needs be done,\nIt must be blessed. And so, if food be taken at improper times,"}, {"tib": "སྒྲ་མི་སྙན་པའི་གླིང་དུ་མོས་པ་དང་། །དེ་བཞིན་ཁྲུས་ལ་ནད་པ་གོས་ལྷག་གམ། །\nརུང་བ་མ་ཡིན་བགོ་བ་དཀར་པོ་དང༌། །ཀོ་པགས་སོགས་ལ་ཕོངས་པས་ཉམ་ཐག་པར། །", "en": "One thinks that one is dwelling in the northern continent.\nSo too, when bathing, one must think that one is sick,\nAnd when constrained to wear additional or improper clothing\n(White in color, made of skin or fur),\nOne keeps in mind that without such materials\nOne would be at great loss,"}, {"tib": "སྲོག་བསྲུང་སླད་དུ་གནང་བ་ཡིན་སྙམ་དང༌། །རིན་པོ་ཆེར་རེག་དཀོན་ཅོག་མཆོད་པ་དང་། །\nསེམས་ཅན་གསོ་བའི་སླད་དུ་གནང་བར་བསྒོམ། །གནང་མེད་བཀག་པ་མེད་པ་རྗེས་མཐུན་བརྩི། །", "en": "Wherefore such things are sanctioned as a means to save ones life.\nIf one is forced to handle precious substances,\nOne thinks that this has been allowed for making offerings\nTo the Three Jewels or to succor living beings.\nAnd as for what is neither banned nor yet permitted,\nAn estimate is made according to the precepts."}, {"tib": "ཐམས་ཅད་ཡོད་སྨྲ་ཕལ་ཆེན་སྡེ་པ་དང་། །གནས་བརྟན་པ་དང་མང་པོས་བཀུར་བ་སྟེ། །\nསྡེ་པ་བཞི་ཀའི་བསླབ་པ་ཐམས་ཅད་ལ། །སྟོན་པའི་བཅས་པས་མ་ཁྱབ་མི་སྲིད་པས། །", "en": "The rules of all the four monastic schools—\nSarvastivada and Mahasanghika, Sthavira and Sammitiya—\nCannot but be covered by the precepts of the Buddha;\nEach is therefore able to uphold the entire training."}, {"tib": "བསླབ་པ་ཀུན་ལ་དབང་ཐོབ་བྱེད་པ་ཡིན། །མྱ་ངན་འདས་བར་བསྔོ་བས་ལྷག་པའི་ཁྲིམས། །\nགཞན་ལ་ཕན་པ་བསྒྲུབ་པས་བྱང་སྡོམ་ལ། །དབང་བསྐུར་རྣལ་མ་ཐོབ་ན་སྔགས་སྡོམ་ཏེ། །", "en": "The higher discipline is dedicated\nTo the state beyond all suffering.\nThe bodhisattva vow effects the benefit of others.\nReceiving true empowerment, one takes the mantra vow."}, {"tib": "གསུམ་རྫོགས་བསླབ་བྱ་ཡོན་ཏན་མཐའ་དག་མང༌། །ངོ་བོ་གཅིག་ལ་ལྡོག་པ་ཐ་དད་དུ། །\nགང་ཟག་གཅིག་གི་རྒྱུད་ལ་གནས་པ་ཡིན། །ནང་འགལ་བྱུང་ན་གོང་མ་གཙོར་བཏོན་པ། །", "en": "The precepts of these three, when perfectly observed,\nGive rise to all the many perfect qualities.\nOne in nature but of separate aspect,\nThe three vows all subsist\nWithin the mindstream of a single individual.\nWhen they seem in contradiction, higher vows take precedence,"}, {"tib": "སྔོན་བྱོན་མཁས་གྲུབ་རྣམས་ཀྱི་ལུགས་ལ་གྲགས། །འོག་མའི་རྣམ་པ་འགལ་བ་ལྟར་སྣང་ཡང་། །\nགནོད་པ་སྤོང་དང་ཕན་འདོགས་དགོས་པ་མཐུན། །གང་ཞིག་འགལ་ན་གནང་བར་མི་སྲིད་ལ། །", "en": "For so the teaching of the accomplished masters of the past proclaims.\nFor even if there seems to be a conflict with the lower vows,\nThere is agreement with their purpose:\nHarm must be avoided, benefit secured.\nTrue contradiction, if there were one, could not be permitted."}, {"tib": "གནང་ན་འགལ་བར་མི་སྲིད་དེ་ཆོས་ཅན། །འདི་ལྟ་ཉན་ཐོས་པ་ལ་ལྟུང་བ་དང་། །\nབྱང་ཆུབ་སེམས་དཔར་ཕྱོགས་མཐུན་ཉེས་བྱས་སུ། །འགྱུར་བའི་མྱོས་བྱེད་སྔགས་ཀྱི་དམ་རྫས་སུ། །", "en": "If there is permission, there can be no contradiction.\nAnd so it is that alcohol, a downfall for the Shravakas\nAnd considered likewise as a fault for Bodhisattvas,\nIs in the Mantrayana savored as a substance of samaya"}, {"tib": "སྤྱོད་པའི་སྐྱེས་བུའི་རྟོག་ཚོགས་ལྷར་ཤར་བས། །གཞི་དང་བསམ་པ་གཉིས་ཀ་གཞན་དུ་འགྱུར། །\nདགེ་སློང་མ་ཡིན་བྱང་ཆུབ་སེམས་དཔའོང་མིན། །ཐབས་བྲལ་ཆགས་སྲེད་ཉོན་མོངས་མཐུས་ནོན་མིན། །", "en": "By those for whom the host of thoughts arise as deities;\nBoth alcohol and attitude are thus transformed.\nThey are not \"monks\" nor are
