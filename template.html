Clearing—abiding as five.\nTheir functions, respectively: sustaining life, generating digestive heat,\nLifting the body and acting, and the going and coming of the breath, and..."}, {"tib": "འགྲོ་འདུག་གཤང་གཅི་འཕེན་པའི་བྱ་བ་བྱེད།། དེའང་ཕོ་རླུང་གྱེན་རྒྱུ་སྟོད་ན་གནས།\n།མོ་རླུང་ཐུར་སེལ་སྨད་དང་མ་ནིང་མཉམ། །ནང་གི་རླུང་གི་འབྱུང་ལྔའི་ཁ་དོག་ཅན། །", "en": "Acting to eject feces and urine and to move the body.\nFurthermore, the male Upward-Moving wind acts in the upper body;\nThe female Downward-Clearing acts in the lower; the [others] are equal to neutral.\nThe inner winds possess the bad colors of the five elements."}, {"tib": "ཕུང་པོ་ཁམས་དང་སྐྱེ་མཆེད་གནས་པའི་རྟེན། །དུག་ལྔ་དང་ནི་ཡེ་ཤེས་རྣམ་པ་ལྔ།\n།རྒྱུ་འབྲས་ལྟ་བུར་མཆེད་པའི་རྟེན་བྱེད་དོ། །ཁྱད་པར་དྭངས་མའི་རླུང་ལྔ་དྷུ་ཏིར་ཆུད། །", "en": "The support for the abiding of the aggregates, elements, and sense fields;\nThe five poisons and the five primal wisdoms\nAct as the support for their spreading like cause and effect.\nIn particular, when the five refined winds enter the central channel..."}, {"tib": "ཟད་པར་ས་ཆུ་མེ་རླུང་ནམ་མཁའ་ཡི། །ཏིང་ངེ་འཛིན་དང་ཡོན་ཏན་རྫུ་འཕྲུལ་འགྲུབ།\n།གསང་བའི་རླུང་ནི་ཡེ་ཤེས་རྣམ་པ་ལྔ། །རགས་པའི་ཆོས་དང་རྣམ་པར་འགལ་བ་ཡིན། །", "en": "The exhaustions of Earth, Water, Fire, Wind, and Space [elements],\nAnd samadhi, qualities, and miracles are accomplished.\nThe secret winds are the five primal wisdoms;\nThey are contrary to the aspect of gross phenomena."}, {"tib": "གསུམ་པ་བཀོད་པ་བྱང་ཆུབ་སེམས་ཀྱི་ཁམས། །རོ་མ་ལས་ནི་ཟླ་བའི་བདུད་རྩི་དང༌།\n།བརྐྱང་མ་ལས་ནི་ཉི་མའི་རྡུལ་འབའ་ཅིང་། །ཕོ་ཡི་རྐྱང་མ་མོ་ཡི་རོ་མའི་སྣ། །", "en": "Thirdly, the arrangement of the element of Bodhichitta:\nFrom the Roma, the nectar of the moon; and\nFrom the Kyangma, the sun-dust descends.\nThe tip of the male Kyangma and the female Roma..."}, {"tib": "མདུད་པར་གྱུར་པས་ཁམས་གཉིས་འཛག་པ་བསྲུང་། །དེ་ལས་གཞན་དུ་གཉིས་པ་ལས་མཆེད་པའི།\n།རྩ་མདུད་ཀུན་ན་དྭངས་མ་དཀར་དམར་གཉིས། །དཔའ་བོ་དང་ནི་རྣལ་འབྱོར་མའི་ཚུལ་དུ། །", "en": "Because they are knotted, the leakage of the two elements is guarded.\nTherefore, since they spread from those two otherwise [if not knotted],\nAt all the channel knots, the refined white and red [elements],\nIn the manner of Dakas and Yoginis..."}, {"tib": "འཁྲིལ་ཞིང་སྦྱོར་བས་བདེ་སྟོང་མཆོད་པ་ལེན། །མདོར་ན་གནས་པ་རྩ་ནི་ཡུར་བ་འདྲ།\n།གཡོ་བ་རླུང་ནི་འགྲོ་འོང་ཁ་ལོ་པ། །བྱང་ཆུབ་སེམས་ནི་ཆུ་འདྲ་ཁྲིད་སར་འདུ། །", "en": "By embracing and uniting, they take the offering of bliss-emptiness.\nIn brief, the abiding channels are like irrigation ditches;\nThe moving wind is the driver, the charioteer;\nThe Bodhichitta is like water collecting where it is led."}, {"tib": "འཁོར་ལོ་དྲུག་ཏུ་བརྩེགས་པའི་སྒྲ་གཅན་དབྱིངས། །སྲོག་དང་རྩོལ་བའི་ཤིང་རྟས་དྲངས་པ་ལས།\n།དབུ་མའི་མདུད་པ་གཉིས་གཉིས་གྲོལ་བ་དང་། །རླུང་དང་ཁམས་ཀྱི་དྭངས་མ་རྣམ་གཉས་རེ། །", "en": "In the Space of Rahu [Central Channel] where six wheels are stacked,\nThrough being drawn by the chariot of Life and Exertion [winds],\nThe knots of the Central Channel are released two by two, and\nThe refined portions of the wind and elements, two by two..."}, {"tib": "སྒྲ་གཅན་ལྟོར་ཞུགས་དང་པོའི་ས་ནས་བཟུང་། །ས་བཅུའི་ཡོན་ཏན་གོང་འཕེལ་གཙུག་ཏོར་འགྲོ།\n།ཁྱད་པར་སྒྱུ་འཕྲུལ་དྲྭ་བ་གསང་ཐིག་ལུགས། །སྣོད་བཅུད་རང་ལ་རྫོགས་པ་ཕུང་པོའི་གྲོང་། །", "en": "Enter the belly of Rahu; beginning from the First Ground,\nThe qualities of the Ten Grounds increase and go to the Ushnisha.\nIn particular, the system of the Net of Magical Illusion [Guhyagarbha] and the Secret Drop:\nThe vessel and contents perfected in oneself; the City of the Aggregates."}, {"tib": "དུས་གསུམ་ལུང་དུ་མ་བསྟན་བདེ་གཤེགས་སྙིང་།།མཐའ་དག་མངོན་འཚང་རྒྱ་བ་རྡོ་རྗེའི་གདན།\n།སྙིང་ཁ་དཔལ་གྱི་བེའུའི་ཁོང་སེང་ན། །རྩ་ཡི་དྭངས་མ་བརྒྱད་དུ་གནས་པ་ལས། །", "en": "The Sugatagarbha, indeterminate in the three times,\nManifestly awakening as the entirety, the Vajra Throne.\nIn the hollow of the glorious knot of the heart,\nThere are eight refined channels abiding."}, {"tib": "དབུས་མ་གསུམ་ནི་སྐུ་གསུམ་ཆོས་ཉིད་རྟེན། །མདུན་མ་གཅིག་ནི་ཡེ་ཤེས་འཆར་བའི་རྩ།\n།རྒྱབ་ན་ཡོན་ཏན་རྩ་ལས་ཞིང་ཁམས་འཆར། །གཡོན་ན་རང་རྒྱུད་རྩ་གསུམ་འཁྲུལ་སྣང་རྟེན། །", "en": "The three central ones are the support of the Three Kayas and Dharmata.\nThe one in front is the channel where wisdom dawns.\nIn the back, from the channel of qualities, the fields dawn.\nOn the left, the three channels of one's own continuum are the support of delusive appearance."}, {"tib": "སོ་སོའི་དབུས་ན་འཁོར་འདས་ཡིག་འབྲུ་ནི། །སྦྱང་གཞི་སྦྱོང་བྱེད་ཚུལ་དུ་གནས་པ་རྣམས།\n།སྐུ་གསུང་ཐུགས་ཀྱི་ཡི་གེས་དག་པར་བྱེད། །ཀུན་གྱི་དབུས་ན་དྭངས་མའི་རྩ་དཀར་པོ། །", "en": "In the center of each, the syllables of Samsara and Nirvana\nAbide in the manner of the base of purification and the purifier.\nThey are purified by the syllables of Body, Speech, and Mind.\nIn the center of all, the refined white channel..."}, {"tib": "རྟ་རྔའི་བཅུ་ཆ་ཙམ་དུ་ཕྲ་བའི་ནང་། །རྡུལ་དང་དབུགས་ཀྱི་དྭངས་མ་འདྲེས་པའི་འོད།\n།ཁ་དོག་ལྔ་པ་ཤིན་ཏུ་ཕྲ་བ་ཉིད། །རང་བཞིན་འོད་གསལ་བྱང་ཆུབ་སེམས་ཀྱི་རྟེན། །", "en": "Inside the subtle [channel], about a tenth of a horse-hair's width,\nThe light where the refined dust and breath are mixed,\nPossessing five colors, extremely subtle.\nIt is the support of the Bodhichitta, the nature of luminosity."}, {"tib": "ཀུན་བཟང་རིགས་ལྔ་བཞུགས་པའི་གཞལ་མེད་ཁང་། །གང་དུ་རླུང་སེམས་དྭངས་མ་འདས་པའི་ཚེ།\n།མྱ་ངན་འདས་པའི་ཞིང་སྣང་མཐའ་དག་འཆར། །སྣང་ཆའི་འོད་ལྔ་སྟོང་ཆའི་ཆོས་སྐུ་གཉིས། །", "en": "The Celestial Palace where the Five Families of Samantabhadra dwell.\nAt the time when the refined wind and mind gather there,\nThe vision of the fields of Nirvana dawns in its entirety.\nThe five lights of the appearance portion and the Dharmakaya of the emptiness portion..."}, {"tib": "རོ་གཅིག་འདྲེས་པས་ལམ་གྱི་ཚོགས་གཉིས་རྫོགས། །འོག་མིན་རྣམ་དག་སྟུག་པོ་བཀོད་པ་ཞེས།\n།གཞན་དུ་མི་གནས་སྒྲིབ་པ་མཐའ་དག་པ། །ནམ་ཞིག་སྤངས་པའི་དུས་དེར་ལྷུན་གྱིས་གྲུབ། །", "en": "By mixing into one taste, the two accumulations are completed by the path.\nThat known as the \"Dense Array of the Pure Akanishtha\"—\nIt does not exist elsewhere; the entirety of obscurations,\nAt the time when they are abandoned, is spontaneously established there."}, {"tib": "དེ་ཕྱིར་ལུས་ནི་ཡེ་ཤེས་ཆེན་པོའི་རྟེན། །འཁོར་བ་ཉིད་ནའང་ངོ་བོའི་བཞུགས་ཚུལ་ལ།\n།ཉམས་དང་དམན་པར་གྱུར་པ་གཉིས་ཀ་མེད། །འགྱུར་བ་མེད་པའི་དོན་དམ་བྱང་ཆུབ་སེམས།།", "en": "Therefore, the body is the support of great primal wisdom.\nEven in Samsara itself, regarding the manner of the essence's abiding,\nThere is neither impairment nor inferiority.\nThe ultimate Bodhichitta which is unchanging..."}, {"tib": "ཏིལ་ལ་མར་གྱི་ཁྱབ་པ་ཇི་བཞིན་ནོ། །དེ་ལྟར་རྡོ་རྗེ་ལུས་ཀྱི་གནས་ལུགས་དང་།\n།གདོད་མ་གཞི་ཡི་བཞུགས་ཚུལ་ཤེས་བྱས་ནས། །གཏུམ་མོ་དང་ནི་སྒྱུ་ལུས་ཉིང་འཁྲུལ་ལམ། །", "en": "Is like sesame oil pervading the sesame seed.\nThus, having known the natural state of the Vajra Body\nAnd the manner of the abiding of the primordial ground,\nTummo [inner heat] and the Illusory Body, the Path of Dream..."}, {"tib": "འོད་གསལ་བར་དོ་འཕོ་བ་རྣམ་པ་དྲུག །སྐྱེས་བུའི་རྩོལ་བས་འགྲུབ་ཀྱིས་གཞན་རྐྱེན་ལ།\n།རག་མ་ལུས་ཕྱིར་རང་ལུས་ཐབས་ཀྱི་ལམ། །རྩ་ཐིག་རླུང་ལ་གནད་དུ་སོང་ནས་སླར། །", "en": "Luminosity, Bardo, and Phowa—the six aspects.\nAlthough accomplished by the exertion of the individual,\nBecause they do not depend on other conditions, they are the Method Path of one's own body.\nHaving gone to the point where channels, drops, and winds act harmfully, then..."}, {"tib": "བདེ་སྟོང་ལམ་དུ་བྱེད་པ་གཞན་ལུས་ཏེ། །ཀུན་ཀྱང་ལམ་དུ་འགྲོ་བ་ཐབས་ཀྱི་ལམ།\n།གཉིས་པ་སྣང་བ་མེད་པའི་རྫོགས་རིམ་ནི། །རྣམ་པར་གྱུར་པའི་བསྐྱེད་རྫོགས་གང་ཡིན་ཡང་། །", "en": "Taking bliss-emptiness as the path is the Other-Body [consort practice].\nSince all [practices] proceed as the path, it is the Path of Methods.\nSecondly, regarding the Perfection Stage without appearance:\nWhatever the transformed Generation and Perfection stages are..."}, {"tib": "དག་པའི་སྣོད་བཅུད་བརྟན་གཡོར་སྣང་བ་ཀུན། །འོད་དུ་ཞུ་ནས་སྙིང་གའི་ས་བོན་རྣམས།\n།ཐིག་ལེར་ཐིམ་པ་དེ་ཡང་མས་རིམ་ནས། །སྟོང་བར་གྱུར་པ་ནམ་མཁའི་ངོ་བོ་ཉིད། །", "en": "All appearances of the pure vessel and contents, stable and moving,\nMelt into light; the seeds at the heart\nDissolve into the Bindu; that also, gradually from the bottom,\nBecomes emptiness, the nature of the sky itself."}, {"tib": "ཡེ་ཤེས་ཆེན་པོའི་སྤྱོད་ཡུལ་ཉིད་ལ་བཞག །བསྐྱེད་རིམ་གྱིས་ནི་སྣང་བའི་བདེན་ཞེན་འགོག\n།རྫོགས་རིམ་གྱིས་ནི་སྒྱུ་མའི་ཞེན་རྟོག་སྤོང་། །བདེ་གསལ་མི་རྟོག་ལྷན་སྐྱེས་ཡེ་ཤེས་འཆར།།", "en": "One places [the mind] in the very domain of Great Primal Wisdom.\nBy the Generation Stage, the attachment to the truth of appearance is stopped.\nBy the Perfection Stage, the fixation on illusion is abandoned.\nBliss, clarity, and non-thought—co-emergent wisdom dawns."}, {"tib": "ཟབ་པའི་རྫོགས་རིམ་བླ་ན་མེད་པ་རྣམས། །བླ་མེད་རྒྱུད་ལས་འོག་མར་གསུངས་པ་མེད།\n།དབང་རྣོན་ཚེ་གཅིག་རྡོ་རྗེ་འཆང་འགྲོ་བའི། །ཉེ་ལམ་སྦས་པ་ཤིན་ཏུ་ཟབ་མོ་ཡིན། །", "en": "The profound Unsurpassed Perfection Stages\nAre not taught in the Tantras below the Unsurpassed.\nThe nearby path where one with sharp faculties becomes Vajradhara in one life;\nIt is called \"The Hidden, Extremely Profound.\""}, {"tib": "གསུམ་པ་མཐུན་པའི་གྲོགས་གྱུར་དམ་ཚིག་ནི། །སྔགས་ལ་ཞུགས་པའི་བརྟུལ་ཞུགས་མི་ཉམས་བསྲུང་།\n།ཐབས་དང་གཉེན་པོའི་རྟེན་འབྲེལ་མི་འཆོལ་བ། །རྨ་བྱའི་མགྲིན་པར་བཙན་དུག་ཞུགས་ལྟར་སྤྱད། །", "en": "Third, the Samaya which acts as the harmonious friend:\nOne guards the discipline of entering Mantra without deterioration.\nNot confusing the dependent arising of method and antidote,\nOne practices like a peacock entering upon aconite poison."}, {"tib": "དེ་ལ་དམ་ཚིག་དང་ནི་སྡོམ་པའི་ཁྱད། །དམ་ཚིག་འདའ་བར་བྱ་བ་མ་ཡིན་ལ།\n།སྡོམ་པ་བྱ་དང་མི་བྱའི་ངེས་པ་སྟེ། །ངོ་བོ་གཅིག་ལ་ལྡོག་ཆས་དབྱེ་བའོ། །", "en": "Regarding the difference between Samaya and Vow:\nSamaya is not to be transcended;\nVow is the certainty of what to do and what not to do.\nThey are one in essence, distinguished by their isolates [conceptual aspects]."}, {"tib": "ཀུན་གྱི་སྤྱི་དོན་སྔགས་སྡོམ་མ་ཐོབ་དང་། །སྨྱོ་བ་ལ་སོགས་འདུ་ཤེས་རང་བཞིན་དུ།\n།མི་གནས་པ་ལ་ལྟུང་དང་དངོས་གྲུབ་མེད། །སྔགས་སྡོམ་ལྡན་ཞིང་མ་ཉམས་མ་བཏང་ལ། །", "en": "Furthermore, if it is a Mantra Vow, Samaya is mixed with it.\nIf it is a Samaya, it does not [necessarily] imply the Vow is mixed.\nThe general meaning of all: Not having obtained Mantra Vows, and\nIn the nature of notions such as madness..."}, {"tib": "ཤེས་པ་རང་བཞིན་རྣལ་དུ་གནས་པ་དེ། །ལྟུང་བ་དང་ནི་དངོས་གྲུབ་གཉིས་ཀའི་སྣོད།\n།བྱང་ཆུབ་སེམས་ལས་གཞན་པའི་རྩ་ལྟུང་ལ། །ཀུན་དཀྲིས་ཞེས་བྱ་ད་དུང་བྱ་བ་དེ། །", "en": "For one who does not abide [in sanity], there is neither downfall nor siddhi.\nOne who possesses Mantra Vows and has not spoiled or given them up,\nWhose consciousness abides in its natural state—\nThat is the vessel for both downfalls and siddhis."}, {"tib": "བྱེད་འདོད་མ་ལོག་དེ་ལ་འགྱོད་པ་མེད། །རང་ངོར་ལྟོས་པའི་ངོ་ཚ་ཤེས་པོ་དང་།\n།གཞན་ངོར་ལྟོས་པའི་ཁྲེལ་ཡོད་མེད་པ་སྟེ། །ཆོས་གསུམ་ཚང་བའི་ཀུན་སློང་བྱ་བའི་མཐར། །", "en": "Regarding root downfalls other than Bodhichitta,\nIt is called \"Entanglement\" (Kun dkris); if one still does it,\nAnd the desire to do it has not reversed, and there is no regret for it,\nAnd one possesses knowledge [lack] of shame regarding oneself..."}, {"tib": "གཏུགས་པ་དེ་སྲིད་རྒྱུན་ཆགས་ཡོད་གྱུར་ན། །ཀུན་དཀྲིས་ཚང་བའི་ཕམ་པར་གྱུར་པ་ཡིན།\n།དུས་ཀྱི་བར་ཆད་རྒྱུན་ཆགས་མེད་པའམ། །ཆོས་གསུམ་གང་ལས་ཅིག་ཤོས་མ་ཚང་ན། །", "en": "And lack of embarrassment regarding others;\nAt the end of an action where the motivation of the three factors is complete,\nIf it exists continuously for that duration,\nIt becomes a Defeat (Pham pa) where the Entanglements are complete."}, {"tib": "བྱ་བའི་ཡན་ལག་མ་ཚོགས་སྦོམ་པོར་འགྱུར། །དེ་ཡིས་ཤེས་བྱས་རྩ་བ་ཡན་ལག་ཀུན།\n།ཡིད་ཀྱིས་མི་སྤོང་ལུས་ཀྱིས་དོར་མི་བྱ། །ཉིན་དང་མཚན་མོ་ཆ་དྲུག་བགོས་པ་ལ། །", "en": "If there is no continuity of the time [duration] of the obstacle,\nOr if one of the three factors is incomplete,\nThe branch of action is not assembled; it becomes a Gross Infraction (Sborm po).\nKnowing that, regarding all Roots and Branches..."}, {"tib": "ཆ་རེའི་ནང་དུ་རྩ་ལྟུང་བཅུ་བཞི་པོའི། །ཉེས་པ་བྱུང་ངམ་མ་བྱུང་སྔོ་བགྲང་བྱ།\n།གོས་ན་འགྱོད་པ་བསྐྱེད་ཅིང་ཕྱིར་འཆོས་སེམས། །གོས་པ་མིན་ན་དགའ་བ་སྒོམ་ཞིང་བསྔོ།།", "en": "Do not abandon with the mind; do not discard with the body.\nRegarding the division of day and night into six parts:\nWithin each part, regarding the fourteen root downfalls,\nOne should calculate whether a fault has occurred or not."}, {"tib": "སྔོན་ཆད་གོས་སམ་མ་གོས་གང་ཡིན་ཀྱང་། །ཕྱིན་ཆད་སྲོག་ལ་བབ་ཀྱང་ཉེས་བྱས་ཀྱི།\n།གོས་པར་མི་བྱའི་སྡོམ་སེམས་ཤིན་ཏུ་བསྟེན། །གང་ཚེ་ཆ་དྲུག་གང་ཡང་རུང་བའི་ནང་། །", "en": "If stained, generate regret and the mind of restoration.\nIf not stained, meditate on joy and dedicate.\nWhether stained in the past or not, whatever it is,\nHenceforth, even at the cost of life, regarding negative deeds..."}, {"tib": "སྔོ་བགྲང་བྱེད་པའི་འདུ་ཤེས་རྨོངས་གྱུར་ན། །ཁ་ན་མ་ཐོ་སྦོམ་པོ་ཞེས་པ་འབྱུང་།\n།དྲུག་ཀ་འདས་ན་སྦོམ་པོ་དྲུག་ཏུ་འགྱུར། །ཞག་དེའི་ཁོང་དུ་ཕྱིར་བཅོས་མ་གྲུབ་ན། །", "en": "Rely utterly on the binding mind of \"I will not be stained.\"\nWhenever, within any of the six periods,\nOne becomes deluded regarding the notion of performing the calculation,\nThe fault called \"Gross Infraction\" (Sborm po) arises."}, {"tib": "ཕྱི་མའི་སྐྱ་རེངས་དང་པོ་འཆར་བ་དང་། །སྦོམ་པོ་བཅུ་གཉིས་དག་ཏུ་འགྱུར་བར་བཤད།\n།ཡན་ལག་དམ་ཚིག་ལའང་དེ་ཡིས་འགྲེ། །ཐོག་མར་བླ་མེད་སྤྱི་ལ་གཅེས་པའི་ཆིངས། །", "en": "If all six pass, it becomes six Gross Infractions.\nIf restoration is not accomplished within that day,\nUpon the rising of the first dawn of the next,\nIt is said it becomes twelve Gross Infractions."}, {"tib": "རྩ་ལྟུང་བཅུ་བཞིའི་རབ་དབྱེ་འདི་ལྟར་བརྟག །དང་པོ་དབང་ཐོབ་སློབ་དཔོན་སྨོས་ཅི་དགོས།\n།སྔགས་རྒྱུད་ཚིགས་བཅད་གཅིག་པ་ཡན་ཆད་བཀྲལ། །ལམ་གྱི་མན་ངག་ཟབ་མོ་སྟོན་གསུམ་ལ། །", "en": "Regarding branch samayas also, it follows that pattern.\nFirst, the binding outline cherished generally for Unsurpassed [Tantra].\nOne should examine the divisions of the fourteen root downfalls thus:\nFirst: The Master who has conferred empowerment—what need to mention?"}, {"tib": "ཆོས་ཀྱི་འབྲེལ་བའི་བསྙེན་བཀུར་ཁུར་བོར་བརྙས། །དེ་ལ་སྔགས་ཀྱི་དངོས་གྲུབ་ཡོད་མ་ཡིན།\n།གཉིས་པ་སྡོམ་པ་གསུམ་དང་བསླབ་པའི་གནས། །བདེ་བར་གཤེགས་པའི་གནང་བཀག་མཚམས་ལས་འདས། །", "en": "One who has explained from a Mantra Tantra even a single verse;\nAnd shown the profound pith instructions of the path—the three.\nTo carry contempt, physically or verbally, for the relationship of Dharma;\nFor that person, there is no Mantra Siddhi."}, {"tib": "དེ་བཞིན་མཚན་ཉིད་ལྡན་པའི་བླ་མ་ཡི། །ཡུལ་དུས་ལ་དགོངས་བཀའ་ལ་ཁྱད་བསད་ཡིན།\n།གསུམ་པ་དབང་གྲལ་གཅིག་ཏུ་འདྲེས་པའི་མཆེད། །བསྐུར་ཞིང་བརྙས་བྱས་དམིགས་ཀྱིས་བསལ་ནའང་། །", "en": "Second: Regarding the three vows and the points of training,\nTransgressing the boundaries of permission and prohibition of the Sugata.\nSimilarly, regarding the command of a Master possessing characteristics,\nIntended for the place and time—it is to hold it in contempt."}, {"tib": "མཐའ་ཡས་སེམས་ཅན་བདེ་གཤེགས་སྙིང་པོའི་སྤྱན། །ཡིན་ཕྱིར་རིང་དང་ཉེ་བའི་མཆེད་ལའང་མཚུངས།\n།བཞི་པ་སྦྱོར་བ་རྩུབ་པའི་སེམས་ཅན་ཞིག །མཐོང་བའི་ཆོས་ལ་ལས་ཀྱི་མནར་གྱུར་པ། །", "en": "Third: The siblings who have mixed in the single row of empowerment;\nTo criticize and abuse them. Even if singling out [one],\nSince limitless sentient beings are siblings of the Sugatagarbha,\nTherefore, it is equal for both distant and close siblings."}, {"tib": "དེ་ལ་དགའ་བ་བསྒོམས་ནས་བྱམས་པའི་སེམས། །གཏོང་བ་བྱང་ཆུབ་སེམས་དཔར་རབ་ལྕི་ན།\n།གཞན་བདེ་བྲལ་བར་འདོད་ལ་སྨོས་ཅི་དགོས། །ལྔ་པ་གཞན་དོན་གཉེར་བའི་བྱང་ཆུབ་སེམས། །", "en": "Fourth: Regarding a sentient being with a rough train of thought,\nWho is tormented by karma in this visible life;\nAbandoning the mind of love by meditating on joy regarding that [suffering]\nIs extremely heavy for a Bodhisattva."}, {"tib": "སྤངས་པའི་མོད་ལ་སྨོན་སེམས་གཏོང་བའི་ཕྱིར། །ཀུན་དཀྲིས་ཚང་བའི་ཕམ་པར་གྱུར་པ་ཡིན།\n།གནང་བའི་སྐབས་བདུན་མིན་པར་ཁུ་བ་ཕྱུང་། །དྲུག་པ་ཐེག་པ་གསུམ་ལྟོས་རྒྱལ་བའི་བཀའ། །", "en": "What need to mention desiring [them] to be separated from happiness?\nFifth: The Bodhichitta of aspiring for the welfare of others;\nBecause abandoning the aspiration mind at that moment casts it away,\nIt becomes a Defeat with complete Entanglements."}, {"tib": "དཔྱས་ཤིང་སྟོན་པས་མ་གསུངས་ཞེས་སྨྲ་དང་། །ལས་དང་དངོས་གྲུབ་རྒྱུར་རུང་བསྟན་བཅོས་གཞན།\n།རྗེས་གནང་བྱིན་བརླབས་བཀའ་རུ་མ་བལྟས་བརྙས། །བདུན་པ་དབང་གི་ཆོ་ག་མ་བྱས་དང་། །", "en": "Ejecting the jasmine [semen] except in the seven permitted situations.\nSixth: Scolding the Word of the Victor relying on the three vehicles,\nSaying \"The Teacher did not speak this\"; and\nOther treatises suitable as causes for karma and siddhis..."}, {"tib": "མ་རྫོགས་ཉམས་དང་སྣོད་ངན་ཟབ་མོས་སྐྲག།འདུལ་བའི་དུས་སྐབས་གནས་ཀྱི་བསྐལ་པ་ལ།\n།གསང་སྔགས་ཟབ་མོའི་དོན་དང་དགོངས་སྤྱོད་བསྒྲགས། །དམིགས་བསལ་ཡིན་གྱི་རྗེས་གནང་བཟླས་ལུང་ཡང་། །", "en": "Despising the authorization and blessing, not viewing it as the Word.\nSeventh: Not performing the ritual of empowerment; and\nIncomplete, impaired, bad vessel, or afraid of the profound;\nRegarding the time and occasion of the Vinaya, or being separated by place..."}, {"tib": "གསང་སྒྲོག་ངོས་འཛིན་འདིར་ནི་སྣོད་ལ་བརྟག །བརྒྱད་པ་གཟུགས་ཕུང་རྣམ་སྣང་ལ་སོགས་ལྔ།\n།དེ་བཞིན་སྐྱེ་མཆེད་ལྷ་སྐུར་མི་ཤེས་པར། །སྡུག་བསྔལ་བདེན་པར་བསྒྲུབ་པའི་རྟོག་གེའི་བློས།།", "en": "Proclaiming the meaning and intent of the conduct of profound Secret Mantra.\nAlthough it is an exception regarding authorization and reading transmission,\nRegarding the identification of \"Proclaiming Secrets\" here, one examines the vessel."}, {"tib": "བརྙན་དང་དཀའ་ཐུབ་མཐུ་ཡིས་ལྷག་པར་གདུང་། །དགུ་པ་རང་བཞིན་དག་པའི་སྟོང་ཉིད་དོན།\n།སངས་རྒྱས་ཁོ་ནའི་སྤྱོད་ཡུལ་ཉིད་ལས་གཞན། །སེམས་ཅན་ཁམས་དང་འབྲེལ་བ་ལྡེམ་དགོངས་སུ། །", "en": "Eighth: The form aggregate is Vairochana, and so on for the five.\nSimilarly, regarding sense bases as deities and stars; without knowing that,\nBy the intellect of speculation establishing [them] as the Truth of Suffering,\nTo despise and to torment [the body] especially by the power of austerity."}, {"tib": "ཐེ་ཚོམ་ཟོས་ནས་བཀྲི་བར་སྤངས་པའོ། །བཅུ་པ་དཀོན་མཆོག་གསུམ་དང་བླ་མ་སྨོད།\n།བསྟན་པ་འཇིག་སོགས་དྲག་ཤུལ་ཆོ་ག་ཡིས། །མངོན་དུ་སྤྱོད་པའི་ཡུལ་ལ་སྲན་ཅིང་བཟོད། །", "en": "Ninth: The meaning of Emptiness, naturally pure...\nIs the domain of the Buddhas alone; other than that,\nRegarding the connection with the realm of sentient beings as \"interpretive intent,\"\nHaving entertained doubt, to abandon the guidance [of emptiness]."}, {"tib": "འདྲིས་ཤིང་བཤེས་ནས་བྱམས་པར་བྱས་པའོ། །བཅུ་གཅིག་མིང་བྲལ་ཆོས་ལ་ཚད་མས་གཞལ།\n།ཆོས་ཀྱི་བདག་མེད་བློ་དང་རྫས་འགལ་བཞིན། །ཕུང་སོགས་སྟོང་པར་བལྟ་བ་མཆོག་འཛིན་བློས། །", "en": "Tenth: To be loving towards those who slander the Three Jewels and the Lama...\nAnd destroyers of the Teaching, etc., the objects of the rite of wrathful\nDirect conduct; to endure and be patient with them,\nAnd having become acquainted and friendly, to act lovingly."}, {"tib": "སྐྱེ་མེད་གྲུབ་མཐའ་རྟོག་པས་འཇལ་བའོ། །བཅུ་གཉིས་སྔགས་ཀྱི་སྣོད་རུང་གདུལ་བྱའམ།\n།དད་གསུམ་ལྡན་ལ་དོན་གཉེར་ཆོས་མི་སྟོན། །ཀུན་སློང་ངན་པས་གཞན་སེམས་སུན་ཕྱུང་ནས། །", "en": "Eleventh: Measuring the Dharma free of names with valid cognition [logic].\nJust as the \"selflessness of phenomena\" and the mind contradict substance,\nViewing the aggregates, etc., as empty by the mind of grasping at supreme;\nMeasuring the philosophical tenet of the Unborn by conceptual thought."}, {"tib": "འདུན་པ་ཕྱིན་ཅི་ལོག་ཏུ་སྐྱོགས་པའོ། །བཅུ་གསུམ་སྤྱད་བྱའི་དམ་རྫས་རང་རྒྱུད་དུ།\n།བལྟས་ནས་ལ་ལ་སྤོང་ཞིང་ལ་ལ་སྲེད། །སྔགས་ཀྱི་བརྟུལ་ཞུགས་ཇི་བཞིན་ཉམས་འོག་ཏུ། །", "en": "Twelfth: Regarding disciples who are suitable vessels for Mantra, or...\nThose possessing the three faiths and striving for the meaning; not teaching the Dharma.\nBy bad motivation, upsetting the minds of others,\nDeflecting their interest into the perverted [path]."}, {"tib": "མ་ཆུད་མཐའ་གཉིས་མལ་དུ་འཁྱམས་པའོ། །བཅུ་བཞི་རྣལ་འབྱོར་མ་སོགས་འཇིག་རྟེན་འདས།\n།མ་མོ་མཁའ་འགྲོ་ལ་སོགས་སོ་མཚམས་འཛིན། །འབྱུང་བ་ལྔ་ཡི་ཁམས་ལ་རང་བརྒྱུད་བལྟས། །", "en": "Thirteenth: Regarding the samaya substances to be engaged...\nHaving viewed them as self-existing entities, to abandon some and crave others.\nNot entering under the experience of the conduct of Mantra just as it is,\nWandering into the path of the two extremes."}, {"tib": "དབང་གི་རྟེན་གྱུར་བུད་མེད་སྨོད་པའོ། །བཅུ་བཞིའི་ཡན་ལག་སྡོམ་པ་གཏོང་བྱེད་ཀྱི།\n།ཕམ་པ་མིན་ཡང་དངོས་གྲུབ་ཐོབ་པ་ལ། །གེགས་སུ་ཆེ་བའི་སྦོམ་པོ་བརྒྱད་ཡོད་དེ། །", "en": "Fourteenth: Regarding the Yoginis, etc., who have transcended the world,\nAnd the Mamos and Dakinis, etc., holding the boundaries;\nViewing the element of the five [women] as self-existing entities [ordinary];\nDisparaging women who become the support of empowerment."}, {"tib": "དབང་དང་དམ་ཚིག་སྡོམ་པས་མ་སྦྱངས་པའི། །ཐ་མལ་བུད་མེད་རིག་མར་བསྟེན་པ་དང་།\n།མཚན་ཉིད་འགལ་བའི་དྲན་པའི་ཁྲོན་པ་ནས། །ཆོ་ག་མ་ཡིན་བཞིན་པས་བདུད་རྩི་ལེན། །", "en": "The branches of the fourteen, acting to discard the vows...\nAlthough not Defeats (Pham pa), regarding the attainment of siddhis\nThere are eight Gross Infractions (Sbom po) which are great obstacles:\nRelying on an ordinary woman as a consort (Rig ma)\nWho has not been purified by empowerment, samaya, and vows. And..."}, {"tib": "དབང་མ་ཐོབ་དང་ལྷག་པར་དད་མེད་ལ། །སྐུ་གཟུགས་གླེངས་བམ་ཕྱག་མཚན་ཕྱག་རྒྱ་སྟོན།\n།ཚོགས་ཀྱི་འཁོར་ལོའི་དུས་ན་འཐབ་རྩོད་དང་། །བབ་ཅོལ་ཀྱལ་ཀས་བརྟུལ་ཞུགས་ཐ་མལ་སྦྱར། །", "en": "Taking nectar not in accordance with the ritual\nFrom the \"Well of Memory\" [Consort's body] which contradicts the characteristics.\nTo those who have not obtained empowerment and especially those lacking faith,\nShowing the body image, text, hand implement, and mudra."}, {"tib": "སྣོད་ལྡན་དམ་ཆོས་འདྲི་ལ་ཤེས་བཞིན་དུ། །དེ་ལས་འགལ་བའི་བསྙོན་དོར་ལན་དུ་ལྡོན།\n།སྔགས་ཀྱི་ལྟ་སྤྱོད་སྐུར་ཞིང་ཉམས་སད་པའི། །ཉན་ཐོས་ནང་དུ་ཞག་བདུན་ལོངས་པར་བསྡད། །", "en": "At the time of the Wheel of Gathering (Tsog), fighting and\nApplying ordinary conduct through babble and jokes.\nTo a vessel possessing the Holy Dharma asking questions, while knowing,\nGiving a deceptive answer contrary to that."}, {"tib": "སྔགས་རྒྱུད་དེ་ཉིད་ཆོ་ག་མི་ཤེས་བཞིན། །རྡོ་རྗེ་འཛིན་པར་ང་རྒྱལ་རྫུན་དང་འགྲོགས།\n།དབང་བསྐུར་ཐོབ་ཀྱང་སྔགས་ལ་མི་དད་པའི། །ཐེ་ཚོམ་ཅན་ལ་སླར་ཡང་གསང་བ་འཆད། །", "en": "Staying for a full seven days among Shravakas\nWho slander the view and conduct of Mantra and test [the Yogi].\nWhile not knowing the ritual of the Mantra Tantra and Thatness,\nAssociating with the pride and lie of being a Vajra Holder."}, {"tib": "ཀླུ་སྒྲུབ་ཀྱིས་བསྡུས་དེ་བཞིན་དཔའ་བོ་དང་། །ལཀྵིཾ་ཀཱ་རས་དེ་ལས་དོན་གཞན་པ།\n།བསྙེན་པ་དག་པར་མ་བྱས་དབང་བསྐུར་དང་། །རབ་གནས་སྦྱིན་བསྲེག་སློབ་མ་བསྡུ་བར་རིངས། །", "en": "Having obtained empowerment, explaining the secrets again\nTo one who possesses doubt and has no faith in Mantra.\nSummarized by Nagarjuna; similarly by Ashvagosha (Dpa' bo) and\nLakshminkara. Other meanings than that [list]..."}, {"tib": "ཚོགས་འཁོར་ལས་གཞན་ཕྱི་དྲོའི་ཁ་ཟས་སོགས། །སོ་བྱང་བཅས་པ་དགོས་མེད་འདའ་བ་ཡིས།\n།བདག་ཉིད་སུན་འབྱིན་དངོས་གྲུབ་འཕྲོག་པའི་རྒྱུར། །གསུངས་པའི་སྦོམ་པོ་རྣམས་ལའང་བརྟག་པར་བྱ། །", "en": "Conferring empowerment without having purified the approach (recitation); and\nBeing in a hurry to gather students for consecration and fire puja;\nOther than the Ganachakra, food of the afternoon, etc.—\nViolating the [Pratimoksha] precepts without necessity..."}, {"tib": "འདི་ལྟར་རྣལ་འབྱོར་བླ་མེད་ཐུན་མོང་གི།།རྩ་ལྟུང་བཅུ་བཞིར་བྷ་ཝི་ལྷས་བསྡུས་པ།\n།ཀུན་ལ་ཁྱབ་ཅིང་ཡོངས་སུ་གྲགས་པ་སྟེ། །གཞན་དུ་རྒྱུད་སྡེ་བཞི་པོའི་རང་ལུགས་ཀྱི། །", "en": "Acting as a cause to refute oneself and steal siddhis;\nOne should examine the Gross Infractions spoken of [in those texts] also.\nThus, regarding the fourteen root downfalls common to\nUnsurpassed Yoga, those summarized by Bhawilha..."}, {"tib": "བཅུ་བཞིའི་གྲངས་ངེས་དུས་ཀྱི་འཁོར་ལོ་དང་། །སྤྱི་རྒྱུད་མངོན་བྱང་སོགས་ལས་གསལ་པོར་གསུངས།\n།རྣལ་འབྱོར་ལྡན་པ་འཆིའམ་སྲོག་གཏོང་སླ། །རྟག་ཏུ་དམ་ཚིག་བསྲུང་བར་མ་བྱས་ན། །", "en": "Are pervasive to all and utterly renowned.\nOtherwise, regarding the individual systems of the four Tantra sections,\nThe definite count of fourteen is clearly spoken of\nIn the Kalachakra and the General Tantra Manifest Enlightenment, etc."}, {"tib": "སྔགས་ལ་སྤྱོད་པའི་སྐྱེས་བུ་ངན་སོང་དང༌། །སངས་རྒྱས་གཉིས་ལས་འགྲོ་ས་གསུམ་པ་མེད།\n།དེ་ཕྱིར་ལྟུང་ན་བདག་ཉིད་སུན་ཕྱུང་ནས། །ཕྱིར་བཅོས་ཐབས་ལ་དེ་མ་ཐག་ཏུ་འབད། །", "en": "For the one possessing Yoga, it is easier to die or give up life;\nIf one does not practice guarding the samaya at all times,\nFor the individual practicing Mantra, other than the two:\nBad migrations and Buddhahood, there is no third place to go."}, {"tib": "ཁྱད་པར་རྩ་ལྟུང་དང་པོ་ཤིན་ཏུ་ལྕི། །བླ་མར་བསྙེན་བཀུར་འཁོར་གསུམ་ཡོངས་དག་འབུལ།\n།དབང་བསྐུར་བསྐྱར་ནས་སྡོམ་པ་གསོར་གཞུག་ཅིང་། །ཉེ་བར་མི་གནས་བདག་འཇུག་ལན་མང་བླང་། །", "en": "Therefore, if fallen, having refuted oneself [felt remorse],\nStrive immediately in the method of restoring it.\nIn particular, the first root downfall is extremely heavy.\nOffer the service of the Lama and the Three Spheres completely pure."}, {"tib": "དེ་བཞིན་གཞན་ལ་ཁྲེལ་ཡོད་ངོ་ཚའི་རྟེན། །བླ་མ་མེད་ན་སྔགས་ཀྱི་སྡོམ་ལྡན་མདུན།\n།ཕྱག་དང་སྤྱོད་ལམ་དུལ་བས་རང་གི་མིང་། །སྨོས་ནས་རྡོ་རྗེ་ཐེག་པའི་འདུལ་བ་དང་།།", "en": "Repeat the empowerment and restore the entrance to the vows; and\nWithout staying near [in ordinary conduct], take the Self-Entry many times.\nSimilarly, regarding the support of embarrassment and shame before others:\nIf the Lama is absent, in front of a holder of Mantra vows..."}, {"tib": "འགལ་བའི་ནོངས་པ་འདི་དང་འདི་བྱུང་བས། །འཆབ་ན་བདག་ཉིད་བདེ་བར་གནས་མི་འགྱུར།\n།འཆབ་མེད་ལེགས་པར་གསོལ་ནས་བཤགས་ཡུལ་གྱིས། །ཉེས་པར་མཐོང་ངམ་རང་གིས་མཐོང་ལགས་བརྗོད། །", "en": "With prostrations and subdued conduct, saying one's own name:\n\"Because this and that fault contradictory to the Vinaya\nOf the Vajra Vehicle has occurred...\"\nIf concealed, oneself will not abide in bliss."}, {"tib": "ཡུལ་གྱི་ཕྱིན་ཆད་སྡོམ་པར་བྱེད་དམ་དྲི། །ཆོས་བཞིན་འདུལ་བ་བཞིན་དུ་སྤྱི་བོས་ནོད།\n།ཅེས་པ་ལན་གསུམ་བརྗོད་ལ་ཐབས་ལེགས་བྱ། །གལ་ཏེ་ཕྱིར་བཅོས་འགྱངས་ན་ཞག་རེ་བཞིན། །", "en": "Without concealment, having supplicated well, the object of confession\nAsks if the fault is seen, or oneself says \"I see it.\"\nThe object asks \"Henceforth will you bind it?\"\n\"I will accept it on the crown of my head according to the Dharma and Vinaya.\""}, {"tib": "གོང་འཕེལ་འགྲོ་འགྱུར་དེ་ཡི་གཉེན་པོ་རུ། །སྟོབས་བཞི་ཚང་བའི་ཡིག་བརྒྱས་རྟག་ཏུ་བཤགས།\n།བཅུ་བཞིའི་སྔོ་བགྲང་བརྗོད་པའི་བཤགས་ཚིག་གདོན། །ཁྱད་པར་མདོ་སྒྱུ་སེམས་གསུམ་རིང་ལུགས་ནི། །", "en": "Saying thus three times, perform the skill in means.\nIf the restoration is delayed, day by day\nIt goes on increasing; as the antidote to that,\nConfess always with the Hundred Syllables complete with the four powers."}, {"tib": "སྤྱི་མདོར་སྐུ་དང་གསུང་ཐུགས་རྡོ་རྗེ་ཡི། །བསྲུང་དང་སྤྱད་དང་ཡིད་འོང་མི་འདོར་དང༌།\n།ཤེས་བྱ་བསྒྲུབ་པའི་དབྱེ་བས་ཉི་ཤུ་བརྒྱད། །སྒྱུ་འཕྲུལ་རྩེ་བའི་དམ་ཚིག་རྣམ་ལྔ་དང་། །", "en": "Recite the words of confession uttering the calculation of the fourteen.\nIn particular, the tradition of the Sutra, Maya, and Mind (mdo sgyu sems gsum):\nIn the General Sutra: the Vajra of Body, Speech, and Mind—\nGuarding, practicing, and not abandoning the wish-fulfilling..."}, {"tib": "ཡན་ལག་བཅུར་བཤད་རྩ་བའི་ཕྱོགས་ལ་ནི། །རྡོ་རྗེ་སློབ་དཔོན་མི་སྤོང་བཀུར་སྟིས་བསྙེན།\n།སྔགས་དང་ཕྱག་རྒྱ་རྒྱུན་མི་བཅད་པ་དང་། །ཡང་དག་ལམ་དུ་ཞུགས་ལ་བྱམས་པར་བྱེད། །", "en": "Divided by the accomplishment of objects of knowledge, there are twenty-eight.\nRegarding the five root samayas of the Mayajala (Magical Net) and\nThe ten branches explained: regarding the aspect of the Root,\nNot abandoning the Vajra Master and serving him with respect."}, {"tib": "གསང་བའི་དོན་རྣམས་གཞན་མི་བསྒྲིག་པའོ། །ཡན་ལག་དམ་ཚིག་སྡེ་ཚན་གཉིས་སུ་བསྡུ།\n།དང་པོའི་ཕྱོགས་ནི་ཉོན་མོངས་ལྔ་མི་སྤང་། །རང་བཞིན་ཤེས་པའི་ཉོན་མོངས་དེ་བཞིན་ཉིད། །", "en": "Not cutting the continuous stream of Mantra and Mudra; and\nActing lovingly toward those who have entered the perfect path;\nNot proclaiming the secret meanings to others."}, {"tib": "ཐབས་ཀྱིས་ཟིན་པ་རྨ་བྱས་དུག་ཟོས་འདྲ། །ཡེ་ནས་རིགས་ལྔར་ཤེས་པས་ཡེ་ཤེས་འགྱུར།\n།གཉིས་པའི་ཕྱོགས་ནི་བདུད་རྩི་ཆེན་པོ་ལྔ། །བླང་བྱར་ངེས་པ་ཆོས་ཉིད་རོལ་པར་བླང་། །", "en": "The branch samayas are condensed into two sections.\nThe aspect of the first: not abandoning the five afflictions.\nKnowing the nature, the affliction is Thatness.\nHeld by method, it is like aconite eaten by a peacock.\nBy knowing them as the Five Families from the beginning, they become Primal Wisdom."}, {"tib": "རིགས་ལྔའི་རང་བཞིན་ཉིད་དུ་ཤེས་པར་བླང་། །དངོས་གྲུབ་བསྒྲུབ་པའི་དམ་རྫས་ཡིན་པས་བླང་།\n།མཁའ་འགྲོ་འདུ་ཞིང་དངོས་གྲུབ་ཉེ་བས་བླང་། །སངས་རྒྱས་ཀུན་གྱི་བརྟུལ་ཞུགས་ཡིན་པས་བླང་། །", "en": "The aspect of the second: the five great nectars.\nCertainty as what is to be accepted; accepted as the play of Dharmata.\nAccepted by knowing them as the nature of the Five Families.\nAccepted because they are the samaya substances accomplishing siddhi."}, {"tib": "ཆ་ཤས་དབྱེ་བ་ཉིས་བརྒྱའི་གྲངས་ངེས་ནི། །ཉི་ཤུར་བསྡུ་བ་ཀུན་གཟིགས་རོང་པའི་ལུགས།\n།སེམས་ཀྱི་ཕྱོགས་ལ་མེད་དང་གཅིག་པུ་དང་། །ཕྱལ་བ་དང་ནི་ལྷུན་གྲུབ་ཅེས་གྲགས་པ། །", "en": "Accepted because Dakinis gather and siddhis are near.\nAccepted because it is the discipline of all Buddhas.\nRegarding the definite count of two hundred divisions of parts,\nThe system of the Omniscient Rongpa condenses them into twenty."}, {"tib": "བསྲུང་མཚམས་བྲལ་ལ་འདའ་བྱ་མི་དམིགས་པའི། །ངོ༌བོའི་བཞུགས་ཚུལ་དམ་ཚིག་ཆིངས་ཀྱིས་བཅིངས།\n།ཡེ་ནས་ཉམས་མེད་རྡོ་རྗེ་རྒྱལ་པོའི་ལུགས། །ལམ་ཞུགས་རྣམས་ཀྱི་རང་རྒྱུད་དག་བྱའི་ཕྱིར། །", "en": "Regarding the Mind Section (Sems sde): Non-existent, Single,\nEven, and Spontaneously Present—so it is known.\nFree from a boundary to be guarded, regarding the manner of abiding of the essence\nWhere no object to be transgressed is observed, it is bound by the knot of samaya."}, {"tib": "ཉམས་ན་ཕྱིར་བཅོས་རིན་ཆེན་བུམ་པ་བཟང་། །དམ་ཚིག་རྣམ་པར་བཀོད་པའི་གྲུབ་མཐའ་ནི།\n།རྩ་བ་བླ་མའི་སྐུ་གསུང་ཐུགས་གསུམ་ལ། །ཕྱི་ནང་གསང་བའི་དམ་ཚིག་གསུམ་ཚན་གསུམ། །", "en": "The system of the Vajra King, primordially un-deteriorated.\nFor the sake of purifying the own-stream of those entered into the path,\nIf deteriorated, the restoration is the Supreme Precious Vase."}, {"tib": "སྲོག་གཅོད་མི་ཚངས་སྤྱོད་དང་བརྐུ་བ་སྤང་། །ཕ་མ་སྤུན་སྲིང་རང་ལུས་ཆོས་གང་སྨོད།\n།བླ་མའི་གྲིབ་འགོང་ཡུམ་གཙེ་སྤུན་སྲིང་བརྡེག །གསུང་གི་གསུམ་ལ་རྫུན་ཕྲ་ཚིག་རྩུབ་སྤང་། །", "en": "The philosophical tenet of the Arrangement of Samayas (Dam tshig rnam bkod) is:\nRegarding the Root: the Body, Speech, and Mind of the Lama—three.\nOuter, Inner, and Secret samayas—three sets of three.\nAbandon killing, unchaste conduct, and stealing.\nDisparaging father, mother, siblings, one's own body, or any Dharma."}, {"tib": "ཆོས་སྨྲ་དོན་སེམས་གནས་ལུགས་སྒོམ་མི་བཀུར། །བླ་མའི་ཡུམ་དང་སྤུན་སྲིད་ཚིག་མི་བརྙས།\n།ཐུགས་ཀྱི་གསུམ་ལ་ཡིད་ཀྱི་རྣམ་གསུམ་དང་། །སྤྱོད་དང་སྒོམ་དང་ལྟ་བ་ལོག་པ་སྤང་། །", "en": "Stepping on the Lama's shadow; striking the Consort or siblings.\nRegarding the three of Speech: abandon lies, slander, and harsh words.\nTeaching Dharma [without authorization]; not respecting the meaning, mind, and natural state [meditation].\nNot speaking harsh words to the Lama's Consort and siblings."}, {"tib": "བླ་མ་ལྷ་མཆེད་ལྟ་སྒོམ་ཐུན་ཀུན་སེམས། །ཐབས་ཀྱི་དབང་གྱུར་ཡན་ལག་ཉི་ཤུ་ལྔ།\n།ཏན་གན་མ་བྱིན་ལེན་རྫུན་ཀྱལ་པའི་ཚིག། །སྤྱད་བྱ་ལྔ་ནི་གནང་བཀག་ཤེས་པས་སྤྱོད། །", "en": "Regarding the three of Mind: the three aspects of mind [malice, covetousness, wrong view]; and\nAbandoning wrong conduct, meditation, and view.\nThe Lama, Deity, and Siblings; View, Meditation, and Session—mindful of all."}, {"tib": "འདོད་ཆགས་ཞེ་སྡང་ལ་སོགས་ཉོན་མོངས་ལྔ། །མི་སྤང་ལྔ་ནི་རང་རྒྱུད་པ་དང་དབྲལ།\n།དྲི་ཆེན་དྲི་ཆུ་མཱི་ས་རཀྟ་ཟིལ། །དང་ལེན་ལྔ་ལ་གཙང་སྨེའི་གཉིས་རྟོག་འདྲལ། །", "en": "The twenty-five branches which are the power of method:\nIntercourse, union, taking what is not given, lies, meaningless words—\nThe five to be practiced are practiced by knowing permission and prohibition.\nAttachment, anger, etc., the five afflictions—\nThe five not to be abandoned are free from [being viewed as] self-existing entities."}, {"tib": "ཕུང་པོ་འབྱུང་ཡུལ་དབང་པོ་ཁ་དོག་ལྷར། །ཤེས་བྱ་ལྔ་ནི་ཤེས་རབ་སྟོབས་ཀྱིས་སྤྱོད།\n།རྡོ་རྗེ་རིན་ཆེན་པདྨ་ལས་དེ་བཞིན། །བསྒྲུབ་བྱ་ལྔ་ནི་རྟོགས་གོམས་མཐུ་ཡིས་བསྒྲུབ། །", "en": "Feces, urine, meat (mamsa), blood (rakta), chyle (zil)—\nRegarding the five to be accepted, the dualistic thought of clean and dirty is torn asunder.\nAggregates, elements, objects, senses, colors—as Deities;\nThe five to be known are practiced by the power of wisdom."}, {"tib": "འདི་དག་དམ་ཚིག་གསལ་བཀྲའི་དགོངས་པ་སྟེ། །དེ་བཞིན་དུས་འཁོར་བརྟུལ་ཞུགས་ཉི་ཤུ་ལྔ།\n།གསང་འདུས་སངས་རྒྱས་མཉམ་སྦྱོར་ཟླ་གསང་སོགས། །སྔོན་དང་ཕྱིན་ཆད་འགྱུར་བའི་རྒྱུད་སྡེ་ཡི། །", "en": "Vajra, Jewel, Lotus, Karma, Tathagata—\nThe five to be accomplished are accomplished by the power of realization and habituation.\nThese are the intent of the Clarification of Samaya.\nSimilarly, the twenty-five disciplines of the Kalachakra."}, {"tib": "སྤྱི་དོན་གྱུར་པའི་རིགས་ལྔའི་སྡོམ་པ་ལ། །སངས་རྒྱས་རྣལ་འབྱོར་སྨོན་འཇུག་ཚུལ་ཁྲིམས་གསུམ།\n།མི་བསྐྱོད་རྡོར་དྲིལ་ཕྱག་རྒྱ་བླ་མ་གཟུང་། །རིན་འབྱུང་ཆོས་ནོར་མི་འཇིགས་བྱམས་པ་སྦྱིན།།", "en": "Guhyasamaja, Buddha Union (Sangs rgyas mnyam sbyor), Secret Moon, etc.\nThe general meaning of the Tantra sections of the past and future translations:\nRegarding the vows of the Five Families:\nBuddha [Family]: Yoga, Engaging in Aspiration, and Discipline—the three."}, {"tib": "སྣང་མཐའ་ཐེག་པ་གསུམ་འཛིན་ཆོས་རྣམ་བཤད། །དོན་གྲུབ་མཆོད་བསྟོད་ཕྲིན་ལས་ཀུན་ལ་གུས།\n།ཁྱད་པར་བླ་མེད་རིགས་ལྔའི་སྡོམ་པ་ནི། །རྡོ་རྗེ་རིགས་གྱུར་སྲོག་ལ་འཚེ་བ་ཡང་། །", "en": "Akshobhya: Holding the Vajra, Bell, Mudra, and Lama.\nRatnasambhava: Giving Dharma, Wealth, Fearlessness, and Love.\nAmitabha: Holding the Three Vehicles and explaining the Dharmas.\nAmoghasiddhi: Devotion to offerings, praise, and all activities."}, {"tib": "ཞིང་བཅུ་ལས་གཞན་དབུ་མར་རླུང་རྟོགས་གསོད། །རིན་ཆེན་རིགས་ལ་མ་བྱིན་བླང་བྱ་ནི།\n།མཚན་ལྡན་གཟུགས་དང་སྐལ་མེད་སྐྱེ་བོའི་ནོར། །རྫོགས་པའི་བྱང་ཆུབ་རང་སྟོབས་མཐུ་ཡིས་བླང་། །", "en": "In particular, the vows of the Five Families of Unsurpassed [Yoga Tantra]:\nThose becoming the Vajra Family: regarding \"killing the life\"—\nOther than the ten fields [of enemies], it is killing the wind and thought in the Central Channel.\nThe Jewel Family: regarding \"taking what is not given\"—\nThe qualified Dharani [Consort] and the wealth of beings without fortune;\nTaking Perfect Buddhahood by the power of one's own strength."}, {"tib": "པདྨའི་རིགས་ལ་རི་དྭགས་མིག་ཅན་མཆོད། །སྟོང་པ་ཉིད་ཀྱི་བུད་མེད་ཀུན་ཏུ་སྤྱོད།\n།ལས་ཆོས་དམ་ཚིག་ཕྱག་རྒྱ་ཆེན་པོ་བསྟེན། །ལས་ལ་རྫུན་ཚིག་སྒྱུ་མ་ལྟ་བུར་སྒྲོག །", "en": "The Lotus Family: worshipping the one with deer-eyes;\nEngaging thoroughly with the woman of Emptiness.\nRelying on Karma [Mudra], Dharma [Mudra], Samaya [Mudra], and Mahamudra."}, {"tib": "འཁོར་ལོའི་རིགས་ལ་རྫས་དང་ཡུལ་རྣམས་ཀྱི། །འདོད་པའི་ཡོན་ཏན་སྒྱུ་མ་ལྟ་བུར་སྤྱོད།\n།དེ་ཡི་ཡན་ལག་ཚིག་གིས་གབ་པ་ནི། །མ་བསྒྲལ་བསྒྲལ་སོགས་བྱང་ས་དང་ཐུན་མོང་། །", "en": "The Wheel Family: regarding substances and objects,\nEnjoying the qualities of desire as like a magical illusion.\nThe hidden words of the branches of that:\n\"Not liberating,\" \"Liberating,\" etc., are common with the Bodhisattva Grounds."}, {"tib": "ལྷ་དང་ལྷ་མིན་གསང་བ་པ་མི་བརྙས། །ཕྱག་རྒྱ་བཞོན་པ་མཚོན་ཆ་མཚན་མ་ལ།\n།སྨད་པར་མི་བྱའི་གཉིས་ནི་དངོས་བསྟན་ཏེ། །གསང་བ་གནོད་སྦྱིན་ཕྱག་རྒྱ་སྐུ་གཟུགས་རྫོགས། །", "en": "Gods and Demi-gods, and the Secret Ones [Yakshas]—do not despise.\nMudra, Mount, Weapon, and Sign—\n\"Do not disparage\"—the two are explicitly taught."}, {"tib": "བཞོན་པ་བླ་མའི་སྟན་དང་ཆིབས་ལ་སོགས། །མཚོན་ཆ་ལྷ་ཡི་ཆེད་དུ་བྱས་པའི་རིགས།\n།མཚན་མ་ཕྱག་མཚན་ལྷ་དང་བླ་མ་དང་། །མཆོད་རྟེན་གྲིབ་མ་འགོམ་ལ་སྨད་པའི་སྒྲ། །", "en": "Secret Ones: Yakshas. Mudra: The Body Image [of the deity] is perfected.\nMount: The Lama's seat and horse, etc.\nWeapon: The types made for the sake of the Deity."}, {"tib": "དེ་བཞིན་མཆོད་རྫས་རྙིངས་ལ་དམན་མར་གྲགས། །ཕྱག་མཚན་རྣམ་པའང་བཟའ་བར་བཀག་པ་ཡིན།\n།ཁྱད་པར་གསོད་དང་མ་བྱིན་ལེན་པ་སོགས། །དངོས་བསྟན་ཉིད་དང་དགོངས་པ་ལུང་སྟོན་གྱི། །", "en": "Sign: The hand implements of the Deity and the Lama; and...\nStepping on the shadow of a Stupa; the word \"disparage.\"\nSimilarly, offering substances that are old are known as \"inferior.\"\nThe shapes of hand implements also are prohibited to be eaten."}, {"tib": "རྣམ་དབྱེ་མ་ཕྱེད་སྔགས་པ་ཐུར་ལ་ལྟུང་། །མདོར་ན་གབ་པའི་གསང་བ་མ་རྟོགས་པར།\n།སྤྲས་པའི་གསང་བར་མངོན་འཆེལ་ཀུན་ལ་གཟུར། །ཉིན་བཞིན་བྲམ་ཟེ་གསོད་དང་མཚམས་མེད་སྤྱོད། །", "en": "In particular, killing and taking what is not given, etc.\nNot distinguishing the division of the literal teaching itself and\nThe intent of the interpretive teaching, the Mantrika falls downwards.\nIn brief, without realizing the hidden secret,\nAvoid explicitly seeking the concealed secret in all [public contexts]."}, {"tib": "སྔགས་སྡོམ་སྐྱེ་བའི་རྟེན་དུ་རུང་བས་ན། །གསང་སྔགས་ཐབས་ཀྱིས་ཆེ་བ་སྨོས་ཅི་དགོས།\n།ལྟུང་མཚམས་མི་ཤེས་བླ་མར་མི་གུས་དང༌། །བག་མེད་ལ་གོམས་ཉོན་མོངས་མཐུ་ཆེ་བཞི། །", "en": "Because he kills a Brahmin every day and performs the deeds of Immediate Retribution,\nYet is suitable as a support for the birth of Mantra vows;\nTherefore, what need to mention the greatness of the methods of Secret Mantra?\nNot knowing the boundaries of downfalls; not respecting the Lama; and..."}, {"tib": "ལྟུང་བ་འབྱུང་བའི་སྒོ་བཞི་དེའི་སྟེང་དུ། །བརྗེད་ངས་ཆེ་དང་དྲན་པ་མི་གསལ་བ།\n།བསྣན་པ་དམ་ཚིག་ཉམས་པའི་རྒྱུ་དྲུག་ཡིན། །དེ་བས་དྲན་དང་ཤེས་བཞིན་གཉེན་པོ་ཡི། །", "en": "Habituated to carelessness; the four great strengths of affliction.\nAdded to those \"Four Doors of the Arising of Downfalls\":\nGreat forgetfulness and unclear mindfulness.\nAdded [together], they are the six causes of damaged samaya."}, {"tib": "ལོང་བ་དབྱེ་བའི་གནས་སྐབས་ཐོབ་པའི་བག །བསྲུང་བ་ཇི་བཞིན་ཉིན་མཚན་ཐུན་དྲུག་ཏུ།\n།སྤང་བླང་གནས་ལ་བསྒྲིམས་ཤིང་བསྒྲིམས་ཤིང་དཔྱད། །ཉམས་ན་གསོ་བའང་འོག་མ་ལས་འཕགས་ཏེ། །", "en": "Therefore, by the antidote of mindfulness and introspection (vigilance),\nWith the care of [a doctor] opening the eyes of the blind,\nJust like guarding [the eyes], in the six sessions of day and night,\nOne should scrutinize and examine the points of adopting and discarding."}, {"tib": "ཉན་ཐོས་སྡོམ་ཁྲིམས་འཆབ་སེམས་མ་སྐྱེས་ན། །ལན་བདུན་གསོར་ཡོད་འཆབ་བཅས་ལན་གཅིག་ཀྱང་།\n།གསོ་བའི་ཡུལ་མེད་རྫ་བེའུ་ཆག་པ་བཞིན། །བྱང་སྡོམ་རིན་ཆེན་ཉེར་སྤྱད་ཆག་དང་འདྲ། །", "en": "If damaged, the restoration is superior to the lower [vehicles].\nIn the Shravaka discipline, if the mind of concealment is not born,\nIt exists to be restored seven times; with concealment, even once\nThere is no object of restoration; it is like a broken clay pot."}, {"tib": "གཞན་རྐྱེན་དགེ་བའི་བཤེས་ལ་བསྟེན་ནས་གསོ། །གསང་སྔགས་སྡོམ་པ་རིན་ཅེན་སྣོད་ཞོམ་ལྟར།\n།རང་སྟོབས་མཐུ་ཡིས་གསོ་རུ་བྱར་ཡོད་པས། །བླ་མ་སྤྱན་བརྙས་འཕྲལ་དུ་མཉེས་བྱས་བསྐང་། །", "en": "The Bodhisattva Vow is like a damaged precious vessel;\nIt is restored by relying on the condition of another, a Spiritual Friend.\nThe Secret Mantra Vow is like a dented precious vessel;\nSince it exists to be restored by the power of one's own strength..."}, {"tib": "གསུང་གི་ཐ་ཚིག་ཉམས་ན་རྡོ་རྗེ་ཆོས། །བསྒོམས་ལ་སྙིང་པོའམ་ཡིག་བརྒྱ་འབུམ་ཐེར་འདོན།\n།ཐུགས་ལས་ཉམས་ན་ལོ་གསུམ་སྨྲ་བ་བཅད། །གཅིག་ཏུ་མཉམ་པར་བཞག་པ་གསོ་བའི་ཐབས།།", "en": "If the Lama or sibling is disparaged, immediately please and fulfill them.\nIf the Word of Speech is damaged, meditate on Vajra Dharma [Avalokiteshvara]\nAnd recite the Essence or the Hundred Syllables one hundred thousand times.\nIf Mind is damaged, cut speech [silence] for three years."}, {"tib": "དྲུག་ཆ་ལས་ཐལ་ཐུན་ཚོད་འདའ་བའི་མཚམས། །འགལ་དང་ཉམས་དང་འདས་དང་རལ་བ་ཞེས།\n།ཞག་དང་ཟླ་བ་ལོ་གཅིག་ལོ་གཉིས་འདས། །གསོ་བར་རུང་སྟེ་ཕྱི་མ་ཕྱི་མར་ལྕི།།", "en": "One-pointed equipoise is the method of restoration.\nPassing one-sixth [of the day/session]: the boundary of transcending the session time.\n\"Contradicted,\" \"Damaged,\" \"Transgressed,\" and \"Torn\"—so they are called.\nA day, a month, one year, and two years passed."}, {"tib": "ལོ་གསུམ་འདས་ན་གསོ་བར་རུང་མ་ཡིན། །འགལ་ན་ཚོགས་འཁོར་ཉམས་ན་བདོག་དགུས་བསྐང་།\n།འདས་ན་བུ་དང་ཆུང་མ་ནོར་གྱི་དབྱིག །རལ་ན་སྲོག་གིས་གསོ་བའི་རྣམ་བཞག་རྣམས། །", "en": "They are suitable to be restored, [though] heavier and heavier.\nIf three years pass, it is not suitable to be restored.\nIf \"Contradicted,\" [restore] by Ganachakra; if \"Damaged,\" fulfill with all possessions.\nIf \"Transgressed,\" [restore] by child, wife, and the wealth of jewels."}, {"tib": "རྡོ་རྗེ་ཉི་མ་རྣམ་པར་བཀོད་ལས་གསུངས། །གཞན་ཡང་དབང་བཞི་བསྐྱར་དང་བདག་འཇུག་བླང་།\n།བསྐྱེད་རྫོགས་བཟླས་བརྗོད་འཕོ་མེད་ཚུལ་ཁྲིམས་དང་། །ཐིག་ལེའི་རྣལ་འབྱོར་སྦྱིན་སྲེག་གཏོར་མ་གཏོང་། །", "en": "If \"Torn,\" the arrangements of restoring by [giving] life\nAre spoken of in the Vajra Sun Arrangement.\nFurthermore, repeating the four empowerments and taking Self-Entry;\nGeneration and Perfection, recitation, discipline of non-emission; and..."}, {"tib": "དྲལ་བའི་སྔགས་རྒྱ་བཀྲུ་དང་གཏུམ་མོས་བསྲེག །ཚོགས་སམ་རྟེན་གྱི་དྲུང་དུ་ཉེས་པ་བསྒྲག\n།སྲོག་བསླུ་གསུང་རབ་བཀླག་དང་ཡིག་བརྒྱ་བཟླ། །མཎྜལ་ཡན་ལག་བདུན་དང་མཆོད་རྟེན་བཞེངས། །", "en": "Yoga of the Drop, Fire Puja, sending Torma.\nWashing the torn mantra and mudra, and burning with Tummo.\nProclaiming the fault in the presence of the Assembly or a Support.\nRansoming life, reading the Scriptures, and reciting the Hundred Syllables."}, {"tib": "ལ་སོགས་ཐབས་ཀྱིས་གཏུགས་པ་མ་ཡིན་ལ། །ཁྱད་པར་དོང་སྤྲུགས་བཤགས་པས་མི་འདག་མེད།\n།དམིགས་བཅས་ཀུན་ལ་འགྱོད་སེམས་ལྷག་པར་གཅེས། །མ་བཤགས་ཚེ་འདིར་བདེ་ལེགས་ཡོན་ཏན་འགྲིབ། །", "en": "Prostrating with the Seven Limbs and building Stupas.\nBy such methods, it is not [a situation of] reaching the end [hopelessness].\nIn particular, by the Confession of Churning the Depths (Dong Sprugs), there is nothing not uncleansed.\nFor all those possessing visualization, the mind of regret is especially crucial."}, {"tib": "དོ་ཟླ་མེད་པའི་རྡོ་རྗེའི་དམྱལ་བར་ལྟུང་། །དམ་ཚིག་ལྡན་པ་སྐྱེ་བ་བཅུ་དྲུག་གམ།\n།མྱུར་ན་འདིའམ་འཆི་ཁ་བར་མ་དོར། །གྲུབ་པ་བརྒྱད་དང་དབང་བཅུ་ཕྱི་ནང་གཉིས། །", "en": "If not confessed, in this life happiness and qualities will decline.\nOne will fall into the Vajra Hell which has no equal.\nThe one possessing samaya, in sixteen lifetimes, or\nMore swiftly: in this [life], or at death, or in the intermediate state..."}, {"tib": "དབང་ཕྱུག་བརྒྱད་དང་རིག་འཛིན་རྣམ་པ་བཞི། །མཆོག་གི་དངོས་གྲུབ་ཁ་སྦྱོར་ཡན་ལག་བདུན། །སྐུ་ལྔའི་ཞིང་འགྲོ་དོན་གཉིས་ལྷུན་གྱིས་གྲུབ། །\n\nཡོན་ཏན་རིན་པོ་ཆེའི་མཛོད་དགའ་བའི་ཆར་ཞེས་བྱ་བ་ལས། རིག་པ་འཛིན་པའི་སྡེ་སྣོད་བསྟན་པའི་ཚོམས་ཏེ་ལེའུ་བཅུ་པའོ།།", "en": "The eight siddhis and the ten powers—outer and inner [two];\nThe eight sovereignties and the four types of Vidyadharas;\nThe Supreme Siddhi, the Seven Branches of Union;\nGoing to the Field of the Five Kayas, the two benefits are spontaneously established."}],
      11: [{"tib": "།རྒྱལ་བས་འཁོར་ལོ་བར་པར་རྣམ་ཐར་གསུམ། །བསྟན་བྱའི་ངོ་བོ་སོ་སོ་རང་རིག་ཉིད། །\nསེམས་ཅན་ཁམས་ལ་བདེ་གཤེགས་སྙིང་པོ་རུ། །རང་བཞིན་བཞུགས་ལ་རྫོགས་པ་ཆེན་པོར་གྲགས།", "en": "In the Intermediate Wheel, the Conqueror [taught] the Three Liberations.\nThe essence of the object of teaching is individual self-awareness itself.\nIt abides naturally within the element of sentient beings\nAs the Sugatagarbha;\nit is renowned as the Great Completeness."}, {"tib": "།གང་དུ་རྒྱ་ཆེའི་ལམ་བཟང་དམ་པའི་དོན། །མཐའ་དག་བློ་ཡི་བྱི་དོར་ཁོ་ནའི་ཕྱིར། །\nསྡོམ་པ་གསུམ་དང་ཕྱིན་དྲུག་བསྐྱེད་རྫོགས་སོགས༑ ༑ཀུན་ཀྱང་རྫོགས་པ་ཆེན་པོའི་ལམ་སྟེགས་ཡིན།", "en": "Wherein the vast excellent path, the ultimate meaning,\nIs entirely for the sake of polishing the intellect (mind).\nThe three vows, the six paramitas, generation and perfection, etc.—\nAll are the staircase of the path of the Great Completeness."}, {"tib": "།འདིར་ནི་འཁོར་དང་མྱ་ངན་འདས་པའི་ཆོས། །དབྱིངས་ལས་མ་གཡོས་གཞན་དུ་གྱུར་བ་མེད། །\nའཁོར་འདས་མ་གྲུབ་གཞི་ཡི་ཆོས་ཉིད་ཀྱང་། །ངོ་བོ་རང་བཞིན་ཐུགས་རྗེ་གསུམ་དུ་རྫོགས།", "en": "Here, regarding the phenomena of Samsara and Nirvana,\nThey have not moved from the Expanse, nor become something else.\nSamsara and Nirvana are unestablished;\nthe Dharmata of the Ground itself\nIs perfected as the three:\nEssence,\nNature, and Compassion."}, {"tib": "།དེ་ཉིད་ངང་ན་དག་པ་སངས་རྒྱས་དང་། །མ་དག་སེམས་ཅན་འཁོར་འདས་གཉིས་ཀྱི་ཆ། །\nགཉིས་ཀྱི་ངང་ན་རྨི་ལམ་མི་གཡོ་བཞིན། །གང་ནས་མ་འོངས་གཞན་དུ་འཕོ་བའང་མེད།", "en": "Within the state of Thatness, the purity is the Buddha, and\nThe impurity is the Sentient Being;\nthe parts of the two,\nSamsara and Nirvana,\nAre like dreams within the state of sleep:\nimmovable.\nThey have not come from anywhere, nor is there transfer to elsewhere."}, {"tib": "།རེ་ཞིག་གཞི་ཡི་བཞུགས་ཚུལ་གྲུབ་པའི་མཐའ། །ཀ་དག་ལྷུན་གྲུབ་མ་ངེས་ངེས་པ་དོན། །\nཅིར་ཡང་བཏུབ་དང་ཅིར་ཡང་ཁས་བླང་བཏུབ། །སྣ་ཚོགས་འདོད་པའི་གཞི་བདུན་ཐམས་ཅད་ཀྱང་།", "en": "For the moment, regarding the philosophical tenet of the manner of the Ground's abiding:\nPrimordially Pure (Ka-dag),\nSpontaneously Present (Lhun-grub),\nIndeterminate,\nDeterminate,\nSuitable as anything, and suitable to be accepted as anything,\nAnd manifold;\neven regarding all \"Seven Grounds of Assertion\"..."}, {"tib": "།ངོ་བོ་ཀ་དག་གཅིག་པུའི་ཕྱོགས་རེ་ལ། །སོ་སོར་བཏགས་པའི་རང་གཞུང་འཛིན་པ་གཞན། །\nཁོང་ལོང་བདུན་གྱིས་གླང་པོའི་སྐྱེ་མཆེད་དང༌། །ངང་པའི་ཁ་དོག་བརྗོད་པ་ཇི་བཞིན་ནོ།", "en": "Regarding the partial side of the single Essence,\nPrimordial Purity,\nThey hold individual imputations as their own textual tradition;\ndifferent.\nBy seven blind men, regarding the sense-fields [features] of an elephant\nAnd the color of a swan—\nit is just like that expression."}, {"tib": "།འདིར་ནི་ངོ་བོ་ཀ་ནས་དག་པ་ལ། །ཡོན་ཏན་ལྷུན་གྲུབ་གཅིག་དང་ཐ་དད་མིན། །\nདངོས་མཚན་སྤྲོས་པ་བྲལ་བས་ཀ་དག་ལ། །གཏིང་གསལ་འགག་པ་མེད་པས་ལྷུན་གྲུབ་བོ།", "en": "Here, regarding the Essence which is pure from the beginning (Ka-dag):\nQualities are Spontaneously Present (Lhun-grub);\nthey are neither one nor separate.\nBecause it is free from substantial characteristics and elaboration, it is Primordially Pure.\nBecause clarity is deep and unceasing, it is Spontaneously Present."}, {"tib": "།གཞི་གཅིག་རྫས་སུ་འགལ་བའང་མ་ཡིན་ཏེ། །གཉིད་དུ་ཕྱོགས་དང་གཉིད་དུས་ཤེས་པ་ལྟར། །\nངོ་བོ་ཀ་དག་ཡིན་པས་འཁོར་མ་མྱོང་། །ལྷུན་གྲུབ་རྩལ་ལ་རོལ་པ་ཅིར་ཡང་སྣང་།", "en": "In the Single Ground, they are not contradictory in substance.\nLike the direction to sleep and the consciousness at the time of sleep.\nSince the Essence is Primordially Pure, it has not experienced Samsara.\nIn the creativity of Spontaneous Presence, the play appears as anything."}, {"tib": "།ཇི་ལྟར་བཻཌཱུརྱ་ཡི་རང་འོད་ནི། །གཏིང་གསལ་རྐྱེན་གྱིས་མ་བསྐྱེད་ཕྱིར་མི་སྣང་། །\nདེ་བཞིན་ཀ་དག་དངོས་མཚན་སྤངས་པའི་གདངས། །ལྷུན་གྲུབ་ཕྱི་རྒྱ་མ་རལ་བུམ་པའི་སྐུ།", "en": "Just as the self-light of a lapis lazuli (sapphire)\nDoes not appear because it is not generated by the condition of deep clarity,\nSimilarly, the tone of Primordial Purity abandoned of substantial characteristics\nIs Spontaneous Presence;\nthe outer seal is not torn—\nthe Youthful Vase Body."}, {"tib": "།ངོ་བོས་སྟོང་ལ་གདངས་ཀྱིས་མ་འགགས་པས། །སྣང་བ་ཀུན་གྱི་འཆར་གཞིར་དེ་བཞུགས་ཀྱང༌། །\nགཞི་ལས་གཡོས་པ་མེད་པའི་བྱང་ཆུབ་སེམས། །མཚན་མ་རིས་ཆད་ཅན་དུ་ཕྱིར་མི་གསལ།", "en": "Since the Essence is empty and the Tone is unceasing,\nAlthough it abides as the ground of arising for all appearances,\nThe Bodhichitta which has not moved from the Ground\nDoes not clearly manifest as [having] characteristics or partiality."}, {"tib": "།དེ་ནི་སངས་རྒྱས་མ་ཡིན་སེམས་ཅན་མིན། གཅིག་དང་ཐ་དད་མ་ཡིན་མཐའ་དབུས་མིན། །\nསྟོང་པ་ཕྱང་ཆད་མ་ཡིན་དངོས་པོ་མིན། །སྐྱེ་མེད་སྣང་བ་གསུམ་དང་ཐབས་གཅིག་གོ།", "en": "That is not Buddha, not Sentient Being;\nNot one and not separate;\nnot edge and not center;\nNot void emptiness, not substantial thing.\nIt is one method with the three:\nUnborn,\nAppearance, [and Liberation]."}, {"tib": "།དེ་ཉིད་ངང་ལས་རིག་པའི་བདག་ཉིད་ཅན། །རླུང་ལྔའི་སྙིང་པོ་གདངས་ཀྱི་ཕྱིར་འཕགས་པས། །\nནང་གསལ་གཞོན་ནུ་བུམ་པའི་རྒྱ་རལ་ནས། །གཞན་ལས་གཡོས་པ་མེད་བཞིན་གཞི་སྣང་ཤར།", "en": "From the state of Thatness, possessing the identity of Awareness,\nThe essence of the five winds rises outwardly as a tone.\nInner Clarity, the Youthful One—\nthe seal of the vase having been torn,\nWhile not moving from the Ground, the Ground-Appearance dawns."}, {"tib": "།གང་ཚེ་ཐུགས་རྗེའི་རིགས་གདངས་རྣམ་པའི་ཡུལ། །དཔྱོད་བྱེད་ཤེས་པར་ཤར་བ་རིག་པ་ལ། །\nལྟོས་པའི་མ་རིག་ཅན་གྱི་ཆ་བཟུང་བས། །སྤྲིན་བྲལ་མཁའ་བཞིན་དྭངས་པའི་ཀ་དག་ལས།", "en": "At that time, the object of the aspect of the cognitive tone of Compassion\nDawns as the analyzing consciousness;\nregarding Awareness,\nBecause it holds the part of \"possessing ignorance\" which relies [on analysis],\nFrom the Primordial Purity, clear like a cloudless sky..."}, {"tib": "།ལྷུན་གྲུབ་གཡོ་བ་འཆར་ཚུལ་བརྒྱུད་དུ་ཤར། །འདི་ནི་འཁོར་འདས་འབྲེལ་བའི་སྒོ་འཕར་ཏེ། །\nཐེག་རྩེ་ཤིན་ཏུ་རྣལ་འབྱོར་རྒྱུད་སྡེ་དང་། །མན་ངག་ལྡེ་མིག་གངས་ལྡན་རི་ཡི་ལྗོངས།", "en": "Spontaneous Presence moves;\nthe manner of arising dawns as eight.\nThis is the door-panel of the connection between Samsara and Nirvana.\nThe Peak of Vehicles, the extremely Yogic Tantra Section, and\nThe Key of Pith Instructions;\nin the land of the snowy mountains..."}, {"tib": "།དྲི་མེད་འོད་ཟེར་སྟོང་ལྡན་གཅིག་གིས་ཕྱེ། །དེ་ཚེ་གཞི་སྣང་མཐོང་བའི་སྐད་ཅིག་མར། །\nདང་པོའི་སངས་རྒྱས་ཀུན་ཏུ་བཟང་པོ་དེས། །སྣང་བ་འཁྲུལ་པར་མ་མཆེད་རང་སྣང་དུ།", "en": "Was opened by the one possessing a thousand light rays of Stainless [Dri-med] light.\nAt that time, in the instant of seeing the Ground-Appearance,\nThat Primordial Buddha,\nSamantabhadra,\nDid not spread appearance into delusion;\ninto Self-Appearance..."}, {"tib": "།རིག་པས་ལུང་མ་བསྟན་གྱི་གཞི་ལས་འཕགས། །གཞི་ཉིད་འབྲས་བུ་སྨིན་པའི་ཤེས་རབ་ཀྱིས། །\nསྐད་ཅིག་གཅིག་ལ་བྱེ་བྲག་རབ་ཏུ་ཕྱེད། །ཕྱེད་ཐོག་ཤེས་རབ་ཉིད་ཀྱང་སྐུར་སྨིན་པ།", "en": "Through Awareness, he ascended from the Ground of the Indeterminate.\nBy the wisdom which ripens the Ground itself into the Result,\nIn a single instant, the details were utterly distinguished.\nUpon distinguishing, Wisdom itself also ripened again."}, {"tib": "།གཞན་བྱུང་རྐྱེན་ལ་མ་ལྟོས་རང་སར་གནས། །སྐུ་དང་ཡེ་ཤེས་རྒྱ་མཚོའི་བདག་ཉིད་དུ། །\nསྐད་ཅིག་གཅིག་ལ་མངོན་པར་སངས་རྒྱས་སོ། །གང་ཚེ་ཆོས་སྐུའི་དབྱིངས་ལས་མ་གཡོས་བཞིན།", "en": "Not relying on conditions arising from others, holding its own place.\nIn the identity of the Ocean of Kayas and Wisdoms,\nIn a single instant, he manifestly awakened.\nAt the time, while not moving from the Expanse of Dharmakaya..."}, {"tib": "།རྣམ་གྲོལ་ཡོན་ཏན་རྒྱས་པའི་ལྷུན་གྲུབ་སྒོ། །ལོངས་སྤྱོད་རྫོགས་པའི་སྐུ་རུ་སྣང་བྱས་ནས། །\nདེ་ཡི་རྩལ་ལས་ཚངས་ཆེན་བསྐལ་པ་བཀོད། །དག་པ་རང་བཞིན་སྤྲུལ་སྐུའི་སྣང་བ་དང་།", "en": "The door of Spontaneous Presence where qualities of liberation expand\nHaving appeared as the Sambhogakaya,\nFrom the creativity of that, the Great Brahma arranged the aeons.\nThe appearance of the Pure Nature Nirmanakaya;\nand..."}, {"tib": "།མ་དག་འཁོར་བའི་སྒོ་ལས་སེམས་ཅན་གྱི། །སྣང་བ་ཉིད་དང་མཐུན་པའི་སྟོན་པ་ཡི། །\nའཁོར་བ་སྟོངས་པའི་ཕྲིན་ལས་ཟད་མི་ཤེས། །ཟག་མེད་རང་ངོ་ཤེས་པའི་དགེ་ཚོགས་ཀྱི།", "en": "From the gate of Impure Samsara, the Teacher\nCompatible with the very appearance of sentient beings—\nThe activity of emptying Samsara knows no exhaustion.\nOf the virtue-accumulation of recognizing one's own face of undefiled [nature]..."}, {"tib": "།མངའ་དབང་རྫོགས་པའི་སྟོན་པ་ཆེན་པོ་དེའི། །ཞིང་དང་མཛད་པ་ཆོས་ཀྱི་དབྱིངས་དང་མཉམ། །\nསངས་རྒྱས་ཉིད་ཀྱི་སྣང་བ་དེ་ཙམ་མོ། །དེ་ལ་གཉིས་སུ་འཛིན་པ་ཡོད་མིན་པས།", "en": "That Great Teacher who has perfected dominion/power:\nHis Field and Activity are equal to the Dharmadhatu.\nThe appearance of Buddhahood itself is just that amount.\nIn that, because there is no dualistic grasping..."}, {"tib": "།གདུལ་བྱ་འདུལ་བྱེད་རྣམ་པར་མི་རྟོག་ཀྱང་། །ནོར་བུ་མཆོག་དང་དཔག་བསམ་ཤིང་ཆེན་ལྟར། །\nརྩོལ་བ་མེད་པའི་ཐུགས་རྗེ་གཞན་ངོར་སྣང་། །དེ་ཉིད་མ་རིག་ཁམས་གསུམ་སེམས་ཅན་རྣམ།", "en": "Though there is no conceptuality regarding disciple and tamer,\nLike the supreme jewel and the great wish-fulfilling tree,\nEffortless compassion appears to the face of others.\nThe sentient beings of the three realms who are ignorant of Thatness..."}, {"tib": "།ཐོག་མའི་གཞི་ལ་འཁྲུལ་པ་མ་མཆིས་ཀྱང་། །གཞི་སྣང་ཤར་བའི་རྣམ་པ་མ་རིག་པའི། །\nགློ་བུར་རྐྱེན་ནི་བདག་ཉིད་གཅིག་པ་སྟེ། །དེ་ཉིད་ཐུར་སོང་ལྷན་ཅིག་སྐྱེས་པ་ལ།", "en": "Though there is no delusion in the primordial Ground,\nNot knowing the aspect of the dawning of Ground-Appearance—\nThe Adventitious Condition is the identity [of the ground] itself.\nThat itself having gone downwards:\nregarding the Co-emergent..."}, {"tib": "།མིང་དོན་བདག་རྟོག་ཀུན་ཏུ་བརྟགས་པ་ཡི། །མ་རིག་གསུམ་ལས་འཁྲུལ་བའི་རྐྱེན་བཞི་མཆེད། །\nགཞི་ཉིད་ཁྱིམ་ལྟར་གནས་པ་རྒྱུ་ཡི་རྐྱེན། །དེ་ལ་རྟོག་དཔྱོད་ཤར་བ་བདག་པོའི་རྐྱེན།", "en": "The Imputing Ignorance which imputes name, meaning, and self.\nFrom the Three Ignorances, the Four Conditions of delusion spread.\nThe Ground itself abiding like a house is the Causal Condition.\nThe dawning of analysis regarding that is the Dominant Condition."}, {"tib": "།དེ་ལས་ཡུལ་དང་ཡུལ་ཅན་དམིགས་པའི་རྐྱེན། །གསུམ་པོ་དུས་མཚུངས་དེ་མ་ཐག་པའི་རྐྱེན། །\nཚོགས་ལས་རིམ་བཞིན་འཁྲུལ་བ་སྟོབས་གྱུར་ནས། །ཉོན་མོངས་ཚོགས་འཕེལ་འཁོར་བའི་གནས་རིགས་གྲུབ།", "en": "From that, the Object and Subject are the Objective Condition.\nThe three, simultaneous, are the Immediately Preceding Condition.\nFrom the assembly, gradually, delusion having become powerful,\nThe assembly of afflictions increases;\nthe abodes and types of Samsara are established."}, {"tib": "།རྟེན་འབྲེལ་བཅུ་གཉིས་ཤིང་རྟའི་འཕང་ལོ་བཞིན། །འདི་ལྟར་རིགས་དྲུག་སྐྱེ་གནས་བཞི་པོའང་། །\nམེད་སྣང་སྒྱུ་མའི་རང་གཟུགས་སྣང་དུས་ནས། །ཡོད་མ་མྱོང་བའི་སྟོང་གཟུགས་ཐོག་མ་ལ།", "en": "Like the wheel of a chariot, the Twelve Dependent Arisings.\nThus, the six types [of beings] and the four birth-places also.\nFrom the time of the appearance of the self-form of illusion, appearing yet not existing,\nRegarding the beginning of empty forms which have never been experienced as existing..."}, {"tib": "།དཔྱོད་བྱེད་ཡིད་དྲུག་ལངས་ནས་ཚོགས་དྲུག་ཤར། །རྣམ་རྟོག་བདག་ཏུ་འཛིན་པའི་འཆིང་བ་ནི། །\nརབ་ཏུ་མཐུ་ཆེ་སེམས་ཉིད་ནམ་མཁའི་ཁམས། །ངོ་བོ་ཉིད་མེད་འདི་ཡང་རབ་བཅིངས་ནས།", "en": "The six analyzing minds having risen, the six collections [of consciousness] dawn.\nThe binding of conceptual thought and self-grasping\nIs utterly powerful;\nthe Space Element of Mind Itself,\nThis also, which lacks essence, having been utterly bound..."}, {"tib": "།བདག་ཡོད་ལ་ཞེན་མགལ་མེའི་འཁོར་ལོ་བཞིན། །སྲིད་ན་ལ་ལའི་སྣང་བ་ལ་ལའི་མུན། །\nལ་ལའི་བདུད་རྩི་ལ་ལའི་ཆུ་དང་མེ། །ཀུན་ནས་རྣམ་པར་འགལ་བའི་འདུ་ཤེས་རྣམས།", "en": "Cherishing the existence of a self;\nlike a wheel of a firebrand.\nIn existence, to some it is appearance;\nto some, darkness.\nTo some, nectar;\nto some, water and fire.\nNotions which are utterly contradictory..."}, {"tib": "།བག་ཆགས་རྗེས་འགྲོ་ངེས་པ་འགའ་ཡང་མེད། །དེ་ལྟ་ནའང་སྣང་ཡུལ་སེམས་མ་ཡིན། །\nབཞིན་གྱི་གཟུགས་བརྙན་མེ་ལོང་ནང་ཞུགས་ཀྱང་། །རྟེན་ཅིང་འབྲེལ་བར་འབྱུང་བའི་རྐྱེན་ཙམ་ལས།", "en": "There is no certainty whatsoever that follows the habitual tendency.\nEven so, the appearing object is not the mind.\nAlthough the reflection of the face enters inside the mirror,\nOther than being merely the condition of dependent arising..."}, {"tib": "།བཞིན་དང་མེ་ལོང་ནམ་ཡང་འདྲེས་མ་མྱོང་། །མེད་བཞིན་སྣང་ལ་དེར་འཛིན་འཁྲུལ་པའི་སེམས། །\nཐག་ཁྲ་མཐོང་ཚེ་སྦྲུལ་དུ་འཛིན་བྱེད་ཀྱི། །ཤེས་པ་དང་པོ་གཟུང་བའི་ཆོས་ཡིན་ལ།", "en": "The face and the mirror have never mixed.\nWhile not existing, it appears;\nthe mind which is deluded into grasping at that:\nAt the time of seeing a speckled rope, the grasper of a snake—\nThe first consciousness is the phenomenon of the apprehended."}, {"tib": "།རྗེས་ལ་རྟོག་དཔྱོད་ཞུགས་པ་འཛིན་པའོ། །གལ་ཏེ་སྦྲུལ་དུ་སྣང་བ་གཟུང་བ་ལ། །\nའཛིན་པ་བདག་པོའི་ཤེས་པར་སྨྲ་བྱེད་ན། །སྣང་དང་སྣང་ཡུལ་མ་ཕྱེད་སྐྱེས་བུ་ཡང་།", "en": "The analysis that enters subsequently is the apprehender.\nIf one says that the apprehender of the appearance of the snake—which is grasped—\nIs the dominant consciousness;\nEven the individual who has not distinguished appearance and the object of appearance..."}, {"tib": "།སྣང་བ་ཉིད་དང་ལྷན་ཅིག་ཡོད་མེད་བྱེད། །གང་དུའང་མ་རིག་གང་འཛིན་གློ་བུར་རྐྱེན། །\nསྲིད་པའི་བདག་པོ་ང་དང་ང་ཡི་བར། །མེད་བཞིན་འཁྲུལ་པའི་རྩ་བ་ཆོད་གྱུར་ན། །\nཀུན་བྱེད་རྒྱལ་པོ་རང་བྱུང་རང་ལ་ཐིམ།", "en": "Makes existence and non-existence simultaneous with appearance itself.\nWherever, the adventitious conditions of ignorance and subject-object grasping—\nThe \"I\" and \"Mine\", the Lords of Existence—\nWhile not existing, if the root of delusion is severed,\nThe All-Creating King dissolves into the Self-Arisen Self."}],
      12: [{"tib": "།།གང་ཞིག་སློབ་པ་མིན་པའི་ཟུང་འཇུག་ལ། །དཀྲི་བའི་ལམ་ཆེན་ཕྱིན་དྲུག་ཡོན་ཏན་ཀུན། །\nཤེས་རབ་ཕ་རོལ་ཕྱིན་ལ་ཡང་དག་བསྟེན། །ལམ་དེ་ནམ་ཡང་གཞན་དྱི་རྒྱུར་མི་འགྱུར།", "en": "That which is the Great Path that leads to\nUnion beyond learning; all qualities of the Six Paramitas\nProperly rely on the Perfection of Wisdom.\nThat path will never become the cause of something else."}, {"tib": "།འདི་ལྟར་རྫོགས་པའི་སངས་རྒྱས་ཀུན་གྱི་གསང་། །སྟོང་པ་ཉིད་ལ་མཚན་ཉིད་མི་གནས་ཤིང་། །\nམཐའ་བྲལ་དོན་ལ་དབུ་མར་གཟུང་བའང་མེད། །ངོ་བོ་ཉིད་སྤངས་རྫོགས་པ་ཆེན་པོར་གྲུབ།", "en": "Thus, the secret of all Perfect Buddhas:\nRegarding Emptiness, characteristics do not abide;\nRegarding the meaning free of extremes, there is no grasping at a \"Middle\" either.\nHaving abandoned identity (essence), the Great Completeness is established."}, {"tib": "།རྩོད་པ་མངོན་པར་འཕེལ་བའི་རྟོག་གེ་ནི། །བརྟགས་ཤིང་རྗེས་སུ་དཔག་པའི་ཕྱི་བཞིན་འབྲང་། །\nདོན་དམ་ཡུལ་ནི་དེ་དང་འགལ་བ་ཅན། །སོ་སོ་རང་རིག་བརྗོད་པའི་ཡུལ་ལས་འདས།", "en": "The speculation which fully increases disputation\nFollows behind examination and inference.\nThe Ultimate Object is contradictory to that;\nIndividual Self-Awareness is beyond the object of expression."}, {"tib": "།དངོས་པོར་སྨྲ་བ་གྲུབ་མཐའི་རྟོག་གེ་དང་། །ས་མཚམས་དམན་པ་སོ་སྐྱེའི་རྟོག་གེ་ཡི། །\nརྟོག་དཔྱོད་ལས་འདས་རྒྱལ་བའི་ཡེ་ཤེས་ནི། །གདོད་ནས་གྲོལ་བ་རྫོགས་པ་ཆེན་པོའི་ལམ།", "en": "The wisdom of the Victor, which is beyond the analysis\nOf the speculation of philosophical tenets asserting substantial existence,\nAnd the speculation of ordinary beings with inferior boundaries,\nIs the path of Great Completeness, primordially liberated."}, {"tib": "།ཤེས་བྱ་སྣང་བས་མ་བཅིངས་སྟོང་པའི་དངོས། །སྟོང་པ་རང་བཞིན་གསལ་བའི་སྙིང་པོ་ནི། །\nརིག་པར་བཞུགས་པའི་སྐུ་དང་ཡེ་ཤེས་ཁམས། །འདུ་འབྲལ་མེད་པ་ཉི་མའི་སྙིང་པོ་བཞིན།", "en": "The actual thing of emptiness not bound by the appearance of objects of knowledge;\nThe essence of the natural clarity of emptiness\nIs the Body (Kaya) and Wisdom Element abiding in Awareness.\nWithout gathering or separating, like the essence of the sun."}, {"tib": "།གང་ལ་བློ་ཡི་རིམ་པས་འཇལ་ལུགས་གསུམ། །སེམས་ཀྱི་སྡེ་ནི་རོལ་པའི་རྩལ་དུ་ཤར། །\nཀློང་གི་སྡེ་ནི་རང་སྣང་བཀོད་པའི་རྒྱན། །མན་ངག་སྡེ་ནི་མེད་སྣང་སྟོང་པའི་གཟུགས།", "en": "Regarding that, the three modes of measuring by the stages of intellect:\nThe Mind Section dawns as the creativity of display.\nThe Space Section is the ornament of the arrangement of Self-Appearance.\nThe Instruction Section is the form of emptiness appearing while not existing."}, {"tib": "།ཀུན་ཀྱང་དགྲོལ་གཞི་མེད་པའི་བྱང་ཆུབ་སེམས། །གང་གི་འགྲོལ་བ་སྤངས་པའི་ངང་གསལ་གདངས། །\nགཞི་དང་རྩ་བ་མེད་པའི་ཀློང་ན་གསལ། །བྱས་ཤིང་བཅོས་པ་མེད་པས་ཡེ་གྲོལ་ཡིན།", "en": "All are Bodhichitta without a base of liberation.\nThe tone of natural clarity which has abandoned \"that which liberates\"\nIs clear in the Expanse without ground and root.\nBecause it is without doing or contrivance, it is Primordially Liberated."}, {"tib": "།རང་གི་རང་གྲོལ་རྐྱེན་ལ་རག་མ་ལུས། །ཅེར་གྲོལ་ཡིན་པས་ལྟོས་གཞི་ཀུན་དང་བྲལ། །\nགཅིག་དང་དུ་མར་གདགས་པའི་མཐའ་ལས་གྲོལ། །གཅིག་པོ་རིག་པར་གྲོལ་བས་མཚན་ཉིད་མེད།", "en": "Self-Liberation of itself does not depend on conditions.\nBecause it is Naked Liberation, it is free of all bases of reliance.\nIt is liberated from the extreme of designating one and many.\nBecause the single one is liberated in Awareness, there are no characteristics."}, {"tib": "།གང་དག་སེམས་ལས་འདས་པའི་རིག་པ་ནི། །རང་བཞིན་རྫོགས་པ་ཆེན་པོའི་ཁྱད་ཆོས་ཡིན། །\nརྟོགས་པ་རྣམས་ནི་གཞི་ལས་རིག་པར་གྲོལ། །མ་རྟོགས་སེམས་ཅན་དེ་ཉིད་ངང་དུ་འཁོར།", "en": "Whatever Awareness is beyond Mind\nIs the special feature of the Natural Great Completeness.\nThose who realize are liberated from the ground into Awareness.\nUnrealized sentient beings circle in that very state."}, {"tib": "།རྣམ་པས་དབྱེ་ན་ཆུ་དང་ཆུ་ལྦུར་བཞིན། །རྟོག་མེད་ཙམ་དུ་སེམས་རིག་མཚུངས་ནའང་། །\nརིག་པ་རང་བཞིན་མེད་པར་ཟང་ཐལ་ལ། །སེམས་ནི་ལྟེང་ཀ་ལྟ་བུར་འཁྱིལ་ཞིང་རྨོངས།", "en": "When dividing by aspects: like water and water-foam,\nAlthough Mind and Awareness are similar merely in non-conceptuality,\nAwareness is transparent (Zang-thal) without nature;\nMind is swirling and dull like a pond."}, {"tib": "།རིག་པ་གནམ་སྟོང་ཟླ་བ་གཏིང་གསལ་འདྲ། །སེམས་ནི་བཅོ་ལྔའི་ཟླ་བ་ཡུལ་འདྲེས་མཚུངས། །\nདྭངས་ལ་ཡུལ་མེད་རིག་པའི་ཡོན་ཏན་ཏེ། །ཡུལ་དང་ཀུན་ནས་འདྲེས་པ་སེམས་ཀྱི་ཁྱད།", "en": "Awareness is like the moon of the 30th day [New Moon]—deeply clear.\nMind is equivalent to the moon of the 15th day [Full Moon]—mixed with objects.\nClear and objectless is the quality of Awareness;\nMixed with objects from all sides is the feature of Mind."}, {"tib": "།དེ་བཞིན་རིག་པ་རང་གནས་ཤེས་རབ་སྟེ། །བསམ་གཏན་ཐབས་ལ་མ་ལྟོས་བྱིང་རྒོད་བྲལ། །\nསེམས་ནི་གཟུང་འཛིན་ཆ་དང་བཅས་པ་ཡི། །རྣམ་རྟོག་ཉེ་བར་ལེན་པའི་ཕྱོགས་དང་འདྲེས།", "en": "Similarly, Awareness is naturally abiding wisdom;\nNot relying on the method of concentration, it is free of dullness and agitation.\nMind is one-pointed on the object of focus;\nIt is connected to Samadhi and \"support and supported.\""}, {"tib": "།རིག་པ་ཡུལ་ལ་ཤར་ཀྱང་སྣང་བ་ཡིད། །ཟིལ་གྱིས་མི་ནོན་དངུལ་ཆུ་སར་ལྷུང་འདྲ། །\nསེམས་ནི་གཟུང་འཛིན་ཆ་དང་བཅས་པ་ཡི། །རྣམ་རྟོག་ཉེ་བར་ལེན་པའི་ཕྱོགས་དང་འདྲེས།", "en": "Though Awareness dawns on the object, it is not overpowered\nBy the splendor of appearance;\nlike mercury falling on the ground.\nMind is mixed with the side of the appropriating\nConceptual thought possessing the parts of subject and object."}, {"tib": "།རིག་པས་སེམས་ཉིད་གཞན་དུ་མ་སྤངས་ཀྱང་། །སེམས་དང་རིག་པ་ལྷན་ཅིག་མི་འདུ་བས། །\nཡུལ་དང་རྣམ་པར་རང་དང་རྫས་གཅིག་པའི། །ཉོན་མོངས་རྣམས་ཀྱང་ལྷན་ཅིག་སྐྲུན་ནས་བྲོས།", "en": "Although Awareness does not discard Mind Itself elsewhere,\nBecause Mind and Awareness do not assemble together,\nThe afflictions which are one substance with the self regarding objects and aspects\nAlso flee from the presence of the Wisdom Eye."}, {"tib": "།དེ་ལྟར་བྲོས་པས་ཉོན་མོངས་བཙོན་ར་ལས། །ངེས་པར་འབྱིན་པ་མན་ངག་སྡེ་བ་ཡི། །\nཁྱད་པར་ཆོས་ཏེ་གཞན་དུ་ཉོན་མོངས་ཚོགས། །ཉན་རང་སྤོང་ཞིང་བྱང་སེམས་གཉེན་པོས་འདུལ།", "en": "Thus, removing one definitely from the prison of affliction through liberation\nIs the special Dharma of the Instruction Section.\nOtherwise, the assembly of afflictions:\nShravakas/Pratyekabuddhas abandon;\nBodhisattvas tame with antidotes."}, {"tib": "།སྔགས་སྤྱིར་ལམ་གཏོང་སེམས་སྡེར་གཤེས་ཐོག་གྲོལ། །ཀློང་སྡེར་ཆོས་ཉིད་གཅིག་ཏུ་དག་བྱེད་པ། །\nརིག་པའི་ཀློང་ན་རང་ཚུགས་ཞིག་པ་མཚར། །དེ་བཞིན་ཀུན་གཞི་དང་ནི་ཆོས་སྐུ་གཉིས།", "en": "Mantra in general takes as path;\nin Mind Section, liberated upon the nature.\nIn Space Section, purified into the single Dharmata.\nIn the Expanse of Awareness, it is wondrous that they collapse naturally.\nSimilarly, the All-Ground (Alaya) and Dharmakaya—the two..."}, {"tib": "།དབྱིངས་ལུ་གཅིག་ཀྱང་ཆོས་སྐུ་རྒྱ་མཚོ་འདྲ། །ཀུན་གཞིའི་རྣམ་ཤེས་དེ་ཡི་སྒྲིབ་ཆ་སྟེ། །\nགྲུ་པ་བཞིན་དུ་འཁོར་འདས་གཉིས་ཀར་ལྡིང་། །གཞི་དེ་ཉིད་ནས་འཁྲུལ་གྲོལ་ཆོས་ཉིད་ཀྱང་།", "en": "Though one in the Expanse, Dharmakaya is like the ocean.\nThe consciousness of the All-Ground is the obscuration portion of that;\nLike a boatman, drifting in both Samsara and Nirvana.\nFrom the Ground itself, delusion and liberation are the Dharmata..."}, {"tib": "།གཉིད་དུ་སོང་དང་དེ་ལས་སད་པ་བཞིན། །འཁྲུལ་པ་དབང་པོ་ཉམས་པའི་གཉིད་སྟུག་བཞིན། །\nགྲོལ་བ་དེ་ལས་སད་པའི་གནས་སྐབས་འདྲ། །ཐོག་མའི་ངེས་མེད་གཞི་ཡི་ལྷུན་གྲུབ་དང་།", "en": "Like having gone to sleep and waking from that.\nDelusion is like the thick sleep of impaired senses.\nLiberation is like the occasion of waking from that.\nThe Spontaneous Presence of the Ground—indeterminate at the beginning—and..."}, {"tib": "།མཐར་གྱི་གྲོལ་སའི་ཀ་དག་དྲི་བྲལ་གཉིས། །རྫས་སུ་གཅིག་ཀྱང་སླད་ཀྱའི་འཁྲུལ་པའི་གཞི། །\nབྱེད་དང་མི་བྱེད་ཁྱད་པར་ཤེས་པ་གཅེས། །དེ་བཞིན་དབྱིངས་ཀྱི་གྲོལ་ས་ཀ་དག་དང་།", "en": "The two—Primordial Purity of the place of liberation at the end, free of stain—\nThough one in substance, regarding the ground of later delusion,\nIt is crucial to know the difference of \"acting\" and \"not acting\" as cause.\nSimilarly, the Primordial Purity of the place of liberation of the Expanse, and..."}, {"tib": "།ད་ལྟའི་ལམ་གྱི་རིག་པ་ཀ་དག་གཉིས། །རྒྱ་ཆད་ཕྱོགས་ལྷུང་མེད་པར་མཉམ་ནའང་། །\nགྲོལ་ས་ཉིད་ནི་རླུང་སེམས་ཆ་དང་བཅས། །རྣམ་པར་བྱང་བའི་འཁོར་འདས་ཀ་དག་སྟེ།", "en": "The Primordial Purity of Awareness of the Path of View—the two—\nThough equal in not falling into partiality and restriction,\nThe place of liberation itself is Primordial Purity purified of Samsara and Nirvana,\nTogether with the parts of wind and mind."}, {"tib": "།ལམ་དུས་རླུང་སེམས་མ་དག་སྐྱེ་དབང་དང༌། །འགྲོགས་ཤིང་སེམས་དང་སེམས་བྱུང་དྲི་མའི་ཆས། །\nབསླད་ཅིང་ཁུར་བས་དངོས་གནས་རེས་འགའ་ཙམ། །དེ་བཞིན་ཆོས་ཉིད་བར་དོའི་རིག་གདངས་དང༌།", "en": "At the time of the path, associating with the power of the condition of impure wind and mind,\nAnd polluted and burdened by the stained phenomena of mind and mental factors,\nIt is the actual state only occasionally.\nSimilarly, the radiance of awareness of the Bardo of Dharmata, and..."}, {"tib": "།རྟོག་བཅས་གོམས་པའི་ལྷ་ཡི་སྒྱུ་ལུས་གཉིས། །ལྷ་སྐུར་མཚུངས་ཀྱང་སྣང་བ་ཞིང་ཁམས་སུ། །\nཤར་ཞིང་ཤེས་ཐོག་གྲོལ་དང་མི་གྲོལ་ཁྱད། །ཁྱད་པར་ལམ་འདིར་ཞུགས་པའི་དམ་ཚིག་ཅན།", "en": "The two illusory bodies of the deity habituated with conceptuality;\nThough similar as the Body of the Deity, appearing in the Pure Land,\nThere is the difference of liberation upon knowing and non-liberation.\nIn particular, the one possessing samaya who has entered this path..."}, {"tib": "།ས་བཅུའི་སྣང་བས་བསྡུས་པའི་ལོངས་སྐུ་ལ། །འཐོགས་པ་མ་ཡིན་དེ་ཡི་དཔེ་བྱད་ནི། །\nརང་བཞིན་སྤྲུལ་པར་བཀོད་ལ་མྱུར་དུ་འགྲོ། །དེ་ཕྱིར་འདི་ནི་རྡོ་རྗེའི་ལམ་མཆོག་སྟེ།", "en": "Is not obstructed regarding the Sambhogakaya gathered by the appearance of the Ten Grounds.\nIts marks and signs are arranged as the Natural Nirmanakaya\nAnd one goes swiftly.\nTherefore, this is the Supreme Path of Vajra."}, {"tib": "།གདོད་ནས་གྲོལ་བའི་རིག་པ་ཀ་དག་ནི། །སྟོང་པ་ངོ་བོ་ཉིད་མེད་བསམ་བརྗོད་འདས། །\nམཚན་ཉིད་བློ་ཡིས་བརྗོད་པས་ཐུག་པ་སྤངས། །སྨོན་པ་མེད་ལ་རིག་པའི་ཡོན་ཏན་རྫོགས་།", "en": "The Primordially Pure Awareness liberated from the beginning\nIs empty, without essence, beyond thought and expression.\nCharacteristics are abandoned where the expression of intellect touches.\nWithout aspiration, the qualities of Awareness are perfected."}, {"tib": "།རིག་པའང་ཤེས་བྱའི་ཡུལ་ལ་མི་གནས་པས། །ང་དང་ང་ཡིར་འཛིན་པའི་ཆོས་དང་བྲལ། །\nདེ་ལ་སྒོམ་དང་སྒོམ་པར་བྱ་བ་མེད། །མ་བཅོས་རྣལ་མར་བཞག་ན་རྗེན་པར་མཐོང་།", "en": "Awareness also does not abide in the object of knowledge;\nTherefore, it is free from the phenomena of grasping at \"I\" and \"Mine.\"\nRegarding that, there is no meditation and nothing to be meditated.\nIf placed in the unaltered genuine state, one sees nakedly."}, {"tib": "།རང་གི་ངོ་བོ་གཞན་དུ་མི་འགྱུར་ན། །མ་རིག་འཛིན་པས་སྲིད་པར་འཁྲིད་མི་ནུས། །\nཕྱི་རོལ་ཡུལ་དང་བདག་ཏུ་ཞེན་པ་རྣམས། །བྱེད་པོས་མ་བྱས་སེམས་རྟོག་བརྟས་ལས་གྲུབ་།", "en": "If its own essence does not change into something else,\nThe grasping of ignorance is unable to lead to existence.\nExternal objects and attachment to self—\nNot made by a creator;\nestablished from the expansion of mental thought."}, {"tib": "།གཞི་དང་རྩ་བ་མེད་ལས་ཐམས་ཅད་སྐྱེས། །སྐྱེས་ཙམ་ཉིད་ལས་སྐྱེ་བ་མེད་པར་རྫོགས། །\nདེ་ལས་གཞན་པའི་རྟོག་པ་ཡོད་མི་དགོས། །ཀློག་དང་འཛིན་དང་སྒོམ་དང་བསྟན་བཅོས་སེམས་།", "en": "Because Ground and Root do not exist, everything is born.\nFrom the very [moment of] birth, it is perfected as unborn.\nThere is no need for a realization other than that.\nReading, grasping, meditating, and the mind of treatises..."}, {"tib": "།མཐའ་དག་བློ་ཡི་གྲུབ་མཐའ་ཞིག་གྱུར་ན། །ཡིད་སྨོན་མེད་པའི་སངས་རྒྱས་དེ་ཉིད་དོ། །\nཁྱད་པར་བླ་ན་མེད་པའི་ཐོད་རྒལ་ནི། །རིག་གདངས་མངོན་སུམ་མཐོང་བའི་གོལ་ས་ཉུང་།", "en": "If all collapse in the philosophical tenet of the mind (intellect),\nThat is the Buddha without mental aspiration.\nIn particular, regarding the Thogal of the Unsurpassed:\nBy seeing the radiance of Awareness directly, the places of straying are few."}, {"tib": "།ཕྱི་འབྱུང་ས་རྡོ་རི་བྲག་ཡུལ་སྣང་གི། །རྡོས་བཅས་དྲི་མ་ཟད་པའི་འབྱུང་ཆེན་གྱི། །\nཡེ་ཤེས་འོད་གསལ་ཆེན་པོར་དྭངས་པའི་ལམ། །མངོན་དུ་བྱེད་པས་ནང་འབྱུང་ཁྲེགས་ཆོད་ཀྱིས།", "en": "The path where the outer arising—earth, stone, mountain, rock, object-appearance—\nThe Great Elements where material stains are exhausted—\nClarifies into the Great Luminosity of Primal Wisdom.\nBecause it manifests, the inner arising Trekcho..."}, {"tib": "།རྡུལ་ཕྲན་ཉིད་ལས་དྭངས་པར་མ་ནུས་པའང་། །འཕོ་བ་ཆེན་པོ་རྡོ་རྗེའི་སྐུར་སྨིན་ནས། །\nགཞན་དོན་འཁོར་བ་མ་སྟོངས་བར་དུ་མཛད། །དེ་ཕྱིར་རང་གི་སྡེ་པས་ཡིད་དཔྱོད་ཀྱི།", "en": "Even though it is unable to clarify from the atoms themselves,\nHaving ripened into the Vajra Body of Great Transfer,\nActs for the welfare of others until Samsara is empty.\nTherefore, the instruction which distinguishes well..."}, {"tib": "།ལྟ་སྒོམ་སྤྱོད་འབྲས་ཀུན་とཁྱད་ཞུགས་པའི། །མཚན་ཉིད་ལེགས་པར་ཕྱེད་པ་མན་ངག་ཡིན། །\nདེ་ལྟ་མོད་ཀྱི་བདག་འཛིན་གློ་བུར་རྐྱེན། །ཆོས་དབྱིངས་དག་པའི་ཀློང་དུ་མ་ནུབ་པར།", "en": "The characteristics which make [Thogal] superior to all\nViews, meditations, conducts, and results of mental analysis of one's own [lower] schools.\nThat being so, until the adventitious condition of self-grasping\nHas subsided in the pure Expanse of Dharmadhatu..."}, {"tib": "།གློ་བུར་རྐྱེན་གྱིས་བསླུ་བའི་རྟོག་ཚོགས་ཆོས་། །ཐ་མལ་རང་ལུགས་སྲིད་པའི་བདག་པོ་ཡིས། །\nདང་པོའི་ལས་ཅན་རྣམས་ལ་སྒྲིབ་པའི་ཕྱིར། །ཞི་གནས་ལྷག་མཐོང་ངོ་བོ་གཅིག་པ་དང༌།", "en": "Because the phenomena of the assembly of thoughts, deceived by adventitious conditions,\nFinally obscure the \"Lord of Existence\" of one's own system\nFor those of beginner karma; therefore,\nRegarding the two modes of guiding Calm Abiding and Insight..."}, {"tib": "།སོ་སོ་བ་ཡི་འཁྲིད་ཚུལ་རྣམ་གཉིས་ལས། །དང་པོའི་ཕྱོགས་ལ་གནས་ཆའི་བསམ་གཏན་དང་། །\nགསལ་ཆའི་ཤེས་རབ་ཞི་ལྷག་ཟུང་འབྲེལ་ལས། །གཉིས་པ་མིན་པའི་མཐའ་བྲལ་དོན་ལ་བཞག", "en": "As one essence and as individual:\nRegarding the side of the first: from the union of Calm Abiding\nOf the abiding portion and Insight of the clear portion,\nIt is placed in the meaning free of extremes which is not \"the second\" [dual]."}, {"tib": "།གཉིས་པའི་ཕྱོགས་ལའང་དབྱེ་བ་གཉིས་གྲུབ་སྟེ་། །ཤེས་རབ་ལས་དང་གདམས་ངག་ལས་བྱུང་ངོ་། །\nཤེས་རབ་ལས་བྱུང་སྒྲ་ཡི་རྗེས་མཐུན་པ། །ཐོས་པའི་དོན་ལ་རྩེ་གཅིག་ཞི་བ་དང་།", "en": "Regarding the side of the second, two divisions are established:\nArising from Wisdom and arising from Pith Instructions.\nArising from Wisdom: concordant with the words,\nOne-pointedness on the heard meaning is Calm Abiding; and..."}, {"tib": "།དེ་ལས་དོན་རྟོགས་ལྷག་མཐོང་མཚན་ཉིད་དོ། །མན་ངག་ལས་བྱུང་དོན་གྱི་རྗེས་སུ་འགྲོ་། །\nསེམས་ནི་གཡོ་བ་མེད་པ་ཞི་གནས་ལ། །དེ་ཡི་རང་བཞིན་ཤེས་པ་ལྷག་མཐོང་ཏེ་།", "en": "Realizing the meaning from that is the characteristic of Insight.\nArising from Pith Instructions: following the meaning.\nMind without movement is Calm Abiding;\nKnowing the nature of that is Insight."}, {"tib": "།མདོར་ན་རབ་ཀྱིས་ངན་རྟོག་ཆོས་སྐུར་ལྷོངས། །བཟང་ངན་མཉམ་ན་གཉེན་པོ་བསྟེན་མི་དགོས། །\nའབྲིང་གི་ངང་དྭངས་ཟུང་འབྲེལ་ལམ་གོམས་པས། །བཟང་ངན་རྟོག་པ་མཐའ་དག་དབྱིངས་སུ་ནུབ།", "en": "In brief: by the best, bad thoughts are liberated into Dharmakaya.\nIf good and bad are equal, there is no need to rely on antidotes.\nBy the medium: by habituating to the path of union where the state is clear,\nAll thoughts, good and bad, subside into the Expanse."}, {"tib": "།ཐ་མས་ཐོག་མར་ཞི་གནས་འབབ་ཞིག་བཙལ། །གང་དམིགས་བརྟན་པ་ཐོབ་ནས་ལྷག་མཐོང་གི། །\nཡེ་ཤེས་སོ་སོར་རྟོག་པ་ལ་གོམས་ན། །མཐར་གྱིས་གསེར་གླིང་ས་རྡོ་མ་རྙེད་བཞིན།", "en": "By the lowest: first seek Calm Abiding alone.\nHaving obtained stability on whatever object, if habituated\nTo the individual analysis of the wisdom of Insight,\nGradually, like not finding earth and stones on a Golden Island..."}, {"tib": "།སེམས་དང་སེམས་བྱུང་རྟོག་པ་གང་སྐྱེས་ཀྱང་། །སྣང་སེམས་དབྱེར་མེད་གཞི་གྲོལ་ཆེན་པོར་འཆར། །\nཐབས་ཀྱི་མཆོག་ཏུ་རྟོག་པ་གང་ཤར་ཡང་། །དགག་པར་མི་བྱ་བསྒྲུབ་པར་བྱ་བ་མེད།", "en": "Whatever thoughts of mind and mental factors are born,\nAppearance and Mind dawn as the indivisible Great Liberation of the Ground.\nWhatever thoughts arise through the supreme method,\nThere is nothing to refute, nothing to establish."}, {"tib": "།རྗེས་སུ་མི་འབྲང་ངང་ལས་མ་གཡོས་ན། །ལྷ་ཡི་མིག་དང་སྤྱན་དང་མངོན་ཤེས་སོགས། །\nདབང་པོ་དངས་པའི་ཡོན་ཏན་མཐའ་དག་འཐོབ། །རྟོག་པ་ཡུལ་དང་འབྲེལ་ན་ཐ་མལ་ཏེ་།", "en": "Not following; if one does not move from the state,\nThe Eye of the Gods and [Wisdom] Eye and Clairvoyance, etc.—\nAll qualities of the refined senses are obtained.\nIf thoughts are connected with objects, it is ordinary."}, {"tib": "།མེ་ལོང་ལྟ་བུར་དྭངས་པའི་ཤེས་པ་ལ། །སྣང་ཡུལ་མ་འགགས་གཟའ་སྐར་བཞིན་བཀྲ་ཡང་། །\nརྣམ་པའི་བློ་ཡིས་གོས་པར་མ་གྱུར་ན། །གཟུང་བའི་ཡུལ་དང་འཛིན་སེམས་འབྲེལ་ཆད་པས།", "en": "In the consciousness clear like a mirror,\nThough appearing objects are unceasing and brilliant like planets and stars,\nIf not stained by the mind of the aspect [grasping],\nBecause the connection between apprehended object and apprehending mind is cut..."}, {"tib": "།སོ་སོ་རང་རིག་རྣམ་པར་མི་རྟོག་པའི། །ཡེ་ཤེས་བླ་མའི་ས་ལ་ད་ལྟ་ཕྱིན། །\nམདོར་ན་དབྱིངས་ཀྱི་ལམ་ནི་ཆོས་ཉིད་གཅིག །རིག་པའི་ལམ་ནི་ཤེས་རབ་ཁྱད་པར་ཅན།", "en": "One has now arrived at the Ground of the Lama,\nThe Primal Wisdom of non-conceptual individual self-awareness.\nIn brief, the Path of the Expanse is the Single Dharmata.\nThe Path of Awareness is extraordinary Wisdom."}, {"tib": "།འོད་གསལ་ལམ་ནི་སྒྲོན་མ་རྣམ་པ་གཉིས། །ཁྲེགས་ཆོད་ལམ་ནི་ཤར་གྲོལ་དུས་མཉམ་སྟེ་། །\nཐོད་སྒལ་ལམ་ནི་དབྱིངས་དང་རིག་པ་ཡིན། །འདི་དག་རང་བཞིན་རྫོགས་པ་ཆེན་པོ་ཡི།", "en": "The Path of Luminosity is the two types of Lamp.\nThe Path of Trekcho is rising and liberation simultaneous.\nThe Path of Thogal is Expanse and Awareness.\nHaving known these five uncommon paths..."}, {"tib": "།ཐུན་མོང་མ་ཡིན་ལམ་ལྔར་མཁྱེན་འཚལ་ནས། །མ་རིག་གྲོགས་དང་འཁྲུལ་པའི་བསླུ་བྲིད་ཀྱིས། །\nམཐའ་མེད་འཁོར་བའི་འབྲོག་དགོན་འཇིགས་རུང་བར། །ལས་དང་ཉོན་མོངས་འདུ་བྱེད་ལྕགས་སྒྲོག་གིས།", "en": "Of the Natural Great Completeness,\nBy the friend of ignorance and the deception of delusion,\nIn the terrifying wilderness of endless Samsara,\nBy the iron shackles of karma and formations of affliction..."}, {"tib": "།དེ་རིང་ཕན་ཆད་བཅིངས་ལ་སྐྱོ་བའི་སེམས་། །བསྐྱེད་ནས་ཞི་བ་དམ་པའི་གྲོང་ཁྱེར་དུ། །\nམྱ་ངན་འདས་པའི་ལམ་མཆོག་བསྙེན་པར་མཛོད།\n།ཡོན་ཏན་རིན་པོ་ཆེའི་མཛོད་དགའ་བའི་ཆར་ཞེས་བྱ་བ་ལས།\n།རང་བཞིན་རྫོགས་པ་ཆེན་པོའི་ལམ་ཐུན་མོང་མ་ཡིན་པ་བསྟན་པའི་ཚོམས་ཏེ་ལེའུ་བཅུ་གཉིས་པའོ།།", "en": "Having generated a mind of weariness toward being bound from today onwards,\nToward the City of Holy Peace,\nPlease rely on the Supreme Path of passing beyond sorrow (Nirvana)."}],
      13: [{"tib": "།།དེ་ལྟར་གཞི་ལམ་མཚན་ཉིད་ལེགས་རྟོགས་ནས། །མཐར་ཕྱིན་འབྲས་བུ་སྐུ་དང་ཡེ་ཤེས་ནི། །\nགཞན་ལས་མ་བྱུང་ཀུན་གཞིའི་རྟོགས་པ་དྭངས། །སེམས་དང་སེམས་བྱུང་ཆོས་དབྱིངས་ཞི་བ་ཡིན།", "en": "Thus, having well realized the characteristics of the Ground and Path,\nThe ultimate Result—the Kayas and Wisdoms—\nDoes not arise from elsewhere; the sediment of the All-Ground (Alaya) is cleared.\nMind and mental factors are pacified in the Dharmadhatu."}, {"tib": "།གང་དུ་གཞི་ལས་གཞི་སྣང་གཡོས་པ་ཡི། །བདག་འཛིན་བདག་ཆགས་ཤེས་བྱའི་ཆ་འཛིན་པའི། །\nཚོགས་བརྒྱད་ཉེར་ལེན་སྤྲིན་དང་འདྲ་བ་རྣམས། །རྣམ་པར་དག་པའི་ཡེ་ཤེས་ཉི་མ་ནི།", "en": "Wherein the Ground-Appearance has moved from the Ground:\nThe self-grasping habitual tendency, holding the part of the object of knowledge,\nThe eight collections [of consciousness] are like the substantial cause, the clouds;\nThe sun of completely pure Primal Wisdom..."}, {"tib": "།སྒྲིབ་པ་མེད་པར་རང་བཞིན་འོད་དུ་གསལ། །གློ་བུར་དྲི་མ་ཆ་དང་བཅས་སྤངས་པ། །\nདག་པ་གཉིས་ལྡན་བྱང་ཆུབ་མཆོག་གི་དངོས། །གདོད་མི་སངས་རྒྱས་སྨོན་པ་མེད་པའི་དབྱིངས།", "en": "Is without obscuration; naturally clear as light.\nAdventitious stains, together with their parts, are abandoned.\nPossessing the two purities, the actual thing of Supreme Enlightenment.\nThe Primordial Buddha, the Expanse without aspiration."}, {"tib": "།ཉ་རྒྱས་ཟླ་བ་སྤྲོས་པ་ཕྱིར་གསལ་ཅན། །སྟོང་གི་ཆ་ལ་དབྱིངས་སུ་ནུབ་པ་ལྟར། །\nཀུན་ཏུ་མི་རྟོག་ཆོས་ཉིད་འཕོ་འགྱུར་མེད། །དབྱིངས་ཀྱི་རྟག་པ་མི་འགྱུར་རྡོ་རྗེའི་སྐུ།", "en": "The Full Moon possesses the elaborate outward clarity;\nAt the New Moon [part of the empty], it sinks into the Expanse.\nSimilarly, the Dharmata, utterly non-conceptual and unchanging,\nIs the Permanent Unchanging Vajra Body of the Expanse."}, {"tib": "།རྣམ་པ་ཀུན་གྱི་མཆོག་ལྡན་ཞི་བའི་དབྱིངས། །སྟོབས་སོགས་ཡོན་ཏན་རྒྱ་མཚོ་ཀུན་ཆུབ་ཀྱང་། །\nསྣང་ཆ་ངོ་བོར་མ་འདྲེས་སྤངས་རྟོགས་ཀྱི། །ཆ་ནས་གཞལ་བ་མངོན་པར་བྱང་ཆུབ་སྐུ།", "en": "Possessing the supreme of all aspects, the Expanse of Peace.\nAlthough the ocean of qualities—powers and so forth—are all perfected,\nThe appearance portion is unmixed in essence;\nMeasured from the part of abandonment and realization is the Body of Manifest Enlightenment (Abhisambodhikaya)."}, {"tib": "།ཤེས་བྱའི་ཡུལ་ལ་བློ་ཡི་འཇུག་པ་ཞི། །ཤེས་བྱེད་བློ་ལ་འཛིན་པའི་ཀུན་རྫོབ་སྤངས། །\nསོ་སོ་རང་རིག་རྟག་ཆད་མཐར་མ་ལྷུང་། །ཐིམ་ལ་མ་རྨུགས་ཕྲ་བའི་ཡེ་ཤེས་ནི།", "en": "Regarding the object of knowledge, the engaging of the intellect ceases.\nRegarding the knower, the relative truth of grasping in the mind is abandoned.\nIndividual Self-Awareness does not fall into the extremes of permanence or nihilism.\nAbsorbed but not dull, the Subtle Wisdom..."}, {"tib": "།མཁྱེན་ཆ་འགག་མེད་སྐུ་དང་ཡེ་ཤེས་རྟེན། །ཤིན་ཏུ་མཉམ་པར་བཞག་པ་རྣམས་ཀྱིས་མཐོང་། །\nགང་ལ་ཞི་བ་ཆོས་ཀྱི་སྐུ་ཞེས་བརྗོད། །སོ་སོ་རང་གི་རིག་བྱ་རྒྱལ་བའི་ཁམས།", "en": "The unceasing cognitive portion is the support of the Kayas and Wisdoms.\nIt is seen by those who are extremely equipoised.\nThat is called the \"Peaceful Dharmakaya.\"\nThe object of individual self-knowledge is the Sphere of the Conquerors."}, {"tib": "།གཅིག་དང་དུ་མར་མ་ཡིན་དངོས་པོ་དང་། །དངོས་མེད་ལས་འདས་མཁའ་ལྟར་རྣམ་མི་རྟོག །\nགོས་པ་མེད་ཅིང་རྣམ་འགྱུར་སྤྲོས་པ་ཞི། །ངག་གི་ཡུལ་འདས་དོན་དམ་བདེན་པས་བསྡུས།", "en": "It is not one and not many; regarding \"substantial thing\"\nAnd \"non-substantial thing,\" it is beyond; like the sky, it is non-conceptual.\nIt is without stain; the elaboration of transformation is pacified.\nBeyond the object of speech, it is included in the Ultimate Truth."}, {"tib": "།རྟོག་དཔྱོད་ཐ་སྙད་གཏན་ཚིགས་ཀྱིས་མི་མཚོན། །བློ་དང་སྙམ་བྱེད་དཔེ་དང་འགལ་བའི་ཕྱིར། །\nས་བཅུའི་དབང་ཕྱུག་གི་ཡང་སྤྱོད་ཡུལ་མིན། །འདྲེན་པ་རྣམས་ལ་མངོན་སུམ་གྱུར་པའི་གནས།", "en": "It is not illustrated by the logic of speculation, convention, and reason.\nBecause it contradicts the examples of mind and \"thinking it is so.\"\nIt is not the domain of even the Lords of the Tenth Ground.\nIt is the Abode which is manifest to the Guides [Buddhas]."}, {"tib": "།ཟབ་ཞི་གཞོན་ནུ་བུམ་པའི་ཁང་མཛེས་ནང་། །དུས་གསུམ་སངས་རྒྱས་རྣམས་ནི་རྟག་བཞུགས་ཀྱང༌། །\nརྣམ་པའི་ཆ་ནས་གཅིག་གིས་གཅིག་མི་གཟིགས། །རང་བཞིན་སྤྲོས་བྲལ་དབྱིངས་ན་དགོངས་ཀློང་གཅིག", "en": "Profound, peaceful, Youthful Vase Body inside the beautiful house.\nAlthough the Buddhas of the three times abide permanently,\nFrom the aspect of features, one does not see the other.\nIn the Expanse of the Nature free from elaboration, the Intention-Expanse is one."}, {"tib": "།མཁྱེན་ཆ་འགག་པ་མེད་པའི་རང་གདངས་ལས། །ཐུགས་རྗེ་ཕྱིར་གསལ་ལོངས་སྤྱོད་རྫོགས་པའི་སྐུ། །\nགནས་དང་དུས་དང་སྟོན་པ་ཆོས་དང་འཁོར། །ངེས་པ་ལྔ་ལྡན་སྐུ་དང་ཞིང་ཁམས་དང་།", "en": "From the natural tone of the unceasing cognitive portion,\nCompassion is outwardly clear as the Sambhogakaya.\nPlace, Time, Teacher, Dharma, and Retinue:\nPossessing the five certainties, the Body and the Field; and..."}, {"tib": "།མཚན་དཔེ་ཡོན་ཏན་རྒྱ་མཚོའི་བདག་ཉིད་ཅན། །གནས་ནི་ལྷུན་རྫོགས་འོག་མིན་སྟུག་པོ་བཀོད། །\nཡེ་ཤེས་ལྔ་ཡི་འོད་ཟེར་གསལ་འཚེར་འབར། །མཁའ་དབྱིངས་དབང་པའི་མཚོན་ཆས་བཀབ་པ་བཞིན།", "en": "Possessing the identity of the ocean of Marks, Signs, and Qualities.\nThe Place is the spontaneously perfected \"Dense Array of Akanishtha.\"\nThe light rays of the Five Wisdoms are clear, shimmering, and blazing.\nIt is like the Space Element covered by the weapon of the King [Rainbows]."}, {"tib": "།མནན་ན་ནེམ་ཞིང་བཏེགས་ན་འཕར་བ་ལྟའི། །གཞལ་མེད་ཁང་མཛེས་སྒོ་འཕར་རྣམ་བཞིར་ལྡན། །\nརྟ་རྐང་བརྒྱད་ལྡན་ཡེ་ཤེས་ལྔའི་རྩིག་པ། །ཕ་གུ་དྲྭ་ཕྱེད་མདའ་ཡབ་པུ་ཤུ་ཅན།", "en": "Like that which gives way when pressed and bounces back when lifted [soft ground],\nThe Beautiful Celestial Palace possesses four doors and pediments.\nPossessing the eight horse-legs [pillars/beams], the walls of the Five Wisdoms.\nPossessing the ledge, the half-net [loops], the roof parapet, and the coping."}, {"tib": "།སྣམ་བུར་འདོད་པའི་ཡོན་ཏན་མིག་ཡངས་མ། །བདེ་སྟོང་མཆོད་སྤྲིན་རྩེ་དགའ་གཡོ་བ་ཅན། །\nརྔ་ཡབ་འཕན་གདུགས་རྒྱལ་མཚན་ནོར་བུའི་ཏོག །བླ་བྲེ་ཟར་ཚགས་གཙང་ཁང་ཕྱུར་བུར་མཛེས།", "en": "The sensory qualities of desire on the balcony; the \"Wide-Eyed\" [Offering Goddesses];\nThe offering cloud of Bli
